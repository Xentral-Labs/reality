server {
    # ALB owns request logging; retain only operational errors here.
    access_log off;
    error_log /dev/stderr warn;
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ \.rss$ {
        default_type application/rss+xml;
        charset utf-8;
    }

    location / {
        try_files $uri.html $uri $uri/ /404.html;
    }
}
