<text x="600.0" y="174" text-anchor="middle" font-weight="700" font-size="15">Die Schicht darüber, außerhalb von Reality: Sachbearbeiter, deine Workflows, dein Agent</text>
<text x="600.0" y="194" text-anchor="middle" font-size="10.5" fill-opacity="0.8">Reality liefert die Leitplanken: Vorschlag, Vorschau, Ablehnung, Entscheidung. Was ohne Rückfrage läuft, legst du im Agenten fest; bei Zweifel und Neuem entscheidet ein Mensch.</text>
