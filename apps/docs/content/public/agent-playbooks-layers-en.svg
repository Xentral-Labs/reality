<path d="M 1170 604 L 1170 574 L 1260 574 L 1260 108 L 291.0 108 L 291.0 72" fill="none" stroke="#e67e22" stroke-width="2.5"/>
<polygon points="284.0,84 298.0,84 291.0,70" fill="#e67e22"/>
<rect x="1084.0" y="260" width="212" height="96" rx="6" fill="#fdeedd" stroke="#e67e22"/>
<text x="1190.0" y="277" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1d1d21">Report availability</text>
<text x="1190.0" y="292" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1d1d21">a workflow reads stock and</text>
<text x="1190.0" y="307" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1d1d21">demand and sends it to the</text>
<text x="1190.0" y="322" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1d1d21">shop; Reality sends nothing</text>
<text x="1190.0" y="337" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1d1d21">itself</text>
<rect x="611.5" y="84" width="200" height="40" rx="6" fill="#ececef" stroke="#6e6e78"/>
<text x="619.5" y="101" font-size="11.5" font-weight="600" fill="#1d1d21">Delivery + delivery note</text>
<text x="619.5" y="116" font-size="10.5" font-weight="400" fill="#1d1d21">→ book goods receipt</text>
<rect x="902.5" y="84" width="232" height="56" rx="6" fill="#ececef" stroke="#6e6e78"/>
<text x="910.5" y="101" font-size="11.5" font-weight="600" fill="#1d1d21">Return parcel · mail · call</text>
<text x="910.5" y="116" font-size="10.5" font-weight="400" fill="#1d1d21">→ inbox: book, announce,</text>
<text x="910.5" y="131" font-size="10.5" font-weight="400" fill="#1d1d21">hold, credit, ask</text>
<rect x="130" y="150" width="940" height="330" rx="10" fill="rgba(99,102,241,0.08)" stroke="#6366f1" stroke-width="1.5"/>
<text x="600.0" y="174" text-anchor="middle" font-weight="700" font-size="15">The layer above, outside Reality: clerks, your workflows, your agent</text>
<text x="600.0" y="194" text-anchor="middle" font-size="10.5" fill-opacity="0.8">Reality provides the guardrails: proposal, preview, refusal, decision. What runs without asking is set in your agent; a person decides in doubt and on anything new.</text>
<rect x="144.0" y="210" width="143.7" height="256" rx="8" fill="rgba(255,255,255,0.35)" stroke="rgba(99,102,241,0.6)"/>
<text x="215.8" y="232" text-anchor="middle" font-weight="600" font-size="12">Sales &amp; fulfilment</text>
<text x="153.0" y="256" font-size="11">• reserve stock</text>
<text x="153.0" y="280" font-size="11">• book goods issue</text>
<text x="153.0" y="304" font-size="11">• revise the promise</text>
<text x="153.0" y="328" font-size="11">• delivery hold</text>
<text x="153.0" y="352" font-size="11">• report availability</text>
<rect x="297.7" y="210" width="143.7" height="256" rx="8" fill="rgba(255,255,255,0.35)" stroke="rgba(99,102,241,0.6)"/>
<text x="369.5" y="232" text-anchor="middle" font-weight="600" font-size="12">Receivables</text>
<text x="306.7" y="256" font-size="11">• book invoices</text>
<text x="306.7" y="280" font-size="11">• match payments</text>
<text x="306.7" y="304" font-size="11">• decide differences</text>
<text x="306.7" y="328" font-size="11">• credit, refund</text>
<text x="306.7" y="352" font-size="11">• credit notes</text>
<rect x="451.3" y="210" width="143.7" height="256" rx="8" fill="rgba(255,255,255,0.35)" stroke="rgba(99,102,241,0.6)"/>
<text x="523.2" y="232" text-anchor="middle" font-weight="600" font-size="12">Purchasing</text>
<text x="460.3" y="256" font-size="11">• purchase orders</text>
<text x="460.3" y="280" font-size="11">• book goods receipts</text>
<text x="460.3" y="304" font-size="11">• invoice check</text>
<text x="460.3" y="328" font-size="11">• payment run</text>
<rect x="605.0" y="210" width="143.7" height="256" rx="8" fill="rgba(255,255,255,0.35)" stroke="rgba(99,102,241,0.6)"/>
<text x="676.8" y="232" text-anchor="middle" font-weight="600" font-size="12">Returns</text>
<text x="614.0" y="256" font-size="11">• announce</text>
<text x="614.0" y="280" font-size="11">• book the return</text>
<text x="614.0" y="304" font-size="11">• restock / write off</text>
<text x="614.0" y="328" font-size="11">• credit note, fee</text>
<rect x="758.7" y="210" width="143.7" height="256" rx="8" fill="rgba(255,255,255,0.35)" stroke="rgba(99,102,241,0.6)"/>
<text x="830.5" y="232" text-anchor="middle" font-weight="600" font-size="12">Customer service inbox</text>
<text x="767.7" y="256" font-size="11">• read mail and calls</text>
<text x="767.7" y="280" font-size="11">• announce a return</text>
<text x="767.7" y="304" font-size="11">• hold, credit</text>
<text x="767.7" y="328" font-size="11">• capture open questions</text>
<rect x="912.3" y="210" width="143.7" height="256" rx="8" fill="rgba(255,255,255,0.35)" stroke="rgba(99,102,241,0.6)"/>
<text x="984.2" y="232" text-anchor="middle" font-weight="600" font-size="12">Master data &amp; sources</text>
<text x="921.3" y="256" font-size="11">• items, partners,</text>
<text x="921.3" y="280" font-size="11">   prices, terms</text>
<text x="921.3" y="304" font-size="11">• unit relations</text>
<text x="921.3" y="328" font-size="11">• register sources</text>
<text x="921.3" y="352" font-size="11">• fix failed imports</text>
