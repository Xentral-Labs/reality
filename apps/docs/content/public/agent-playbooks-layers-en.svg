<text x="64" y="313" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1d1d21">Orders and</text>
<text x="64" y="328" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1d1d21">payments</text>
<text x="64" y="343" text-anchor="middle" font-size="10.5" font-weight="400" fill="#1d1d21">arrive by themselves</text>
<line x1="821.5" y1="68" x2="821.5" y2="146" stroke="#6e6e78" stroke-width="2.5"/>
<polygon points="814.5,134 828.5,134 821.5,148" fill="#6e6e78"/>
