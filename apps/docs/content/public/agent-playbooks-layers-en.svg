<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 860" width="1320" height="860" role="img" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="currentColor">
<title>The layer above: clerks, your workflows, agents</title>
<rect x="20.0" y="14" width="311.0" height="54" rx="8" fill="rgba(120,120,120,0.10)" stroke="currentColor" stroke-opacity="0.35"/>
<text x="175.5" y="36" text-anchor="middle" font-weight="600" font-size="14">Shop / marketplace</text>
<text x="175.5" y="55" text-anchor="middle" font-size="11" fill-opacity="0.8">orders out, availability back</text>
<rect x="343.0" y="14" width="311.0" height="54" rx="8" fill="rgba(120,120,120,0.10)" stroke="currentColor" stroke-opacity="0.35"/>
<text x="498.5" y="36" text-anchor="middle" font-weight="600" font-size="14">Bank / payment provider</text>
<text x="498.5" y="55" text-anchor="middle" font-size="11" fill-opacity="0.8">statements, payouts</text>
<rect x="666.0" y="14" width="311.0" height="54" rx="8" fill="rgba(120,120,120,0.10)" stroke="currentColor" stroke-opacity="0.35"/>
<text x="821.5" y="36" text-anchor="middle" font-weight="600" font-size="14">Supplier</text>
<text x="821.5" y="55" text-anchor="middle" font-size="11" fill-opacity="0.8">goods and delivery note at the ramp</text>
<rect x="989.0" y="14" width="311.0" height="54" rx="8" fill="rgba(120,120,120,0.10)" stroke="currentColor" stroke-opacity="0.35"/>
<text x="1144.5" y="36" text-anchor="middle" font-weight="600" font-size="14">Customer</text>
<text x="1144.5" y="55" text-anchor="middle" font-size="11" fill-opacity="0.8">return parcel, mail, phone call</text>
<path d="M 175.5 68 L 175.5 86 L 60 86" fill="none" stroke="#159a5c" stroke-width="3" stroke-dasharray="6 5"/>
