<text x="854" y="546.0" font-size="11.5">verify</text>
<rect x="20" y="604" width="1280" height="200" rx="10" fill="rgba(16,150,90,0.07)" stroke="#159a5c" stroke-width="1.5"/>
<text x="660.0" y="630" text-anchor="middle" font-weight="700" font-size="15">Reality: records, derives, reports</text>
<rect x="34.0" y="646" width="242.4" height="144" rx="8" fill="rgba(255,255,255,0.35)" stroke="rgba(16,150,90,0.6)"/>
<text x="155.2" y="668" text-anchor="middle" font-weight="600" font-size="12.5">Documents</text>
<text x="155.2" y="690" text-anchor="middle" font-size="11.5" fill-opacity="0.85">orders, invoices, credit notes,</text>
<text x="155.2" y="707" text-anchor="middle" font-size="11.5" fill-opacity="0.85">payments</text>
<rect x="286.4" y="646" width="242.4" height="144" rx="8" fill="rgba(255,255,255,0.35)" stroke="rgba(16,150,90,0.6)"/>
<text x="407.6" y="668" text-anchor="middle" font-weight="600" font-size="12.5">Promises &amp; movements</text>
<text x="407.6" y="690" text-anchor="middle" font-size="11.5" fill-opacity="0.85">delivery promises, reservations,</text>
<text x="407.6" y="707" text-anchor="middle" font-size="11.5" fill-opacity="0.85">receipts, issues, returns</text>
<rect x="538.8" y="646" width="242.4" height="144" rx="8" fill="rgba(255,255,255,0.35)" stroke="rgba(16,150,90,0.6)"/>
<text x="660.0" y="668" text-anchor="middle" font-weight="600" font-size="12.5">Open items &amp; credit</text>
<text x="660.0" y="690" text-anchor="middle" font-size="11.5" fill-opacity="0.85">payment intake in three tiers:</text>
<text x="660.0" y="707" text-anchor="middle" font-size="11.5" fill-opacity="0.85">record, allocate, propose</text>
<rect x="791.2" y="646" width="242.4" height="144" rx="8" fill="rgba(255,255,255,0.35)" stroke="rgba(16,150,90,0.6)"/>
<text x="912.4" y="668" text-anchor="middle" font-weight="600" font-size="12.5">Exceptions</text>
<text x="912.4" y="690" text-anchor="middle" font-size="11.5" fill-opacity="0.85">shipped not billed, unmatched</text>
<text x="912.4" y="707" text-anchor="middle" font-size="11.5" fill-opacity="0.85">payment, silent source …</text>
<rect x="1043.6" y="646" width="242.4" height="144" rx="8" fill="rgba(255,255,255,0.35)" stroke="rgba(16,150,90,0.6)"/>
<text x="1164.8" y="668" text-anchor="middle" font-weight="600" font-size="12.5">Reads</text>
<text x="1164.8" y="690" text-anchor="middle" font-size="11.5" fill-opacity="0.85">fulfilment queue, availability</text>
<text x="1164.8" y="707" text-anchor="middle" font-size="11.5" fill-opacity="0.85">and demand, order explain,</text>
<text x="1164.8" y="724" text-anchor="middle" font-size="11.5" fill-opacity="0.85">balances</text>
<line x1="24" y1="830" x2="58" y2="830" stroke="#159a5c" stroke-width="3" stroke-dasharray="6 5"/>
<text x="66" y="834" font-size="11.5">green: arrives in Reality by itself</text>
<line x1="301.79999999999995" y1="830" x2="335.79999999999995" y2="830" stroke="#6e6e78" stroke-width="3"/>
<text x="343.79999999999995" y="834" font-size="11.5">grey: reaches the layer above, which books it</text>
<line x1="645.5999999999999" y1="830" x2="679.5999999999999" y2="830" stroke="#e67e22" stroke-width="3"/>
<text x="687.5999999999999" y="834" font-size="11.5">orange: the layer reports outward; Reality sends nothing</text>
