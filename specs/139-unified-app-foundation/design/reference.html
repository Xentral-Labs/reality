function historyData(){
 let backlog=0;
 return Array.from({length:30},(_,i)=>{
  const date=new Date(Date.UTC(2026,7,9+i)),day=date.getUTCDay();
  let received=day===0?7:day===6?5:[0,9,8,11,7,6][day];
  let shipped=(day===0||day===6)?0:Math.min(backlog+received,day===1?24:16);
  if(i===26){received=6;shipped=backlog+received;}
  if(i===27){received=0;shipped=0;}
  if(i===28){received=10;shipped=0;}
  if(i===29){received=0;shipped=4;}
  backlog+=received-shipped;
  return {date:date.toISOString().slice(0,10),label:date.toLocaleDateString('en-GB',{day:'2-digit',month:'short',timeZone:'UTC'}),weekend:day===0||day===6,received,shipped,backlog};
 });
}

function paintCharts(){
 root.querySelectorAll('.rw-flow-chart').forEach(svg=>{
  const rows=historyData().slice(-Number(svg.dataset.days));
  const width=Math.max(200,svg.getBoundingClientRect().width),height=svg.dataset.compact==='true'?130:235;
  const left=42,right=15,top=20,bottom=38,max=Math.max(...rows.flatMap(r=>[r.received,r.shipped,r.backlog]),1),ceiling=Math.ceil(max/5)*5;
  const x=i=>left+i*(width-left-right)/(rows.length-1),y=v=>height-bottom-v*(height-top-bottom)/ceiling;

  svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
  svg.innerHTML=`<title>Ordered, shipped and open lamps per calendar day</title>${rows.map((r,i)=>r.weekend?`<rect x="${Math.max(left,x(i)-(width-left-right)/(rows.length-1)/2)}" y="${top}" width="${Math.min((width-left-right)/(rows.length-1),width-right-Math.max(left,x(i)-(width-left-right)/(rows.length-1)/2))}" height="${height-top-bottom}" fill="var(--rw-bg)"/>`:'').join('')}${[0,ceiling/2,ceiling].map(v=>`<line x1="${left}" x2="${width-right}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rw-border)" stroke-dasharray="3 5"/><text x="${left-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('')}<text x="${left}" y="12">Lamps</text>${Array.from({length:ticks},(_,j)=>{const i=Math.round(j*(rows.length-1)/(ticks-1));return `<text x="${x(i)}" y="${height-16}" text-anchor="${j===0?'start':j===ticks-1?'end':'middle'}">${rows[i].label}</text>`;}).join('')}${[['received','--rw-indigo'],['shipped','--rw-green'],['backlog','--rw-amber']].map(([key,color])=>`<polyline points="${rows.map((r,i)=>`${x(i)},${y(r[key])}`).join(' ')}" fill="none" stroke="var(${color})" stroke-width="2" stroke-linejoin="round"/>`).join('')}${rows.map((r,i)=>`<rect data-chart-date="${r.date}" x="${Math.max(left,x(i)-Math.max(4,(width-left-right)/(rows.length-1)/2))}" y="${top}" width="${Math.max(8,(width-left-right)/(rows.length-1))}" height="${height-top-bottom}" fill="transparent"><title>${r.label}: ${r.received} ordered, ${r.shipped} shipped, ${r.backlog} open</title></rect>`).join('')}`;
 });
}

function exceptionsPage(){return `<main class="rw-page">${pageHeader('DAILY CONTROL','Exceptions','Investigate a specific condition with a visible route to its supporting records.')}${state.reserved?`<section class="rw-empty"><h2>No unreserved demand in this sample</h2><p class="rw-muted">The reservation resolved the allocation gap. Six lamps still need shipment.</p><div class="rw-actions">${caseButton('delivery','Review the delivery')}</div></section>`:`<section class="rw-panel"><span class="rw-chip">Allocation needed</span><h2 style="margin-top:12px">4 lamps have no reservation</h2><p style="margin-top:10px">Müller has 6 lamps left to receive. Only 2 are reserved. Available stock is 8, so this condition does not establish a shortage.</p><div class="rw-actions">${caseButton('delivery','Resolve in the case →','rw-primary')}<button data-inspect="delivery:unreserved">Show the calculation</button></div></section>`}</main>`;}
function decisionsPage(){
 const pending=state.proposal==='pending'&&!state.reserved;
 return `<main class="rw-page">${pageHeader('HUMAN CONTROL','Decisions','Changes prepared by Reality wait here for your explicit confirmation.')}<section class="rw-panel">${pending?`<span class="rw-chip">Awaiting confirmation</span><h2 style="margin-top:12px">Reserve 4 table lamps for Müller</h2>${facts([['Commitment','cmt_a8f2 · Order #1042'],['Location','Main warehouse'],['Reserved quantity','2 → 6'],['Free stock','8 → 4']])}<div class="rw-actions">${action('confirm-global','Confirm reservation in demo','rw-primary')}${action('cancel-global','Reject proposal')}${caseButton('delivery','Open the business case')}</div>`:state.reserved?`<span class="rw-chip rw-done">Confirmed in demo</span><h2 style="margin-top:12px">4 additional lamps reserved</h2><p style="margin-top:10px">Reservation rsv_f9a4 links to commitment cmt_a8f2. No shipment was recorded.</p><div class="rw-actions"><button data-inspect="delivery:reserved">Inspect the result →</button></div>`:`<h2>No pending confirmations</h2><p style="margin-top:10px">Prepare a reservation in the delivery case or ask Reality to prepare one. The exact proposal will appear here.</p><div class="rw-actions">${caseButton('delivery','Open Müller’s delivery','rw-primary')}${viewButton('chat','Ask Reality')}</div>`}</section>${state.notice?`<div class="rw-success" role="status">${escapeHTML(state.notice)}</div>`:''}</main>`;
}
function factsPage(){return `<main class="rw-page">${pageHeader('BUSINESS UNDERSTANDING','Facts','Source-backed observations, with the business context kept close.')}<section class="rw-panel"><h2>What the sample sources state</h2>${table(['Statement','Evidence',''],[['Müller ordered 10 table lamps','Order #1042 · Line 1','<button data-inspect="delivery:unreserved">Trace statement ↗</button>'],['Schneider’s invoice total is €1,200','Invoice #2086','<button data-inspect="payment:invoice">Trace statement ↗</button>'],['Weber is to supply 20 desk lamps','Purchase order #3071 · Line 1','<button data-inspect="receipt:expected">Trace statement ↗</button>']])}</section><p class="rw-hint">Current stock, open deliveries and outstanding balances remain derived observations in their workspaces.</p></main>`;}
function dataPage(){
 const selected=state.section||'sources';let body;
 if(selected==='sources')body=`<section class="rw-panel"><h2>Sample source library</h2><p class="rw-muted">These fixtures illustrate imported evidence. No vendor connection is running.</p>${[['Customer order','external-order-7841','delivery:unreserved'],['Customer invoice','external-invoice-992','payment:invoice'],['Supplier order','external-purchase-381','receipt:expected']].map(([label,id,target])=>`<div class="rw-connected"><div><strong>${label}</strong><small>${id} · Version 1 · Synthetic fixture</small></div><button data-inspect="${target}">View evidence & source ↗</button></div>`).join('')}</section>`;
 else if(selected==='evidence')body=table(['Document','Evidence type','Recorded value',''],[['#1042','Customer order','10 table lamps',caseButton('delivery','Open context →')],['#2086','Customer invoice','€1,200',caseButton('payment','Open context →')],['#3071','Supplier order','20 desk lamps',caseButton('receipt','Open context →')]]);
 else body=`${table(['Record','Type','Relationship',''],[['cmt_a8f2','Commitment','Order #1042 · Line 1','<button data-inspect="delivery:unreserved">Inspect ↗</button>'],['rsv_e7c1','Reservation','Commitment cmt_a8f2','<button data-inspect="delivery:reserved">Inspect ↗</button>'],...(state.reserved?[['rsv_f9a4','Reservation','Commitment cmt_a8f2','<button data-inspect="delivery:reserved">Inspect ↗</button>']]:[]),['mov_b3d9','Movement','Shipment fulfillment','<button data-inspect="delivery:shipped">Inspect ↗</button>'],['alloc_c4b2','Allocation','Invoice open item','<button data-inspect="payment:allocated">Inspect ↗</button>']])}<p class="rw-hint">Technical records stay linked to the same business cases. Display IDs are abbreviated.</p>`;
 return `<main class="rw-page">${pageHeader('COMPANY DATA','Data & sources','Original inputs, normalized evidence and technical traceability. Maintain items and partners under Master data.')}${tabs([['sources','Sources & imports'],['evidence','Evidence'],['explorer','Reality Explorer']],selected)}${body}</main>`;
}
function settingsPage(){
 const selected=state.section||'general';let body;
 if(selected==='general'&&state.sandbox)body=`<section class="rw-panel"><h2>Practice company</h2><p>This isolated sample is active. Company preferences are edited in the company environment.</p><div class="rw-actions">${action('leave-sandbox','Return to company')}</div></section>`;
 else if(selected==='general')body=`<form id="rw-company-form" class="rw-panel"><h2>Company preferences</h2><div class="rw-form-grid"><div><label for="rw-company-name">Company name</label><input id="rw-company-name" name="company" maxlength="80" value="${escapeHTML(state.company)}" required></div><div><label for="rw-company-zone">Display timezone</label><select id="rw-company-zone" disabled><option>Europe/Rome · Demo</option></select></div></div><button type="submit" class="rw-primary">Save in this preview</button><p class="rw-hint">Presentation-only change. All preview changes reset when the file is reloaded.</p></form>`;
 else if(selected==='members')body=`${table(['Member','Role','Access'],[['Alex Morgan','Owner',state.sandbox?'Practice company':escapeHTML(state.company)],['Sam Taylor','Operations',state.sandbox?'Practice company':escapeHTML(state.company)]])}<p class="rw-hint">Illustrative membership view. Invitations and access changes are unavailable in this offline preview.</p>`;
 else body=`<section class="rw-panel"><h2>Agent access and actions</h2>${facts([['Assistant','Scripted interaction demo'],['Connected AI provider','None'],['Read-only questions','Immediate'],['Business changes','Preview → Confirm → Verify'],['External execution','Not connected']])}<div class="rw-actions">${viewButton('chat','Try the sample chat','rw-primary')}${viewButton('decisions','View confirmations')}</div></section>`;
 return `<main class="rw-page">${pageHeader('COMPANY','Settings','Company preferences, members and agent access live here.')}${tabs([['general','General'],['members','Members'],['agents','Agents & access']],selected)}${body}${state.notice?`<div class="rw-success" role="status">${escapeHTML(state.notice)}</div>`:''}</main>`;
}
function playgroundPage(){return `<main class="rw-page">${pageHeader('LEARNING','Same product. Room to practice.','Learn a business flow in a separate practice company, with the same navigation and explainable records.')}<section class="rw-panel"><span class="rw-badge">Guided example</span><h2 style="margin-top:14px">From open delivery to reserved stock</h2><p style="margin-top:10px">Follow Müller’s order, understand the remaining quantity and confirm a reservation. The company example stays unchanged.</p><ol class="rw-timeline"><li><span class="rw-dot">1</span><div class="rw-event"><strong>Understand the position</strong><small>10 ordered · 4 shipped · 2 reserved</small></div></li><li><span class="rw-dot">2</span><div class="rw-event"><strong>Review Reality’s proposal</strong><small>Reserve the remaining 4 lamps</small></div></li><li><span class="rw-dot">3</span><div class="rw-event"><strong>Inspect what changed</strong><small>New Reservation → Commitment → Evidence</small></div></li></ol><div class="rw-actions">${action('enter-sandbox',state.sandbox?'Continue practice':'Enter practice company →','rw-primary')}</div></section></main>`;}
function chatReply(question){
 const q=question.toLocaleLowerCase();
 if(/reserv|allocate stock|bestand zuweisen/.test(q)){
  if(state.reserved)return `<p>The remaining 4 lamps are already reserved for Müller. All 6 open lamps are reserved; shipment is still outstanding.</p><div class="rw-actions"><button data-inspect="delivery:reserved">Inspect the reservation</button></div>`;
  if(/^(?:please\s+)?(?:prepare|reserve|reservier|bereite)|^(?:can you|kannst du)\s+(?:reserve|prepare|reservier)/.test(q)){
   const quantity=q.match(/\b\d+\b/);
   if(quantity&&quantity[0]!=='4')return '<p>This scripted example supports a reservation of exactly 4 table lamps for Müller. No proposal was prepared for the requested quantity.</p>';
   state.proposal='pending';state.phase='preview';
   return '<p>I prepared the sample proposal to reserve 4 table lamps for Müller. Review the exact change in the proposal below. No stock has moved.</p>';
  }
  return `<p>2 lamps are reserved against Müller’s commitment. There are 6 lamps still to deliver, leaving 4 unreserved.</p><div class="rw-actions"><button data-inspect="delivery:reserved">Inspect the reservation</button></div>`;
 }
 if(/invoice|payment|paid|money|€|400|schneider|zahlung|rechnung|geld/.test(q))return `<p>The source invoice states €1,200. €800 has been allocated, leaving €400 outstanding. The sample contains no due date, so I cannot establish whether it is overdue.</p><div class="rw-actions">${caseButton('payment','Open Schneider’s balance →')}</div>`;
 if(/weber|incoming|receipt|supplier|arriv|wareneingang|lieferant|ankomm/.test(q))return `<p>Weber promised 20 desk lamps. A receipt of 12 is recorded, leaving 8 still expected. No arrival date is available in this example.</p><div class="rw-actions">${caseButton('receipt','Open Weber’s receipt →')}</div>`;
 if(/stock|warehouse|inventory|bestand|lager/.test(q))return `<p>Main warehouse holds 10 table lamps: ${state.reserved?6:2} reserved and ${state.reserved?4:8} free. It also holds 12 desk lamps with no active reservations.</p><div class="rw-actions">${viewButton('warehouse','Open warehouse →')}<button data-inspect="delivery:stock">Explain the calculation</button></div>`;
 if(/müller|muller|delivery|deliver|lamp|liefer|lampe/.test(q))return `<p>Müller ordered 10 table lamps and 4 have shipped. Of the 6 remaining, ${state.reserved?'all 6 are reserved. Shipment is the next open step.':'2 are reserved and 4 are unreserved. The sample has enough free stock to reserve those 4.'}</p><div class="rw-actions">${caseButton('delivery','Open Müller’s delivery →')}</div>`;
 if(/attention|open|next|today|offen|heute|überblick|aufmerksam|tun/.test(q))return `<p>${state.reserved?'Müller’s 6 open lamps are reserved and awaiting shipment.':'Müller’s delivery has 4 unreserved lamps, with stock available.'} Schneider has €400 outstanding. Weber has 8 desk lamps still to deliver.</p><div class="rw-actions">${caseButton('delivery','Müller’s delivery')}${caseButton('payment','Schneider’s balance')}${caseButton('receipt','Weber’s receipt')}</div>`;
 return '<p>This offline preview uses scripted replies. Try a question about Müller’s delivery, Schneider’s invoice, Weber’s receipt or warehouse stock. A business change must be reviewed with the confirmation button.</p>';
}
function chatPage(){
 const proposal=state.proposal==='pending'&&!state.reserved?`<section class="rw-review"><small>PENDING PROPOSAL · NO CHANGE EXECUTED</small><h3>Reserve 4 lamps for Müller</h3>${facts([['Item / warehouse','Table lamp / Main warehouse'],['Reserved for Order #1042','2 → 6 lamps'],['Free stock','8 → 4 lamps']])}<div class="rw-actions">${action('confirm-global','Confirm reservation in demo','rw-primary')}${action('cancel-global','Reject proposal')}${viewButton('decisions','Open decisions')}</div></section>`:'';
 return `<main class="rw-page"><div class="rw-chat">${pageHeader('ASK REALITY','One conversation across your business.','Ask across orders, stock and money. Open the supporting case from any answer.')}<span class="rw-badge">Offline preview · Scripted replies · No AI provider connected</span><div class="rw-suggestions"><button data-question="What needs attention today?">What needs attention?</button><button data-question="Reserve 4 lamps for Müller">Prepare Müller’s reservation</button><button data-question="Why is €400 open for Schneider?">Explain the €400 balance</button></div><div class="rw-chat-history">${state.messages.length?state.messages.map(m=>`<article class="rw-message rw-user-message"><small>You</small><p>${escapeHTML(m.question)}</p></article><article class="rw-message"><small>✦ Reality · Sample snapshot when asked</small>${m.answer}</article>`).join(''):'<section class="rw-message"><small>✦ Reality</small><h2>What would you like to understand or do?</h2><p style="margin-top:12px">I can connect the open delivery, available stock and unpaid invoice in this sample company.</p></section>'}</div>${proposal}${state.notice?`<div class="rw-success" role="status">${escapeHTML(state.notice)}</div>`:''}<form id="rw-chat-form" class="rw-composer"><label for="rw-chat-question">Ask about the sample company</label><textarea id="rw-chat-question" name="question" rows="2" maxlength="1000" placeholder="What is still open for Müller?" required></textarea><div class="rw-actions"><small>Enter a question or choose an example above</small><button type="submit" class="rw-primary">Send question ↑</button></div></form></div></main>`;
}
function switchEnvironment(sandbox){
 environments[state.sandbox?'sandbox':'company']={reserved:state.reserved,phase:state.phase,proposal:state.proposal,messages:state.messages};
 Object.assign(state,environments[sandbox?'sandbox':'company']);
 state.sandbox=sandbox;state.trace=null;state.section='';state.notice='';state.selected='delivery';state.view=sandbox?'work':'overview';state.menu=false;
}
function confirmProposal(){
 if(state.proposal!=='pending'||state.reserved)return;
 state.reserved=true;state.proposal='confirmed';state.phase='done';
 state.notice='Confirmed in this demo: reservation rsv_f9a4 created for 4 lamps. No shipment recorded.';
}
function render(){
 sidebar();
 root.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.view)));
 const pages={overview:dashboard,analytics:analyticsPage,master:masterDataPage,chat:chatPage,orders:ordersPage,warehouse:warehousePage,finance:financePage,exceptions:exceptionsPage,decisions:decisionsPage,facts:factsPage,data:dataPage,settings:settingsPage,playground:playgroundPage};
 if(pages[state.view]){canvas.innerHTML=pages[state.view]();paintCharts();return;}
 const c=cases[state.selected];
 canvas.innerHTML=`<div class="rw-workspace">${queue()}<main class="rw-detail"><div class="rw-section-label"><span class="rw-step">2</span> The selected case</div><small>Position, history and supporting records</small><header class="rw-case-header"><small>${c.type.toUpperCase()} · ${c.name} · ${c.ref}</small><h1>${c.title}</h1><span class="rw-chip ${state.selected==='delivery'&&state.reserved?'rw-done':''}">${status(state.selected)}</span><div class="rw-actions"><button data-master="${state.selected==='delivery'?'muller':state.selected==='payment'?'schneider':'weber'}">Open business partner ↗</button>${state.selected!=='payment'?`<button data-master="${state.selected==='delivery'?'table-lamp':'desk-lamp'}">Open item ↗</button>`:''}</div></header>${position()}${trace()}${timeline()}</main>${assistant()}</div>`;
}
root.addEventListener('click',e=>{
 const day=e.target.closest('[data-chart-date]');
 if(day){const row=historyData().find(r=>r.date===day.dataset.chartDate),panel=day.closest('.rw-chart-body');if(row&&panel)panel.querySelector('.rw-chart-readout').textContent=`${row.label}: ${row.received} ordered · ${row.shipped} shipped · ${row.backlog} still open`;return;}
 const b=e.target.closest('button');if(!b||!root.contains(b))return;
 if(b.dataset.period){state.period=Number(b.dataset.period);render();return;}
 if(b.dataset.metric){state.metric=b.dataset.metric;state.view='analytics';state.section='';render();return;}
 if(b.dataset.master){state.master=b.dataset.master;state.view='master';state.section=['muller','schneider','weber'].includes(state.master)?'partners':state.master==='warehouse'?'locations':'items';render();return;}
 if(b.dataset.view){state.view=b.dataset.view;state.section='';state.master=null;state.notice='';state.menu=false;render();return;}
 if(b.dataset.section){state.section=b.dataset.section;state.master=null;state.notice='';render();return;}
 if(b.dataset.case){state.selected=b.dataset.case;state.view='work';state.phase=state.proposal==='pending'&&state.selected==='delivery'?'preview':'suggestion';state.trace=null;state.notice='';state.menu=false;render();return;}
 if(b.dataset.inspect){const [selected,traceKey]=b.dataset.inspect.split(':');state.selected=selected;state.trace=traceKey;state.view='work';state.phase=state.proposal==='pending'&&selected==='delivery'?'preview':'suggestion';state.menu=false;render();return;}
 if(b.dataset.question){const question=b.dataset.question;state.messages.push({question,answer:chatReply(question)});state.notice='';render();return;}
 if(b.dataset.trace){state.trace=state.trace===b.dataset.trace?null:b.dataset.trace;render();return;}
 const id=b.dataset.action;
 if(id==='close-metric')state.metric=null;
 if(id==='close-master')state.master=null;
 if(id==='close-trace')state.trace=null;
 if(id==='toggle-menu'){state.menu=!state.menu;render();return;}
 if(id==='enter-sandbox'){if(!state.sandbox)switchEnvironment(true);else state.view='work';render();return;}
 if(id==='leave-sandbox'){switchEnvironment(false);render();return;}
 if(id==='prepare'&&state.selected==='delivery'&&!state.reserved){state.phase='preview';state.proposal='pending';}
 if(id==='cancel'||id==='cancel-global'){state.phase='suggestion';if(state.proposal==='pending')state.proposal='rejected';state.notice='Proposal rejected in this demo. No stock changed.';}
 if(id==='confirm'&&state.selected==='delivery'&&state.phase==='preview'){confirmProposal();state.trace='reserved';}
 if(id==='confirm-global')confirmProposal();
 if(id==='explain')state.phase='explain';
 if(id==='show-stock')state.trace='stock';
 if(id==='show-result')state.trace='reserved';
 if(id==='show-records')state.trace='open';
 render();
});
root.addEventListener('submit',e=>{
 if(e.target.id==='rw-chat-form'){
  e.preventDefault();const question=root.querySelector('#rw-chat-question').value.trim();if(!question)return;
  state.messages.push({question,answer:chatReply(question)});state.notice='';render();
 }else if(e.target.id==='rw-company-form'){
  e.preventDefault();const value=root.querySelector('#rw-company-name').value.trim();if(!value)return;
  state.company=value.slice(0,80);state.notice='Company name updated in this preview.';render();
 }
});
render();
if(typeof ResizeObserver!=='undefined')new ResizeObserver(()=>paintCharts()).observe(canvas);
})();
</script>
