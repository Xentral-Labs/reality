  function inlineReview(){if(!['revenue','risks','forecast'].includes(state.review))return '';const data={revenue:['Netto-Umsatz heute · Grundlage','284.600 € aus verbuchten Verkäufen abzüglich erfasster Stornos und Gutschriften seit 00:00 Europe/Berlin. Vergleich: gleicher Tageszeitpunkt am Dienstag der Vorwoche. Angenommene Unternehmensgröße: 100 Mio. € Jahresumsatz.'],risks:['Gefährdete Aufträge · 48 Stunden','184 unterschiedliche Aufträge: 128 wegen noch unbestätigter Zusatzabholung heute, 56 wegen fehlender Ware ab morgen. 21.940 € ist der Warenwert. Der Agent verfolgt beide Ursachen eigenständig.'],forecast:['Versandprognose · bestätigte Kapazität','Beispielprognose auf Basis bestätigter Versandereignisse bis 14:30, Lagerkapazität und bestätigtem Abholplan. Die angefragte Zusatzabholung zählt bis zur Frachtführerbestätigung nicht als gesicherte Kapazität. Tagesende im Basisszenario: 2.992 von 3.120 Aufträgen.']};return `<section class="e-review" aria-live="polite"><h2>${data[state.review][0]}</h2><p>${data[state.review][1]}</p><div class="e-actions">${button('Schließen','cancel')}</div></section>`;}
  let chartObserver;
  function render(){chartObserver?.disconnect();const s=summary();root.querySelector('.e-sidebar').innerHTML=`<div class="e-brand"><span class="e-brand-symbol">${icon('layers-3')}</span>company</div><nav aria-label="Hauptnavigation"><div class="e-nav-heading">Control Tower</div><div class="e-nav">${[['overview','Leitstand','layout-dashboard'],['queues','Vorgänge','list-checks'],['stopped','Angehalten','pause'],['decisions','Entscheidungen','git-branch'],['performance','Leistung','chart-no-axes-combined']].map(([id,label,name])=>`<button type="button" class="cursor-interaction" data-view="${id}" ${state.view===id&&!state.selected?'aria-current="page"':''}>${icon(name)}${label}${id==='stopped'?`<span class="e-nav-count">${s.human}</span>`:''}</button>`).join('')}</div></nav><nav class="e-process-nav" aria-label="Vorgangstypen"><div class="e-nav-heading">Vorgangstypen</div><div class="e-nav">${workflow.map(w=>`<button type="button" class="cursor-interaction" data-area="${w.id}" ${state.view==='queues'&&state.area===w.id?'aria-current="page"':''}>${icon(w.icon)}${w.name}</button>`).join('')}</div></nav><div class="e-user"><strong>A. Neumann</strong><span>Head of Operations</span><span>Nord Commerce Group</span></div>`;root.querySelector('.e-topbar').innerHTML=`<span class="e-company">Nord Commerce Group</span><span class="e-context">/ Autonomer Betrieb</span><span class="e-demo">100 Mio. €/Jahr · Beispielszenario</span>`;const content=state.selected?detail(cases.find(c=>c.id===state.selected)):state.view==='overview'?overview():state.view==='queues'?queues():state.view==='stopped'?stopped():state.view==='decisions'?decisionLog():performance();root.querySelector('.e-main').innerHTML=(!state.selected?inlineReview():'')+content;root.querySelectorAll('.e-table td').forEach(cell=>cell.style.padding=design.dense?'9px 12px':'12px');if(globalThis.lucide)lucide.createIcons({attrs:{width:15,height:15}});const chart=root.querySelector('.e-chart-container');if(chart){drawChart(chart);chartObserver=new ResizeObserver(()=>drawChart(chart));chartObserver.observe(chart);}}
  function drawChart(container){
    const w=container.clientWidth;if(w<80)return;const h=188,l=w<360?38:44,r=12,t=22,b=27;const site=state.site;const actual=[98,310,624,941,1248,1650,2020,2184];const plan=[120,350,680,1020,1350,1720,2080,2280,2520,2780,3000,3120];const xs=[8,9,10,11,12,13,14,14.5,15,16,17,18];const forecast=[2184,2380,2580,2820,2992];const fxs=[14.5,15,16,17,18];const ratio=site==='venlo'?1860/3120:site==='leipzig'?1260/3120:1;const actualRatio=site==='venlo'?1280/2184:site==='leipzig'?904/2184:1;const planVals=plan.map(v=>Math.round(v*ratio));const actualVals=actual.map(v=>Math.round(v*actualRatio));let forecasts=forecast.map(v=>Math.round(v*ratio));forecasts[0]=actualVals[7];if(site==='leipzig')forecasts=[904,970,1060,1180,1260];if(site==='venlo')forecasts=[1280,1410,1520,1640,1732];const max=Math.ceil(Math.max(...planVals,...actualVals,...forecasts)*1.07/100)*100;const x=v=>l+(v-8)/10*(w-l-r),y=v=>h-b-v/max*(h-t-b);const path=(values,times)=>values.map((v,i)=>`${i?'L':'M'}${x(times[i]).toFixed(1)},${y(v).toFixed(1)}`).join(' ');const ticks=[0,max/2,max];
    container.innerHTML=`<svg class="e-chart-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Kumulativer Versand ${site==='all'?'alle Standorte':site}, Ist bis 14:30, Soll bis 18 Uhr und separat markierte Prognose"><title>Versandverlauf: Ist, Soll und Prognose</title><rect x="${x(14.5)}" y="${t}" width="${w-r-x(14.5)}" height="${h-t-b}" fill="var(--e-soft)" opacity=".55"/>${ticks.map(v=>`<line class="e-grid" x1="${l}" x2="${w-r}" y1="${y(v)}" y2="${y(v)}"/><text x="${l-7}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`).join('')}<text x="${l}" y="12">Aufträge, kumuliert</text>${(w<360?[8,12,18]:[8,12,16,18]).map(v=>`<text x="${x(v)}" y="${h-7}" text-anchor="${v===8?'start':v===18?'end':'middle'}">${v}:00</text>`).join('')}<path class="e-plan" d="${path(planVals,xs)}"/><path class="e-actual" d="${path(actualVals,xs.slice(0,8))}"/><path class="e-forecast" d="${path(forecasts,fxs)}"/><circle cx="${x(14.5)}" cy="${y(actualVals[7])}" r="3.5" fill="var(--e-blue)"/><line x1="${x(16)}" x2="${x(16)}" y1="${t}" y2="${h-b}" stroke="var(--e-amber)" stroke-width="1" stroke-dasharray="2 4"/><text x="${x(16)-5}" y="${t+11}" text-anchor="end">Cut-off</text><text x="${x(14.5)-5}" y="${y(actualVals[7])-9}" text-anchor="end">${fmt(actualVals[7])}</text></svg>`;
  }

  root.addEventListener('click',event=>{const el=event.target.closest('button');if(!el||el.disabled)return;if(el.dataset.view){state.view=el.dataset.view;state.selected=null;state.decision=null;state.review=null;state.notice='';state.area='all';state.filter='all';state.search='';}else if(el.dataset.area){state.view='queues';state.area=el.dataset.area;state.filter=el.dataset.filter||'all';state.selected=null;state.review=null;state.search='';}else if(el.dataset.case){state.selected=el.dataset.case;state.tab='overview';state.review=null;state.notice='';}else if(el.dataset.decision){state.view='decisions';state.selected=null;state.decision=el.dataset.decision;state.review=null;}else if(el.dataset.site){state.site=el.dataset.site;}else if(el.dataset.queue){state.filter=state.filter===el.dataset.queue?'all':el.dataset.queue;}else if(el.dataset.tab){state.tab=el.dataset.tab;}else if(el.dataset.action){const c=cases.find(c=>c.id===state.selected);switch(el.dataset.action){case 'back':state.selected=null;state.review=null;state.notice='';break;case 'takeover':state.review='takeover';break;case 'handback':state.review='handback';break;case 'cancel':state.review=null;break;case 'close-decision':state.decision=null;break;case 'revenue':case 'risks':case 'forecast':state.review=el.dataset.action;break;case 'search':state.search=root.querySelector('input[name="search"]')?.value||'';break;case 'confirm-takeover':state.events.unshift({id:c.id,text:'A. Neumann übernimmt den gesamten Vorgang · neue operative Aktionen gesperrt'});state.events=state.events.slice(0,20);state.ownership[c.id]={by:'A. Neumann',time:'14:32',reason:root.querySelector('input[name="reason"]')?.value.trim()||'Ich führe diesen Vorgang selbst zu Ende.'};state.review=null;state.notice=`${c.ref}: Gesamter Vorgang übernommen. Neue operative Aktionen des Agenten sind gesperrt.${c.pending?' Eine bereits gesendete Aktion wird weiter abgeglichen.':''}`;break;case 'confirm-handback':if(!c.pending){state.events.unshift({id:c.id,text:'A. Neumann gibt den gesamten Vorgang ausdrücklich an den Agenten zurück'});state.events=state.events.slice(0,20);state.ownership[c.id]=null;state.review=null;state.notice='Vorgang zurückgegeben. Der Agent liest den aktuellen Stand erneut und führt ihn selbstständig weiter.';}break;default:return;}}else return;render();persist();});
  root.addEventListener('change',event=>{const control=event.target;if(control.dataset.control){state[control.dataset.control]=control.value;render();persist();}});
  root.addEventListener('submit',event=>{event.preventDefault();state.search=root.querySelector('input[name="search"]')?.value||'';render();persist();});
  window.addEventListener('openai:set_globals',event=>{const s=event.detail?.globals?.widgetState?.privateContent;if(s?.version===4){state.ownership=s.ownership||{};state.events=s.events||[];render();}});
  render();
  if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(design,'dense',{label:'Dichte Tabellenansicht'});}
})();
</script>
