services:
  api:
    # The api/mcp images run as UID 1001 in production. Dev bind-mounts the repo
    # over $REALITY_ROOT, which replaces the image's ownership with the host's,
    # so on a Linux host UID 1001 cannot write into the source tree (the
    # REALITY_MASTER_KEY fallback writes .reality-secret.key there). Match the
    # host user instead; the default of 0:0 reproduces the pre-hardening image.
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    environment:
      PYTHONPATH: /app/packages/reality-core/src
    command:
      [
        "uvicorn",
        "reality.web.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "src",
      ]
    volumes:
      - ./packages/reality-core:/app/packages/reality-core

  mcp:
    user: "${DOCKER_UID:-0}:${DOCKER_GID:-0}"
    environment:
      PYTHONPATH: /app/packages/reality-core/src
    command:
      [
        "uvicorn",
        "reality.mcp.app:app",
        "--host",
        "0.0.0.0",
        "--port",
        "${MCP_BIND_PORT:-8001}",
        "--reload",
        "--reload-dir",
        "src",
      ]
    volumes:
      - ./packages/reality-core:/app/packages/reality-core

  web:
    build:
      target: build
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--port", "5173"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
      SITE_URL: ${SITE_URL:-http://localhost:8082}
      DOCS_URL: ${DOCS_URL:-http://localhost:8083}
      VITE_API_PROXY_TARGET: http://api:8000
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    ports: !override
      - "${APP_PORT:-8080}:5173"

  docs:
    build:
      target: build
    working_dir: /app
    command: ["npm", "run", "dev", "--", "--port", "5175"]
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/docs:/app
      - docs_node_modules:/app/node_modules
    ports: !override
      - "${DOCS_PORT:-8083}:5175"

volumes:
  web_node_modules:
  docs_node_modules:
