# yaml-language-server: $schema=https://docs.runreality.ai/storylines/storyline.schema.json
#
# First round, version 1 (spec 182). Seven chapters on one straight path, no branches.
# The shortest complete loop, a finding that a rule raises and the same rule takes back,
# and a refusal. Every chapter runs an ordinary command or an ordinary read.

storyline: 1
key: first-round
version: 1
title:
  en: First round
  de: Erste Runde
  nl: Eerste ronde
  es: Primera vuelta
summary:
  en: Seven steps, about five minutes. One order, one finding that appears by itself and clears by itself, and a shipment the system refuses. The shortest way to see how Reality works.
  de: Sieben Schritte, etwa fünf Minuten. Ein Auftrag, eine Abweichung, die von selbst kommt und von selbst geht, und ein Versand, den das System verweigert. Der kürzeste Weg zu sehen, wie Reality arbeitet.
  nl: Zeven stappen, ongeveer vijf minuten. Eén order, één bevinding die vanzelf komt en vanzelf sluit, en een verzending die het systeem weigert. De kortste weg om te zien hoe Reality werkt.
  es: Siete pasos, unos cinco minutos. Un pedido, un hallazgo que aparece solo y se cierra solo, y un envío que el sistema rechaza. El camino más corto para ver cómo trabaja Reality.
author:
  name: Reality team
process: order_to_cash

seed:
  parties:
    nordlicht:
      role: customer
      name: Nordlicht Handels GmbH
      payment_term: $ref.terms.net14
    baltic:
      role: supplier
      name: Baltic Supply
  items:
    fjord:
      sku: IT-FJORD
      name: Fjord Thermo-Becher
      unit: pcs
      price: "24.50"
      currency: EUR
  locations:
    hamburg:
      name: Hamburg
  terms:
    net14:
      code: NET14
      name: 14 Tage netto
      days: 14
  history:
    - command: movement_create
      at: -60d
      as: opening
      input:
        movement_type: opening_stock
        item_id: $ref.items.fjord
        quantity: "8"
        to_location_id: $ref.locations.hamburg
        occurred_at: -60d
    - command: party_delivery_hold
      as: hold
      input:
        party_id: $ref.parties.nordlicht
        reason_code: credit_check
        note: Bonitaetspruefung laeuft
    - command: order_create
      at: -3d
      as: purchase_order
      input:
        direction: purchase
        number: BE-0107
        company_party_id: $company.party
        counterparty_id: $ref.parties.baltic
        location_id: $ref.locations.hamburg
        gross_amount: "206.00"
        document_date: -3d
        requested_delivery_at: +2d
        lines:
          - item_id: $ref.items.fjord
            quantity: "20"
            unit: pcs
            unit_price: "10.30"
            gross_amount: "206.00"
            promised_at: +2d

chapters:
  - key: order
    title:
      en: Create the order
      de: Auftrag anlegen
      nl: Order aanmaken
      es: Crear el pedido
    situation:
      en: Nordlicht Handels GmbH orders 12 Fjord thermo mugs at 24.50 €. There are 8 on hand. Create the order and watch what Reality makes of it.
      de: Die Nordlicht Handels GmbH bestellt 12 Thermo-Becher Fjord zu 24,50 €. Am Lager liegen 8. Leg den Auftrag an und schau, was Reality daraus macht.
      nl: Nordlicht Handels GmbH bestelt 12 Fjord-thermobekers à 24,50 €. Er liggen er 8 op voorraad. Maak de order aan en kijk wat Reality ervan maakt.
      es: Nordlicht Handels GmbH pide 12 tazas térmicas Fjord a 24,50 €. Hay 8 en existencia. Crea el pedido y observa qué hace Reality con él.
    explain:
      en: One command, several events. The order and its commitment are separate records because they can be revised separately. The finding "customer commitment at risk" was not written by the command. A rule compared the promised quantity with what is on hand and raised it. Nobody typed a status anywhere.
      de: Ein Befehl, mehrere Ereignisse. Auftrag und Verpflichtung sind getrennte Datensätze, weil sie getrennt geändert werden können. Die Abweichung „Kundenverpflichtung gefährdet“ hat der Befehl nicht geschrieben. Eine Regel hat die zugesagte Menge mit dem Bestand verglichen und sie gehoben. Niemand hat irgendwo einen Status gesetzt.
      nl: Eén opdracht, meerdere gebeurtenissen. Order en verplichting zijn aparte records omdat ze apart gewijzigd kunnen worden. De bevinding "klantverplichting in gevaar" is niet door de opdracht geschreven. Een regel vergeleek de toegezegde hoeveelheid met de voorraad en meldde haar. Niemand heeft ergens een status gezet.
      es: Un comando, varios eventos. El pedido y su compromiso son registros distintos porque se revisan por separado. El hallazgo "compromiso con el cliente en riesgo" no lo escribió el comando. Una regla comparó la cantidad prometida con la existencia y lo levantó. Nadie escribió un estado en ninguna parte.
    view: view:orders
    command: order_create
    input:
      direction: sales
      number: AT-0041
      company_party_id: $company.party
      counterparty_id: $ref.parties.nordlicht
      location_id: $ref.locations.hamburg
      gross_amount: "294.00"
      document_date: 0d
      requested_delivery_at: +5d
      payment_term_code: $ref.terms.net14
      lines:
        - item_id: $ref.items.fjord
          quantity: "12"
          unit: pcs
          unit_price: "24.50"
          gross_amount: "294.00"
          promised_at: +5d
    primary:
      record_type: commitment
      from: output.commitment_ids[0]
    expect:
      raised: [outgoing_commitment_at_risk]
    next: explain

  - key: explain
    title:
      en: Explain the finding
      de: Abweichung erklären lassen
      nl: De bevinding laten verklaren
      es: Explicar el hallazgo
    situation:
      en: Reality raised a finding without being asked. Have it explain itself, and look at supply and demand for the mug while you are there. Nothing is written in this step.
      de: Reality hat eine Abweichung gehoben, ohne dass jemand darum gebeten hat. Lass sie dir erklären und sieh dir bei der Gelegenheit Bedarf und Deckung für den Becher an. In diesem Schritt wird nichts geschrieben.
      nl: Reality meldde een bevinding zonder dat iemand erom vroeg. Laat haar zichzelf verklaren en bekijk meteen vraag en dekking voor de beker. In deze stap wordt niets geschreven.
      es: Reality levantó un hallazgo sin que nadie lo pidiera. Pide que se explique y mira de paso la oferta y la demanda de la taza. En este paso no se escribe nada.
    explain:
      en: The explanation names the rule, the evidence it read and what would clear the finding. There is no status field behind it. The finding exists exactly as long as the rule keeps finding it, and not one moment longer. Reads are recorded too, which is why this step appears in the protocol although it changed nothing.
      de: Die Erklärung nennt die Regel, die gelesene Evidenz und was die Abweichung schließen würde. Dahinter steckt kein Statusfeld. Die Abweichung existiert genau so lange, wie die Regel sie findet, und keinen Moment länger. Auch Lesungen werden aufgezeichnet, deshalb steht dieser Schritt im Protokoll, obwohl er nichts verändert hat.
      nl: De verklaring noemt de regel, het gelezen bewijs en wat de bevinding zou sluiten. Er zit geen statusveld achter. De bevinding bestaat precies zolang de regel haar vindt, geen moment langer. Ook leesacties worden vastgelegd, daarom staat deze stap in het protocol hoewel hij niets veranderde.
      es: La explicación nombra la regla, la evidencia que leyó y qué cerraría el hallazgo. No hay ningún campo de estado detrás. El hallazgo existe exactamente mientras la regla lo encuentre, ni un momento más. Las lecturas también se registran, por eso este paso aparece en el protocolo aunque no cambió nada.
    view: view:supply_demand
    kind: read
    reads:
      - tool: exception_explain
        input:
          exception_id: $exception.outgoing_commitment_at_risk.$chapter.order.output.commitment_ids[0]
      - tool: item_supply_demand
        input: {}
    requires:
      findings_present: [outgoing_commitment_at_risk]
    next: receipt

  - key: receipt
    title:
      en: Receive a short delivery
      de: Zu kleine Lieferung einbuchen
      nl: Te kleine levering inboeken
      es: Recibir una entrega incompleta
    situation:
      en: Baltic Supply delivers against purchase order BE-0107. The delivery note says 20 mugs, the box holds 16. Book what is really there, not what the paper says.
      de: Baltic Supply liefert gegen Bestellung BE-0107. Auf dem Lieferschein stehen 20 Becher, im Karton sind 16. Buche ein, was wirklich da ist, nicht was auf dem Papier steht.
      nl: Baltic Supply levert op bestelling BE-0107. Op de pakbon staan 20 bekers, in de doos zitten er 16. Boek in wat er echt is, niet wat op papier staat.
      es: Baltic Supply entrega contra el pedido de compra BE-0107. El albarán dice 20 tazas, la caja tiene 16. Registra lo que realmente hay, no lo que dice el papel.
    explain:
      en: The difference is not booked away. The supplier commitment stays open with 4 pieces, because a promise is not kept by writing that it was. There are 24 mugs on hand now, twice what the customer ordered, and the finding from step 1 still stands. Stock is not cover until something holds it for this order.
      de: Die Differenz wird nicht weggebucht. Die Lieferantenverpflichtung bleibt mit 4 Stück offen, denn eine Zusage wird nicht dadurch erfüllt, dass man sie als erfüllt hinschreibt. Am Lager liegen jetzt 24 Becher, doppelt so viele wie bestellt, und die Abweichung aus Schritt 1 steht weiter. Bestand ist keine Deckung, solange ihn nichts für diesen Auftrag festhält.
      nl: Het verschil wordt niet weggeboekt. De leveranciersverplichting blijft met 4 stuks open, want een toezegging wordt niet nagekomen door op te schrijven dat het zo is. Er liggen nu 24 bekers, twee keer zoveel als besteld, en de bevinding uit stap 1 staat er nog. Voorraad is geen dekking zolang niets haar voor deze order vasthoudt.
      es: La diferencia no se borra. El compromiso del proveedor sigue abierto con 4 piezas, porque una promesa no se cumple escribiendo que se cumplió. Ahora hay 24 tazas, el doble de lo pedido, y el hallazgo del paso 1 sigue ahí. La existencia no es cobertura mientras algo no la retenga para este pedido.
    view: view:movements
    command: movement_create
    input:
      movement_type: receipt
      item_id: $ref.items.fjord
      quantity: "16"
      to_location_id: $ref.locations.hamburg
      commitment_id: $seed.purchase_order.output.commitment_ids[0]
    primary:
      record_type: movement
      from: output.records[0].id
    next: reserve

  - key: reserve
    title:
      en: Reserve the stock
      de: Bestand reservieren
      nl: Voorraad reserveren
      es: Reservar la existencia
    situation:
      en: There are 24 mugs on hand now. Reserve them for the Nordlicht order.
      de: Jetzt liegen 24 Becher am Lager. Reserviere sie für den Nordlicht-Auftrag.
      nl: Er liggen nu 24 bekers op voorraad. Reserveer ze voor de order van Nordlicht.
      es: Ahora hay 24 tazas en existencia. Resérvalas para el pedido de Nordlicht.
    explain:
      en: The reservation covers the whole promise, so the rule that raised "customer commitment at risk" now finds nothing unreserved and the finding clears. Nobody closed it. The same rule that raised it took it back. This is the one thing worth taking away from the whole story.
      de: Die Reservierung deckt die ganze Zusage, also findet die Regel hinter „Kundenverpflichtung gefährdet“ nichts Unreserviertes mehr, und die Abweichung schließt sich. Niemand hat sie geschlossen. Dieselbe Regel, die sie gehoben hat, nimmt sie zurück. Das ist die eine Sache, die von der ganzen Geschichte hängen bleiben sollte.
      nl: De reservering dekt de hele toezegging, dus de regel achter "klantverplichting in gevaar" vindt niets ongereserveerds meer en de bevinding sluit. Niemand heeft haar gesloten. Dezelfde regel die haar meldde, neemt haar terug. Dit is het ene dat van dit hele verhaal mag blijven hangen.
      es: La reserva cubre toda la promesa, así que la regla que levantó "compromiso con el cliente en riesgo" ya no encuentra nada sin reservar y el hallazgo se cierra. Nadie lo cerró. La misma regla que lo levantó lo retira. Esto es lo único que hay que llevarse de toda la historia.
    view: view:reservations
    command: reserve
    input:
      commitment_id: $chapter.order.output.commitment_ids[0]
    primary:
      record_type: reservation
      from: output.reservation_id
    expect:
      cleared: [outgoing_commitment_at_risk]
    next: dispatch

  - key: dispatch
    title:
      en: Try to ship
      de: Versand versuchen
      nl: Proberen te verzenden
      es: Intentar el envío
    situation:
      en: The goods are reserved and there are more than enough. Record the shipment of 12 mugs to Nordlicht. Expectation, it goes through. Watch what happens.
      de: Die Ware ist reserviert und reichlich vorhanden. Erfasse den Versand von 12 Bechern an Nordlicht. Erwartung, es geht durch. Schau, was passiert.
      nl: De goederen zijn gereserveerd en er is meer dan genoeg. Leg de verzending van 12 bekers aan Nordlicht vast. Verwachting, het gaat door. Kijk wat er gebeurt.
      es: La mercancía está reservada y hay de sobra. Registra el envío de 12 tazas a Nordlicht. Expectativa, pasa. Observa qué ocurre.
    explain:
      en: Refused, not aborted. The preparation itself was declined because the customer carries a delivery hold that somebody placed during a credit check. No shipment exists and nothing was written, not even a half-finished record to clean up later. The protocol shows the refused call, and the blockers view names the hold and who set it.
      de: Abgelehnt, nicht abgebrochen. Schon die Vorbereitung wurde verweigert, weil der Kunde eine Liefersperre trägt, gesetzt während einer Bonitätsprüfung. Es gibt keinen Versand, und nichts wurde geschrieben, auch kein halbfertiger Datensatz, den später jemand aufräumen müsste. Das Protokoll zeigt den abgelehnten Aufruf, die Blocker-Ansicht nennt die Sperre und wer sie gesetzt hat.
      nl: Geweigerd, niet afgebroken. Al de voorbereiding werd geweigerd omdat de klant een leverblokkade draagt, gezet tijdens een kredietcontrole. Er bestaat geen verzending en er is niets geschreven, ook geen halfaf record dat later opgeruimd moet worden. Het protocol toont de geweigerde aanroep, het blokkadeoverzicht noemt de blokkade en wie haar zette.
      es: Rechazado, no abortado. La propia preparación fue denegada porque el cliente tiene un bloqueo de entrega, puesto durante una comprobación de solvencia. No existe ningún envío y no se escribió nada, ni siquiera un registro a medias que alguien tenga que limpiar después. El protocolo muestra la llamada rechazada y la vista de bloqueos nombra el bloqueo y quién lo puso.
    view: view:fulfillment_blockers
    command: movement_create
    input:
      movement_type: shipment
      item_id: $ref.items.fjord
      quantity: "12"
      from_location_id: $ref.locations.hamburg
      commitment_id: $chapter.order.output.commitment_ids[0]
    next: release-hold

  - key: release-hold
    title:
      en: Release the hold
      de: Sperre aufheben
      nl: Blokkade opheffen
      es: Levantar el bloqueo
    situation:
      en: The credit check came back clean. Release the delivery hold on Nordlicht.
      de: Die Bonitätsprüfung ist sauber ausgegangen. Hebe die Liefersperre für Nordlicht auf.
      nl: De kredietcontrole is schoon teruggekomen. Hef de leverblokkade voor Nordlicht op.
      es: La comprobación de solvencia salió limpia. Levanta el bloqueo de entrega de Nordlicht.
    explain:
      en: A release is its own event on the same hold record, not a deletion. Who set the hold, who lifted it and when stays readable forever. Reality never lifted it on its own and never will. A rule may raise a finding, a decision belongs to a person, and the decision is on the record.
      de: Eine Aufhebung ist ein eigenes Ereignis am selben Sperrdatensatz, keine Löschung. Wer die Sperre gesetzt hat, wer sie aufgehoben hat und wann, bleibt für immer lesbar. Reality hat sie nie von allein aufgehoben und wird es nie tun. Eine Regel darf eine Abweichung heben, eine Entscheidung gehört einem Menschen, und die Entscheidung steht in der Akte.
      nl: Een opheffing is een eigen gebeurtenis op hetzelfde blokkaderecord, geen verwijdering. Wie de blokkade zette, wie haar ophief en wanneer, blijft voor altijd leesbaar. Reality hief haar nooit uit zichzelf op en zal dat nooit doen. Een regel mag een bevinding melden, een besluit hoort bij een mens, en het besluit staat vast.
      es: Un levantamiento es un evento propio sobre el mismo registro de bloqueo, no un borrado. Quién puso el bloqueo, quién lo levantó y cuándo queda legible para siempre. Reality nunca lo levantó por su cuenta ni lo hará. Una regla puede levantar un hallazgo, una decisión pertenece a una persona, y la decisión queda registrada.
    view: view:fulfillment_blockers
    command: party_delivery_hold_release
    input:
      party_id: $ref.parties.nordlicht
    primary:
      record_type: party_hold
      from: output.records[0].id
    next: ship

  - key: ship
    title:
      en: Ship the goods
      de: Ware versenden
      nl: Goederen verzenden
      es: Enviar la mercancía
    situation:
      en: Now record the shipment of 12 mugs to Nordlicht again. Same command, same input, one step later.
      de: Erfasse jetzt den Versand von 12 Bechern an Nordlicht erneut. Derselbe Befehl, dieselbe Eingabe, einen Schritt später.
      nl: Leg nu de verzending van 12 bekers aan Nordlicht opnieuw vast. Dezelfde opdracht, dezelfde invoer, één stap later.
      es: Ahora registra de nuevo el envío de 12 tazas a Nordlicht. El mismo comando, la misma entrada, un paso después.
    explain:
      en: The same command that was refused a step ago now succeeds. The movement fulfils the customer commitment, the reservation is consumed, and a new finding appears at once, "shipped, not billed". Reality knows that goods left the building and no invoice exists for them. That is where the storyline Order to close picks the story up, with the invoice, an overpayment the customer sends and a month-end review.
      de: Derselbe Befehl, der einen Schritt zuvor abgelehnt wurde, geht jetzt durch. Die Bewegung erfüllt die Kundenverpflichtung, die Reservierung wird verbraucht, und sofort erscheint eine neue Abweichung, „geliefert, nicht fakturiert“. Reality weiß, dass Ware das Haus verlassen hat und keine Rechnung dazu existiert. Genau hier nimmt die Storyline „Auftrag bis Abschluss“ den Faden auf, mit der Rechnung, einer Überzahlung des Kunden und einem Monatsrückblick.
      nl: Dezelfde opdracht die één stap geleden werd geweigerd, slaagt nu. De beweging vervult de klantverplichting, de reservering wordt verbruikt en meteen verschijnt een nieuwe bevinding, "verzonden, niet gefactureerd". Reality weet dat goederen het pand hebben verlaten zonder factuur. Daar pakt de storyline Van order tot afsluiting het verhaal op, met de factuur, een te hoge betaling van de klant en een maandafsluiting.
      es: El mismo comando que fue rechazado un paso antes ahora tiene éxito. El movimiento cumple el compromiso con el cliente, la reserva se consume y aparece de inmediato un nuevo hallazgo, "enviado, no facturado". Reality sabe que salió mercancía y no existe factura para ella. Ahí retoma la historia la storyline Del pedido al cierre, con la factura, un pago en exceso del cliente y una revisión de fin de mes.
    view: view:movements
    command: movement_create
    input:
      movement_type: shipment
      item_id: $ref.items.fjord
      quantity: "12"
      from_location_id: $ref.locations.hamburg
      commitment_id: $chapter.order.output.commitment_ids[0]
    primary:
      record_type: movement
      from: output.records[0].id
    expect:
      raised: [shipped_not_billed]
