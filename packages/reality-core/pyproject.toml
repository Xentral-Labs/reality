[project]
name = "business-reality"
version = "0.0.1"
description = "CLI-first RealityOS ERP playground"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.0", "croniter>=6.2.4,<7", "alembic>=1.13", "psycopg[binary]>=3.2", "pydantic>=2.8", "typer>=0.12", "rich>=13.7", "fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9", "PyYAML>=6.0", "httpx>=0.28", "mcp>=1.26,<2", "cryptography>=43,<46", "boto3>=1.35,<2", "argon2-cffi>=25.1,<26", "opentelemetry-sdk>=1.27,<2", "opentelemetry-exporter-otlp-proto-http>=1.27,<2", "opentelemetry-instrumentation-fastapi>=0.48b0", "opentelemetry-instrumentation-sqlalchemy>=0.48b0", "opentelemetry-instrumentation-httpx>=0.48b0", "opentelemetry-instrumentation-asgi>=0.48b0"]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.0", "pytest-cov>=5.0", "pytest-xdist>=3.6", "ruff>=0.6"]

[project.scripts]
reality = "reality.cli.app:app"
reality-scheduler = "reality.scheduler.cli:app"
reality-worker = "reality.worker.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reality"]

[tool.hatch.build.targets.wheel.force-include]
"fixtures/imports" = "reality/examples/imports"
"config" = "reality/config"
"storylines" = "reality/storylines"
"migrations" = "reality/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["reality"]

[tool.coverage.report]
show_missing = true
skip_empty = true
