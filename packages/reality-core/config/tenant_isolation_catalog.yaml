    description: Prepare, explicitly confirm or reject one owned opening-stock action.
    classification: boundary
    reason: Server-resolved ownership, pinned serialization, exact preview/action authorization and common proposal lifecycle; no arbitrary tenant target.
    authority: 096/FR-003, 096/FR-004, 096/FR-009
    operations: &playground_prepare_operations
