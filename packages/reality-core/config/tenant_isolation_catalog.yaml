families:
  - key: diagnostic_reads
    description: Direct MCP diagnostics derive only the selected tenant's retained records.
    classification: boundary
    reason: Shared read services validate tenant scope and reject foreign references without business or cache writes.
    authority: 145/FR-006, 145/FR-007, 145/FR-008, 145/DR-002
    operations: &diagnostic_read_operations
      - reality.services.read_contracts:read_metadata
      - reality.services.read_contracts:discovery_page
      - reality.services.read_contracts:finance_balances
      - reality.services.read_contracts:location_inventory_rows
      - reality.services.read_contracts:operational_page
      - reality.services.core:business_discovery_statement
      - reality.services.projections:derive_projection_rows
      # The change set reads only this company's business events, and is used to
      # decide what a refresh may skip — never what it may reach (spec 241).
      - reality.services.projections:change_set
    evidence:
      - id: tests/test_mcp_read_contract.py::test_diagnostic_services_exclude_foreign_reality
        assertion: boundary
        operations: *diagnostic_read_operations
  - key: playground_prepare
    description: Prepare, explicitly confirm or reject one owned opening-stock action.
    classification: boundary
    reason: Server-resolved ownership, pinned serialization, exact preview/action authorization and common proposal lifecycle; no arbitrary tenant target.
    authority: 096/FR-003, 096/FR-004, 096/FR-009
    operations: &playground_prepare_operations
      - reality.services.playground:prepare_step
      - reality.services.playground:confirm_step
      - reality.services.playground:reject_step
    evidence:
      - id: tests/test_playground_steps.py::test_step_decisions_owner_boundary
        assertion: boundary
        operations: *playground_prepare_operations
  - key: playground_reads
    description: Account-owned run history and setup status require current private ownership.
    classification: boundary
    reason: Account-scoped listing resolves only owned sandbox tenants with active owner membership; no arbitrary tenant target or administrator override.
    authority: 096/FR-001, 096/FR-003, 096/FR-011
    operations: &playground_read_operations
      - reality.services.playground:list_runs
      - reality.services.playground:read_run
      - reality.services.playground:read_step
    evidence:
      - id: tests/test_playground_api.py::test_run_entry_has_no_admin_override
        assertion: boundary
        operations:
          - reality.services.playground:list_runs
          - reality.services.playground:read_run
      - id: tests/test_playground_steps.py::test_step_read_owner_boundary
        assertion: boundary
        operations:
          - reality.services.playground:read_step
  - key: playground_start
    description: Verified account-owned initialization creates only a fresh private sandbox.
    classification: boundary
    reason: No existing tenant may be supplied; verified account ownership, confirmation and quotas govern a newly allocated tenant.
    authority: 096/FR-001, 096/FR-002, 096/FR-003, 096/FR-011
    operations: &playground_start_operations
