version: 1
title: Application Commands
principle: CLI, Web, API, and Chat are adapters. Shared application services are the business entry points.

# Shared input glossary used by the generated developer reference. Keep a parameter
# untyped until it is operationally relevant; once exposed here, explain its business
# meaning rather than merely repeating its data type.
parameter_descriptions:
  delivery_guard: Optional single-line sales-invoice precondition binding the unit and unbilled quantity read for the invoiced order line; rechecked under the delivery lock before recording.
  supplier_id: Opaque same-tenant identity of the supplier Party stated on the invoice.
  invoice_ids: Opaque same-tenant customer-invoice identities explicitly selected for one reminder.
  notice_id: Opaque same-tenant identity of the retained manual reminder.
  level: Explicit manual reminder level; only the closed levels 1, 2, and 3 are accepted.
  notice_date: Calendar date explicitly stated for the manual reminder and its overdue check.
  fee_amount: Exact non-negative reminder fee stated by the confirming human; zero records no fee posting.
  knowledge_at: Optional exact retained knowledge cutoff in UTC; mismatches refuse instead of reinterpreting current evidence as historical.
  scope_id: Exact item identity for inventory or received invoice-line identity for contribution.
  policy_revision_id: Optional exact retained valuation-policy constraint; mismatches refuse without activating policy.
  page: One-based page of retained membership, bounded to 25 records per page.
  language: Requested inspection labels (en/de); nl/es use English fallback.
  review_id: Exact retained inventory or contribution review identity for the selected tool; absence selects its latest review.
  assessment_revision_id: Optional exact retained carrying-value assessment identity paired with the selected inventory review; absence selects the latest verified assessment for a current read.
  match_revision_id: Exact retained commercial match revision identity; absence selects the latest revision for the sold line.
  expected_candidate_hash: Exact fingerprint returned by the current contribution preview; changed evidence requires a new preview.
  profile_confirmed: Explicit owner confirmation of the declared commercial profile for this reviewed scope.
  revenue_complete: Explicit owner confirmation that received revenue covers this entire matched quantity.
  economic_at: Confirmed UTC recognition time; this whole-line contribution scope requires the exact shipment time.
  document_line_id: Opaque same-tenant received document line identity; must belong to the selected document.
  selling_expense_confirmed: Explicit owner confirmation of selling expense, excluding acquisition costs, inventory purchases, general overhead and already included manufacturing cost.
  selling_categories: Complete seven-category commercial_v1 selling checklist; omitted means DB2 remains unknown.
  source_share: Explicit signed share of the selected received amount; total shares cannot exceed that source bucket.
  cost_effect: Explicit economic cost direction, separate from the retained source sign.
  assignment_kind: Direct cost attribution or explicitly allocated share, kept separate in contribution output.
  manifest_id: Opaque sealed receipt review input set; absence requests current retained knowledge.
  confirmed: Explicit authorized approval of the unchanged prepared decision.
  effective_before: Exclusive UTC effective-time cutoff over retained postings, allocations and reversals; absent means current state. Does not reconstruct historical payment terms or knowledge time.
  item_ids: Opaque article identities the caller can still reach, used to select which articles are answered for; absent means every article of the company. It narrows the rows returned and never how one is derived, because each article's position is worked out from its own movements, reservations and open promises.
  party_ids: Opaque business-partner identities the caller can still reach, used to select which partners are answered for; absent means every partner of the company. A balance is summed within one partner and currency and never across them, so naming fewer returns fewer rows of identical arithmetic.
  principal: Trusted authenticated user context supplied by the server, never by model arguments.
  cash_entry_ids: Opaque payment-entry identities the caller can still reach, used to select which payments are answered for; absent means every payment of the company. It narrows the rows returned and never how one is derived, because a payment's allocated and unallocated amounts are worked out from its own control entry and its own allocations.
  commitment_ids: Opaque promise identities the caller can still reach, used to select which promises are answered for; absent means every promise of the company. It narrows the rows returned and never how one is derived, because a promise's quantity, due date, reservation and risk are worked out from its own revisions, movements and reservations.
  supplier_commitment_id: Opaque identity of the incoming supplier commitment whose quantity is being assigned.
  customer_commitment_id: Optional opaque identity of the outgoing customer commitment that the incoming supply is intended to cover; absence explicitly assigns the quantity to stock.
  request_id: Stable caller-provided idempotency identity; replay with identical input returns the existing result and conflicting reuse is refused.
  return_movement_id: Opaque identity of the arrived customer-return Movement whose physical outcome is being decided.
  disposition: Closed physical outcome for returned goods; restock, quarantine or repair, scrap or loss, or return to supplier.
  destination_location_id: Opaque destination location required when returned goods are transferred to saleable stock or quarantine.
  document_ids: Opaque evidence-document identities the caller can still reach, used to select which documents are answered for; absent means every document of the company. It narrows the rows returned and never how one is built, because a document's register row is assembled from its own source record, lines and promises.
  arguments: Strict versioned request object; nested fields are declared by the MCP input schema.
  type: Closed kind of the record where one is stated, such as a party's primary role or a location's type; the roles list, not this field, decides what a party may do.
  promised_at: UTC instant by which the line's quantity is promised; it becomes the due time of the derived Commitment.
  line_type: Closed kind of a document line, such as goods or a charge, taken from the source statement.
  price_list_entry_id: Opaque identity of the price tier the line price came from, when a list price was applied; provenance, not a recalculation.
  invoice_line_id: Opaque identity of the invoice line this credit line refers back to.
  carrier: Carrier name stated for a physical package; it is descriptive and not an internal identity.
  commit: Internal transaction-control flag used when a service participates in a larger atomic operation.
  purpose: Closed business purpose that determines the shipment's counterparty role and compatible Movement type.
  reporter_type: Closed attribution for who stated a shipment observation, such as company, counterparty, or carrier.
  tracking_number: Carrier-assigned package reference used for operational lookup; it is not internal identity.
  movements: Exact existing Movement command inputs to record atomically as the physical contents of one Package.
  shipment_id: Opaque identity of the tenant-scoped physical consignment.
  event_type: Closed logistics observation kind stated for a Shipment or Package.
  location_text: Optional location text exactly as reported with a logistics observation.
  external_event_id: Optional source-assigned event identity used to make repeated intake idempotent.
  event_id: Opaque identity of the immutable ShipmentEvent being corrected.
  replacement_event_id: Optional opaque identity of another ShipmentEvent that replaces the corrected observation.
  target_id: Opaque same-tenant external accounting destination identity.
  command: Explicit owner-confirmed Finance target configuration operation.
  source_query: Literal search for registered source systems available to classify received codes.
  mapping_id: Opaque Finance mapping revision identity; history follows its exact owning scope.
  item: Received component and current internal assignment at its actual evidence scope.
  component_id: Opaque normalized financial component identity.
  reference_query: Literal search for active same-tenant classification references.
  kind: Explicit internal or target reference kind; no inferred tax or country meaning.
  offset: Number of matching rows to skip for bounded pagination.
  reference_id: Opaque same-tenant managed reference identity.
  arguments: Typed reviewed reference change intent, including expected revision and reason.
  query: Optional invoice-number search within matching same-party credit targets.
  values: Validated mode-specific settlement intent from the shared typed tool contract.
  actor_id: Authenticated confirming user identity supplied by the execution boundary, never caller impersonation.
  agreement: Stated supplier entitlement or agreement authorizing the reduction.
  reason_category: Explicit accepted discount, agreed deduction or small remainder category.
  source_effect_id: Stable effect reference within the original evidence, consumed at most once.
  account_id: Opaque same-tenant operational account identity.
  role: Fixed operational account role.
  state: Active or blocked eligibility for new account postings.
  allocation_amount: Explicit stated amount to offset against the selected invoice; zero leaves the credit unsettled.
  order_line_id: Opaque sales-order line identity linked by invoice billing evidence.
  billed_document_line_id: Opaque identity of the billed order line, or selected invoice line for an invoice-linked credit; the shortest typed evidence relationship.
  action_id: Optional opaque Change Proposal identity linking an emitted Business Event to its confirmed action.
  at: UTC instant at which the projection or rule should be evaluated.
  auto: Whether to run the demo without interactive prompts.
  accounting_code: Accounting reference used when postings or exports need a stable account mapping.
  allows_stock: Whether physical inventory may be held at this location.
  amount: Monetary amount of the payment or financial observation.
  as_of: UTC instant the derivation is evaluated at; the current instant when absent.
  expires_at: The best-before date somebody read off the goods or the delivery note, as a calendar day; never computed from a shelf life, and never adjusted once stated.
  lot_id: Opaque identity of the batch whose best-before date is being stated.
  expected_expires_at: The best-before date the caller believes is stated now, or absent to say none is; a correction is refused unless it still matches, so it cannot be made by somebody who has not looked.
  actor_context: Optional free-form note about who acted and on whose behalf, recorded with the audit rather than interpreted.
  actor_context: Optional authenticated actor metadata retained with the correction audit when available.
  capability_id: Opaque identity of the source capability to change.
  code: Short tenant-scoped business code used to find the record operationally.
  commitment_id: Opaque identity of the obligation being reserved, held, or executed.
  company_party_id: Opaque identity of the tenant's company Party in an order flow.
  connector_code: Template code identifying the connector shell to install.
  context: Optional structured metadata retained with the operation for traceability.
  context_json: Optional JSON object retained as structured context with the source record.
  counterparty_id: Opaque identity of the customer or supplier Party in an order flow.
  conversion_factor: Quantity of base units represented by one purchase unit.
  created_by: Actor or adapter that initiated the operation.
  credit_limit: Optional monetary exposure limit used by operational credit checks.
  currency: ISO 4217 currency code for monetary values.
  customer_reference: Reference supplied by the customer for matching and communication.
  default_currency: ISO 4217 currency used when an operation provides no explicit currency.
  default_location_id: Opaque identity of the item's preferred operational stock location.
  description: Human-readable explanation of the record or rule.
  direction: Business flow direction, such as sales or purchase, incoming or outgoing.
  document_date: Business date printed on or asserted by the evidence document.
  document_id: Opaque identity of the evidence document to inspect or correct.
  document_type: Evidence kind, such as sales order, purchase order, or invoice.
  due_days: Number of calendar days from the document date until payment is due.
  requires_prepayment: Whether customer delivery requires qualifying allocated payment evidence before dispatch.
  effective_at: UTC instant from which the observation or rule takes effect.
  email: Email address supplied for the named business purpose.
  emails: Bounded labelled email addresses recorded for exact Party matching.
  label: Optional human-readable description of a value's business purpose.
  external_id: Identifier assigned by the named external source system; never internal identity.
  gross_amount: Total the source states for the document; recorded as received and never calculated.
  resolves_movement_id: Opaque identity of the return this movement settles; absent means it settles none.
  credit_note_id: Opaque identity of the credit note being posted, netted or refunded.
  due_at: The date the counterparty now states the promise is due on; optional if a quantity is stated.
  due_before: Promises due strictly before this instant are considered; nothing later matches.
  expected_count: The number the caller saw in the preview; a closure is refused unless it still matches.
  refund_number: Caller-supplied number for the refund document; one is generated when absent.
  idempotency_key: Caller-stable retry identity for one intended operation; reuse with different content is rejected.
  expected_revision: Canonical revision of the Evidence snapshot on which a correction is based.
  file: Path to the JSON file whose payload should be ingested losslessly.
  from_location_id: Opaque identity of the location from which physical stock leaves.
  handling_unit_id: Optional pallet or handling-unit identity, for example an NVE/SSCC-labelled pallet.
  host: Network interface on which the local web server should listen.
  invoice_id: Opaque identity of the invoice evidence associated with a payment or allocation.
  invitation_id: Opaque identity of the company invitation to resend or revoke.
  is_active: Whether the record remains selectable for new operational work.
  is_default: Whether this rule is the fallback for its direction and currency.
  item_id: Opaque identity of the operational item reference.
  item_type: Operational classification such as product, service, or charge.
  job_id: Opaque identity of the queued source-processing job.
  lead_time_days: Expected calendar days required before supply becomes available.
  limit: Maximum number of records or jobs processed by this invocation.
  location_id: Opaque identity of the operational or physical location.
  location_type: Operational location classification, such as warehouse or logical location.
  locale: Preferred supported language for invitation delivery, with the documented fallback when absent or unsupported.
  lot_id: Exact batch or lot identity to reserve or move.
  lot_number: Human-readable batch number supplied by production or an external system.
  lines: Complete intended normalized DocumentLine Evidence snapshot for an atomic manual correction.
  min_quantity: Inclusive quantity threshold from which a price tier applies.
  membership_id: Opaque identity of the company membership to remove.
  model: Target master-data model whose lifecycle is being changed.
  movement_id: Opaque identity of the immutable physical Movement being inspected or corrected.
  movement_type: Physical event kind — opening_stock, receipt, shipment, transfer, adjustment, return (goods back from a customer), or supplier_return (goods back to a supplier).
  name: Human-readable display name; it is not used as internal identity.
  name_or_id: Tenant name or opaque tenant identity used to select a workspace.
  note: Optional operational explanation retained with the record.
  observed_at: UTC instant at which a source-supported Fact was observed.
  number: Human-facing document or transaction number; it is not internal identity.
  nve: Optional Nummer der Versandeinheit / SSCC printed on a pallet or handling unit.
  occurred_at: UTC instant at which the physical or business event occurred.
  ordered_at: UTC instant at which an order was placed in its source context.
  parent_location_id: Optional opaque identity of the containing location in the location hierarchy.
  party_group_id: Opaque identity of a pricing or operational party group.
  party_id: Opaque identity of the customer, supplier, or other operational party.
  party_type: Operational party classification used by repeated rules and filtering.
  payload: Lossless JSON object received from or prepared for an external context.
  payment_number: Human-facing payment reference used for matching and investigation.
  payments: The invoices a payment run pays and the amount stated against each; every amount is received, never derived from a discount rate.
  announced_at: The instant the customer said the goods were coming back; the current instant when absent.
  announcement: The announced customer return being measured.
  announcement_id: Opaque identity of the announced customer return.
  expected_by: The day the customer says the goods will go back; absent means they did not say.
  status: Lifecycle state to filter by, such as open, fulfilled, or withdrawn.
  reference: The number the returning parcel will carry, as the customer or the company stated it; never generated.
  return_announcement_id: Opaque identity of the announced return these goods fulfil; absent means they were not announced.
  shipment_package_id: Opaque identity of the physical shipment package that carried this exact movement quantity; absent means no package was recorded.
  pay_by: The day the payment run is being made for; invoices due on or before it are proposed, as is any invoice whose early-payment window is still open.
  expected_total: The sum of money the caller confirmed; a run is refused unless the stated amounts still add up to it.
  discount_days: Days from the invoice date within which an early-payment discount applies; stated together with the rate or not at all.
  discount_percent: Early-payment discount rate the term grants, above zero and below 100; stated together with the days or not at all.
  payment_term_code: Tenant-scoped code of the payment condition to apply.
  payment_term_id: Opaque identity of the payment condition whose lifecycle is changed.
  price_list_id: Opaque identity of the sales or purchase price list.
  priority: Ordering used when more than one eligible rule could apply.
  principal: Authenticated human actor whose current company role is reauthorized when the command executes.
  projection_name: Stable name of the materialized read model to read or rebuild.
  predicate: Stable reviewed name of the observed property.
  preview_fingerprint: Canonical semantic identity of the server preview being confirmed.
  posting_group_id: Opaque identity shared by the balanced LedgerEntries in one posting group.
  refresh: Compatibility argument for stored reads; must be false. Use the explicit maintenance service to rebuild a projection.
  replacement: Optional complete intended Movement that replaces the compensated original.
  port: TCP port on which the local web server should listen.
  purchase_unit: Unit in which the item is normally purchased from suppliers.
  quantity: Decimal quantity expressed in the item's relevant unit.
  raw: Whether to print the original lossless source payload instead of a summary.
  note: Free-text record of what the counterparty said, kept with the statement.
  reason: Human-readable explanation for a hold, correction, or lifecycle change.
  reservation_id: Opaque identity of the reservation being given back.
  retained_allocations: Exact active reservation identities and quantities the operator chooses to preserve when a reduced promise spans different physical allocations.
  records: Several master-data records stated together, each with the same fields the single-record command takes.
  stated_at: When the counterparty stated the new date, defaulting to now.
  reason_code: Stable machine-readable reason used for filtering and automation.
  record_id: Opaque identity of the master-data record whose lifecycle is being changed.
  requested_delivery_at: UTC instant by which the customer or operation requests delivery.
  roles: Operational roles assigned to a party, for example customer or supplier.
  role: Repeatable operational role assigned to a party, for example customer or supplier.
  sales_channel: Operational sales-channel reference used for repeated routing or pricing decisions.
  serial_number: Human-readable unique serial identifier carried by one physical unit.
  serial_unit_id: Exact serial-unit identity to reserve or move; serialized quantities are always one.
  ship_to_party_id: Opaque identity of the party receiving the physical delivery.
  sku: Human-facing stock-keeping code used to find an item; internal joins use item_id.
  source_payload: Lossless external JSON evidence from which typed operational fields were selected.
  source_id: Opaque identity of the immutable source record to inspect.
  source_record_id: Opaque identity of the immutable source record supporting this typed record.
  subject_id: Opaque identity of the existing Reality record described by an observation.
  subject_type: Cataloged Reality record type described by an observation.
  source_artifact_id: Optional opaque identity of the immutable streamed file supporting this source record.
  source_system: Tenant-scoped code naming the external origin of a record.
  source_system_id: Opaque identity of the registered external source instance.
  source_type: Upstream record kind as named by its source, before operational interpretation.
  source_types: Explicit set of upstream record kinds enabled for the connector shell.
  source_version_at: Upstream version timestamp used to order immutable source versions.
  system_code: Unique tenant-scoped code for one external source instance.
  system_name: Human-readable name of the external source instance.
  tenant: Optional opaque tenant identity; otherwise the currently selected workspace is used.
  target_type: Operational Reality type the source capability is intended to produce.
  tax_identifier: External tax or VAT identifier retained when operational matching requires it.
  to_location_id: Opaque identity of the location into which physical stock arrives.
  tracking_type: Inventory identity policy; untracked, lot, or serial.
  unit: Unit of measure in which the quantity is expressed.
  unit_price: Decimal monetary amount for one unit before quantity multiplication.
  valid_from: Inclusive UTC instant from which a rule or price may be selected.
  valid_until: Optional inclusive UTC instant after which a rule or price is no longer selected.
  value: Scalar observation value validated and canonicalized by its predicate contract.

commands:
  - name: Read reviewed partial commercial match
    service: commercial_match
    mode: read
    adapters: [CLI, Web, MCP, Chat]
    reads: [document_line, cost_commercial_match_revision, cost_commercial_inventory_part, cost_commercial_direct_part, cost_inventory_member, cost_inventory_review, cost_policy_revision, cost_movement_basis, cost_attribution_revision, cost_attribution_part, cost_component_basis, financial_component]
    writes: []
    effect: Derive DB1 from one confirmed partial commercial match or reproduce an exact retained revision without creating financial authority.
  - name: Read cost query context
    service: cost_query
    mode: read
    adapters: [CLI, Web, MCP, Chat]
    reads: [business_event, cost_attribution_part, cost_attribution_revision, cost_component_basis, cost_contribution_review, cost_input_manifest, cost_inventory_member, cost_inventory_review, cost_movement_basis, cost_ownership_revision, cost_policy_revision, cost_receipt_basis, cost_revenue_match_basis, cost_scope_review, cost_selling_attribution_part, cost_selling_review_category, cost_selling_review_member, document_line, financial_component, item]
    writes: []
    effect: Read one admitted inventory or contribution scope with exact retained cutoffs and explicit current or historical freshness; no global generation claim.
  - name: Inspect retained cost record
    service: cost_record
    mode: read
    adapters: [CLI, Web, MCP, Chat]
    reads: [cost_receipt_basis, cost_component_basis, cost_conversion_basis_revision, cost_attribution_revision, cost_attribution_part, cost_component_replacement, cost_correction_basis, cost_input_manifest, cost_scope_review, cost_scope_review_category, cost_manifest_receipt, cost_manifest_component, cost_manifest_attribution, cost_manifest_correction, cost_manifest_replacement, cost_policy_revision, cost_movement_basis, cost_ownership_revision, cost_inventory_review, cost_inventory_member, cost_valuation_assessment_revision, cost_valuation_assessment_part, cost_revenue_match_basis, cost_contribution_review, cost_selling_attribution_part, cost_selling_review_category, cost_selling_review_member, cost_company_census, cost_company_census_movement, cost_company_census_document, cost_company_census_line, cost_company_census_source, cost_captured_basis, cost_captured_inventory_basis, cost_captured_contribution_basis, cost_company_manifest, cost_company_inventory_input, cost_company_contribution_input, cost_company_generation, financial_component, action, movement_correction, interpretation_outcome]
    writes: []
    effect: Inspect retained evidence and decision fields with tenant-safe source links and paged exact membership; no current valuation claim or business writes.
  - name: Read reviewed commercial contribution
    service: reviewed_contribution
    mode: read
    adapters: [CLI, Web, MCP, Chat]
    reads: [cost_selling_attribution_part, cost_selling_review_category, cost_selling_review_member, cost_attribution_revision, cost_component_basis, cost_conversion_basis_revision, financial_component, document_line, business_event, cost_revenue_match_basis, cost_contribution_review, cost_inventory_member, cost_inventory_review, cost_movement_basis, cost_input_manifest]
    writes: []
    effect: Derive confirmed whole-line DB1 and independently reviewed DB2, or reproduce their exact retained historical basis.
  - name: Preview current contribution candidate
    service: contribution_preview
    mode: read
    adapters: [CLI, Web, MCP, Chat]
    reads: [document, document_line, commitment, commitment_revision, movement, movement_correction, business_event, cost_inventory_review, cost_inventory_member, cost_policy_revision, cost_movement_basis, cost_ownership_revision, cost_input_manifest]
    writes: []
    effect: Follow an exact whole invoice/order/shipment scope to received net revenue and reviewed consumption; show known DB1 only, with missing commercial review and selling costs.
  - name: Read reviewed inventory acquisition costs
    service: inventory_cost
    mode: read
    adapters: [CLI, Web, MCP, Chat]
    reads: [item, business_event, source_record, cost_policy_revision, cost_movement_basis, cost_ownership_revision, cost_inventory_review, cost_inventory_member, cost_valuation_assessment_revision, cost_valuation_assessment_part, cost_conversion_basis_revision, cost_receipt_basis, cost_input_manifest, cost_attribution_revision, cost_attribution_part, cost_scope_review]
    writes: []
    effect: Derive stock acquisition value and consumption from a bounded confirmed ownership/policy scope, and derive a separate carrying value only from an exact source-backed retained assessment.
  - name: Read received acquisition-cost evidence
    service: cost_evidence
    mode: read
    adapters:
    - CLI
    - Web
    - MCP
    - Chat
    reads:
    - movement
    - document
    - document_line
    - source_record
    - financial_component
    - cost_receipt_basis
    - cost_attribution_revision
    - cost_attribution_part
    - cost_scope_review
    - cost_input_manifest
    writes: []
    effect: Derive receipt costs from exact received amounts and explicit owner decisions; retain sealed
      reviewed knowledge and keep incomplete costs unknown.
  - name: Read receipt acquisition costs
    service: receipt_cost
    mode: read
    adapters:
    - CLI
    - Web
    - MCP
    - Chat
    reads:
    - movement
    - document
    - document_line
    - source_record
    - financial_component
    - cost_receipt_basis
    - cost_attribution_revision
    - cost_attribution_part
    - cost_scope_review
    - cost_input_manifest
    writes: []
    effect: Derive receipt costs from exact received amounts and explicit owner decisions; retain sealed
      reviewed knowledge and keep incomplete costs unknown.
  - name: Confirm cost and contribution decision
    service: execute_cost_change
    mode: mutation
    adapters:
    - CLI
    - Web
    - MCP
    - Chat
    reads:
    - movement
    - document
    - document_line
    - source_record
    - financial_component
    - cost_receipt_basis
    - cost_attribution_revision
    - cost_attribution_part
    - cost_scope_review
    - cost_input_manifest
    - cost_inventory_review
    - cost_inventory_member
    - cost_valuation_assessment_revision
    - cost_valuation_assessment_part
    - cost_conversion_basis_revision
    writes:
    - cost_revenue_match_basis
    - cost_contribution_review
    - cost_selling_attribution_part
    - cost_selling_review_category
    - cost_selling_review_member
    - cost_policy_revision
    - cost_movement_basis
    - cost_ownership_revision
    - cost_inventory_review
    - cost_inventory_member
    - cost_valuation_assessment_revision
    - cost_valuation_assessment_part
    - cost_conversion_basis_revision
    - financial_component
    - cost_receipt_basis
    - cost_component_basis
    - cost_attribution_revision
    - cost_attribution_part
    - cost_component_replacement
    - cost_scope_review
    - cost_scope_review_category
    - cost_input_manifest
    - cost_manifest_receipt
    - cost_manifest_component
    - cost_manifest_attribution
    - cost_manifest_correction
    - cost_manifest_replacement
    - business_event
    - action
    effect: Derive receipt costs from exact received amounts and explicit owner decisions; retain sealed
      reviewed knowledge and keep incomplete costs unknown.
  - name: Change Private Graph Report
    service: change_graph_report
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [tenant, app_user, tenant_membership, analytics_report]
    writes: [analytics_report]
    effect: Save, rename, duplicate or delete the authenticated user's private graph question, recording the model version that gave it meaning, with revision and retry protection.
  - name: List Targets
    service: list_targets
    mode: read
    adapters:
    - CLI
    - Web
    - MCP
    - Chat
    reads:
    - tenant
    - accounting_target
    - accounting_target_reference
    - finance_target_mapping_revision
    - finance_reference
    - finance_state
    - document
    - document_line
    - ledger_entry
    writes: []
    effect: Maintain and explain explicit external destinations without changing financial
      evidence.
  - name: List Target References
    service: list_target_references
    mode: read
    adapters:
    - CLI
    - Web
    - MCP
    - Chat
    reads:
    - tenant
    - accounting_target
    - accounting_target_reference
    - finance_target_mapping_revision
    - finance_reference
    - finance_state
    - document
    - document_line
    - ledger_entry
    writes: []
    effect: Maintain and explain explicit external destinations without changing financial
      evidence.
  - name: List Mappings
