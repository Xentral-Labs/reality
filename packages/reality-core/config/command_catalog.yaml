  proposal_approve_and_execute:
    kind: confirm
    purpose: Apply one exact prepared mutation after an explicit authorized decision through a single-use Reality execution boundary.
    use_when: [A permissioned caller submits an explicit authorized decision on the exact pending proposal preview.]
    do_not_use_when:
      - Approval is inferred from model output, credentials, connection, or prior similar decisions.
      - The proposal is executing, rejected, unknown, foreign, or no longer matches the intended action.
    required_context: [change_proposal]
    preconditions: [The proposal belongs to the selected tenant, remains proposed, and approved is explicitly true.]
    confirmation: explicit_decision
    principal_semantics: Read next_step.decision_policy for the action-specific approval authority and existing contextual exceptions; required_principal is a compatibility summary. Confirmation access and approved=true do not verify human involvement or grant autonomous agent delegation. Operations requiring an authenticated principal representing a Reality user are refused unless the confirming adapter supplies it. Approval-only owner or private-author requirements do not become rejection requirements.
    idempotency: {mode: single_use_replay, guidance: An executed replay returns the stored receipt without executing again; never retry an executing proposal blindly.}
    retry_behavior: Retry only after a transport failure by reading proposal_execution_status; an executed result is replay-safe and an executing result requires reconciliation.
    unknown_behavior: Executing means the effect may be in progress or committed without a delivered response; reconcile by proposal ID and do not execute again.
    refusals:
      - {code: approval_required, description: approved=true was not supplied for an explicit authorized decision.}
      - {code: execution_unknown, description: The proposal is already executing and cannot be safely retried.}
      - {code: proposal_settled, description: The proposal was rejected or otherwise cannot be confirmed.}
      - {code: proposal_not_found, description: No proposal is visible in the selected tenant.}
    events: [reservation.created]
    receipt:
      fields: [proposal_id, capability, reservation_id, commitment_id, requested, applied, shortage, event_id]
      limitations: A receipt proves neither that authoritative state still matches nor that fulfilment or the customer outcome occurred.
    verification_reads:
      - {name: proposal_execution_status, proves: Correlated execution evidence and current Reservation/Commitment values match the stored receipt.}
      - {name: business_records_discover, proves: Named operational records remain visible with current tenant-scoped values.}
    examples:
      use: [{scenario: An accountable operator or agent approves the exact pending reservation proposal., reason: An explicit authorized decision permits the single-use confirmation boundary.}]
      do_not_use: [{scenario: An agent believes a similar proposal would usually be approved., reason: Learned behavior and model output are not confirmation authority.}]
  proposal_execution_status:
    kind: read
    application_tool: proposal_execution_status
    purpose: Reconcile one confirmation lifecycle and validate its stored receipt against authoritative Reality records.
    use_when: [A confirmation response was lost, execution is indeterminate, or an exact effect needs verification.]
    do_not_use_when: [A caller wants to approve, retry, or infer downstream fulfilment from a reservation.]
    required_context: [change_proposal]
    data_basis: [change_proposal, reservation, commitment, business_event]
    limitations: [Verification covers the correlated execution and operational allocation only, not fulfilment or customer outcome.]
    freshness: Reflects committed proposal, Reservation, Commitment, and BusinessEvent state at read time.
    empty_result: An unknown or foreign proposal is not found.
    refusal_behavior: Tenant scope is enforced and no existence is disclosed across tenants.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves: [The receipt matches the proposal and correlated committed operational records.]
      does_not_prove: [Goods moved, fulfilment completed, or the intended customer outcome occurred.]
    unknown_when: [The proposal is executing, a correlated event is absent, or receipt and Reality values disagree.]
    next_steps: [Do not reconfirm an executing proposal; inspect the named records and escalate unresolved evidence.]
    examples:
      use: [{scenario: Reconcile a reservation confirmation after the client lost its response., reason: The proposal ID is the stable reconciliation key.}]
      do_not_use: [{scenario: Prove that the customer received the goods., reason: Reservation verification does not prove physical Movement or delivery.}]
  reality_gaps:
    kind: read
    application_tool: reality_gaps
    purpose: List tenant-scoped missing-information investigations and their current workflow state.
    use_when: [An operator or agent needs the queue of reported information gaps.]
    do_not_use_when: [A caller wants to infer that an unreported gap does not exist.]
    required_context: [tenant]
    data_basis: [reality_gap]
    limitations: [The queue contains reported investigations, not an automatic proof of completeness.]
    freshness: Reflects committed Reality Gap state at read time.
    empty_result: No matching gap has been reported in the selected tenant.
    refusal_behavior: Tenant scope is enforced and no existence is disclosed across tenants.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [Reported gaps and their current state.], does_not_prove: [That all missing information has been discovered.]}
    unknown_when: [A business need has not yet been reported or classified.]
    next_steps: [Capture a new gap when an operator encounters missing information.]
    examples:
      use: [{scenario: Review unresolved Shopify information needs., reason: The queue is the shared investigation inbox.}]
      do_not_use: [{scenario: Certify that the tenant model is complete., reason: Absence from the queue is not completeness evidence.}]
  reality_gap_get:
    kind: read
    application_tool: reality_gap_get
    purpose: Inspect one missing-information investigation with its evidence, decision, rule, and outcomes.
    use_when: [An operator or agent needs the traceable detail behind one reported gap.]
    do_not_use_when: [A caller lacks the opaque gap identity or wants to mutate the investigation.]
    required_context: [reality_gap]
    data_basis: [reality_gap, reality_gap_entry, interpretation_rule, rule_interpretation_outcome]
    limitations: [The detail records the investigation and implementation evidence; it does not prove external business truth beyond linked sources.]
    freshness: Reflects committed investigation, rule, and outcome state at read time.
    empty_result: An unknown or foreign gap is not found.
    refusal_behavior: Tenant scope is enforced and no existence is disclosed across tenants.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [The recorded investigation history and linked implementation state.], does_not_prove: [Unrecorded external facts.]}
    unknown_when: [Evidence is incomplete or no decision has been accepted.]
    next_steps: [Add source-grounded evidence, request a recommendation, or simulate an accepted Fact rule.]
    examples:
      use: [{scenario: Explain why a Shopify field became a Fact rule., reason: Detail preserves the evidence and decision chain.}]
      do_not_use: [{scenario: Change a rule without confirmation., reason: This capability is read-only.}]
  reality_gap_simulate:
    kind: read
    application_tool: reality_gap_simulate
    purpose: Preview deterministic matches and normalized Fact values for a draft or accepted interpretation rule without writing Reality.
    use_when: [An operator needs to validate a SourceRecord-to-Fact rule before activation.]
    do_not_use_when: [The intended change creates typed Evidence, operational Reality, projections, or exceptions.]
    required_context: [reality_gap, source_record]
    data_basis: [reality_gap, interpretation_rule, source_record]
    limitations: [Simulation uses the closed V1 rule grammar and does not create Facts or outcomes.]
    freshness: Evaluates committed SourceRecords and the supplied or stored rule at read time.
    empty_result: No in-scope SourceRecord matches the rule.
    refusal_behavior: Invalid paths, predicates, types, normalizers, values, or cross-tenant identities are rejected.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [Which current source versions would match and what values would be normalized.], does_not_prove: [Future matches or business correctness.]}
    unknown_when: [The source field is absent, invalid for the declared type, or outside the closed grammar.]
    next_steps: [Review samples and activate only an accepted Fact rule with explicit confirmation.]
    examples:
      use: [{scenario: Preview a Shopify shipping-priority Fact rule., reason: Samples expose matches and normalized values without mutation.}]
      do_not_use: [{scenario: Preview a reservation policy., reason: V1 self-service rules may only derive Facts from SourceRecords.}]
  commitment_revise_propose:
    application_tool: commitment_revise
    purpose: Revise the still-open quantity or due date of an existing commitment while preserving its evidence and fulfillment history.
    use_when:
      - A customer or supplier changes the remaining promised quantity or due date and the commitment must stay active.
    do_not_use_when:
      - The complete open remainder is cancelled; use commitment_cancel_propose instead.
      - Goods physically moved or an order document must be rewritten.
    required_context: [commitment, reservation]
    preconditions:
      - The commitment exists in the selected tenant and the requested total is not below the quantity already fulfilled.
      - When multiple active reservations exist, retained_allocations explicitly identifies the opaque reservation IDs and retained quantities.
    confirmation: required
    idempotency: {mode: required, guidance: Reuse one caller-stable request ID only for the identical revision and reconcile the proposal receipt before retrying an unknown outcome.}
    refusals:
      - {code: invalid_revision, description: The requested quantity conflicts with fulfillment already recorded or another current constraint.}
      - {code: allocation_selection_required, description: Multiple reservations require an explicit retained allocation selection.}
    events: [commitment.revised, reservation.released, reservation.created]
    verification_reads:
      - {name: commitment_register, proves: The current open commitment reflects the reviewed revision.}
      - {name: inventory, proves: Only the reviewed reservation quantities remain allocated.}
    examples:
      use:
        - {scenario: A customer reduces an open order line from ten units to six before shipment., reason: The promise remains active while its open quantity and allocation change.}
      do_not_use:
        - {scenario: A customer cancels every unshipped unit., reason: A cancellation needs an explicit reason and cancellation event.}
  commitment_cancel_propose:
    application_tool: commitment_cancel
    purpose: Cancel the complete open remainder of an existing commitment with an explicit business reason while preserving evidence and physical history.
    use_when:
      - A customer or supplier withdraws every remaining promised unit and active allocations or holds must be released.
    do_not_use_when:
      - Only quantity or due date changes and the commitment remains active; use commitment_revise_propose instead.
      - Goods physically moved, were returned, or must be scrapped.
    required_context: [commitment, reservation]
    preconditions:
      - The commitment exists in the selected tenant and a non-empty business reason is supplied.
    confirmation: required
    idempotency: {mode: required, guidance: Reuse one caller-stable request ID only for the identical cancellation and reconcile the proposal receipt before retrying an unknown outcome.}
    refusals:
      - {code: missing_reason, description: Cancellation requires an explicit business reason.}
      - {code: commitment_closed, description: A fully settled or already cancelled commitment has no open remainder to cancel.}
    events: [commitment.cancelled, reservation.released]
    verification_reads:
      - {name: commitment_register, proves: The commitment is cancelled and no open remainder remains.}
      - {name: inventory, proves: Released reservations no longer reduce available stock.}
    examples:
      use:
        - {scenario: A customer cancels the unshipped remainder of an order line., reason: The explicit cancellation closes the promise without inventing a physical movement.}
      do_not_use:
        - {scenario: A warehouse reports damaged stock., reason: Physical loss requires an exact movement rather than promise cancellation.}
  fact_observe_propose:
    application_tool: fact_observe
    purpose: Record one reviewed, source-supported observation without replacing a typed business transition.
    use_when: [An immutable SourceRecord explicitly supports an approved Fact predicate about an existing subject.]
    do_not_use_when:
      - The statement is only model output, an unsupported inference, or an organizational policy.
      - A Commitment, Reservation, Movement, or LedgerEntry already represents the business meaning.
    required_context: [source_record, commitment]
    preconditions: [Source and subject exist in the selected tenant and the predicate accepts the subject and value.]
    confirmation: required
    idempotency: {mode: required, guidance: Reuse one caller-stable key only for the identical observation; changed content needs a new key.}
    refusals:
      - {code: unsupported_predicate, description: The Fact predicate is not registered for the subject or value.}
      - {code: missing_source, description: The immutable supporting SourceRecord does not exist in the selected tenant.}
    events: [fact.observed]
    verification_reads:
      - {name: timeline, proves: The Fact observation event and opaque identity appear in tenant history.}
    examples:
      use:
        - {scenario: A Shopify source explicitly states express shipping for an existing commitment., reason: The contextual observation has immutable source evidence.}
        - {scenario: A customer email explicitly states an approved delivery preference., reason: The statement is contextual evidence rather than a physical event.}
      do_not_use:
        - {scenario: An agent predicts that an order will ship tomorrow., reason: Model inference without source evidence is not a Fact.}
  order_create_propose:
    application_tool: order_create
    purpose: Record a manual order as Source and Document Evidence with derived Commitments.
    use_when: [A human supplies a complete manual order whose parties, items, locations, quantities, and prices are known.]
    do_not_use_when:
      - The source only reports stock allocation, physical execution, or payment.
      - An existing order needs correction rather than a new source identity.
    required_context: [party, item, location, payment_term]
    preconditions: [All referenced master data belongs to the selected tenant and lines form a complete intended order.]
    confirmation: required
    idempotency: {mode: unsafe_retry, guidance: Reconcile Source and Document registers before retrying an unknown outcome.}
    refusals:
      - {code: invalid_order_context, description: Required party, item, location, or payment context is absent or invalid.}
      - {code: duplicate_source_identity, description: The proposed source identity conflicts with existing evidence.}
    events: [source_record.stored, document.recorded, commitment.created]
    verification_reads:
      - {name: document_register, proves: Document Evidence links to its immutable source.}
      - {name: commitment_register, proves: Promised quantities exist as Commitments rather than document status.}
    examples:
      use:
        - {scenario: A sales colleague enters a complete customer order manually., reason: A new order needs Source, Evidence, and outgoing Commitments.}
        - {scenario: A buyer records a complete supplier purchase order manually., reason: A new purchase creates incoming Commitments from evidence.}
      do_not_use:
        - {scenario: Warehouse staff report that an existing order left the building., reason: Physical execution requires a Movement.}
  reservation_propose:
    application_tool: reserve
    purpose: Allocate currently available stock to an existing outgoing Commitment.
    use_when: [An existing outgoing Commitment needs bounded stock allocation before fulfillment.]
    do_not_use_when: [Goods have already physically moved., A source expresses only a preference or future promise.]
    required_context: [commitment, item, location, movement, reservation]
    preconditions: [The commitment is open and matching stock identity is available in the selected tenant.]
    confirmation: required
    idempotency: {mode: unsafe_retry, guidance: Re-read Commitment register and Inventory before retrying an unknown outcome.}
    refusals:
      - {code: insufficient_stock, description: The requested allocation exceeds matching available stock.}
      - {code: commitment_closed, description: The commitment no longer accepts allocation.}
    events: [reservation.created]
    verification_reads:
      - {name: inventory, proves: Reserved quantity increases and available quantity decreases.}
      - {name: commitment_register, proves: Allocation links to the intended Commitment.}
    examples:
      use:
        - {scenario: Allocate five available units to an existing customer commitment., reason: Reservation is the shortest representation of allocation.}
        - {scenario: Allocate an exact lot before picking., reason: Stock stays physically in place while becoming reserved.}
      do_not_use:
        - {scenario: Record that five units were shipped., reason: A completed physical event requires a Movement.}
  movement_create_propose:
    application_tool: movement_create
    purpose: Record an immutable physical receipt, transfer, shipment, return, or adjustment.
    use_when: [A physical stock event occurred with known item, quantity, time, and applicable locations.]
    do_not_use_when:
      - The source expresses only a promise, planned allocation, preference, or prediction.
      - An existing Movement is wrong and requires a compensating correction.
    required_context: [item, location, commitment, reservation]
    preconditions: [Item and locations belong to the selected tenant and the movement type has a valid physical direction.]
    confirmation: required
    idempotency: {mode: unsafe_retry, guidance: Re-read Inventory and Timeline before retrying an unknown physical write.}
    refusals:
      - {code: invalid_physical_direction, description: Movement type and source or destination locations are inconsistent.}
      - {code: invalid_tracking_identity, description: Tracking identity does not satisfy item rules.}
    events: [movement.recorded, reservation.consumed, reservation.created, commitment.fulfilled]
    verification_reads:
      - {name: inventory, proves: Physical stock reflects the immutable Movement.}
      - {name: commitment_register, proves: Fulfillment derives from Movements linked to the Commitment.}
      - {name: timeline, proves: The physical event is visible with its opaque identity.}
    examples:
      use:
        - {scenario: Record goods received into a warehouse after arrival., reason: A receipt is an actual physical Movement.}
        - {scenario: Record a completed shipment against an outgoing commitment., reason: Fulfillment derives from the linked Movement.}
      do_not_use:
        - {scenario: A customer asks for delivery next week., reason: A promise is not evidence that goods moved physically.}
  interpretation_coverage:
    kind: read
    application_tool: interpretation_coverage
    purpose: Explain whether immutable sources were interpreted and which opaque Reality identities each attempt produced.
    use_when: [A source-processing outcome, retry history, or produced-record identity is needed.]
    do_not_use_when: [Current business state or proof that a produced record remains operationally valid is required.]
    required_context: [source_record]
    data_basis: [source_record, import_job, interpretation_outcome, interpretation_record_reference]
    limitations: [An interpretation outcome is processing audit and does not replace the produced Reality records.]
    freshness: Reflects committed source and attempt outcomes at read time; pending work remains explicitly pending.
    empty_result: No matching tenant source exists; an old source without outcomes is labeled not_recorded.
    refusal_behavior: A foreign or unknown source identity behaves as not found.
    confirmation: none
    side_effects: none
    verification:
      role: context
      proves: [A named attempt classification and its recorded produced identities exist.]
      does_not_prove: [The produced business state is still current or that a later effect succeeded.]
    unknown_when: [The source is pending, processing, not_recorded, or its produced identities have not been re-read.]
    next_steps: [Read the produced opaque identities through their authoritative register or explanation capability.]
    examples:
      use: [{scenario: Explain why a Shopify source failed once and succeeded on retry., reason: Attempt history is the subject.}]
      do_not_use: [{scenario: Prove that an order is ready to ship., reason: Read order and inventory state instead.}]
  business_logic_compare:
    kind: read
    application_tool: business_logic_compare
    purpose: Compare supplied conditions or an authorized current record with actual executable test assumptions and source-cited rules.
    use_when: [A professional asks whether their case has the same known conditions as an existing test.]
    do_not_use_when: [A matching example is being used to authorize or execute a business action.]
    required_context: [tenant, registered business entry, actual scenario or relevant case conditions]
    data_basis: [party, document, document_line, commitment, commitment_hold, business_event, ledger_entry, settlement_allocation]
    limitations: [Similarity never proves an outcome; missing fixture or historical source evidence remains unknown.]
    freshness: Actual running code and approved tests are inspected on demand; referenced records use current shared-service reads.
    empty_result: No linked approved test is available for this entry.
    refusal_behavior: Foreign records are not found; conflicting input modes or changed evidence are rejected.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [Which supplied or currently held conditions match known test values.], does_not_prove: [Successful execution or a complete business outcome.]}
    unknown_when: [A relevant value, currency, unit, fixture assumption or historical rule version is unavailable.]
    next_steps: [Read the exact rule and test source; use the normal confirmed operation for any change.]
    examples: {use: [{scenario: Compare a customer's current limit with a synthetic credit test., reason: The read preserves current evidence and unknown assumptions.}], do_not_use: [{scenario: Release the customer's hold based on similarity., reason: An owner must use the reviewed confirmed release action.}]}
  business_records_discover:
    kind: read
    application_tool: business_discover
    purpose: Find bounded tenant-owned business records and their opaque identities before a precise read or proposal.
    use_when: [The correct opaque record identity is not yet known.]
    do_not_use_when: [A selected record needs complete explanation or an effect needs verification.]
    required_context: [tenant]
    data_basis: [party, item, location, document, commitment, movement, reservation]
    limitations: [Page mode traverses matching retained records with a scope-bound cursor; live changes are not a snapshot. Legacy results remain bounded summaries. Neither mode supplies full evidence.]
    freshness: Reads current tenant records without business or projection writes and returns observation metadata in page mode; authentication telemetry may persist and upstream freshness is unknown.
    empty_result: No matching records were found in the selected tenant; absence is not proof that the business object never existed.
    refusal_behavior: Unknown families are refused and foreign records are never returned.
    confirmation: none
    side_effects: none
    verification:
      role: discovery
      proves: [A returned opaque identity currently belongs to the selected tenant and family.]
      does_not_prove: [Completeness, operational readiness, or the outcome of a mutation.]
    unknown_when: [Search terms are incomplete, results hit the bound, or the relevant family is unknown.]
    next_steps: [Use the returned opaque identity with the narrow explanation or register read.]
    examples:
      use: [{scenario: Find the opaque sales-order identity before calling order_explain., reason: Discovery supplies identity only.}]
      do_not_use: [{scenario: Confirm that reserved stock changed after approval., reason: Inventory is the authoritative verification read.}]
  order_explain:
    kind: read
    application_tool: order_explain
    purpose: Trace one selected order through immutable source, Document Evidence, Commitments, reservations, movements, and derived fulfillment.
    use_when: [One known order needs an explainable Source-to-Reality trace.]
    do_not_use_when: [The order identity is unknown or aggregate inventory across orders is required.]
    required_context: [document]
    data_basis: [source_record, document, document_line, commitment, reservation, movement]
    limitations: [Includes retained open and closed orders but cannot reconstruct an arbitrary past state or establish unrelated stock or payment completeness.]
    freshness: Reads retained tenant evidence directly without cache writes or commits and returns observation metadata; authentication telemetry may persist and upstream freshness is unknown.
    empty_result: A missing tenant-owned order is not found rather than represented as an empty explanation.
    refusal_behavior: Ambiguous, unknown, or foreign order references are refused without disclosure.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves: [The selected order trace exposes the current linked Evidence and Reality used for fulfillment.]
      does_not_prove: [Provider delivery, customer receipt, or payment unless corresponding Reality records are present.]
    unknown_when: [The expected linked record is absent, ambiguous, or a relevant external system has not been reconciled.]
    next_steps: [Read inventory for stock consequences and exceptions for explicit attention signals.]
    examples:
      use: [{scenario: Verify that a shipment Movement is linked to the intended order Commitment., reason: The order trace exposes the shortest links.}]
      do_not_use: [{scenario: Search for an order using a vague customer phrase., reason: Discover its opaque identity first.}]
  commitments_list:
    kind: read
    application_tool: commitments
    purpose: Read current customer and supplier obligations and their derived fulfillment state.
    use_when: [Promises, due quantities, allocation context, or fulfillment progress must be inspected.]
    do_not_use_when: [Physical stock across commitments or source-processing success is the question.]
    required_context: [commitment]
    data_basis: [commitment_register]
    limitations: [A Commitment is a promise; it does not by itself prove allocation, physical movement, or payment.]
    freshness: Page mode derives current tenant records without cache writes or commits and returns local event sequence and projection version; upstream freshness is unknown. Legacy mode reads the last completed stored snapshot without refreshing or committing it. Authentication telemetry may persist.
    empty_result: No projected commitments are visible; this does not prove source ingestion is complete.
    refusal_behavior: Only tenant-scoped projection rows are returned.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves: [A Commitment and its derived fulfillment values are present in the returned projection version.]
      does_not_prove: [Physical stock availability or external delivery confirmation.]
    unknown_when: [The projection is stale, the expected commitment is absent, or source interpretation is incomplete.]
    next_steps: [Read inventory for allocation and stock; use order_explain for source linkage.]
    examples:
      use: [{scenario: Re-read an order Commitment after recording a linked shipment., reason: Fulfillment derives from linked Movements.}]
      do_not_use: [{scenario: Prove warehouse stock exists., reason: Inventory derives the physical and reserved quantities.}]
  shipments_list:
    kind: read
    application_tool: shipments_list
    purpose: List real physical consignments and packages separately from delivery commitments.
    use_when: [Physical dispatch, receipt, carrier, tracking, or externally reported delivery must be inspected.]
    do_not_use_when: [The question is only what was promised or currently remains open.]
    required_context: [shipment]
    data_basis: [shipment, shipment_package, shipment_event, movement]
    limitations: [Dispatch and carrier delivery are distinct observations; absent tracking or events prove nothing.]
    freshness: Reads current tenant Reality directly without cache writes; upstream carrier freshness is unknown.
    empty_result: No matching physical shipment is recorded; open delivery Commitments may still exist.
    refusal_behavior: Unknown filters are refused and only tenant-scoped records are returned.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves: [Returned consignments, packages and observations exist in current tenant Reality.]
      does_not_prove: [A promise, stock quantity, or external delivery beyond the linked evidence.]
    unknown_when: [The carrier has not reported, source intake is incomplete, or physical execution was not packaged.]
    next_steps: [Use shipment_explain for exact contents and evidence; use commitments_list for promises.]
    examples:
      use: [{scenario: Find the package carrying tracking number TRACK-123., reason: Tracking search belongs to physical Shipments.}]
      do_not_use: [{scenario: List orders still awaiting shipment., reason: That is a Commitment fulfillment question.}]
  shipment_explain:
    kind: read
    application_tool: shipment_explain
    purpose: Explain one physical Shipment through Packages, current events, effective Movements, and sources.
    use_when: [One known Shipment needs exact contents, tracking history, and proof boundaries.]
    do_not_use_when: [The Shipment identity is unknown or only aggregate promise fulfillment is required.]
    required_context: [shipment]
    data_basis: [shipment, shipment_package, shipment_event, shipment_event_supersession, movement, movement_correction, source_record]
    limitations: [It distinguishes warehouse and external observations and cannot invent absent carrier evidence.]
    freshness: Reads committed tenant Reality directly; external-system freshness remains unknown.
    empty_result: Unknown or foreign Shipment identity is not found.
    refusal_behavior: Unknown and foreign identities are refused without disclosure.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves: [The selected Shipment trace and its current derived observations.]
      does_not_prove: [That dispatch means delivery or a carrier event means warehouse receipt.]
    unknown_when: [Relevant source, Package, Movement, or carrier evidence has not been recorded.]
    next_steps: [Read commitments for promise context and inventory for current stock.]
    examples:
      use: [{scenario: Explain what moved under a selected tracking package., reason: The trace links Package to effective Movements.}]
      do_not_use: [{scenario: Treat delivered as warehouse received., reason: Those observations have different authorities.}]
  inventory_read:
    kind: read
    application_tool: inventory
    purpose: Read physical, reserved, and available stock with explicit item aggregation or item/location scope; page mode supports item_id and location_id filters.
    use_when: [A stock, allocation, or availability consequence must be inspected.]
    do_not_use_when: [A customer promise, source interpretation, or external delivery event is the question.]
    required_context: [item, location]
    data_basis: [inventory]
    limitations: [Inventory derives from Movements and Reservations and does not prove a promise or external receipt.]
    freshness: Page mode derives current tenant records without cache writes or commits and returns local event sequence and projection version; upstream freshness is unknown. Legacy mode reads the last completed stored snapshot without refreshing or committing it. Authentication telemetry may persist.
    empty_result: No projected stock rows are visible; zero stock and missing projection context must not be conflated.
    refusal_behavior: Only tenant-scoped projection rows are returned.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves: [Returned physical, reserved, and available quantities derive from committed Movements and Reservations.]
      does_not_prove: [That goods were promised, delivered externally, or paid.]
    unknown_when: [The projection is stale, the expected item/location row is absent, or an effect outcome is unreconciled.]
    next_steps: [Read commitments for promise context and order_explain for the shortest order trace.]
    examples:
      use: [{scenario: Verify reserved quantity after an approved Reservation., reason: Inventory exposes the allocation consequence.}]
      do_not_use: [{scenario: Claim that reserved goods physically shipped., reason: A Movement and its order trace are required.}]
  exceptions_list:
    kind: read
    application_tool: exceptions
    purpose: List currently derived tenant conditions that require operational attention.
    use_when: [An agent needs a bounded queue of known operational blockers or inconsistencies.]
    do_not_use_when: [A complete health audit or proof that no unknown problem exists is required.]
    required_context: [tenant]
    data_basis: [operational_exception]
    limitations: [Exceptions cover only registered derivations; an empty list is not proof of complete correctness.]
    freshness: Derived from the committed inputs read by the exception service at request time.
    empty_result: No registered exception currently derives; unmodeled or unobserved problems may still exist.
    refusal_behavior: Only tenant-owned derived conditions are returned.
    confirmation: none
    side_effects: none
    verification:
      role: context
      proves: [A returned registered condition currently derives from named Reality inputs.]
      does_not_prove: [That all operations are healthy when the list is empty or that an effect succeeded.]
    unknown_when: [The relevant condition has no registered derivation, its inputs are stale, or external state is unavailable.]
    next_steps: [Explain the specific exception and inspect its named Reality records before proposing action.]
    examples:
      use: [{scenario: Ask what known operational condition needs attention now., reason: The register is an attention projection.}]
      do_not_use: [{scenario: Certify that the whole company has no problems because the list is empty., reason: Coverage is intentionally bounded.}]
  fulfillment_queue:
    kind: read
    application_tool: fulfillment_queue
    purpose: Read the derived open-order work queue with readiness, shortages, holds, and source identity.
    use_when: [Fulfillment work must be prioritized or readiness compared across orders.]
    do_not_use_when: [One blocker needs causal detail or one order needs its full trace.]
    required_context: [tenant]
    data_basis: [fulfillment_queue]
    limitations: [This derived work view does not prove shipment, external delivery, or payment.]
    freshness: Page mode derives current tenant records without cache writes or commits and returns local event sequence and projection version; upstream freshness is unknown. Legacy mode reads the last completed stored snapshot without refreshing or committing it. Authentication telemetry may persist.
    empty_result: No orders are projected into the queue; ingestion may still be incomplete.
    refusal_behavior: Only tenant-scoped queue rows are returned.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [Returned orders have the displayed derived fulfillment state.], does_not_prove: [A ready order shipped or an absent order never existed.]}
    unknown_when: [The projection is stale, an expected order is absent, or a source remains uninterpreted.]
    next_steps: [Read fulfillment blockers or explain one selected order.]
    examples: {use: [{scenario: Prioritize ready versus held orders., reason: This is the bounded work view.}], do_not_use: [{scenario: Assert carrier delivery., reason: External delivery needs separate evidence.}]}
  fulfillment_readiness:
    kind: read
    application_tool: fulfillment_readiness
    purpose: Read the canonical current fulfillment decision for one customer-delivery commitment.
    use_when: [A shipment decision needs exact blocker codes, prepayment amounts, and opaque evidence identifiers.]
    do_not_use_when: [A shipment or payment should be created or changed.]
    required_context: [tenant, commitment_id]
    data_basis: [commitment, document, document_line, payment_term, ledger_entry, settlement_allocation, reservation, commitment_hold, party_hold]
    limitations: [It derives only from committed Reality records and does not claim external bank or carrier state.]
    freshness: Derived from tenant-scoped committed records at request time.
    empty_result: Not applicable; an unknown or ineligible commitment is refused.
    refusal_behavior: Refuses unknown, cross-tenant, or non-customer-delivery commitments.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Whether the named commitment satisfies every modeled dispatch prerequisite now.], does_not_prove: [That dispatch occurred or external payment exists without allocation evidence.]}
    unknown_when: [Required order-backed payment attribution is ambiguous or evidence is absent.]
    next_steps: [Resolve each blocker and request a fresh shipment review.]
    examples: {use: [{scenario: Check whether a prepaid order can ship., reason: The result exposes required, received, remaining, and evidence links.}], do_not_use: [{scenario: Infer payment from a bank memo., reason: Only allocated ledger evidence qualifies.}]}
  fulfillment_blockers:
    kind: read
    application_tool: fulfillment_blockers
    purpose: Read registered order and item conditions that currently block fulfillment.
    use_when: [An order is not ready and its derived blocker and affected Reality records are needed.]
    do_not_use_when: [A complete order trace or proof that every possible blocker is modeled is required.]
    required_context: [tenant]
    data_basis: [fulfillment_blockers]
    limitations: [Only registered blocker derivations appear; absence does not prove complete health.]
    freshness: Page mode derives current tenant records without cache writes or commits and returns local event sequence and projection version; upstream freshness is unknown. Legacy mode reads the last completed stored snapshot without refreshing or committing it. Authentication telemetry may persist.
    empty_result: No registered blocker derives; unobserved or unmodeled causes may remain.
    refusal_behavior: Only tenant-scoped blocker rows are returned.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [A registered blocker derives for the returned records.], does_not_prove: [External root cause, complete health, or successful recovery.]}
    unknown_when: [The projection is stale or required upstream evidence is absent.]
    next_steps: [Explain the order and read inventory or item supply and demand.]
    examples: {use: [{scenario: Inspect why an order is not ready., reason: The blocker projection supplies registered causes.}], do_not_use: [{scenario: Certify all orders healthy from an empty list., reason: Unmodeled causes are outside the view.}]}
  item_supply_demand:
    kind: read
    application_tool: item_supply_demand
    purpose: Read derived stock, incoming supply, demand, shortages, and affected orders by item.
    use_when: [Item-level supply pressure or demand contributing to shortages must be assessed.]
    do_not_use_when: [Exact location stock or external supplier delivery must be proven.]
    required_context: [tenant]
    data_basis: [item_supply_demand]
    limitations: [The aggregate does not prove future supplier performance or external receipt.]
    freshness: Page mode derives current tenant records without cache writes or commits and returns local event sequence and projection version; upstream freshness is unknown. Legacy mode reads the last completed stored snapshot without refreshing or committing it. Authentication telemetry may persist.
    empty_result: No item rows are projected; source interpretation may still be incomplete.
    refusal_behavior: Only tenant-scoped item rows are returned.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [Displayed supply, demand, and shortage derive for each returned item.], does_not_prove: [Expected incoming goods will arrive or an order was externally delivered.]}
    unknown_when: [The projection is stale or expected commitments are absent.]
    next_steps: [Read inventory for locations and commitments or order explanation for promises.]
    examples: {use: [{scenario: Find items contributing to shortages., reason: The view combines typed supply and demand.}], do_not_use: [{scenario: Confirm supplier goods arrived., reason: A receiving Movement is required.}]}
  supply_coverage:
    kind: read
    application_tool: supply_coverage
    purpose: Read explicit links between incoming supplier commitments and customer commitments, including assigned quantity and current reversals.
    use_when: [A user needs to understand which incoming purchase supply is intended to cover which customer demand.]
    do_not_use_when: [Physical receipt, stock availability, reservation, or customer shipment must be proven.]
    required_context: [tenant]
    data_basis: [commitment, supply_assignment]
    limitations: [An assignment expresses commercial intent; it does not move stock, reserve goods, or prove supplier delivery.]
    freshness: Derived from current tenant-scoped commitments, assignments, and reversals at request time.
    empty_result: No explicit supply assignments exist for the selected company and filters.
    refusal_behavior: Only tenant-scoped commitments and assignments are returned.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [The returned supplier commitment quantities are explicitly assigned to the returned customer commitments.], does_not_prove: [Goods arrived, stock is available, or the customer order can ship.]}
    unknown_when: [Expected commitments or assignment evidence are absent.]
    next_steps: [Read item supply and demand, inventory, or the relevant commitment details.]
    examples: {use: [{scenario: Explain which purchase order covers a customer order., reason: The assignment is the shortest explicit relationship.}], do_not_use: [{scenario: Confirm that assigned goods reached the warehouse., reason: A receiving Movement is required.}]}
  return_disposition_summary:
    kind: read
    application_tool: return_disposition_summary
    purpose: Read arrived, resolved and unresolved customer-return quantity with append-only physical outcome history.
    use_when: [Warehouse or customer service needs to decide or explain what happened to returned goods.]
    do_not_use_when: [A customer credit, refund or commercial settlement must be proven.]
    required_context: [tenant]
    data_basis: [movement, movement_correction, source_record]
    limitations: [Physical disposition is independent from credit and refund state.]
    freshness: Derived from current tenant-scoped Movements and corrections at request time.
    empty_result: The selected return has no disposition movements and its full arrived quantity remains unresolved.
    refusal_behavior: Foreign-company or non-return movements are not disclosed.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [Returned quantity has the displayed physical outcomes.], does_not_prove: [The customer received a credit or refund.]}
    unknown_when: [The arrival Movement or later physical evidence is absent.]
    next_steps: [Record a reviewed disposition or inspect the independent credit state.]
    examples: {use: [{scenario: Find the unresolved quantity of an arrived return., reason: The read reconciles correcting movements and all supported outcomes.}], do_not_use: [{scenario: Claim the return was refunded., reason: Financial settlement requires separate evidence.}]}
  delivery_failure_summary:
    kind: read
    application_tool: delivery_failure_summary
    purpose: Read a failed delivery, what it reversed, where the goods went and the carrier claim it opened with its open amount.
    use_when: [Customer service or finance needs to explain why a shipped order is open again or what a carrier still owes.]
    do_not_use_when: [A customer sent goods back; that is a return, not a failed delivery.]
    required_context: [tenant]
    data_basis: [delivery_failure, shipment, movement_correction, document, ledger_entry, source_record]
    limitations: [A failure covers the whole shipment; reshipping or cancelling is a separate decision.]
    freshness: Derived from the failure, its corrections and the claim's postings and allocations at request time.
    empty_result: No failed delivery is recorded for the selected shipment.
    refusal_behavior: Foreign-company failures are not disclosed.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [The shipment no longer counts as delivered and the claim has the shown open amount.], does_not_prove: [The order has been shipped again.]}
    unknown_when: [The failure or its shipment is absent.]
    next_steps: [Reserve and ship the reopened promise again, cancel its rest, or record the carrier's payment.]
    examples: {use: [{scenario: Explain why a delivered order is open again., reason: The failure names the shipment, the kind and the reason.}], do_not_use: [{scenario: Credit a customer for returned goods., reason: Returns and credits are separate evidence.}]}
  drop_shipments:
    kind: read
    application_tool: drop_shipments
    purpose: Read a promise's drop shipping, the purchase assigned to it and what the supplier shipped straight to the customer, with carrier and tracking number.
    use_when: [A customer asks where goods from a drop-ship order are, or purchasing needs to see what a supplier already shipped to a customer.]
    do_not_use_when: [The goods ship from the company's own stock; that is an ordinary shipment.]
    required_context: [tenant]
    data_basis: [commitment, supply_assignment, movement, movement_correction, shipment_package, source_record]
    limitations: [Only purchases assigned to the customer promise are shown; what the supplier stated is recorded as stated.]
    freshness: Derived from the assignments and the drop-shipment movements at request time.
    empty_result: No purchase is assigned to the promise and nothing was drop-shipped.
    refusal_behavior: Foreign-company promises are not disclosed.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [What the supplier stated it shipped to the customer, and when.], does_not_prove: [That the customer received it.]}
    unknown_when: [The promise or its assignment is absent.]
    next_steps: [Record the supplier's dispatch, invoice the customer, or match the supplier invoice.]
    examples: {use: [{scenario: Tell a customer the tracking number of a drop-shipped order., reason: The drop shipment carries the supplier's carrier and tracking number.}], do_not_use: [{scenario: Check stock on hand., reason: Drop-shipped goods never lie in stock.}]}
  customer_exchange:
    kind: read
    application_tool: customer_exchange
    purpose: Read what a customer exchange replaced, the replacement it sent, how much of the return it settles and the decision behind it.
    use_when: [Customer service or finance needs to explain why a return has no credit or a replacement has no invoice.]
    do_not_use_when: [A price difference between the returned and the replacement item must be settled.]
    required_context: [tenant]
    data_basis: [customer_exchange, movement, return_announcement, commitment, source_record]
    limitations: [An exchange moves no money; price differences go through invoices and credit notes.]
    freshness: Derived from the exchange, current movements and the replacement's status at request time.
    empty_result: No exchange answers the selected return or replacement.
    refusal_behavior: Foreign-company exchanges are not disclosed.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [The return is settled by the displayed replacement to the shown quantity.], does_not_prove: [The replacement has been delivered in full.]}
    unknown_when: [The exchange, its return or its replacement is absent.]
    next_steps: [Dispatch the open replacement, or credit what the exchange does not settle.]
    examples: {use: [{scenario: Explain why returned goods show no credit note., reason: The exchange names the replacement that settled them.}], do_not_use: [{scenario: Charge the customer for a more expensive replacement., reason: A price difference needs an invoice.}]}
  movement_explanation:
    kind: read
    application_tool: movement_explanation
    purpose: Explain why one physical stock movement exists through its shortest authoritative relationships.
    use_when: [A user asks for the business reason behind a goods movement.]
    do_not_use_when: [A user wants to mutate a movement.]
    required_context: [tenant, movement_id]
    data_basis: [movement, movement_correction, commitment, return_announcement, shipment_package, source_record]
    limitations: [The explanation derives current links and never invents missing evidence.]
    freshness: Derived from current tenant-scoped Reality and Evidence records at request time.
    empty_result: An existing movement without an allowed relationship is explicitly returned as unexplained.
    refusal_behavior: Foreign-company and unknown movements are not disclosed.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [The displayed relationship or source is linked to the selected movement.], does_not_prove: [An unlinked movement was commercially authorized.]}
    unknown_when: [The movement has no commitment, return, correction, shipment, source, or explicit adjustment reason.]
    next_steps: [Open the linked Inspector record or review the unexplained-movement exception.]
    examples: {use: [{scenario: Explain why a warehouse receipt exists., reason: The read follows its supplier commitment or source record.}], do_not_use: [{scenario: Correct an erroneous receipt., reason: Use the reviewed movement correction workflow.}]}
  return_announcements:
    kind: read
    application_tool: return_announcements
    purpose: List the returns customers have announced, in the order they said so, with what each is still waiting for.
    use_when: [The receiving desk needs to know what parcels are expected, or somebody is chasing a return a customer promised.]
    do_not_use_when: [Goods have already arrived and what to do with them is the question; that is the return itself.]
    required_context: [none]
    data_basis: [return_announcement, commitment, movement]
    limitations: [An announcement is not supply. Nothing here makes the goods available, because goods a customer has promised to send are not goods anybody can sell.]
    freshness: Derived from committed tenant Reality at request time.
    empty_result: A company nobody has announced a return to reports an empty list rather than failing.
    refusal_behavior: An unknown commitment is refused; announcements of another tenant are never returned.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [What a customer said they would send back, and how much of it has arrived.], does_not_prove: [That the parcel exists or was ever posted.]}
    unknown_when: [Goods came back without having been announced, which is ordinary and leaves nothing here to see.]
    next_steps: [Record the returning goods against the announcement they fulfil, or withdraw it if the customer changed their mind.]
    examples: {use: [{scenario: See which parcels the desk should expect., reason: An announcement is what makes an arrival a confirmation rather than a puzzle.}], do_not_use: [{scenario: Decide what to do with returned stock., reason: That starts when the goods arrive and is a movement.}]}
  expired_lots:
    kind: read
    application_tool: expired_lots
    purpose: List the batches whose stated best-before date has passed, oldest first.
    use_when: [Somebody is deciding what to write off, send back, or stop shipping, or is checking what expired stock the company still holds.]
    do_not_use_when: [The question is what is about to expire; nothing states a horizon, so nothing here answers it.]
    required_context: [none]
    data_basis: [lot]
    limitations: [Only a lot with a stated best-before is listed. A lot with no date says nothing in either direction, because an item with no shelf life and a label nobody read are indistinguishable. This lists lots, not quantities; what is still held is in the operational exception entry.]
    freshness: Derived from committed tenant Reality at request time.
    empty_result: A company whose lots state no date reports an empty list rather than failing.
    refusal_behavior: Lots of another tenant are never listed.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [The listed batches carry a stated best-before that has passed.], does_not_prove: [That any stock of them is still held, or that it is unsellable in law.]}
    unknown_when: [Nobody recorded the date, which is silence rather than a negative.]
    next_steps: [Read the expired stock entries in the operational exception queue for what is still held, then write it off or send it back.]
    examples: {use: [{scenario: Find batches past their date before a stock count., reason: The date is stated on the lot and compared with today.}], do_not_use: [{scenario: Find batches expiring within thirty days., reason: No horizon is stated anywhere, and Reality does not invent one.}]}
  payment_run_preview:
    kind: read
    application_tool: payment_run_preview
    purpose: Show which supplier invoices are worth paying now, what each supplier is owed, what the run totals per currency, and what was withheld.
    use_when: [Somebody is deciding what should go out on a payment day, or is checking which invoices can still be paid for less.]
    do_not_use_when: [One invoice is in question, or the amounts have already been confirmed and the run is ready to execute.]
    required_context: [pay_by]
    data_basis: [document, ledger_entry, settlement_allocation, party, payment_term]
    limitations: [It names an early-payment rate and the day the window closes and never states what the discount is worth, because a rate applied to a gross amount is money nobody agreed to. Amounts are what the ledger holds open, not what to pay.]
    freshness: Derived from committed tenant Reality at request time.
    empty_result: A day nothing is due before, with no discount window open, reports a count of zero rather than failing.
    refusal_behavior: A missing day is refused; invoices of another tenant are never proposed.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [The proposed invoices currently have those amounts open under those terms.], does_not_prove: [That any of them should be paid, or that the company has the cash.]}
    unknown_when: [An invoice nobody has posted yet does not appear, because nothing is open on it.]
    next_steps: [State an amount per invoice and confirm the total to execute the run, or narrow the day and preview again.]
    examples: {use: [{scenario: Decide what goes out on Friday., reason: The proposal and its totals are what a run is confirmed against.}], do_not_use: [{scenario: Work out what a 2% discount is worth., reason: Reality never states an amount nobody agreed to.}]}
  stale_closure_preview:
    kind: read
    application_tool: stale_closure_preview
    purpose: Show how many promises an import left behind a closure would close, and a sample of them, without changing anything.
    use_when: [An imported history has filled the queue with promises nobody is going to keep and somebody is deciding what to close.]
    do_not_use_when: [A single promise is in question, or the criteria have not been decided by a person.]
    required_context: [direction, due_before]
    data_basis: [commitment, movement, reservation]
    limitations: [The sample is bounded for recognition and is not the whole set; the count is what a closure confirms.]
    freshness: Derived from committed tenant Reality at request time.
    empty_result: Criteria matching nothing report a count of zero rather than failing.
    refusal_behavior: An unknown direction or a missing date is refused; cross-tenant promises are never counted.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [The counted promises currently match the stated criteria.], does_not_prove: [That any of them is genuinely abandoned rather than late.]}
    unknown_when: [Movements are recorded outside Reality, so a promise may look untouched and not be.]
    next_steps: [Confirm the count with a reason to close them, or narrow the date and preview again.]
    examples: {use: [{scenario: Decide what an imported history left behind., reason: The count and sample are what a closure is confirmed against.}], do_not_use: [{scenario: Judge whether one late order is abandoned., reason: A single promise is read through its own explanation.}]}
  exception_explain:
    kind: read
    application_tool: exception_explain
    purpose: Explain one selected current exception through the Reality context from which it derives.
    use_when: [A known exception identity needs its current derivation and affected records.]
    do_not_use_when: [Exceptions must first be discovered or historical conditions are requested.]
    required_context: [exception_id]
    data_basis: [operational_exception]
    limitations: [The explanation covers a registered derivation, not every external root cause.]
    freshness: Derived from committed tenant Reality at request time.
    empty_result: Unknown, foreign, or no-longer-current exceptions are refused as not found.
    refusal_behavior: Unknown and cross-tenant identities are refused without disclosure.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [The selected exception currently derives from returned Reality.], does_not_prove: [External cause, remediation, or historical persistence.]}
    unknown_when: [External state is absent or the exception changes between reads.]
    next_steps: [Inspect named Reality reads before proposing a governed correction.]
    examples: {use: [{scenario: Inspect records behind a listed exception., reason: Its identity enables bounded explanation.}], do_not_use: [{scenario: Search all exceptions without an ID., reason: List exceptions first.}]}
  proposals_awaiting_approval:
    kind: read
    application_tool: proposals_awaiting_approval
    purpose: List tenant change proposals that still await an explicit authorized decision.
    use_when: [The current governed review queue is needed before approval or rejection.]
    do_not_use_when: [Executed Reality, rejected history, or proof of an effect is required.]
    required_context: [tenant]
    data_basis: [change_proposal]
    limitations: [A proposal is intent and preview, not authority, execution, or resulting Reality.]
    freshness: Reflects committed proposal status at request time and may change concurrently.
    empty_result: No proposal currently has proposed status; completed and rejected proposals are outside this list.
    refusal_behavior: Only tenant-owned pending proposals are returned.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [Returned proposals await approval with the displayed arguments.], does_not_prove: [Correctness, authority, execution, or verified outcome.]}
    unknown_when: [Proposal status or underlying context changes concurrently.]
    next_steps: [Re-read Reality and use explicit confirmation only when justified.]
    examples: {use: [{scenario: Present exact changes requiring review., reason: This is the governed intent queue.}], do_not_use: [{scenario: Claim stock changed from a proposal., reason: Proposal state is not execution.}]}
  finance_balances:
    kind: read
    application_tool: finance_balances
    purpose: Read receivable and payable positions derived from tenant LedgerEntries.
    use_when: [Current ledger-derived receivables and payables separated by represented currency are needed.]
    do_not_use_when: [Bank settlement, reconciliation, invoice evidence, or cash availability must be proven.]
    required_context: [tenant]
    data_basis: [ledger_entry]
    limitations: [Each currency is separate with no conversion or cross-currency total. These balances are not net revenue or profit and do not prove settlement or accounting completeness.]
    freshness: Derived from current tenant LedgerEntries without business writes or commits and returned with observation metadata; authentication telemetry may persist and upstream freshness is unknown.
    empty_result: No balance derives from visible LedgerEntries; missing external postings may remain.
    refusal_behavior: Only tenant-scoped ledger balances are returned.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Returned positions derive from current tenant LedgerEntries.], does_not_prove: [Bank settlement, provider reconciliation, or unrecorded finance events.]}
    unknown_when: [Expected postings are absent or an external finance system is unreconciled.]
    next_steps: [Inspect journal and payment evidence through bounded reads.]
    examples: {use: [{scenario: Verify a recorded payment reduced receivables., reason: The balance derives from LedgerEntries.}], do_not_use: [{scenario: Assert cash settled at the bank., reason: Settlement requires external evidence.}]}
  invoice_credit_context:
    kind: read
    application_tool: invoice_credit_context
    purpose: Read one customer invoice's eligible opaque line identities and remaining credit capacity.
    use_when: [An invoice-linked customer credit must be prepared from current posted evidence.]
    do_not_use_when: [A return-only legacy credit or a physical return disposition is required.]
    required_context: [invoice_id]
    data_basis: [document, document_line, ledger_entry, settlement_allocation]
    limitations: [Capacity is current and does not authorize a credit or imply returned goods.]
    freshness: Derived from committed invoice, credit and settlement evidence at request time.
    empty_result: An invoice with no eligible remaining position returns positions with zero remaining capacity.
    refusal_behavior: Unknown, foreign, unposted or reversed invoices are refused explicitly.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [Which exact invoice positions can currently support a credit.], does_not_prove: [Approval, posting, allocation or physical return.]}
    unknown_when: [Credit or reversal evidence changes concurrently.]
    next_steps: [Prepare sales_credit_record_propose with returned opaque line identities.]
    examples: {use: [{scenario: Prepare a partial credit for two invoice positions., reason: The read supplies current capacity and identities.}], do_not_use: [{scenario: Restock returned goods., reason: Physical disposition is a separate Movement decision.}]}
  invoice_billable_positions:
    kind: read
    application_tool: invoice_billable_positions
    purpose: List one party's order positions that were delivered or received and are not yet fully billed, grouped by order, for one consolidated invoice.
    use_when: [One customer or supplier invoice over several orders of one party must be prepared.]
    do_not_use_when: [A single order's billing is needed; read that order's billing availability instead.]
    required_context: [direction, party_id, currency]
    data_basis: [document, document_line, commitment, movement, ledger_entry, ledger_reversal]
    limitations: [At most 200 positions are returned; total counts all billable positions. Amounts are the order's stated values for reference; the invoice states its own.]
    freshness: Derived from committed order, movement, invoice and reversal evidence at request time.
    empty_result: A party with nothing delivered and unbilled returns no orders and total 0.
    refusal_behavior: Unknown or foreign parties, an unsupported direction or a limit outside 1 to 200 are refused explicitly.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [Which exact order positions can currently be billed and by how much.], does_not_prove: [Approval, posting or payment.]}
    unknown_when: [Deliveries, invoices or reversals change concurrently.]
    next_steps: [Prepare sales_invoice_record_propose or supplier_invoice_record_propose with the returned order line identities.]
    examples: {use: [{scenario: Bill a customer's deliveries of the month on one invoice., reason: The read lists every delivered and unbilled position by order.}], do_not_use: [{scenario: Decide what a customer owes., reason: Open receivables derive from postings and allocations.}]}
  finance_dunning_context:
    kind: read
    application_tool: finance.dunning.context
    purpose: Validate one manual reminder against current overdue invoices and expose its finance revision.
    use_when: [A person has selected overdue invoices, level, date and optional exact fee for review.]
    do_not_use_when: [A reminder should be generated, escalated or sent automatically.]
    required_context: [invoice_ids, level, notice_date]
    data_basis: [document, ledger_entry, settlement_allocation]
    limitations: [The fee is source-stated and no message is sent.]
    freshness: Derived from current open amounts, due dates and finance configuration.
    empty_result: An empty invoice selection is refused rather than treated as no reminder.
    refusal_behavior: Settled, non-overdue, mixed-party, mixed-currency or foreign invoices are refused.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [The selected invoices are currently eligible for the stated reminder.], does_not_prove: [Human approval or delivery to the customer.]}
    unknown_when: [Invoice settlement or finance revision changes after the read.]
    next_steps: [Prepare finance_dunning_record_propose with the returned revision.]
    examples: {use: [{scenario: Review a second reminder with an exact five-euro fee., reason: Eligibility and fee-account prerequisites are shown before proposal.}], do_not_use: [{scenario: Send a reminder email., reason: Message delivery is outside this action.}]}
  finance_dunning_notices:
    kind: read
    application_tool: finance.dunning.notices
    purpose: List recorded manual reminder evidence with invoice, fee and reversal trace.
    use_when: [Recorded reminders must be reconciled or selected for reversal.]
    do_not_use_when: [Overdue invoices must first be selected for a new reminder.]
    required_context: [tenant]
    data_basis: [document, source_record, ledger_entry]
    limitations: [The list proves internal evidence, not external delivery.]
    freshness: Derived from committed reminder, fee and reversal records.
    empty_result: No manual reminder has been recorded for the tenant.
    refusal_behavior: Only tenant-owned notices are returned.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Which reminders and fee effects Reality retains.], does_not_prove: [That the customer received a message.]}
    unknown_when: [External delivery evidence is absent.]
    next_steps: [Read one notice detail or prepare its explicit reversal.]
    examples: {use: [{scenario: Reconcile a recorded fee and notice identity., reason: The list exposes both traces.}], do_not_use: [{scenario: Calculate the next reminder level., reason: Escalation is not automatic.}]}
  finance_dunning_notice:
    kind: read
    application_tool: finance.dunning.notice
    purpose: Read one retained manual reminder with its exact invoice membership, fee and reversal.
    use_when: [One known notice identity needs authoritative reconciliation.]
    do_not_use_when: [A notice has not yet been discovered or recorded.]
    required_context: [notice_id]
    data_basis: [document, source_record, ledger_entry]
    limitations: [Internal evidence does not prove external message delivery.]
    freshness: Derived from the selected tenant-owned notice and current reversal evidence.
    empty_result: Unknown and foreign identities are refused as not found.
    refusal_behavior: Cross-tenant identities disclose nothing.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Exact retained notice, invoice membership, fee and reversal state.], does_not_prove: [External receipt by the customer.]}
    unknown_when: [External delivery evidence is absent.]
    next_steps: [Prepare finance_dunning_reverse_propose when a human decides the notice was wrong.]
    examples: {use: [{scenario: Verify a notice after a lost confirmation response., reason: Opaque identity reaches retained evidence.}], do_not_use: [{scenario: Find every notice without an identity., reason: Use the list read first.}]}
  sales_credit_record_propose:
    application_tool: sales_credit_record
    purpose: Record either an invoice-linked financial credit or the retained legacy order-line return credit shape.
    use_when: [A human has stated the exact credit amount and selected one complete supported evidence shape.]
    do_not_use_when: [Returned goods need a physical disposition; use the return disposition action separately.]
    required_context: [For invoice-linked credit use invoice_id, lines with invoice_line_id, reason and allocation_amount; for legacy credit use order_line_id and quantity. Both shapes require number and gross_amount.]
    preconditions: [Invoice-linked and legacy fields are mutually exclusive and every opaque identity belongs to the tenant.]
    confirmation: required
    idempotency: {mode: supported, guidance: Reconcile the proposal identity; confirmed replay returns its stored receipt.}
    refusals: [{code: invalid_credit_shape, description: Required fields are missing, shapes are mixed, capacity changed or evidence is unavailable.}]
    events: [source_record.stored, document.recorded, ledger.posted, credit.recorded]
    verification_reads: [{name: invoice_credit_context, proves: Remaining invoice-linked position and amount capacity derives independently after execution.}, {name: document_register, proves: The retained credit and its shortest line links exist.}]
    examples: {use: [{scenario: Credit two selected invoice positions and explicitly allocate part of the amount., reason: The invoice-linked shape carries exact positions, reason and allocation.}, {scenario: Retain an established order-line return credit integration., reason: The legacy shape remains distinct and supported.}], do_not_use: [{scenario: Combine order_line_id with invoice_id and invoice positions., reason: Mixed evidence shapes are ambiguous and refused.}]}
  return_disposition_propose:
    application_tool: return_disposition
    purpose: Resolve arrived customer-return goods through one of the four canonical physical outcomes without changing credit evidence.
    use_when: [A return Movement has arrived and a human has chosen restock, quarantine_repair, scrap_loss or return_to_supplier for an exact quantity.]
    do_not_use_when: [A financial credit must be recorded; use the invoice-linked or legacy customer-credit action separately.]
    required_context: [return_movement_id, disposition, quantity; destination_location_id for restock or quarantine_repair; reason for scrap_loss]
    preconditions: [The return Movement retains its customer-delivery commitment, arrival location and any handling-unit, lot or serial identity.]
    confirmation: required
    idempotency: {mode: supported, guidance: Reconcile the proposal identity; confirmed replay returns the retained resolving Movement.}
    refusals: [{code: invalid_return_relationship, description: Return Movement, commitment, arrival location, tracking identity, destination or unresolved quantity is missing or incompatible.}]
    events: [movement.recorded]
    verification_reads: [{name: return_disposition_summary, proves: Each resolving Movement preserves the arrived return identity and reconciles the remaining quantity.}, {name: inventory, proves: The resulting exact-location stock effect is visible independently.}]
    examples: {use: [{scenario: Split five lot-tracked returned units across all four outcomes., reason: Each result is an explicit resolving Movement with inherited tracking identity.}], do_not_use: [{scenario: Treat a credit note as proof that goods were restocked., reason: Financial and physical outcomes remain separate.}]}
  supplier_invoice_free_record_propose:
    application_tool: supplier_invoice_free_record
    purpose: Record source-stated supplier invoice evidence and post its payable without inventing a purchase order.
    use_when: [A supplier invoice contains supported free goods, service or charge positions with no purchase-order line.]
    do_not_use_when: [The invoice positions belong to existing purchase-order lines.]
    required_context: [supplier, source-stated number, currency, total, positions]
    preconditions: [The Party has supplier role and every stated line is valid tenant evidence.]
    confirmation: required
    idempotency: {mode: supported, guidance: Reconcile the proposal identity; confirmed replay returns its stored receipt.}
    refusals: [{code: invalid_supplier_invoice, description: Supplier, position or stated amount is invalid or outside the tenant.}]
    events: [source_record.stored, document.recorded, ledger.posted, invoice.recorded]
    verification_reads: [{name: document_register, proves: The supplier invoice and stated lines are retained.}, {name: finance_balances, proves: The payable derives from posted LedgerEntries.}]
    examples: {use: [{scenario: Record a freight invoice without a purchase order., reason: The action preserves evidence and payable without inventing commitments.}], do_not_use: [{scenario: Receive physical goods., reason: A supplier invoice does not create a Movement.}]}
  finance_dunning_record_propose:
    application_tool: finance.dunning.record
    purpose: Record one owner-confirmed manual reminder and optional exact stated fee.
    use_when: [A person has reviewed eligible overdue invoices and explicitly chosen the level and fee.]
    do_not_use_when: [A reminder should be calculated, escalated or sent automatically.]
    required_context: [invoice_ids, level, notice_date, expected_revision]
    preconditions: [Invoices belong to one customer and currency and remain open and overdue.]
    confirmation: required
    idempotency: {mode: supported, guidance: Reconcile the same proposal identity before retrying.}
    refusals: [{code: invalid_dunning_scope, description: Invoice eligibility, account configuration or finance revision changed.}]
    events: [dunning.notice_recorded, ledger.posted]
    verification_reads: [{name: finance.dunning.notice, proves: Exact notice membership and fee effect are retained.}]
    examples: {use: [{scenario: Record a reviewed reminder with a stated fee., reason: Both notice and fee retain explicit authority.}], do_not_use: [{scenario: Send the reminder., reason: Delivery is outside this action.}]}
  finance_dunning_reverse_propose:
    application_tool: finance.dunning.reverse
    purpose: Reverse one owner-confirmed manual reminder and its fee effect without deleting evidence.
    use_when: [A recorded notice was issued in error and a person explicitly decides to reverse it.]
    do_not_use_when: [The notice is correct or only its external message needs correction.]
    required_context: [notice_id, reason, expected_revision]
    preconditions: [The tenant-owned notice exists and is not already reversed.]
    confirmation: required
    idempotency: {mode: supported, guidance: Reconcile the original proposal identity before retrying.}
    refusals: [{code: invalid_dunning_reversal, description: Notice is foreign, unknown, stale or already reversed.}]
    events: [dunning.notice_reversed, ledger.reversed]
    verification_reads: [{name: finance.dunning.notice, proves: Reversal identity and fee outcome are retained.}]
    examples: {use: [{scenario: Reverse a reminder entered for the wrong invoices., reason: Evidence remains while the fee effect is inverted.}], do_not_use: [{scenario: Delete reminder history., reason: Retained evidence is immutable.}]}
  finance_dunning_schedule:
    kind: read
    application_tool: finance.dunning.schedule
    purpose: Read the company's dunning schedule and the finance revision required to change it.
    use_when: [A dunning run or a schedule change needs the current waiting days and fees.]
    do_not_use_when: [The level of one invoice is needed; the run preview derives it.]
    required_context: [tenant]
    data_basis: [dunning_schedule_level, source_record]
    limitations: [One schedule per company; no schedule per payment term or party group.]
    freshness: Read from the committed schedule.
    empty_result: No schedule is set; a dunning run is refused until one is.
    refusal_behavior: Only the tenant's own schedule is returned.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [The waiting days and fees every later run applies.], does_not_prove: [That any notice was recorded.]}
    unknown_when: [The schedule is changed concurrently.]
    next_steps: [Prepare finance_dunning_schedule_set_propose with the returned revision, or preview a run with finance_dunning_run_context.]
    examples: {use: [{scenario: Check the fee of the second reminder before a run., reason: The schedule states it per level.}], do_not_use: [{scenario: Find overdue invoices., reason: The run preview lists them.}]}
  finance_dunning_run_context:
    kind: read
    application_tool: finance.dunning.run_context
    purpose: Preview which overdue items a dunning run on a date would remind, at which level and fee, and why others are left out.
    use_when: [A person starts a dunning run over all or selected customers.]
    do_not_use_when: [One specific reminder is chosen by hand; use finance_dunning_context.]
    required_context: [run_date]
    data_basis: [document, ledger_entry, settlement_allocation, dunning_notice, dunning_schedule_level, collection_handover_invoice]
    limitations: [Disputed items are not known to Reality; the person deselects them. Nothing is sent.]
    freshness: Derived at read time from open amounts, due dates, non-reversed notices, credits and handovers.
    empty_result: No overdue item is due for a notice on that date; waiting items are listed with the day they become due.
    refusal_behavior: A missing schedule, an invalid date or a foreign customer is refused.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [Each proposed item's level follows from its last notice and the schedule.], does_not_prove: [Approval or delivery to the customer.]}
    unknown_when: [Payments, notices or handovers change after the read; confirmation re-derives and skips them.]
    next_steps: [Prepare finance_dunning_run_propose with the selected items and the returned schedule_source_record_id; hand level-3 items to collection with finance_dunning_collection_propose.]
    examples: {use: [{scenario: Run the monthly dunning over all customers., reason: Every overdue item appears at its next level or with the reason it waits.}], do_not_use: [{scenario: Send reminder letters., reason: Message delivery is outside this action.}]}
  finance_dunning_collection_handovers:
    kind: read
    application_tool: finance.dunning.collection_handovers
    purpose: List collection handovers with their invoices and delivery hold.
    use_when: [Items handed to collection must be reconciled.]
    do_not_use_when: [Items still to be handed over are needed; the run preview lists them as ready for collection.]
    required_context: [tenant]
    data_basis: [collection_handover, collection_handover_invoice, business_event]
    limitations: [No collection agency integration; the handover is an internal decision.]
    freshness: Read from committed handovers.
    empty_result: No invoice has been handed to collection.
    refusal_behavior: Only tenant-owned handovers are returned.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Which invoices went to collection, when and why.], does_not_prove: [What the collection agency recovered.]}
    unknown_when: [External collection evidence is absent.]
    next_steps: [Read one handover with finance_dunning_collection_handover.]
    examples: {use: [{scenario: List the customers in collection., reason: Each handover names its customer and invoices.}], do_not_use: [{scenario: Decide which items to hand over., reason: Use the run preview.}]}
  finance_dunning_collection_handover:
    kind: read
    application_tool: finance.dunning.collection_handover
    purpose: Read one collection handover with its invoices, the last notice of each and the delivery hold.
    use_when: [One known handover identity needs reconciliation.]
    do_not_use_when: [The handover has not been discovered; list them first.]
    required_context: [handover_id]
    data_basis: [collection_handover, collection_handover_invoice, business_event]
    limitations: [The hold may since have been released through the ordinary release action.]
    freshness: Read from the selected tenant-owned handover.
    empty_result: Unknown and foreign identities are refused as not found.
    refusal_behavior: Cross-tenant identities disclose nothing.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [The handover's invoices, reason, last notices and the hold it placed or kept.], does_not_prove: [Payment by the customer.]}
    unknown_when: [The delivery hold was released afterwards.]
    next_steps: [Read the customer's delivery hold or the invoices it names.]
    examples: {use: [{scenario: Verify a handover after a lost confirmation response., reason: The identity reaches the retained decision.}], do_not_use: [{scenario: Find every handover without an identity., reason: Use the list read.}]}
  finance_dunning_schedule_set_propose:
    application_tool: finance.dunning.schedule.set
    purpose: Set the company's dunning schedule for owner confirmation.
    use_when: [A person states the waiting days and fixed fee for levels 1, 2 and 3.]
    do_not_use_when: [Only one reminder's fee should differ; record that notice by hand.]
    required_context: [levels, expected_revision]
    preconditions: [Exactly levels 1, 2 and 3; a positive fee needs the dunning_fee_revenue account default.]
    confirmation: required
    idempotency: {mode: supported, guidance: Reconcile the proposal identity; confirmed replay returns the schedule.}
    refusals: [{code: dunning_schedule_incomplete, description: Not exactly levels 1, 2 and 3.}, {code: dunning_schedule_value_invalid, description: Waiting days or fee are negative or not exact.}, {code: finance_account_default_missing, description: A fee needs the dunning fee account.}]
    events: [dunning.schedule_set]
    verification_reads: [{name: finance.dunning.schedule, proves: The confirmed waiting days and fees are retained.}]
    examples: {use: [{scenario: Remind after 7 days, then every 14 days with fees of 5 and 10., reason: One schedule states all three levels.}], do_not_use: [{scenario: Change the fee of a notice already recorded., reason: Recorded notices keep their fee.}]}
  month_end_billing:
    kind: read
    application_tool: month_end_billing
    purpose: List what the month-end close must invoice or accrue, from the same findings the exception queue reports.
    use_when: [Someone closes a month and asks what was shipped and not invoiced, or invoiced and not shipped.]
    do_not_use_when: [The question is which invoices are unpaid; use the open items read.]
    required_context: [tenant]
    data_basis: [document, document_line, commitment, movement]
    limitations: [Down-payment and pro-forma invoices bill no order line and appear in neither list.]
    freshness: Derived at read time from the findings at the stated instant.
    empty_result: Every shipped line is invoiced and every invoiced line has shipped.
    refusal_behavior: Another company's lines are never listed.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Which order lines differ between shipped and invoiced quantity at the instant.], does_not_prove: [That an invoice was sent to the customer.]}
    unknown_when: [A shipment or an invoice exists that was not recorded.]
    next_steps: [Invoice a shipped line with sales_invoice_record_propose, or ship what was invoiced.]
    examples: {use: [{scenario: Prepare the month-end billing accrual., reason: Both lists come from the same findings at one instant.}], do_not_use: [{scenario: Record the missing invoice., reason: Use sales_invoice_record_propose; a person confirms.}]}
  credit_exposure:
    kind: read
    application_tool: credit_exposure
    purpose: Explain a customer's credit exposure against its limit and why an order is held for credit.
    use_when: [A new order was held for credit, or someone asks how much a customer may still order.]
    do_not_use_when: [The question is one invoice's due date; use the aging read.]
    required_context: [tenant, party_id]
    data_basis: [party, document, document_line, commitment, ledger_entry, settlement_allocation]
    limitations: [Only amounts in the customer's own currency count; payables are named, not netted.]
    freshness: Derived at read time from open items, order lines and credits.
    empty_result: A customer without open items, orders or credits has an exposure of zero.
    refusal_behavior: A party of another company is not found.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [What the exposure consists of and how far it is past the limit.], does_not_prove: [That the customer will pay.]}
    unknown_when: [An order or payment exists that was not recorded, or an amount is in another currency.]
    next_steps: [Release a held order with credit_hold_release_propose after deciding.]
    examples: {use: [{scenario: Explain why an order is held for credit., reason: The read names the open, overdue and ordered amounts and the credits.}], do_not_use: [{scenario: Release the hold., reason: Use credit_hold_release_propose; an owner confirms.}]}
  available_to_promise:
    kind: read
    application_tool: available_to_promise
    purpose: Answer from when and how much of an item can be promised, naming the purchases the answer relies on.
    use_when: [Someone asks whether or when an item can be promised, or when more arrives.]
    do_not_use_when: [The question is which order a receipt should serve; prepare backorders_serve_propose.]
    required_context: [tenant, item_id]
    data_basis: [movement, reservation, stock_block, commitment, supply_assignment]
    limitations: [Purchase dates are what the supplier stated; an overdue purchase is still counted and marked overdue., Waiting orders that no reservation or incoming supply covers are taken from free stock first.]
    freshness: Read from stock, reservations, blocks, open orders and assignments at request time.
    empty_result: No open purchase; only what is free now.
    refusal_behavior: Only the company's own items are read.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Which purchase and stated date each later quantity relies on.], does_not_prove: [That the supplier delivers on time.]}
    unknown_when: [A purchase or order exists that was not recorded.]
    next_steps: [Promise the customer the date shown, or prepare backorders_serve_propose when goods have arrived.]
    examples: {use: [{scenario: A customer asks when 10 more can be delivered., reason: The read names the purchase and its date.}], do_not_use: [{scenario: Reserve stock for a waiting order., reason: Use backorders_serve_propose; a person confirms.}]}
  company_currency:
    kind: read
    application_tool: company_currency
    purpose: Show the currency the company keeps its books in.
    use_when: [Someone asks in which currency the books are kept, or before posting an invoice in another currency.]
    do_not_use_when: [The question is a rate; rates are stated per posting and payment.]
    required_context: [tenant]
    data_basis: [company_currency, ledger_entry]
    limitations: [EUR until stated; it cannot change once anything is posted.]
    freshness: Read at request time.
    empty_result: The company currency is EUR, the default.
    refusal_behavior: Only the company's own currency is read.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [The company currency and whether anything is posted.], does_not_prove: [Which rate any posting used; read the posting.]}
    unknown_when: [Never; the default is EUR.]
    next_steps: [State another currency with company_currency_set_propose before the first posting; a person confirms.]
    examples: {use: [{scenario: Check the books are kept in EUR before posting a USD invoice., reason: The read names the company currency.}], do_not_use: [{scenario: Find the rate of a USD invoice., reason: Read the posting; the rate is stated there.}]}
  company_time_zone:
    kind: read
    application_tool: company_time_zone
    purpose: Show the time zone the company's business days are counted in.
    use_when: [Someone asks on which day a late-evening order or posting counts, or why a due date passed a day early or late.]
    do_not_use_when: [The question is when something happened; instants are read in UTC from the record itself.]
    required_context: [tenant]
    data_basis: [company_time_zone]
    limitations: [UTC until stated; analysis reports group by UTC day.]
    freshness: Read at request time.
    empty_result: The company time zone is UTC, the default.
    refusal_behavior: Only the company's own time zone is read.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [The zone business days are counted in and whether it was stated.], does_not_prove: [The day any stored document carries; read the document.]}
    unknown_when: [Never; the default is UTC.]
    next_steps: [State the company's zone with company_time_zone_set_propose; a person confirms.]
    examples: {use: [{scenario: An order at 23:30 Berlin time shows on the next day., reason: The read names the zone days are counted in.}], do_not_use: [{scenario: Find when a parcel left., reason: Read the shipment; its instant is recorded there.}]}
  supplier_item_terms:
    kind: read
    application_tool: supplier_item_terms
    purpose: Show a supplier's minimum order quantity and order multiple per item.
    use_when: [Someone asks how much must be ordered from a supplier at least, or in which pack size.]
    do_not_use_when: [The question is a price; read the price resolution.]
    required_context: [tenant, party_id or item_id]
    data_basis: [supplier_item_terms]
    limitations: [Terms are what a person stated; orders below them are named in review, not refused.]
    freshness: Read at request time.
    empty_result: No terms are stated for the selection.
    refusal_behavior: Only the company's own suppliers and items are read.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [The minimum and multiple stated for a supplier and item.], does_not_prove: [That the supplier still applies them.]}
    unknown_when: [A supplier applies terms nobody stated.]
    next_steps: [State or change terms with supplier_item_terms_set_propose; a person confirms.]
    examples: {use: [{scenario: Check the pack size before ordering bikes from a supplier., reason: The read names the minimum and the multiple.}], do_not_use: [{scenario: Find the purchase price., reason: Read the price resolution instead.}]}
  kits:
    kind: read
    application_tool: kits
    purpose: Show the kits, their components and how many each location can build.
    use_when: [Someone asks whether a set can be sold or packed, what a kit is made of, or which part is missing.]
    do_not_use_when: [The item is not a kit; read the item's stock.]
    required_context: [tenant, optionally item_id]
    data_basis: [kit_component, movement, reservation, stock_block]
    limitations: [One level only; buildable counts free stock now and reserves nothing.]
    freshness: Read at request time.
    empty_result: No kit is stated for the selection.
    refusal_behavior: Only the company's own items are read.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [The stated components and what free stock builds at each location.], does_not_prove: [That nobody takes the components before the kit is assembled.]}
    unknown_when: [Components are held somewhere no movement records.]
    next_steps: [Assemble the kits with kit_assemble_propose before the kit order ships; a person confirms.]
    examples: {use: [{scenario: Check how many bike kits the warehouse can pack today., reason: The read gives the buildable count and the limiting part.}], do_not_use: [{scenario: Find the stock of a single wheel., reason: Read the item's stock instead.}]}
  party_merges:
    kind: read
    application_tool: party_merges
    purpose: Show which business partners were merged as duplicates and into which survivor.
    use_when: [Someone asks whether two business partners are the same, where a guest customer's history went, or why a partner is inactive.]
    do_not_use_when: [Someone asks for a partner's balance or orders; read the partner's detail or balances, which already include merged partners.]
    required_context: [tenant, optionally party_id]
    data_basis: [party_merge, party]
    limitations: [A merge is not undone; the duplicate's records keep naming it.]
    freshness: Read at request time.
    empty_result: No business partner was merged.
    refusal_behavior: Only the company's own partners are read.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Which partner was merged into which survivor, why and when.], does_not_prove: [That the two partners are really the same; a person stated it.]}
    unknown_when: [Duplicates nobody merged yet.]
    next_steps: [Merge a further duplicate with party_merge_propose; a person confirms.]
    examples: {use: [{scenario: Find out why a shop guest customer is inactive., reason: The read names the account it was merged into.}], do_not_use: [{scenario: Find what a customer owes., reason: Read the balances; they include merged partners.}]}
  kit_split:
    kind: read
    application_tool: kit_split
    purpose: Show how a kit's order or invoice line splits its price, revenue and tax across the components.
    use_when: [Someone asks what share of a bundle's revenue or tax a component carries, or what to credit for one returned component.]
    do_not_use_when: [The line is not a kit line.]
    required_context: [tenant, document_line_id]
    data_basis: [document_line, kit_component]
    limitations: [Splits the line's stated amounts by the stated shares; per-component tax rates are not modelled.]
    freshness: Read at request time.
    empty_result: The kit has no stated shares, so there is no split.
    refusal_behavior: Only the company's own lines are read.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Each component's part of the stated gross, net and tax, adding up to the line.], does_not_prove: [What tax a component would carry at its own rate.]}
    unknown_when: [The line states no net or tax; only the gross is split.]
    next_steps: [Record a credit note for a returned component with the per-piece amount the split gives.]
    examples: {use: [{scenario: Find the revenue share of the frame in a bike kit invoice., reason: The split names each component's net, tax and gross.}], do_not_use: [{scenario: Find the price of a single frame., reason: Read the price resolution instead.}]}
  purchase_match:
    kind: read
    application_tool: purchase_match
    purpose: Show whether a purchase order's lines are matched across order, receipt and invoice.
    use_when: [Someone asks whether a purchase can be paid, or whether order, receipt and invoice agree.]
    do_not_use_when: [The question is about open payables; read the open items.]
    required_context: [tenant, document_id]
    data_basis: [document_line, commitment, commitment_revision, movement]
    limitations: [Exact match only, without tolerances; lines in units that cannot be compared are named, not judged.]
    freshness: Derived from promises, movements and invoice lines at request time.
    empty_result: The order has no lines that promised goods.
    refusal_behavior: Only the company's own purchase orders are read.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Which lines match in quantity and price and what differs on the others.], does_not_prove: [That the invoice is paid.]}
    unknown_when: [A receipt or invoice exists that was not recorded.]
    next_steps: [Record the missing receipt or invoice, revise the promise to what was confirmed, or ask the supplier for a credit.]
    examples: {use: [{scenario: Check that PO-100 was delivered and billed as agreed before paying., reason: The read answers matched or names the difference.}], do_not_use: [{scenario: See what is still owed to the supplier., reason: Read the open items instead.}]}
  customer_item_numbers:
    kind: read
    application_tool: customer_item_numbers
    purpose: Show which of our items a customer means by its own article numbers.
    use_when: [A customer order quotes the customer's own article number, or someone asks which numbers a customer uses.]
    do_not_use_when: [The question is a price; read the price resolution.]
    required_context: [tenant, party_id or item_id]
    data_basis: [customer_item_number]
    limitations: [A number is what a person stated for the customer; Shopify orders quote our own SKU.]
    freshness: Read from the mappings at request time.
    empty_result: No customer item number is stated for the selection.
    refusal_behavior: Only the company's own customers and items are read.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Which item a customer number names and the customer's name for it.], does_not_prove: [That the customer still uses the number.]}
    unknown_when: [A customer uses a number nobody stated.]
    next_steps: [State or change a number with customer_item_number_set_propose; a person confirms.]
    examples: {use: [{scenario: Find which item the customer means by K-4711., reason: The read names our item for that number.}], do_not_use: [{scenario: Find the customer's price., reason: Read the price resolution instead.}]}
  supplier_item_numbers:
    kind: read
    application_tool: supplier_item_numbers
    purpose: Show which of our items a supplier means by its own article numbers.
    use_when: [A purchase order, confirmation or supplier invoice quotes the supplier's own article number, or someone asks which numbers a supplier uses.]
    do_not_use_when: [The question is a supplier's minimum quantity or pack size; read the supplier item terms.]
    required_context: [tenant, party_id or item_id]
    data_basis: [supplier_item_number]
    limitations: [A number is what a person stated for the supplier; documents from a supplier's own system are not interpreted yet.]
    freshness: Read from the mappings at request time.
    empty_result: No supplier item number is stated for the selection.
    refusal_behavior: Only the company's own suppliers and items are read.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Which item a supplier number names and the supplier's name for it.], does_not_prove: [That the supplier still uses the number.]}
    unknown_when: [A supplier uses a number nobody stated.]
    next_steps: [State or change a number with supplier_item_number_set_propose; a person confirms.]
    examples: {use: [{scenario: Find which item supplier Lindner means by LF900-12., reason: The read names our item for that number.}], do_not_use: [{scenario: Find the supplier's minimum order quantity., reason: Read the supplier item terms instead.}]}
  outbound_deliveries:
    kind: read
    application_tool: outbound_deliveries
    purpose: List the planned outbound deliveries and where each stands.
    use_when: [Someone asks what is planned to go out, where an order's parts go, or what is picked but not shipped.]
    do_not_use_when: [The question is what has already shipped; read shipments.]
    required_context: [tenant]
    data_basis: [outbound_delivery, outbound_delivery_line, outbound_delivery_pick, movement, source_record]
    limitations: [A delivery's state is derived from its lines, picks and shipment; nothing about a delivery is stored as a status.]
    freshness: Read from the deliveries, their pick movements and shipments at request time.
    empty_result: No delivery is planned for the selection.
    refusal_behavior: Only the company's own deliveries are returned.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Which promises each delivery carries, how much is picked, waiting to be put back and shipped.], does_not_prove: [That the goods in staging are physically complete.]}
    unknown_when: [Goods were picked on paper and never recorded.]
    next_steps: [Read one delivery with outbound_delivery_detail, pick it with outbound_delivery_pick_propose, or ship it with shipment_dispatch_propose.]
    examples: {use: [{scenario: Show what goes to the Bremen store this week., reason: The list names each delivery's recipient and slot.}], do_not_use: [{scenario: Tell whether an order was delivered., reason: Read the shipment instead.}]}
  outbound_delivery_detail:
    kind: read
    application_tool: outbound_delivery_detail
    purpose: Explain one planned delivery, its picks and statements, and how to ship it.
    use_when: [Someone asks which address a delivery uses, what was picked, or what must be put back.]
    do_not_use_when: [The question is a shipment's carrier events; read the shipment.]
    required_context: [tenant, outbound_delivery_id]
    data_basis: [outbound_delivery, outbound_delivery_line, outbound_delivery_pick, movement, source_record, shipment]
    limitations: [The address and slot are as stated; nothing checks them against the carrier.]
    freshness: Read from the delivery, its statements and movements at request time.
    empty_result: The delivery is not found.
    refusal_behavior: Only the company's own deliveries are read.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Every statement of the delivery, each pick and put-back movement, and the shipment it went with.], does_not_prove: [That the recipient received it.]}
    unknown_when: [A change of address was agreed but not stated.]
    next_steps: [Revise it with outbound_delivery_revise_propose, or ship its `dispatch` arguments with shipment_dispatch_propose.]
    examples: {use: [{scenario: Explain which address the parcel went to after the customer moved., reason: The statements and the shipment keep both addresses.}], do_not_use: [{scenario: Reserve stock., reason: Reserve the promise instead.}]}
  external_stock:
    kind: read
    application_tool: external_stock
    purpose: Compare stock someone outside states, such as a 3PL or a shop, with what Reality's movements held there at the stated time.
    use_when: [Someone asks whether the 3PL's stock report matches Reality, or why External stock differs is reported.]
    do_not_use_when: [The question is current stock in Reality; read inventory.]
