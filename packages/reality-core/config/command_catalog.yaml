    use_when: [An accountable human has reviewed and approved the exact pending proposal preview.]
    do_not_use_when:
      - Approval is inferred from model output, credentials, connection, or prior similar decisions.
      - The proposal is executing, rejected, unknown, foreign, or no longer matches the intended action.
    required_context: [change_proposal]
    preconditions: [The proposal belongs to the selected tenant, remains proposed, and approved is explicitly true.]
    confirmation: explicit_human
    principal_semantics: The authenticated MCP client asserts that an accountable human approved the exact preview; operations that require a Reality user principal are refused unless the confirming adapter supplies that authenticated principal.
    idempotency: {mode: single_use_replay, guidance: An executed replay returns the stored receipt without executing again; never retry an executing proposal blindly.}
    retry_behavior: Retry only after a transport failure by reading proposal_execution_status; an executed result is replay-safe and an executing result requires reconciliation.
    unknown_behavior: Executing means the effect may be in progress or committed without a delivered response; reconcile by proposal ID and do not execute again.
    refusals:
      - {code: approval_required, description: approved=true was not supplied after explicit human approval.}
      - {code: execution_unknown, description: The proposal is already executing and cannot be safely retried.}
      - {code: proposal_settled, description: The proposal was rejected or otherwise cannot be confirmed.}
      - {code: proposal_not_found, description: No proposal is visible in the selected tenant.}
    events: [reservation.created]
    receipt:
      fields: [proposal_id, capability, reservation_id, commitment_id, requested, applied, shortage, event_id]
      limitations: A receipt proves neither that authoritative state still matches nor that fulfilment or the customer outcome occurred.
    verification_reads:
      - {name: proposal_execution_status, proves: Correlated execution evidence and current Reservation/Commitment values match the stored receipt.}
      - {name: business_records_discover, proves: Named operational records remain visible with current tenant-scoped values.}
    examples:
      use: [{scenario: An accountable operator approves the exact pending reservation proposal., reason: Explicit human approval permits the single-use confirmation boundary.}]
      do_not_use: [{scenario: An agent believes a similar proposal would usually be approved., reason: Learned behavior and model output are not confirmation authority.}]
  proposal_execution_status:
    kind: read
    application_tool: proposal_execution_status
    purpose: Reconcile one confirmation lifecycle and validate its stored receipt against authoritative Reality records.
    use_when: [A confirmation response was lost, execution is indeterminate, or an exact effect needs verification.]
    do_not_use_when: [A caller wants to approve, retry, or infer downstream fulfilment from a reservation.]
    required_context: [change_proposal]
    data_basis: [change_proposal, reservation, commitment, business_event]
    limitations: [Verification covers the correlated execution and operational allocation only, not fulfilment or customer outcome.]
    freshness: Reflects committed proposal, Reservation, Commitment, and BusinessEvent state at read time.
    empty_result: An unknown or foreign proposal is not found.
    refusal_behavior: Tenant scope is enforced and no existence is disclosed across tenants.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves: [The receipt matches the proposal and correlated committed operational records.]
      does_not_prove: [Goods moved, fulfilment completed, or the intended customer outcome occurred.]
    unknown_when: [The proposal is executing, a correlated event is absent, or receipt and Reality values disagree.]
    next_steps: [Do not reconfirm an executing proposal; inspect the named records and escalate unresolved evidence.]
    examples:
      use: [{scenario: Reconcile a reservation confirmation after the client lost its response., reason: The proposal ID is the stable reconciliation key.}]
      do_not_use: [{scenario: Prove that the customer received the goods., reason: Reservation verification does not prove physical Movement or delivery.}]
  reality_gaps:
    kind: read
    application_tool: reality_gaps
    purpose: List tenant-scoped missing-information investigations and their current workflow state.
    use_when: [An operator or agent needs the queue of reported information gaps.]
    do_not_use_when: [A caller wants to infer that an unreported gap does not exist.]
    required_context: [tenant]
    data_basis: [reality_gap]
    limitations: [The queue contains reported investigations, not an automatic proof of completeness.]
    freshness: Reflects committed Reality Gap state at read time.
    empty_result: No matching gap has been reported in the selected tenant.
    refusal_behavior: Tenant scope is enforced and no existence is disclosed across tenants.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [Reported gaps and their current state.], does_not_prove: [That all missing information has been discovered.]}
    unknown_when: [A business need has not yet been reported or classified.]
    next_steps: [Capture a new gap when an operator encounters missing information.]
    examples:
      use: [{scenario: Review unresolved Shopify information needs., reason: The queue is the shared investigation inbox.}]
      do_not_use: [{scenario: Certify that the tenant model is complete., reason: Absence from the queue is not completeness evidence.}]
  reality_gap_get:
    kind: read
    application_tool: reality_gap_get
    purpose: Inspect one missing-information investigation with its evidence, decision, rule, and outcomes.
    use_when: [An operator or agent needs the traceable detail behind one reported gap.]
    do_not_use_when: [A caller lacks the opaque gap identity or wants to mutate the investigation.]
    required_context: [reality_gap]
    data_basis: [reality_gap, reality_gap_entry, interpretation_rule, rule_interpretation_outcome]
    limitations: [The detail records the investigation and implementation evidence; it does not prove external business truth beyond linked sources.]
    freshness: Reflects committed investigation, rule, and outcome state at read time.
    empty_result: An unknown or foreign gap is not found.
    refusal_behavior: Tenant scope is enforced and no existence is disclosed across tenants.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [The recorded investigation history and linked implementation state.], does_not_prove: [Unrecorded external facts.]}
    unknown_when: [Evidence is incomplete or no decision has been accepted.]
    next_steps: [Add source-grounded evidence, request a recommendation, or simulate an accepted Fact rule.]
    examples:
      use: [{scenario: Explain why a Shopify field became a Fact rule., reason: Detail preserves the evidence and decision chain.}]
      do_not_use: [{scenario: Change a rule without confirmation., reason: This capability is read-only.}]
  reality_gap_simulate:
    kind: read
    application_tool: reality_gap_simulate
    purpose: Preview deterministic matches and normalized Fact values for a draft or accepted interpretation rule without writing Reality.
    use_when: [An operator needs to validate a SourceRecord-to-Fact rule before activation.]
    do_not_use_when: [The intended change creates typed Evidence, operational Reality, projections, or exceptions.]
    required_context: [reality_gap, source_record]
    data_basis: [reality_gap, interpretation_rule, source_record]
    limitations: [Simulation uses the closed V1 rule grammar and does not create Facts or outcomes.]
    freshness: Evaluates committed SourceRecords and the supplied or stored rule at read time.
    empty_result: No in-scope SourceRecord matches the rule.
    refusal_behavior: Invalid paths, predicates, types, normalizers, values, or cross-tenant identities are rejected.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [Which current source versions would match and what values would be normalized.], does_not_prove: [Future matches or business correctness.]}
    unknown_when: [The source field is absent, invalid for the declared type, or outside the closed grammar.]
    next_steps: [Review samples and activate only an accepted Fact rule with explicit confirmation.]
    examples:
      use: [{scenario: Preview a Shopify shipping-priority Fact rule., reason: Samples expose matches and normalized values without mutation.}]
      do_not_use: [{scenario: Preview a reservation policy., reason: V1 self-service rules may only derive Facts from SourceRecords.}]
  fact_observe_propose:
    application_tool: fact_observe
    purpose: Record one reviewed, source-supported observation without replacing a typed business transition.
    use_when: [An immutable SourceRecord explicitly supports an approved Fact predicate about an existing subject.]
    do_not_use_when:
      - The statement is only model output, an unsupported inference, or an organizational policy.
      - A Commitment, Reservation, Movement, or LedgerEntry already represents the business meaning.
    required_context: [source_record, commitment]
    preconditions: [Source and subject exist in the selected tenant and the predicate accepts the subject and value.]
    confirmation: required
    idempotency: {mode: required, guidance: Reuse one caller-stable key only for the identical observation; changed content needs a new key.}
    refusals:
      - {code: unsupported_predicate, description: The Fact predicate is not registered for the subject or value.}
      - {code: missing_source, description: The immutable supporting SourceRecord does not exist in the selected tenant.}
    events: [fact.observed]
    verification_reads:
      - {name: timeline, proves: The Fact observation event and opaque identity appear in tenant history.}
    examples:
      use:
        - {scenario: A Shopify source explicitly states express shipping for an existing commitment., reason: The contextual observation has immutable source evidence.}
        - {scenario: A customer email explicitly states an approved delivery preference., reason: The statement is contextual evidence rather than a physical event.}
      do_not_use:
        - {scenario: An agent predicts that an order will ship tomorrow., reason: Model inference without source evidence is not a Fact.}
  order_create_propose:
    application_tool: order_create
    purpose: Record a manual order as Source and Document Evidence with derived Commitments.
    use_when: [A human supplies a complete manual order whose parties, items, locations, quantities, and prices are known.]
    do_not_use_when:
      - The source only reports stock allocation, physical execution, or payment.
      - An existing order needs correction rather than a new source identity.
    required_context: [party, item, location, payment_term]
    preconditions: [All referenced master data belongs to the selected tenant and lines form a complete intended order.]
    confirmation: required
    idempotency: {mode: unsafe_retry, guidance: Reconcile Source and Document registers before retrying an unknown outcome.}
    refusals:
      - {code: invalid_order_context, description: Required party, item, location, or payment context is absent or invalid.}
      - {code: duplicate_source_identity, description: The proposed source identity conflicts with existing evidence.}
    events: [source_record.stored, document.recorded, commitment.created]
    verification_reads:
      - {name: document_register, proves: Document Evidence links to its immutable source.}
      - {name: commitment_register, proves: Promised quantities exist as Commitments rather than document status.}
    examples:
      use:
        - {scenario: A sales colleague enters a complete customer order manually., reason: A new order needs Source, Evidence, and outgoing Commitments.}
        - {scenario: A buyer records a complete supplier purchase order manually., reason: A new purchase creates incoming Commitments from evidence.}
      do_not_use:
        - {scenario: Warehouse staff report that an existing order left the building., reason: Physical execution requires a Movement.}
  reservation_propose:
    application_tool: reserve
    purpose: Allocate currently available stock to an existing outgoing Commitment.
    use_when: [An existing outgoing Commitment needs bounded stock allocation before fulfillment.]
    do_not_use_when: [Goods have already physically moved., A source expresses only a preference or future promise.]
    required_context: [commitment, item, location, movement, reservation]
    preconditions: [The commitment is open and matching stock identity is available in the selected tenant.]
    confirmation: required
    idempotency: {mode: unsafe_retry, guidance: Re-read Commitment register and Inventory before retrying an unknown outcome.}
    refusals:
      - {code: insufficient_stock, description: The requested allocation exceeds matching available stock.}
      - {code: commitment_closed, description: The commitment no longer accepts allocation.}
    events: [reservation.created]
    verification_reads:
      - {name: inventory, proves: Reserved quantity increases and available quantity decreases.}
      - {name: commitment_register, proves: Allocation links to the intended Commitment.}
    examples:
      use:
        - {scenario: Allocate five available units to an existing customer commitment., reason: Reservation is the shortest representation of allocation.}
        - {scenario: Allocate an exact lot before picking., reason: Stock stays physically in place while becoming reserved.}
      do_not_use:
        - {scenario: Record that five units were shipped., reason: A completed physical event requires a Movement.}
  movement_create_propose:
    application_tool: movement_create
    purpose: Record an immutable physical receipt, transfer, shipment, return, or adjustment.
    use_when: [A physical stock event occurred with known item, quantity, time, and applicable locations.]
    do_not_use_when:
      - The source expresses only a promise, planned allocation, preference, or prediction.
      - An existing Movement is wrong and requires a compensating correction.
    required_context: [item, location, commitment, reservation]
    preconditions: [Item and locations belong to the selected tenant and the movement type has a valid physical direction.]
    confirmation: required
    idempotency: {mode: unsafe_retry, guidance: Re-read Inventory and Timeline before retrying an unknown physical write.}
    refusals:
      - {code: invalid_physical_direction, description: Movement type and source or destination locations are inconsistent.}
      - {code: invalid_tracking_identity, description: Tracking identity does not satisfy item rules.}
    events: [movement.recorded, reservation.consumed, reservation.created, commitment.fulfilled]
    verification_reads:
      - {name: inventory, proves: Physical stock reflects the immutable Movement.}
      - {name: commitment_register, proves: Fulfillment derives from Movements linked to the Commitment.}
      - {name: timeline, proves: The physical event is visible with its opaque identity.}
    examples:
      use:
        - {scenario: Record goods received into a warehouse after arrival., reason: A receipt is an actual physical Movement.}
        - {scenario: Record a completed shipment against an outgoing commitment., reason: Fulfillment derives from the linked Movement.}
      do_not_use:
        - {scenario: A customer asks for delivery next week., reason: A promise is not evidence that goods moved physically.}
  interpretation_coverage:
    kind: read
    application_tool: interpretation_coverage
    purpose: Explain whether immutable sources were interpreted and which opaque Reality identities each attempt produced.
    use_when: [A source-processing outcome, retry history, or produced-record identity is needed.]
    do_not_use_when: [Current business state or proof that a produced record remains operationally valid is required.]
    required_context: [source_record]
    data_basis: [source_record, import_job, interpretation_outcome, interpretation_record_reference]
    limitations: [An interpretation outcome is processing audit and does not replace the produced Reality records.]
    freshness: Reflects committed source and attempt outcomes at read time; pending work remains explicitly pending.
    empty_result: No matching tenant source exists; an old source without outcomes is labeled not_recorded.
    refusal_behavior: A foreign or unknown source identity behaves as not found.
    confirmation: none
    side_effects: none
    verification:
      role: context
      proves: [A named attempt classification and its recorded produced identities exist.]
      does_not_prove: [The produced business state is still current or that a later effect succeeded.]
    unknown_when: [The source is pending, processing, not_recorded, or its produced identities have not been re-read.]
    next_steps: [Read the produced opaque identities through their authoritative register or explanation capability.]
    examples:
      use: [{scenario: Explain why a Shopify source failed once and succeeded on retry., reason: Attempt history is the subject.}]
      do_not_use: [{scenario: Prove that an order is ready to ship., reason: Read order and inventory state instead.}]
  business_records_discover:
    kind: read
    application_tool: business_discover
    purpose: Find bounded tenant-owned business records and their opaque identities before a precise read or proposal.
    use_when: [The correct opaque record identity is not yet known.]
    do_not_use_when: [A selected record needs complete explanation or an effect needs verification.]
    required_context: [tenant]
    data_basis: [party, item, location, document, commitment, movement, reservation]
    limitations: [Page mode traverses matching retained records with a scope-bound cursor; live changes are not a snapshot. Legacy results remain bounded summaries. Neither mode supplies full evidence.]
    freshness: Reads current tenant records without business or projection writes and returns observation metadata in page mode; authentication telemetry may persist and upstream freshness is unknown.
    empty_result: No matching records were found in the selected tenant; absence is not proof that the business object never existed.
    refusal_behavior: Unknown families are refused and foreign records are never returned.
    confirmation: none
    side_effects: none
    verification:
      role: discovery
      proves: [A returned opaque identity currently belongs to the selected tenant and family.]
      does_not_prove: [Completeness, operational readiness, or the outcome of a mutation.]
    unknown_when: [Search terms are incomplete, results hit the bound, or the relevant family is unknown.]
    next_steps: [Use the returned opaque identity with the narrow explanation or register read.]
    examples:
      use: [{scenario: Find the opaque sales-order identity before calling order_explain., reason: Discovery supplies identity only.}]
      do_not_use: [{scenario: Confirm that reserved stock changed after approval., reason: Inventory is the authoritative verification read.}]
  order_explain:
    kind: read
    application_tool: order_explain
    purpose: Trace one selected order through immutable source, Document Evidence, Commitments, reservations, movements, and derived fulfillment.
    use_when: [One known order needs an explainable Source-to-Reality trace.]
    do_not_use_when: [The order identity is unknown or aggregate inventory across orders is required.]
    required_context: [document]
    data_basis: [source_record, document, document_line, commitment, reservation, movement]
    limitations: [Includes retained open and closed orders but cannot reconstruct an arbitrary past state or establish unrelated stock or payment completeness.]
    freshness: Reads retained tenant evidence directly without cache writes or commits and returns observation metadata; authentication telemetry may persist and upstream freshness is unknown.
    empty_result: A missing tenant-owned order is not found rather than represented as an empty explanation.
    refusal_behavior: Ambiguous, unknown, or foreign order references are refused without disclosure.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves: [The selected order trace exposes the current linked Evidence and Reality used for fulfillment.]
      does_not_prove: [Provider delivery, customer receipt, or payment unless corresponding Reality records are present.]
    unknown_when: [The expected linked record is absent, ambiguous, or a relevant external system has not been reconciled.]
    next_steps: [Read inventory for stock consequences and exceptions for explicit attention signals.]
    examples:
      use: [{scenario: Verify that a shipment Movement is linked to the intended order Commitment., reason: The order trace exposes the shortest links.}]
      do_not_use: [{scenario: Search for an order using a vague customer phrase., reason: Discover its opaque identity first.}]
  commitments_list:
    kind: read
    application_tool: commitments
    purpose: Read current customer and supplier obligations and their derived fulfillment state.
    use_when: [Promises, due quantities, allocation context, or fulfillment progress must be inspected.]
    do_not_use_when: [Physical stock across commitments or source-processing success is the question.]
    required_context: [commitment]
    data_basis: [commitment_register]
    limitations: [A Commitment is a promise; it does not by itself prove allocation, physical movement, or payment.]
    freshness: Page mode derives current tenant records without cache writes or commits and returns local event sequence and projection version; upstream freshness is unknown. Legacy mode reads the last completed stored snapshot without refreshing or committing it. Authentication telemetry may persist.
    empty_result: No projected commitments are visible; this does not prove source ingestion is complete.
    refusal_behavior: Only tenant-scoped projection rows are returned.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves: [A Commitment and its derived fulfillment values are present in the returned projection version.]
      does_not_prove: [Physical stock availability or external delivery confirmation.]
    unknown_when: [The projection is stale, the expected commitment is absent, or source interpretation is incomplete.]
    next_steps: [Read inventory for allocation and stock; use order_explain for source linkage.]
    examples:
      use: [{scenario: Re-read an order Commitment after recording a linked shipment., reason: Fulfillment derives from linked Movements.}]
      do_not_use: [{scenario: Prove warehouse stock exists., reason: Inventory derives the physical and reserved quantities.}]
  shipments_list:
    kind: read
    application_tool: shipments_list
    purpose: List real physical consignments and packages separately from delivery commitments.
    use_when: [Physical dispatch, receipt, carrier, tracking, or externally reported delivery must be inspected.]
    do_not_use_when: [The question is only what was promised or currently remains open.]
    required_context: [shipment]
    data_basis: [shipment, shipment_package, shipment_event, movement]
    limitations: [Dispatch and carrier delivery are distinct observations; absent tracking or events prove nothing.]
    freshness: Reads current tenant Reality directly without cache writes; upstream carrier freshness is unknown.
    empty_result: No matching physical shipment is recorded; open delivery Commitments may still exist.
    refusal_behavior: Unknown filters are refused and only tenant-scoped records are returned.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves: [Returned consignments, packages and observations exist in current tenant Reality.]
      does_not_prove: [A promise, stock quantity, or external delivery beyond the linked evidence.]
    unknown_when: [The carrier has not reported, source intake is incomplete, or physical execution was not packaged.]
    next_steps: [Use shipment_explain for exact contents and evidence; use commitments_list for promises.]
    examples:
      use: [{scenario: Find the package carrying tracking number TRACK-123., reason: Tracking search belongs to physical Shipments.}]
      do_not_use: [{scenario: List orders still awaiting shipment., reason: That is a Commitment fulfillment question.}]
  shipment_explain:
    kind: read
    application_tool: shipment_explain
    purpose: Explain one physical Shipment through Packages, current events, effective Movements, and sources.
    use_when: [One known Shipment needs exact contents, tracking history, and proof boundaries.]
    do_not_use_when: [The Shipment identity is unknown or only aggregate promise fulfillment is required.]
    required_context: [shipment]
    data_basis: [shipment, shipment_package, shipment_event, shipment_event_supersession, movement, movement_correction, source_record]
    limitations: [It distinguishes warehouse and external observations and cannot invent absent carrier evidence.]
    freshness: Reads committed tenant Reality directly; external-system freshness remains unknown.
    empty_result: Unknown or foreign Shipment identity is not found.
    refusal_behavior: Unknown and foreign identities are refused without disclosure.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves: [The selected Shipment trace and its current derived observations.]
      does_not_prove: [That dispatch means delivery or a carrier event means warehouse receipt.]
    unknown_when: [Relevant source, Package, Movement, or carrier evidence has not been recorded.]
    next_steps: [Read commitments for promise context and inventory for current stock.]
    examples:
      use: [{scenario: Explain what moved under a selected tracking package., reason: The trace links Package to effective Movements.}]
      do_not_use: [{scenario: Treat delivered as warehouse received., reason: Those observations have different authorities.}]
  inventory_read:
    kind: read
    application_tool: inventory
    purpose: Read physical, reserved, and available stock with explicit item aggregation or item/location scope; page mode supports item_id and location_id filters.
    use_when: [A stock, allocation, or availability consequence must be inspected.]
    do_not_use_when: [A customer promise, source interpretation, or external delivery event is the question.]
    required_context: [item, location]
    data_basis: [inventory]
    limitations: [Inventory derives from Movements and Reservations and does not prove a promise or external receipt.]
    freshness: Page mode derives current tenant records without cache writes or commits and returns local event sequence and projection version; upstream freshness is unknown. Legacy mode reads the last completed stored snapshot without refreshing or committing it. Authentication telemetry may persist.
    empty_result: No projected stock rows are visible; zero stock and missing projection context must not be conflated.
    refusal_behavior: Only tenant-scoped projection rows are returned.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves: [Returned physical, reserved, and available quantities derive from committed Movements and Reservations.]
      does_not_prove: [That goods were promised, delivered externally, or paid.]
    unknown_when: [The projection is stale, the expected item/location row is absent, or an effect outcome is unreconciled.]
    next_steps: [Read commitments for promise context and order_explain for the shortest order trace.]
    examples:
      use: [{scenario: Verify reserved quantity after an approved Reservation., reason: Inventory exposes the allocation consequence.}]
      do_not_use: [{scenario: Claim that reserved goods physically shipped., reason: A Movement and its order trace are required.}]
  exceptions_list:
    kind: read
    application_tool: exceptions
    purpose: List currently derived tenant conditions that require operational attention.
    use_when: [An agent needs a bounded queue of known operational blockers or inconsistencies.]
    do_not_use_when: [A complete health audit or proof that no unknown problem exists is required.]
    required_context: [tenant]
    data_basis: [operational_exception]
    limitations: [Exceptions cover only registered derivations; an empty list is not proof of complete correctness.]
    freshness: Derived from the committed inputs read by the exception service at request time.
    empty_result: No registered exception currently derives; unmodeled or unobserved problems may still exist.
    refusal_behavior: Only tenant-owned derived conditions are returned.
    confirmation: none
    side_effects: none
    verification:
      role: context
      proves: [A returned registered condition currently derives from named Reality inputs.]
      does_not_prove: [That all operations are healthy when the list is empty or that an effect succeeded.]
    unknown_when: [The relevant condition has no registered derivation, its inputs are stale, or external state is unavailable.]
    next_steps: [Explain the specific exception and inspect its named Reality records before proposing action.]
    examples:
      use: [{scenario: Ask what known operational condition needs attention now., reason: The register is an attention projection.}]
      do_not_use: [{scenario: Certify that the whole company has no problems because the list is empty., reason: Coverage is intentionally bounded.}]
  fulfillment_queue:
    kind: read
    application_tool: fulfillment_queue
    purpose: Read the derived open-order work queue with readiness, shortages, holds, and source identity.
    use_when: [Fulfillment work must be prioritized or readiness compared across orders.]
    do_not_use_when: [One blocker needs causal detail or one order needs its full trace.]
    required_context: [tenant]
    data_basis: [fulfillment_queue]
    limitations: [This derived work view does not prove shipment, external delivery, or payment.]
    freshness: Page mode derives current tenant records without cache writes or commits and returns local event sequence and projection version; upstream freshness is unknown. Legacy mode reads the last completed stored snapshot without refreshing or committing it. Authentication telemetry may persist.
    empty_result: No orders are projected into the queue; ingestion may still be incomplete.
    refusal_behavior: Only tenant-scoped queue rows are returned.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [Returned orders have the displayed derived fulfillment state.], does_not_prove: [A ready order shipped or an absent order never existed.]}
    unknown_when: [The projection is stale, an expected order is absent, or a source remains uninterpreted.]
    next_steps: [Read fulfillment blockers or explain one selected order.]
    examples: {use: [{scenario: Prioritize ready versus held orders., reason: This is the bounded work view.}], do_not_use: [{scenario: Assert carrier delivery., reason: External delivery needs separate evidence.}]}
  fulfillment_blockers:
    kind: read
    application_tool: fulfillment_blockers
    purpose: Read registered order and item conditions that currently block fulfillment.
    use_when: [An order is not ready and its derived blocker and affected Reality records are needed.]
    do_not_use_when: [A complete order trace or proof that every possible blocker is modeled is required.]
    required_context: [tenant]
    data_basis: [fulfillment_blockers]
    limitations: [Only registered blocker derivations appear; absence does not prove complete health.]
    freshness: Page mode derives current tenant records without cache writes or commits and returns local event sequence and projection version; upstream freshness is unknown. Legacy mode reads the last completed stored snapshot without refreshing or committing it. Authentication telemetry may persist.
    empty_result: No registered blocker derives; unobserved or unmodeled causes may remain.
    refusal_behavior: Only tenant-scoped blocker rows are returned.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [A registered blocker derives for the returned records.], does_not_prove: [External root cause, complete health, or successful recovery.]}
    unknown_when: [The projection is stale or required upstream evidence is absent.]
    next_steps: [Explain the order and read inventory or item supply and demand.]
    examples: {use: [{scenario: Inspect why an order is not ready., reason: The blocker projection supplies registered causes.}], do_not_use: [{scenario: Certify all orders healthy from an empty list., reason: Unmodeled causes are outside the view.}]}
  item_supply_demand:
    kind: read
    application_tool: item_supply_demand
    purpose: Read derived stock, incoming supply, demand, shortages, and affected orders by item.
    use_when: [Item-level supply pressure or demand contributing to shortages must be assessed.]
    do_not_use_when: [Exact location stock or external supplier delivery must be proven.]
    required_context: [tenant]
    data_basis: [item_supply_demand]
    limitations: [The aggregate does not prove future supplier performance or external receipt.]
    freshness: Page mode derives current tenant records without cache writes or commits and returns local event sequence and projection version; upstream freshness is unknown. Legacy mode reads the last completed stored snapshot without refreshing or committing it. Authentication telemetry may persist.
    empty_result: No item rows are projected; source interpretation may still be incomplete.
    refusal_behavior: Only tenant-scoped item rows are returned.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [Displayed supply, demand, and shortage derive for each returned item.], does_not_prove: [Expected incoming goods will arrive or an order was externally delivered.]}
    unknown_when: [The projection is stale or expected commitments are absent.]
    next_steps: [Read inventory for locations and commitments or order explanation for promises.]
    examples: {use: [{scenario: Find items contributing to shortages., reason: The view combines typed supply and demand.}], do_not_use: [{scenario: Confirm supplier goods arrived., reason: A receiving Movement is required.}]}
  return_announcements:
    kind: read
    application_tool: return_announcements
    purpose: List the returns customers have announced, in the order they said so, with what each is still waiting for.
    use_when: [The receiving desk needs to know what parcels are expected, or somebody is chasing a return a customer promised.]
    do_not_use_when: [Goods have already arrived and what to do with them is the question; that is the return itself.]
    required_context: [none]
    data_basis: [return_announcement, commitment, movement]
    limitations: [An announcement is not supply. Nothing here makes the goods available, because goods a customer has promised to send are not goods anybody can sell.]
    freshness: Derived from committed tenant Reality at request time.
    empty_result: A company nobody has announced a return to reports an empty list rather than failing.
    refusal_behavior: An unknown commitment is refused; announcements of another tenant are never returned.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [What a customer said they would send back, and how much of it has arrived.], does_not_prove: [That the parcel exists or was ever posted.]}
    unknown_when: [Goods came back without having been announced, which is ordinary and leaves nothing here to see.]
    next_steps: [Record the returning goods against the announcement they fulfil, or withdraw it if the customer changed their mind.]
    examples: {use: [{scenario: See which parcels the desk should expect., reason: An announcement is what makes an arrival a confirmation rather than a puzzle.}], do_not_use: [{scenario: Decide what to do with returned stock., reason: That starts when the goods arrive and is a movement.}]}
  expired_lots:
    kind: read
    application_tool: expired_lots
    purpose: List the batches whose stated best-before date has passed, oldest first.
    use_when: [Somebody is deciding what to write off, send back, or stop shipping, or is checking what expired stock the company still holds.]
    do_not_use_when: [The question is what is about to expire; nothing states a horizon, so nothing here answers it.]
    required_context: [none]
    data_basis: [lot]
    limitations: [Only a lot with a stated best-before is listed. A lot with no date says nothing in either direction, because an item with no shelf life and a label nobody read are indistinguishable. This lists lots, not quantities; what is still held is in the operational exception entry.]
    freshness: Derived from committed tenant Reality at request time.
    empty_result: A company whose lots state no date reports an empty list rather than failing.
    refusal_behavior: Lots of another tenant are never listed.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [The listed batches carry a stated best-before that has passed.], does_not_prove: [That any stock of them is still held, or that it is unsellable in law.]}
    unknown_when: [Nobody recorded the date, which is silence rather than a negative.]
    next_steps: [Read the expired stock entries in the operational exception queue for what is still held, then write it off or send it back.]
    examples: {use: [{scenario: Find batches past their date before a stock count., reason: The date is stated on the lot and compared with today.}], do_not_use: [{scenario: Find batches expiring within thirty days., reason: No horizon is stated anywhere, and Reality does not invent one.}]}
  payment_run_preview:
    kind: read
    application_tool: payment_run_preview
    purpose: Show which supplier invoices are worth paying now, what each supplier is owed, what the run totals per currency, and what was withheld.
    use_when: [Somebody is deciding what should go out on a payment day, or is checking which invoices can still be paid for less.]
    do_not_use_when: [One invoice is in question, or the amounts have already been confirmed and the run is ready to execute.]
    required_context: [pay_by]
    data_basis: [document, ledger_entry, settlement_allocation, party, payment_term]
    limitations: [It names an early-payment rate and the day the window closes and never states what the discount is worth, because a rate applied to a gross amount is money nobody agreed to. Amounts are what the ledger holds open, not what to pay.]
    freshness: Derived from committed tenant Reality at request time.
    empty_result: A day nothing is due before, with no discount window open, reports a count of zero rather than failing.
    refusal_behavior: A missing day is refused; invoices of another tenant are never proposed.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [The proposed invoices currently have those amounts open under those terms.], does_not_prove: [That any of them should be paid, or that the company has the cash.]}
    unknown_when: [An invoice nobody has posted yet does not appear, because nothing is open on it.]
    next_steps: [State an amount per invoice and confirm the total to execute the run, or narrow the day and preview again.]
    examples: {use: [{scenario: Decide what goes out on Friday., reason: The proposal and its totals are what a run is confirmed against.}], do_not_use: [{scenario: Work out what a 2% discount is worth., reason: Reality never states an amount nobody agreed to.}]}
  stale_closure_preview:
    kind: read
    application_tool: stale_closure_preview
    purpose: Show how many promises an import left behind a closure would close, and a sample of them, without changing anything.
    use_when: [An imported history has filled the queue with promises nobody is going to keep and somebody is deciding what to close.]
    do_not_use_when: [A single promise is in question, or the criteria have not been decided by a person.]
    required_context: [direction, due_before]
    data_basis: [commitment, movement, reservation]
    limitations: [The sample is bounded for recognition and is not the whole set; the count is what a closure confirms.]
    freshness: Derived from committed tenant Reality at request time.
    empty_result: Criteria matching nothing report a count of zero rather than failing.
    refusal_behavior: An unknown direction or a missing date is refused; cross-tenant promises are never counted.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [The counted promises currently match the stated criteria.], does_not_prove: [That any of them is genuinely abandoned rather than late.]}
    unknown_when: [Movements are recorded outside Reality, so a promise may look untouched and not be.]
    next_steps: [Confirm the count with a reason to close them, or narrow the date and preview again.]
    examples: {use: [{scenario: Decide what an imported history left behind., reason: The count and sample are what a closure is confirmed against.}], do_not_use: [{scenario: Judge whether one late order is abandoned., reason: A single promise is read through its own explanation.}]}
  exception_explain:
    kind: read
    application_tool: exception_explain
    purpose: Explain one selected current exception through the Reality context from which it derives.
    use_when: [A known exception identity needs its current derivation and affected records.]
    do_not_use_when: [Exceptions must first be discovered or historical conditions are requested.]
    required_context: [exception_id]
    data_basis: [operational_exception]
    limitations: [The explanation covers a registered derivation, not every external root cause.]
    freshness: Derived from committed tenant Reality at request time.
    empty_result: Unknown, foreign, or no-longer-current exceptions are refused as not found.
    refusal_behavior: Unknown and cross-tenant identities are refused without disclosure.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [The selected exception currently derives from returned Reality.], does_not_prove: [External cause, remediation, or historical persistence.]}
    unknown_when: [External state is absent or the exception changes between reads.]
    next_steps: [Inspect named Reality reads before proposing a governed correction.]
    examples: {use: [{scenario: Inspect records behind a listed exception., reason: Its identity enables bounded explanation.}], do_not_use: [{scenario: Search all exceptions without an ID., reason: List exceptions first.}]}
  proposals_awaiting_approval:
    kind: read
    application_tool: proposals_awaiting_approval
    purpose: List tenant change proposals that still await explicit human approval.
    use_when: [The current governed review queue is needed before approval or rejection.]
    do_not_use_when: [Executed Reality, rejected history, or proof of an effect is required.]
    required_context: [tenant]
    data_basis: [change_proposal]
    limitations: [A proposal is intent and preview, not authority, execution, or resulting Reality.]
    freshness: Reflects committed proposal status at request time and may change concurrently.
    empty_result: No proposal currently has proposed status; completed and rejected proposals are outside this list.
    refusal_behavior: Only tenant-owned pending proposals are returned.
    confirmation: none
    side_effects: none
    verification: {role: context, proves: [Returned proposals await approval with the displayed arguments.], does_not_prove: [Correctness, authority, execution, or verified outcome.]}
    unknown_when: [Proposal status or underlying context changes concurrently.]
    next_steps: [Re-read Reality and use explicit confirmation only when justified.]
    examples: {use: [{scenario: Present exact changes requiring review., reason: This is the governed intent queue.}], do_not_use: [{scenario: Claim stock changed from a proposal., reason: Proposal state is not execution.}]}
  finance_balances:
    kind: read
    application_tool: finance_balances
    purpose: Read receivable and payable positions derived from tenant LedgerEntries.
    use_when: [Current ledger-derived receivables and payables separated by represented currency are needed.]
    do_not_use_when: [Bank settlement, reconciliation, invoice evidence, or cash availability must be proven.]
    required_context: [tenant]
    data_basis: [ledger_entry]
    limitations: [Each currency is separate with no conversion or cross-currency total. These balances are not net revenue or profit and do not prove settlement or accounting completeness.]
    freshness: Derived from current tenant LedgerEntries without business writes or commits and returned with observation metadata; authentication telemetry may persist and upstream freshness is unknown.
    empty_result: No balance derives from visible LedgerEntries; missing external postings may remain.
    refusal_behavior: Only tenant-scoped ledger balances are returned.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Returned positions derive from current tenant LedgerEntries.], does_not_prove: [Bank settlement, provider reconciliation, or unrecorded finance events.]}
    unknown_when: [Expected postings are absent or an external finance system is unreconciled.]
    next_steps: [Inspect journal and payment evidence through bounded reads.]
    examples: {use: [{scenario: Verify a recorded payment reduced receivables., reason: The balance derives from LedgerEntries.}], do_not_use: [{scenario: Assert cash settled at the bank., reason: Settlement requires external evidence.}]}

# Executable parity contract. Keys are canonical service names above. A command is
# either eligible with all public agent tools that cover its service family, or is
# explicitly excluded with a durable reason. The catalog validator rejects drift.
# Mutating services a surface can reach that are deliberately not commands. Each
# says why, because the alternative — an operation nobody declared and nobody
# noticed — is what spec 091 found and this list exists to prevent. A stale entry
# fails the build: an exemption outliving the operation it excused would hide the
# next real one.
reachable_mutations_that_are_not_commands:
  add_chat_assistant_message: Chat transcript handling. The business command is whatever the assistant then proposes, which is catalogued on its own.
  create_chat_session: Opening a conversation is not an operation on the business.
  delete_chat_session: Removing a conversation changes no business record.
  restore_chat_session: Restoring a conversation changes no business record.
  send_chat_message: Sending a message is transport; anything it causes is a proposal a person confirms.
  process_pending_import_jobs: The worker step that drains the queue. Enqueuing a source is the command; running the queue is the runtime doing what it was told.

