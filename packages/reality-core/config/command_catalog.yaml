    required_context:
    - tenant, authenticated active owner, event sequence, reason and operation-specific received evidence
      or review categories; inventory_review additionally requires explicit owner Party, unit/currency, empty-opening history, all economic issues and receipt cost/ownership evidence; inventory_batch_review confirms 2–10 distinct scopes with one cutoff, owner and currency, limited to 100 movements and 20 receipts in total; contribution_review requires an exact candidate hash, explicit commercial_v1/revenue completeness and shipment economic time; selling_assign requires received net evidence, confirmed selling expense, exact sold-line shares and recoverable/no-tax treatment; optional selling_categories reviews all seven categories for DB2
