    events:
    - document.recorded
    - ledger.posted
    - settlement.allocated
    verification_reads:
    - name: finance.adjustment.context
      proves: Remaining invoice claim.
    examples:
      use:
      - scenario: Accept a stated discount of 20 after payment of 980.
        reason: Noncash reduction remains separate from actual money.
      do_not_use:
      - scenario: The customer pays less without agreement.
        reason: Keep the remaining claim open.
    postcondition:
      kind: reference
      meaning: The immutable adjustment evidence, balanced postings and allocation exist.
