  delivery_rules:
    kind: read
    application_tool: delivery_rules
    purpose: Show how a customer or an order is delivered, where the rule comes from, and why.
    use_when: [Someone asks why an order does not ship in parts, or whether a customer accepts backorders.]
    do_not_use_when: [The question is whether an order can ship now; read its readiness, which names the rule as a blocker.]
    required_context: [tenant, party_id or document_id]
    data_basis: [delivery_rule, source_record]
    limitations: [A rule is a person's statement; nothing in an order source sets it.]
    freshness: Read from the rules and their statements at request time.
    empty_result: No rule is stated; partial deliveries are allowed.
    refusal_behavior: Only the company's own customers and orders are read.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Which rule an order ships under, who stated it and why.], does_not_prove: [That the customer still wants it.]}
    unknown_when: [A customer agreement exists that was never stated in Reality.]
    next_steps: [Change it with delivery_rule_set_propose; a person confirms.]
    examples: {use: [{scenario: Explain why the ready lines of an order wait., reason: The read names the ship-complete rule and its reason.}], do_not_use: [{scenario: Ship part of the order anyway., reason: Lift the rule for the order with delivery_rule_set_propose first.}]}
  stock_blocks:
    kind: read
    application_tool: stock_blocks
    purpose: List stock held back where it lies, with its reason, quantity and who blocked it.
    use_when: [Someone asks why stock is not available, or which goods are in quarantine, inspection or damaged.]
    do_not_use_when: [The question is what is available to sell; read inventory, which already subtracts blocks.]
    required_context: [tenant]
    data_basis: [stock_block, item, location]
    limitations: [A block is a person's statement; nothing blocks stock by itself, not even an expiry date.]
    freshness: Read from the blocks at request time.
    empty_result: Nothing is blocked for the selection.
    refusal_behavior: Only the company's own blocks are returned.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Which quantity is held back where and why.], does_not_prove: [That the goods are physically damaged or unsafe.]}
    unknown_when: [Goods are held back on the shelf without a block being recorded.]
    next_steps: [Release with stock_block_release_propose or scrap with stock_block_scrap_propose; a person confirms.]
    examples: {use: [{scenario: Explain why five pieces cannot be reserved., reason: The read names the block and its reason.}], do_not_use: [{scenario: Write the goods off., reason: Use stock_block_scrap_propose; a person confirms.}]}
  reorder_points:
    kind: read
    application_tool: reorder_points
    purpose: List the reorder points the company stated, per item and location, with the reorder quantity.
    use_when: [Someone asks at which stock level an item is reordered, or before changing a reorder point.]
    do_not_use_when: [The question is which items need reordering now; read the exception reorder_point_reached.]
    required_context: [tenant]
    data_basis: [item_reorder_point, item, location]
    limitations: [Values are in the item's stock unit; whether a point is reached is derived by the exception class, not stored here.]
    freshness: Read from the stated points at request time.
    empty_result: The company has stated no reorder point for the selection.
    refusal_behavior: Only the company's own points are returned.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Which reorder point and quantity are stated for an item at a location.], does_not_prove: [That stock is below the point or that anything was ordered.]}
    unknown_when: [A level the company uses was never stated here.]
    next_steps: [Change a point with reorder_point_set_propose or remove it with reorder_point_remove_propose; a person confirms.]
    examples: {use: [{scenario: Check the reorder point of an item in one warehouse., reason: The read returns the stated point and quantity.}], do_not_use: [{scenario: Order the item., reason: Prepare a purchase with order_create_propose; a person confirms.}]}
  finance_payment_returns:
    kind: read
    application_tool: finance.payment_returns
    purpose: List returned customer payments with their reason, fee and reopened invoices.
    use_when: [Returned direct debits or chargebacks must be reconciled or followed up.]
    do_not_use_when: [A payment has not come back; use the payments read.]
    required_context: [tenant]
    data_basis: [payment_return, document, settlement_allocation]
    limitations: [Returns are recorded by a person; bank and provider files are not read.]
    freshness: Read from committed returns and current open amounts.
    empty_result: No customer payment has been recorded as returned.
    refusal_behavior: Only tenant-owned returns are returned.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Which payments came back, why, and which invoices are open again.], does_not_prove: [That the customer has paid again.]}
    unknown_when: [A return exists at the bank that nobody recorded.]
    next_steps: [Read one return with finance_payment_return.]
    examples: {use: [{scenario: List this month's returned direct debits., reason: Each return names its reason and reopened invoices.}], do_not_use: [{scenario: Record a new return., reason: Use finance_payment_return_propose.}]}
  finance_payment_return:
    kind: read
    application_tool: finance.payment_return
    purpose: Read one returned customer payment with its reason, reference, fee and reopened invoices.
    use_when: [One known return needs reconciliation.]
    do_not_use_when: [The return is not known yet; list them first.]
    required_context: [return_id]
    data_basis: [payment_return, document, settlement_allocation]
    limitations: [Customer fee charges are separate payable open items without inherited maturity or discounts and are not dunned again.]
    freshness: Read from the selected return and current open amounts.
    empty_result: Unknown and foreign identities are refused as not found.
    refusal_behavior: Cross-tenant identities disclose nothing.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [The return, its reversal, its fee documents and what is open again.], does_not_prove: [Payment by the customer.]}
    unknown_when: [The invoices were settled again after the read.]
    next_steps: [Follow up the reopened invoices; dun them as usual.]
    examples: {use: [{scenario: Check what a chargeback reopened., reason: The read names every invoice and its open amount.}], do_not_use: [{scenario: Reverse a payment entered twice., reason: That is a ledger reversal, not a return.}]}
  finance_payment_return_propose:
    application_tool: finance.payment.return
    purpose: Record a returned direct debit or chargeback of a customer payment for owner confirmation.
    use_when: [The bank or provider says a customer payment came back.]
    do_not_use_when: [A payment was entered by mistake; reverse its posting instead.]
    required_context: [payment_document_id, kind, returned_on, reason]
    preconditions: [A recorded customer payment, not reversed or returned before, not settled together with a payment fee.]
    confirmation: required
    idempotency: {mode: supported, guidance: Reconcile the proposal identity; confirmed replay returns the same return.}
    refusals: [{code: payment_return_already_returned, description: The payment was recorded as returned before.}, {code: payment_return_reduction_active, description: The payment was settled together with a reduction that is still in force.}, {code: finance_account_default_missing, description: A fee needs the payment-fee account.}]
    events: [payment.returned, ledger.reversed, ledger.posted]
    verification_reads: [{name: finance.payment_return, proves: The return, its reversal and fee documents are retained.}]
    examples: {use: [{scenario: A direct debit came back with a bank fee of 3.50., reason: The invoice is open again and the customer owes the fee.}], do_not_use: [{scenario: A customer asks for a refund., reason: A refund is recorded from a credit note.}]}
  finance_payout_settle_propose:
    application_tool: finance.payout.settle
    purpose: Settle a marketplace or payment-provider payout statement for owner confirmation.
    use_when: [A marketplace, payment provider or carrier paid one amount for many orders, minus refunds, chargebacks and fees.]
    do_not_use_when: [A customer paid one invoice directly; record a payment. The statement does not add up; ask the provider.]
    required_context: [provider_party_id, payout_reference, paid_on, currency, amount, clearing_account_id, lines]
    preconditions: [The provider is a business partner; its balance is held on an active cash account apart from the bank; the lines add up to the net payout.]
    confirmation: required
    idempotency: {mode: supported, guidance: Settling the same statement again books only lines that were still unbooked; a changed statement under the same reference is refused.}
    refusals: [{code: payout_total_mismatch, description: The lines do not add up to the stated net payout.}, {code: payout_clearing_is_bank, description: The provider's account is the bank account.}, {code: payout_clearing_account_invalid, description: The provider's account is not an active cash account.}, {code: payout_statement_changed, description: The payout was settled before with other content.}]
    events: [payout.settled, ledger.posted, settlement.allocated, payment.returned, ledger.reversed]
    verification_reads: [{name: finance.payout, proves: Every line's booking and the invoices it settled are retained.}]
    examples: {use: [{scenario: An Amazon payout of 400 orders minus 12 refunds, 3 chargebacks and fees., reason: Each order is paid, every deduction is booked, the bank receives the net.}], do_not_use: [{scenario: A single card payment for one invoice., reason: Record the customer payment instead.}]}
  finance_payouts:
    kind: read
    application_tool: finance.payouts
    purpose: List payouts with their net amount and the lines nothing booked yet.
    use_when: [Payouts must be reconciled with the bank or followed up.]
    do_not_use_when: [One payout is known; read it.]
    required_context: [tenant]
    data_basis: [document, source_record, payment_return]
    limitations: [Payouts are stated by a person or an agent; provider report files are not read.]
    freshness: Read from committed payouts and their bookings.
    empty_result: No payout has been settled.
    refusal_behavior: Only tenant-owned payouts are returned.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Which payouts arrived and how many of their lines are booked.], does_not_prove: [That the provider holds nothing more.]}
    unknown_when: [A payout arrived at the bank that nobody stated.]
    next_steps: [Read one payout with finance_payout.]
    examples: {use: [{scenario: Find the payouts that still have unbooked lines., reason: Each row names the unbooked lines and their amount.}], do_not_use: [{scenario: Settle a payout., reason: Use finance_payout_settle_propose.}]}
  finance_payout:
    kind: read
    application_tool: finance.payout
    purpose: Read one payout with every stated line, what it booked, the invoices it settled and the shipment a tracking number names.
    use_when: [One payout needs reconciliation, or a line stayed unbooked.]
    do_not_use_when: [The payout is not known yet; list them first.]
    required_context: [payout_id]
    data_basis: [document, source_record, ledger_entry, settlement_allocation, payment_return, shipment_package]
    limitations: [An unbooked line names why from what Reality holds now.]
    freshness: Read from the selected payout and current allocations.
    empty_result: Unknown and foreign identities are refused as not found.
    refusal_behavior: Cross-tenant identities disclose nothing.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Each line's booking, the invoices and credit notes it settled and the shipment it names.], does_not_prove: [That the provider's statement is complete.]}
    unknown_when: [An order named by an unbooked line arrives after the read.]
    next_steps: [Settle the same statement again once the orders an unbooked line names are held.]
    examples: {use: [{scenario: See which order a cash-on-delivery remittance paid., reason: The line names its shipment and the invoice it settled.}], do_not_use: [{scenario: Record a chargeback for a direct payment., reason: Use finance_payment_return_propose.}]}
  finance_payment_authorization_record_propose:
    application_tool: finance.payment.authorization.record
    purpose: Record what a card or wallet provider authorized for one sales order, for owner confirmation.
    use_when: [The provider authorized an amount for an order before shipment.]
    do_not_use_when: [Money was captured or paid out; record the capture or settle the payout.]
    required_context: [order_document_id, amount, currency, authorized_at, valid_until, reference]
    preconditions: [A sales order of the tenant in the same currency; the reference is new for the order.]
    confirmation: required
    idempotency: {mode: supported, guidance: Reconcile the proposal identity; a reference is recorded once per order.}
    refusals: [{code: payment_authorization_currency_mismatch, description: The currency differs from the order's.}, {code: payment_authorization_duplicate, description: The reference is already recorded for the order.}]
    events: [payment.authorized]
    verification_reads: [{name: finance.payment_authorizations, proves: The authorization and what is left of it are retained.}]
    examples: {use: [{scenario: Klarna authorized 100 for an order shipped in two parts., reason: Each capture is then checked against what is left.}], do_not_use: [{scenario: The provider paid out., reason: Settle the payout.}]}
  finance_payment_capture_record_propose:
    application_tool: finance.payment.capture.record
    purpose: Record an amount captured against an authorization, for owner confirmation.
    use_when: [The provider captured part or all of an authorization, typically at shipment.]
    do_not_use_when: [The authorization lapsed; a new authorization is needed first.]
    required_context: [authorization_id, amount, captured_at]
    preconditions: [The capture lies between the authorization and its lapse and is no more than is left.]
    confirmation: required
    idempotency: {mode: supported, guidance: Reconcile the proposal identity; confirmed replay returns the same authorization.}
    refusals: [{code: payment_capture_exceeds_authorization, description: More than is left of the authorization.}, {code: payment_capture_after_expiry, description: The authorization had lapsed.}]
    events: [payment.captured]
    verification_reads: [{name: finance.payment_authorizations, proves: The capture and the remainder are retained.}]
    examples: {use: [{scenario: 60 of 100 were captured with the first parcel., reason: 40 remain authorized for the rest.}], do_not_use: [{scenario: Record the money arriving., reason: Settle the payout.}]}
  finance_payment_authorizations:
    kind: read
    application_tool: finance.payment_authorizations
    purpose: List payment authorizations with what was captured, what is left and whether each is live, expired or captured.
    use_when: [Before a late shipment, to see whether the payment is still authorized.]
    do_not_use_when: [The question is whether an invoice is paid; read the invoice.]
    required_context: [tenant]
    data_basis: [payment_authorization, payment_capture]
    limitations: [Authorizations and captures are stated by a person or an agent; provider feeds are not read.]
    freshness: Read from recorded authorizations at the requested instant.
    empty_result: No authorization is recorded for the selection.
    refusal_behavior: Only tenant-owned authorizations are returned.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [What was authorized and captured, and what is left.], does_not_prove: [That the captured money was paid out.]}
    unknown_when: [The provider extended an authorization nobody recorded.]
    next_steps: [Record a new authorization when an expired one leaves goods to ship uncovered.]
    examples: {use: [{scenario: Check whether the rest of an order is still authorized., reason: The read names live, expired and captured amounts.}], do_not_use: [{scenario: Record a capture., reason: Use finance_payment_capture_record_propose.}]}
  finance_dunning_run_propose:
    application_tool: finance.dunning.run
    purpose: Record the reviewed dunning run's notices for owner confirmation.
    use_when: [A person has reviewed the run preview and kept the items to remind.]
    do_not_use_when: [No preview was read; the proposal needs its items and schedule.]
    required_context: [run_date, items, schedule_source_record_id]
    preconditions: [Each item is a customer invoice of the tenant with its proposed level.]
    confirmation: required
    idempotency: {mode: supported, guidance: Reconcile the proposal identity; confirmed replay returns the same receipt.}
    refusals: [{code: dunning_preview_stale, description: The schedule changed since the preview.}, {code: dunning_run_item_unknown, description: An item is not a customer invoice of the tenant.}]
    events: [dunning.run_confirmed, dunning.notice_recorded, ledger.posted]
    verification_reads: [{name: finance.dunning.notices, proves: The recorded notices, their invoices and fees are retained.}, {name: finance.dunning.run_context, proves: Reminded items now wait for their next level.}]
    examples: {use: [{scenario: Confirm a run of twelve customers after deselecting a disputed invoice., reason: Only the kept items are reminded; paid ones are skipped and named.}], do_not_use: [{scenario: Hand an item to collection., reason: Use finance_dunning_collection_propose.}]}
  finance_dunning_collection_propose:
    application_tool: finance.dunning.collection.handover
    purpose: Hand one customer's invoices to collection after a level 3 notice, for owner confirmation.
    use_when: [An item stays unpaid after the third reminder and a person decides to hand it over.]
    do_not_use_when: [The item has no level 3 notice yet, or the customer has paid.]
    required_context: [invoice_ids, handover_date, reason, expected_revision]
    preconditions: [One customer; each invoice open, with a level 3 notice and not handed over before.]
    confirmation: required
    idempotency: {mode: supported, guidance: Reconcile the proposal identity; confirmed replay returns the handover.}
    refusals: [{code: collection_level_missing, description: An invoice has no level 3 notice.}, {code: collection_invoice_not_open, description: An invoice has nothing open.}, {code: collection_already_handed_over, description: An invoice is already in collection.}, {code: collection_mixed_customers, description: The invoices belong to different customers.}]
    events: [dunning.collection_handover_recorded, party.delivery_hold_placed]
    verification_reads: [{name: finance.dunning.collection_handover, proves: The handover, its invoices and the delivery hold are retained.}]
    examples: {use: [{scenario: Hand two unpaid invoices to the collection agency., reason: The decision is recorded and further deliveries are held.}], do_not_use: [{scenario: Write off a receivable., reason: A bad-debt adjustment is a separate finance action.}]}

# Executable parity contract. Keys are canonical service names above. A command is
# either eligible with all public agent tools that cover its service family, or is
# explicitly excluded with a durable reason. The catalog validator rejects drift.
# Mutating services a surface can reach that are deliberately not commands. Each
# says why, because the alternative — an operation nobody declared and nobody
# noticed — is what spec 091 found and this list exists to prevent. A stale entry
# fails the build: an exemption outliving the operation it excused would hide the
# next real one.
reachable_mutations_that_are_not_commands:
  add_chat_assistant_message: Chat transcript handling. The business command is whatever the assistant then proposes, which is catalogued on its own.
  create_chat_session: Opening a conversation is not an operation on the business.
  delete_chat_session: Removing a conversation changes no business record.
  restore_chat_session: Restoring a conversation changes no business record.
  send_chat_message: Sending a message is transport; anything it causes is a proposal a person confirms.
  process_pending_import_jobs: The worker step that drains the queue. Enqueuing a source is the command; running the queue is the runtime doing what it was told.
  set_source_system_base_url: Records where a configured source system can be opened in a browser. Integration configuration, not something an operator asks the business to do; it changes no business record.

