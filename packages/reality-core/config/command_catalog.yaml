      - scenario: Determine DB2 for an order.
        reason: This first slice does not implement consumption or selling costs.
  cost_change_propose:
    application_tool: cost.change
    purpose: Prepare acquisition or selling-cost decisions, bounded inventory reviews and explicitly confirmed whole-line DB1/DB2 reviews.
    use_when:
