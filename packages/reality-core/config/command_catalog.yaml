      invalidate the current review.
    empty_result: An unadmitted receipt has unknown cost.
    refusal_behavior: Unknown or foreign tenants are unavailable.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - Held evidence, explicit shares and reviewed receipt completeness.
      does_not_prove:
      - Inventory valuation, accounting compliance or contribution margins.
    unknown_when:
    - The scope is unreviewed, stale, corrected or has unsupported tax basis.
    next_steps:
    - Prepare a cost decision with the returned event sequence and evidence fingerprint.
    examples:
      use:
      - scenario: Explain 1050 acquisition costs on a 100-unit receipt.
        reason: Goods, freight and reductions remain traceable.
      do_not_use:
      - scenario: Determine DB2 for an order.
        reason: This first slice does not implement consumption or selling costs.
  cost_change_propose:
    application_tool: cost.change
    purpose: Prepare acquisition or selling-cost decisions, bounded inventory reviews and explicitly confirmed whole-line DB1/DB2 reviews. For inventory_review and contribution_review, call cost_review_draft first and then cost_review_propose.
    use_when:
    - Assign received acquisition amounts, review their completeness, confirm bounded inventory scope or approve an exact whole-line commercial contribution.
    do_not_use_when:
    - Automatically choose company policies, post ledger entries, certify HGB book value or calculate unsupported tax/FX or company-wide margins.
    required_context:
    - tenant, authenticated active owner, event sequence, reason and operation-specific received evidence
      or review categories; inventory_review additionally requires explicit owner Party, unit/currency, empty-opening history, all economic issues and receipt cost/ownership evidence; inventory_batch_review confirms 2–10 distinct scopes with one cutoff, owner and currency, limited to 100 movements and 20 receipts in total; contribution_review requires an exact candidate hash, explicit commercial_v1/revenue completeness and shipment economic time; selling_assign requires received net evidence, confirmed selling expense, exact sold-line shares and recoverable/no-tax treatment; optional selling_categories reviews all seven categories for DB2
