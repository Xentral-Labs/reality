    empty_result: No configured destination or exact matching rule exists.
    refusal_behavior: Unknown or foreign tenants are unavailable.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - Defined internal references.
      does_not_prove:
      - Financial posting or available credit.
    unknown_when:
    - A concurrent configuration change invalidates the preview revision.
    next_steps:
