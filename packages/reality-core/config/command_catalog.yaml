  finance_opening_context:
    kind: read
    application_tool: finance.opening.context
    purpose: Read permitted opening account, active parties and current review revision.
    use_when:
    - Prepare an opening residual import from the previous system.
    do_not_use_when:
    - Infer historic balances or reconstruct missing due dates.
    required_context:
    - Tenant identity and optional party search.
    data_basis:
    - party
    - subledger_account
    - finance_state
    limitations:
    - Read-only context does not establish opening coverage.
    freshness: Current committed finance state.
    empty_result: Configure the neutral opening counterpart and customer/supplier parties
      first.
    refusal_behavior: Foreign tenant references are unavailable.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - Current account configuration and bounded active party choices.
      does_not_prove:
      - Correctness or completeness of an external snapshot.
    unknown_when:
    - A concurrent configuration change invalidates the preview revision.
    next_steps:
    - Prepare finance_opening_propose with stated residuals, stable item references
      and current revision.
    examples:
      use:
      - scenario: Find parties and accounts before carrying outstanding positions.
        reason: References must already exist in this tenant.
      do_not_use:
      - scenario: Determine historic turnover.
        reason: Opening positions represent only stated residual balances.
  finance_opening_propose:
    application_tool: finance.opening.import
    purpose: Prepare explicit customer/supplier opening residuals with stable source
      coverage.
    use_when:
    - Migrate outstanding debt or credit from an external system.
    do_not_use_when:
    - Record an actual payment or create new turnover.
    required_context:
    - "Tenant, source namespace, snapshot, cutover, coverage kind, reason and 1\u2013\
      100 stated rows with current revision."
    preconditions:
    - Active compatible accounts and parties, no overlapping coverage, explicit owner
      confirmation.
    confirmation: required
    idempotency:
      mode: supported
      guidance: Reuse the proposal ID after a lost response; changed input needs a new
        preview.
    refusals:
    - code: invalid_opening
      description: Duplicate or overlapping scope, stale revision, foreign reference,
        incompatible party or account, invalid amount/date.
    events:
    - document.recorded
    - ledger.posted
    verification_reads:
    - name: finance.opening.context
      proves: Current finance revision and account setup; inspect receipt document and
        ledger identities for balances.
    examples:
      use:
      - scenario: Carry a customer invoice with original total 1000 and stated residual
          600.
        reason: Only 600 becomes an open position; 1000 remains optional source evidence.
      do_not_use:
      - scenario: Import a summary and all its constituent invoices.
        reason: Overlapping coverage would duplicate balances and is refused.
    postcondition:
      kind: reference
      meaning: Confirmed receipt identifies each immutable opening source, evidence
        item and balanced posting group.
  finance_credits:
    kind: read
    application_tool: finance.credits.list
    purpose: Read available customer or supplier credit, that is payments and credit notes
      with an original, used and still available amount.
    use_when:
    - Answer who holds credit from overpayments or credit notes, and how much.
    - Find an original credit before allocating it to an invoice or recording a refund.
    do_not_use_when:
    - Read open receivables or payables; use finance_balances or the open items.
    - Decide that a credit belongs to a particular invoice.
    required_context:
    - tenant; side customer or supplier
    data_basis:
    - document
    - ledger_entry
    - settlement_allocation
    limitations:
    - A read records no allocation or refund; available amounts are read-time derivations.
    freshness: Current committed finance state.
    empty_result: No unused credit exists for the side; it does not mean nothing was paid.
    refusal_behavior: Unknown side or status is unavailable.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - Which original payments and credit notes still carry available credit and how much.
      does_not_prove:
      - Which invoice a credit should settle, or that a refund was sent.
    unknown_when:
    - A concurrent allocation changes the available amount between read and proposal.
    next_steps:
    - Read finance_settlement_context for the chosen credit, then prepare finance_settlement_propose.
    examples:
      use:
      - scenario: Which customers paid too much and how much is still available?
        reason: Available credit is derived from original payments and credit notes minus
          their active allocations, never from invoice balances.
      do_not_use:
      - scenario: Tell me the open receivables per customer.
        reason: Receivables are open items; credit is unused money or credit notes.
  finance_party_balances:
    kind: read
    application_tool: finance.party_balances.list
    purpose: Read where each customer or supplier stands, one row per party and currency,
      with open amount, of which overdue, available credit and the balance of the two.
    use_when:
    - Answer who owes the most, who is overdue, or who holds credit, per party rather than per document.
    - Read a party's position before a call, a delivery hold decision or a payment run.
    do_not_use_when:
    - Decide that a party's credit may be netted against an invoice; that is a confirmed settlement.
    - Judge creditworthiness or predict payment; a balance is a position, not a forecast.
    - Add amounts across currencies; rows are per currency and nothing is converted.
    required_context:
    - tenant; side customer or supplier
    data_basis:
    - document
    - ledger_entry
    - settlement_allocation
    - payment_term
    limitations:
    - Sums the open items register and the credit register at read time; it derives no new amount.
    - Overdue follows the aging register's due-date rule at the read's instant.
    freshness: Current committed finance state at the read's instant.
    empty_result: No party of that side has anything open or any credit; it does not mean nothing was ever invoiced.
    refusal_behavior: Unknown side or sort key is unavailable.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - The open, overdue and credit sums of each party's documents at the read's instant, and the documents behind them through the open items and credit reads.
      does_not_prove:
      - That a customer will pay, that a credit belongs to a particular invoice, or a party's total across currencies.
    unknown_when:
    - A payment or allocation is recorded between the read and a proposal built on it.
    next_steps:
    - Read the party's open items or finance_credits for the documents, then prepare finance_settlement_propose or a hold.
    examples:
      use:
      - scenario: Which customers hold credit, and how much per customer?
        reason: The balances read sums each party's available credit; the credit read lists it per document.
      - scenario: Which suppliers do we owe, and how much of it is overdue?
        reason: The supplier side sums open payables and the overdue share per supplier from the aging register.
      do_not_use:
      - scenario: Net Müller's credit against their oldest invoice.
        reason: Using credit is a confirmed settlement through finance_settlement_propose, not a read.
      - scenario: What is the group total across EUR and USD?
        reason: Rows are per currency and Reality never converts.
  finance_payments:
    kind: read
    application_tool: finance.payments.list
    purpose: Read recorded incoming and outgoing payments with their allocated and unallocated
      amounts, optionally only those with money left to allocate.
    use_when:
    - Answer which payments are not, or not fully, allocated to an invoice.
    - Find a payment by number or party before reading its settlement context.
    do_not_use_when:
    - Record or allocate a payment; that is finance_settlement_propose.
    - Read invoice open amounts; use the open items or finance_balances.
    required_context:
    - tenant; optional direction incoming or outgoing
    data_basis:
    - document
    - ledger_entry
    - settlement_allocation
    limitations:
    - Allocated and unallocated amounts are read-time derivations; reversed payments are marked.
    freshness: Current committed finance state.
    empty_result: No payment matches the filter; it does not mean money never arrived.
    refusal_behavior: Unknown direction is unavailable.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - Which recorded payments carry an unallocated remainder and how much.
      does_not_prove:
      - Why a payment is unallocated or which invoice it belongs to.
    unknown_when:
    - A concurrent allocation changes the unallocated amount between read and proposal.
    next_steps:
    - Read finance_settlement_context for a payment with candidates, then prepare finance_settlement_propose.
    examples:
      use:
      - scenario: Show payments from the bank that nobody could match yet.
        reason: Unallocated remainders are the payments a person still has to decide on.
      do_not_use:
      - scenario: Allocate this payment to invoice 4711.
        reason: Allocation is a proposal through finance_settlement_propose.
  finance_settlement_context:
    kind: read
    application_tool: finance.settlement.context
    purpose: Read invoice/payment-credit context and matching invoice choices; for an
      unallocated customer payment each choice carries the reasons it is a candidate.
    use_when:
    - Prepare actual payment, credit allocation or refund.
    do_not_use_when:
    - Determine tax or calculate a discount.
    required_context:
    - tenant and original document ID
    data_basis:
    - document
    - ledger_entry
    - settlement_allocation
    - subledger_account
    - finance_state
    limitations:
    - A read records no cash, allocation or reduction.
    freshness: Current committed finance state.
    empty_result: An original invoice or available-credit document identity is required.
    refusal_behavior: Unknown, foreign, unsupported or reversed credit origins are unavailable.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - Current selected invoice claim or original credit availability and matching
        invoice choices, with read-time candidate reasons for unallocated payments.
      does_not_prove:
      - Bank execution, unrecorded cash, that a candidate is the right invoice, or
        authorization to accept a reduction.
    unknown_when:
    - A concurrent configuration change invalidates the preview revision.
    next_steps:
    - Prepare finance_settlement_propose using stated amounts and the current revision.
    examples:
      use:
      - scenario: Find an original overpayment and matching invoices.
        reason: Credit remains on its original payment and is consumed through explicit
          allocations.
      do_not_use:
      - scenario: Send a bank refund.
        reason: These tools record actual money only.
  finance_settlement_propose:
    application_tool: finance.settlement.apply
    purpose: Prepare actual payment with explicit allocation/reduction, or consume existing
      credit.
    use_when:
    - Record actual money or allocate an existing available credit.
    do_not_use_when:
    - Initiate a bank transfer or infer a discount.
    required_context:
    - tenant, original document, mode, stated amounts and current revision; reference
      and effective time for actual cash
    preconditions:
    - Active compatible accounts, available claim/credit, current revision and explicit
      owner confirmation.
    confirmation: required
    idempotency:
      mode: supported
      guidance: Reuse the proposal ID after a lost response; changed input needs a new
        preview.
    refusals:
    - code: invalid_settlement
      description: Stale revision, duplicate source effect, invalid or excessive amount,
        incompatible account/party/currency or missing supplier agreement.
    events:
    - document.recorded
    - ledger.posted
    - settlement.allocated
    verification_reads:
    - name: finance.settlement.context
      proves: Current remaining invoice claim or available credit.
    examples:
      use:
      - scenario: Record 980 paid, allocate 980 and explicitly accept a stated 20 discount
          against 1000 open.
        reason: Cash, invoice allocation and accepted reduction remain separate evidence.
      do_not_use:
      - scenario: Record another payment when an existing overpayment is available.
        reason: Allocate the existing credit without creating new cash.
    postcondition:
      kind: reference
      meaning: The confirmed receipt links recorded cash, reduction and allocation evidence.
  finance_adjustment_context:
    kind: read
    application_tool: finance.adjustment.context
    purpose: Read the remaining claim and reduction account configuration.
    use_when:
    - Prepare a separately accepted settlement reduction.
    do_not_use_when:
    - Determine tax or calculate a discount.
    required_context:
    - tenant and invoice ID
    data_basis:
    - document
    - ledger_entry
    - settlement_allocation
    - subledger_account
    - finance_state
    limitations:
    - Read-time context does not accept a reduction.
    freshness: Current committed finance state.
    empty_result: An invoice identity is required.
    refusal_behavior: Unknown or foreign invoices are unavailable.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - The current permitted accounts and defaults.
      does_not_prove:
      - Financial posting or available credit.
    unknown_when:
    - A concurrent configuration change invalidates the preview revision.
    next_steps:
    - Prepare finance_adjustment_propose with the stated amount and current revision.
    examples:
      use:
      - scenario: Find the receivable default.
        reason: Configuration owns the destination.
      do_not_use:
      - scenario: Determine customer debt.
        reason: Use open items.
  finance_adjustment_propose:
    application_tool: finance.adjustment.accept
    purpose: Prepare an explicit noncash customer or supplier settlement reduction.
    use_when:
    - Accept a stated agreed reduction of an open invoice.
    do_not_use_when:
    - Record actual cash or calculate a discount or tax.
    required_context:
    - tenant, invoice ID, stated amount, reason, revision and supplier agreement where
      applicable
    preconditions:
    - Active compatible accounts, remaining claim and explicit owner confirmation.
    confirmation: required
    idempotency:
      mode: supported
      guidance: Reuse the proposal ID after a lost response; changed input needs a new
        preview.
    refusals:
    - code: invalid_reduction
      description: Missing agreement, stale preview, duplicate evidence, unsupported
        account or amount.
    events:
    - document.recorded
    - ledger.posted
    - settlement.allocated
    verification_reads:
    - name: finance.adjustment.context
      proves: Remaining invoice claim.
    examples:
      use:
      - scenario: Accept a stated discount of 20 after payment of 980.
        reason: Noncash reduction remains separate from actual money.
      do_not_use:
      - scenario: The customer pays less without agreement.
        reason: Keep the remaining claim open.
    postcondition:
      kind: reference
      meaning: The immutable adjustment evidence, balanced postings and allocation exist.
  finance_components:
    kind: read
    application_tool: finance.components.context
    purpose: Read received component values and internal attribution history.
    use_when:
    - Inspect received detail separately from explicit internal attribution.
    do_not_use_when:
    - Prove balances or external posting.
    required_context:
    - tenant and document identity
    data_basis:
    - document
    - document_line
    - source_record
    - financial_component
    - component_assignment_revision
    - component_assignment_part
    limitations:
    - Configuration is not money or external accounting.
    freshness: Current committed reference configuration and immutable decisions.
    empty_result: No component or assignment history exists.
    refusal_behavior: Unknown or foreign tenants are unavailable.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - Received component amounts and explicit assignment revisions.
      does_not_prove:
      - Financial posting or available credit.
    unknown_when:
    - A concurrent configuration change invalidates the preview revision.
    next_steps:
    - Prepare explicit shares against an available received basis.
    examples:
      use:
      - scenario: Inspect the unassigned remainder of a purchase invoice line.
        reason: The shared service compares explicit shares with the received basis.
      do_not_use:
      - scenario: Determine customer debt.
        reason: Use open items.
  finance_component_history:
    kind: read
    application_tool: finance.component.history
    purpose: Read received component values and internal attribution history.
    use_when:
    - Inspect received detail separately from explicit internal attribution.
    do_not_use_when:
    - Prove balances or external posting.
    required_context:
    - tenant and component identity
    data_basis:
    - document
    - document_line
    - source_record
    - financial_component
    - component_assignment_revision
    - component_assignment_part
    limitations:
    - Configuration is not money or external accounting.
    freshness: Current committed reference configuration and immutable decisions.
    empty_result: No component or assignment history exists.
    refusal_behavior: Unknown or foreign tenants are unavailable.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - Received component amounts and explicit assignment revisions.
      does_not_prove:
      - Financial posting or available credit.
    unknown_when:
    - A concurrent configuration change invalidates the preview revision.
    next_steps:
    - Prepare explicit shares against an available received basis.
    examples:
      use:
      - scenario: Inspect the unassigned remainder of a purchase invoice line.
        reason: The shared service compares explicit shares with the received basis.
      do_not_use:
      - scenario: Determine customer debt.
        reason: Use open items.
  cost_query_get:
    kind: read
    application_tool: cost.query.get
    purpose: Read one admitted inventory or contribution scope with constrained cutoffs, exact basis identity and independent freshness.
    use_when:
    - Explain the exact retained basis of an inventory or DB1/DB2 answer.
    do_not_use_when:
    - Group multiple independently reviewed scopes or activate valuation policies.
    required_context:
    - Tenant, inventory/contribution kind and scope ID; optional exact review, UTC cutoffs and policy constraints.
    data_basis: [cost_component_basis, cost_attribution_revision, cost_input_manifest, cost_inventory_review, cost_contribution_review, financial_component, action]
    limitations:
    - Ready freshness does not establish DB2 or carrying-value evidence completeness.
    - Only exact retained cutoffs are supported; no generalized historical reconstruction or published generation.
    freshness: Ready, stale, uninitialized or historical; stale current answers expose only basis_result.
    empty_result: An unreviewed scope has no resolved context; absent or foreign scopes are not found.
    refusal_behavior: Unsupported cutoffs/policy constraints and invalid scope refuse; current reads require READ COMMITTED.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - Requested versus resolved cutoffs, scoped retained basis identity and delegated arithmetic.
      does_not_prove:
      - Company-wide profile approval, generation readiness or HGB carrying value.
    unknown_when:
    - The admitted scope has no review or required evidence is missing.
    next_steps:
    - Inspect returned review references with cost.record.get; use confirmed workflows to renew stale basis.
    examples:
      use:
      - scenario: Request an exact historical contribution review with its actual knowledge cutoff.
        reason: The shared service preserves historical inputs and exposes the resolved valuation basis.
      do_not_use:
      - scenario: Treat a historical contribution review as approval of current numbers.
        reason: A retained record is not a current completeness assessment.
  cost_record_get:
    kind: read
    application_tool: cost.record.get
    purpose: Inspect one retained cost record with exact values, source links and paged membership through the same reader as the web Inspector and CLI.
    use_when:
    - Follow an opaque cost, policy, inventory or contribution review reference to its retained evidence.
    do_not_use_when:
    - Calculate a current cost or margin, change a policy, or request an arbitrary database table.
    required_context:
    - Tenant, allowlisted record kind and opaque record ID; optional member page and presentation language.
    data_basis: [cost_component_basis, cost_attribution_revision, cost_input_manifest, cost_inventory_review, cost_contribution_review, financial_component, action]
    limitations:
    - Retained record inspection does not establish current completeness; actions exclude proposal input/output.
    - Owned membership is paged at 25 rows; Dutch and Spanish labels fall back to English.
    freshness: Exact retained fields and memberships; bridge decision status is recorded state, not current valuation approval.
    empty_result: A record may have no owned members; absent or foreign records are not found.
    refusal_behavior: Unknown kind, foreign or missing identity, invalid page or incompatible language refuses.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - Exact retained record fields, shortest supported reference links and member counts.
      does_not_prove:
      - Current cost completeness, legal suitability or recomputed contribution.
    unknown_when:
    - Current valuation or coverage has not been queried through its own shared service.
    next_steps:
    - Follow the returned links and member pages; use cost.contribution.get or cost.inventory.get for calculated values.
    examples:
      use:
      - scenario: Follow a DB2 selling membership to its allocation revision and received supplier component.
        reason: The same read preserves original amounts and source identity across Inspector, CLI and MCP.
      do_not_use:
      - scenario: Treat a historical contribution review as approval of current numbers.
        reason: A retained record is not a current completeness assessment.
  cost_commercial_match_get:
    kind: read
    application_tool: cost.commercial-match.get
    purpose: Read a confirmed partial commercial match and derive DB1 from its retained revenue and frozen cost references.
    use_when:
    - Explain split billing, partial fulfilment, direct service input or an exact historical credit/return match.
    do_not_use_when:
    - Infer a match, allocate a partial direct component, or request company-wide contribution reporting.
    required_context:
    - Tenant and sold document-line ID; optional exact commercial match revision ID.
    data_basis: [cost_commercial_match_revision, cost_commercial_inventory_part, cost_commercial_direct_part, cost_inventory_member, cost_inventory_review, cost_attribution_revision, cost_component_basis, financial_component]
    limitations:
    - Only explicitly confirmed portions are read; direct evidence must be one complete retained attribution.
    - DB2 and unsupported production/WIP inference remain unavailable.
    freshness: The current read selects the latest revision; an explicit revision ID reproduces its immutable history.
    empty_result: An unreviewed line has unknown DB1 and names commercial_match_not_reviewed.
    refusal_behavior: Foreign scope is not found; corrupt hashes, incompatible units/currency or broken frozen references refuse.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - Exact confirmed commercial portions and their derived inventory or complete direct cost observation.
      does_not_prove:
      - Legal recognition suitability, DB2 completeness, FX conversion or inferred production cost.
    unknown_when:
    - The latest disposition is unresolved or referenced cost evidence is unknown.
    next_steps:
    - Inspect retained match and cost records; confirm a new commercial_match_review to rematch.
    examples:
      use:
      - scenario: Reproduce one half of a split invoice against 30 of 60 frozen issued units.
        reason: The read retains the exact portion while deriving amount and DB1 without stored allocation authority.
      do_not_use:
      - scenario: Allocate half of a supplier component by entering a percentage.
        reason: Partial direct-component allocation remains unsupported.
  cost_contribution_get:
    kind: read
    application_tool: cost.contribution.get
    purpose: Read confirmed DB1 and independently reviewed DB2 for one full invoice line and shipment from retained inputs.
    use_when:
    - Explain a confirmed single-line DB1 or reproduce a specific historical contribution review.
    do_not_use_when:
    - Request partial revenue matching, rematching, HGB value or company-wide reports.
    required_context:
    - Tenant and invoice document-line ID; optional exact contribution review ID.
    data_basis: [cost_revenue_match_basis, cost_contribution_review, cost_inventory_member, cost_inventory_review, cost_selling_attribution_part, cost_selling_review_category, cost_selling_review_member, cost_attribution_revision, cost_component_basis, financial_component]
    limitations:
    - Whole positive-quantity invoice/shipment bindings only; no silent reuse or rematching.
    - Profile approval is scoped to this review; DB2 needs the seven-category selling review and exact received net expense shares. Global reporting remains unavailable.
    freshness: Current completeness becomes stale after any later tenant event; explicit review IDs reproduce retained history.
    empty_result: An unreviewed line has unknown DB1 and DB2.
    refusal_behavior: Foreign scope is not found; corrupt retained inputs or incompatible membership refuse.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - Confirmed commercial_v1 revenue completeness and exact reviewed consumption for this full-line scope.
      does_not_prove:
      - Legal recognition suitability, whole-company completeness, unsupported tax/FX or unreviewed changes.
    unknown_when:
    - The line is unreviewed or stale; DB2 remains unknown without complete selling-category decisions, independently of DB1.
    next_steps:
    - Obtain a current contribution preview and confirm contribution_review through cost_change_propose for supported scope.
    examples:
      use:
      - scenario: Reproduce DB1 570 and rate 47.5 percent from the original confirmed review after late freight changes the current basis.
        reason: The read pins both retained revenue context and exact inventory membership.
      do_not_use:
      - scenario: Sum current and historical review versions as separate sales.
        reason: They are revisions of the same whole-line binding, not disjoint contributions.
  cost_contribution_preview:
    kind: read
    application_tool: cost.contribution.preview
    purpose: Preview a current exact revenue and consumption candidate with known DB1 and explicit missing review basis.
    use_when:
    - Explain a single fully billed and shipped item line with current reviewed inventory costs.
    do_not_use_when:
    - Request final DB1/DB2, historical margin, partial billing, returns or company-wide reports.
    required_context:
    - Tenant and opaque sales invoice document-line ID.
    data_basis: [document, document_line, commitment, movement, cost_inventory_review, cost_inventory_member]
    limitations:
    - Only one whole invoice line, one order line, one customer-delivery commitment and one shipment are supported.
    - No confirmed commercial match, profile revision or selling-cost review exists in this preview.
    freshness: Current read only; requires a current inventory review and unchanged tenant event cursor during the read.
    empty_result: Missing or ambiguous evidence returns explicit gaps and no known margin.
    refusal_behavior: Foreign identities are not found; concurrent changes or unsupported transaction isolation refuse.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - A bounded current candidate follows exact existing relationships and received net revenue without prorating.
      does_not_prove:
      - Confirmed revenue recognition, completeness of sales costs, final margin or historical context.
    unknown_when:
    - Revenue, exact fulfilment or reviewed consumption is unavailable, ambiguous or stale.
    next_steps:
    - Inspect the returned missing basis and receipt evidence; use cost_change_propose contribution_review for supported whole-line scope.
    examples:
      use:
      - scenario: Explain known DB1 of 570 from received net revenue 1200 and reviewed consumption 630.
        reason: The service follows exact billing and fulfilment references while exposing missing reviews.
      do_not_use:
      - scenario: Publish this preview as final DB2.
        reason: Selling costs and commercial completeness remain unreviewed.
  cost_inventory_get:
    kind: read
    application_tool: cost.inventory.get
    purpose: Read stock acquisition value and economic consumption at an explicitly confirmed bounded cutoff.
    use_when:
    - Explain a confirmed inventory review and its original receipt costs.
    do_not_use_when:
    - Request HGB carrying value, DB margins or unreviewed live whole-company inventory.
    required_context:
    - Tenant and opaque item ID; optional exact inventory review ID for frozen history.
    data_basis:
    - cost_policy_revision
    - cost_movement_basis
    - cost_ownership_revision
    - cost_inventory_review
    - cost_inventory_member
    - cost_input_manifest
    limitations:
    - At most 100 movements and 20 receipts in one explicitly confirmed FIFO or specific-identification item, currency, unit and economic-owner scope.
    - Returns, adjustments, opening layers, corrected pools and mixed ownership require later integration.
    freshness: Latest confirmed cutoff becomes stale after any later tenant event; explicit review IDs retain their exact basis.
    empty_result: A scope without a review has unknown acquisition value.
    refusal_behavior: Foreign item/review identities are unavailable; unsupported or corrupt input membership refuses.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - Acquisition value and consumption from exact confirmed policy, ownership and retained input membership.
      does_not_prove:
      - HGB carrying value, margin, current unreviewed stock or policy suitability for other scopes.
    unknown_when:
    - The scope is unreviewed or later evidence invalidates its current completeness.
    next_steps:
    - Prepare an owner-confirmed inventory_review through cost_change_propose when the scope is supported.
    examples:
      use:
      - scenario: Explain 420 remaining acquisition value and 630 consumed cost from a receipt of 1050.
        reason: The confirmed input set retains policy, ownership and original receipt evidence.
      do_not_use:
      - scenario: Determine a company's final HGB inventory book value.
        reason: Separate valuation assessments and whole-company qualification are not implemented by this tool.
  cost_receipt_get:
    kind: read
    application_tool: cost.receipt.get
    purpose: Read receipt acquisition costs, category coverage and exact retained review history.
    use_when:
    - Explain receipt costs before or after explicit review.
    do_not_use_when:
    - Determine inventory book value or contribution margin.
    required_context:
    - tenant and an opaque receipt/document ID; optional retained manifest for receipt reads
    data_basis:
    - movement
    - document
    - document_line
    - source_record
    - financial_component
    - cost_attribution_revision
    - cost_scope_review
    - cost_input_manifest
    limitations:
    - At most 100 cost components per receipt; no currency or unit conversion.
    - Receipt cost is not yet inventory valuation or DB1/DB2.
    freshness: Current committed evidence or exact retained manifest; unrelated input events conservatively
      invalidate the current review.
    empty_result: An unadmitted receipt has unknown cost.
    refusal_behavior: Unknown or foreign tenants are unavailable.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - Held evidence, explicit shares and reviewed receipt completeness.
      does_not_prove:
      - Inventory valuation, accounting compliance or contribution margins.
    unknown_when:
    - The scope is unreviewed, stale, corrected or has unsupported tax basis.
    next_steps:
    - Prepare a cost decision with the returned event sequence and evidence fingerprint.
    examples:
      use:
      - scenario: Explain 1050 acquisition costs on a 100-unit receipt.
        reason: Goods, freight and reductions remain traceable.
      do_not_use:
      - scenario: Determine DB2 for an order.
        reason: This first slice does not implement consumption or selling costs.
  cost_evidence_get:
    kind: read
    application_tool: cost.evidence.get
    purpose: Read stated supplier invoice or credit amounts and their evidence fingerprint without writing.
    use_when:
    - Explain receipt costs before or after explicit review.
    do_not_use_when:
    - Determine inventory book value or contribution margin.
    required_context:
    - tenant and an opaque receipt/document ID; optional retained manifest for receipt reads
    data_basis:
    - movement
    - document
    - document_line
    - source_record
    - financial_component
    - cost_attribution_revision
    - cost_scope_review
    - cost_input_manifest
    limitations:
    - At most 100 cost components per receipt; no currency or unit conversion.
    - Receipt cost is not yet inventory valuation or DB1/DB2.
    freshness: Current committed evidence or exact retained manifest; unrelated input events conservatively
