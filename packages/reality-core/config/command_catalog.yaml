    - source_system
    - finance_reference
    - finance_state
    - source_classification_mapping_revision
    writes:
    - source_classification_mapping_revision
    - finance_state
    - business_event
    effect: Resolve explicit source codes with reviewed immutable classification revisions;
      never change received evidence or postings.
  - name: Read received financial detail
    service: component_context
    mode: read
    adapters:
    - CLI
    - Web
    - MCP
    - Chat
    reads:
    - document
    - document_line
    - source_record
    - financial_component
    - component_assignment_revision
    - component_assignment_part
    - finance_reference
    - finance_state
    writes: []
    effect: Separate received values from owner-confirmed internal classification and
      exact cost-center shares; preserve postings.
  - name: Read component assignment history
    service: component_history
    mode: read
    adapters:
    - CLI
    - Web
    - MCP
    - Chat
    reads:
    - document
    - document_line
    - source_record
    - financial_component
    - component_assignment_revision
    - component_assignment_part
    - finance_reference
    - finance_state
    writes: []
    effect: Separate received values from owner-confirmed internal classification and
      exact cost-center shares; preserve postings.
  - name: Assign received financial component
    service: assign_component
    mode: mutation
    adapters:
    - CLI
    - Web
    - MCP
    - Chat
    reads:
    - document
    - document_line
    - source_record
    - financial_component
    - component_assignment_revision
    - component_assignment_part
    - finance_reference
    - finance_state
    writes:
    - financial_component
    - component_assignment_revision
    - component_assignment_part
    - finance_state
    - business_event
    effect: Separate received values from owner-confirmed internal classification and
      exact cost-center shares; preserve postings.
  - name: Read finance references
    service: list_references
    mode: read
    adapters:
    - CLI
    - Web
    - MCP
    - Chat
    reads:
    - tenant
    - finance_reference
    - finance_state
    - business_event
    writes: []
    effect: Read or maintain defined internal references with immutable reasoned decisions
      and owner confirmation for changes.
  - name: Read reference history
    service: reference_history
    mode: read
    adapters:
    - CLI
    - Web
    - MCP
    - Chat
    reads:
    - tenant
    - finance_reference
    - finance_state
    - business_event
    writes: []
    effect: Read or maintain defined internal references with immutable reasoned decisions
      and owner confirmation for changes.
  - name: Maintain finance reference
    service: maintain_reference
    mode: mutation
    adapters:
    - CLI
    - Web
    - MCP
    - Chat
    reads:
    - tenant
    - finance_reference
    - finance_state
    - business_event
    writes:
    - finance_reference
    - finance_state
    - business_event
    effect: Read or maintain defined internal references with immutable reasoned decisions
      and owner confirmation for changes.
  - name: Initialize operational accounts
    service: initialize_accounts
    mode: mutation
    adapters: [CLI, Web, MCP, Chat]
    reads: [tenant, subledger_account, finance_role_destination, finance_state]
    writes: [subledger_account, finance_role_destination, finance_state, business_event]
    effect: Uses shared tenant-scoped operational account configuration with explicit owner confirmation for changes.
  - name: Create operational account
    service: create_account
    mode: mutation
    adapters: [CLI, Web, MCP, Chat]
    reads: [tenant, subledger_account, finance_role_destination, finance_state]
    writes: [subledger_account, finance_role_destination, finance_state, business_event]
    effect: Uses shared tenant-scoped operational account configuration with explicit owner confirmation for changes.
  - name: Update operational account
    service: update_account
    mode: mutation
    adapters: [CLI, Web, MCP, Chat]
    reads: [tenant, subledger_account, finance_role_destination, finance_state]
    writes: [subledger_account, finance_role_destination, finance_state, business_event]
    effect: Uses shared tenant-scoped operational account configuration with explicit owner confirmation for changes.
  - name: Set operational account default
    service: set_default_account
    mode: mutation
    adapters: [CLI, Web, MCP, Chat]
    reads: [tenant, subledger_account, finance_role_destination, finance_state]
    writes: [subledger_account, finance_role_destination, finance_state, business_event]
    effect: Uses shared tenant-scoped operational account configuration with explicit owner confirmation for changes.
  - name: Read operational transaction matrix
    service: transaction_matrix
    mode: read
    adapters: [CLI, Web, MCP, Chat]
    reads: [tenant, subledger_account, finance_role_destination, finance_state]
    writes: []
    effect: Describes configured defaults and fixed operation roles; no posting or authorization.
  - name: Read operational accounts
    service: list_accounts
    mode: read
    adapters: [CLI, Web, MCP, Chat]
    reads: [tenant, subledger_account, finance_role_destination, finance_state]
    writes: []
    effect: Uses shared tenant-scoped operational account configuration with explicit owner confirmation for changes.
  - name: Observe fact
    service: observe_fact
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [tenant, source_record, commitment]
    writes: [fact, business_event]
    effect: Appends one idempotent source-supported observation about an existing tenant-scoped subject after confirmation without copying typed operational state.
  - name: Create manual sales or purchase order
    service: create_manual_order
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [tenant, party, item, location, payment_term]
    writes: [source_stream, source_record, document, document_line, commitment, business_event]
    effect: Atomically records lossless manual Source evidence, typed order Evidence, and the derived outgoing or incoming Commitments without storing operational status on the Document.
  - name: Install mock connector shell
    service: install_connector_shell
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [tenant, source_system]
    writes: [source_system, source_capability]
    effect: Creates one named source instance with only explicitly selected source and target type declarations, without credentials, synchronization, or vendor API calls.
  - name: Define source system
    service: create_source_system
    related_services: [set_source_system_active]
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [tenant, source_system]
    writes: [source_system]
    effect: Defines one tenant-specific external origin without pretending that a connector or credentials already exist.
  - name: Define source capability
    service: create_source_capability
    related_services: [set_source_capability_active]
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [tenant, source_system, source_capability]
    writes: [source_capability]
    effect: Declares which upstream type a source may provide and the operational target it is intended to produce.
  - name: Ingest arbitrary source
    service: enqueue_source
    related_services: [process_import_job, retry_import_job]
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [tenant, source_stream, source_record, import_job]
    writes: [source_stream, source_record, import_job, business_event]
    effect: Stores any JSON object losslessly and idempotently, then queues a registered interpreter or marks the job unmapped.
  - name: Correct manual document evidence
    service: correct_manual_document
    related_services: [manual_document_line_snapshot, correct_manual_document_lines]
    mode: mutation
    adapters: [Web, API, MCP, Chat]
    reads: [tenant, document, document_line, commitment, ledger_entry, party, item, payment_term]
    writes: [document, document_line, business_event]
    effect: Corrects typed internal header or complete line evidence snapshots while protecting economic fields after Reality records have been derived.
  - name: Record corrected document source
    service: record_corrected_document_source
    mode: mutation
    adapters: [Web, API, MCP, Chat]
    reads: [tenant, document, source_record, import_job]
    writes: [source_stream, source_record, import_job, business_event]
    effect: Appends a lossless immutable version to the original source stream and queues normal interpretation.
  - name: Create party
    service: create_party
    related_services: [create_parties]
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [tenant, source_record, party]
    writes: [source_record, party, party_role]
    effect: Creates a tenant-scoped party, optional immutable source evidence, and its operational roles.
  - name: Update party
    service: update_party
    related_services: [update_parties]
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [party, party_role, source_record]
    writes: [source_record, party, party_role, business_event]
    effect: Changes operational party fields and roles; changed external identity creates new source evidence and every effective change emits an exact before/after audit diff.
  - name: Create item
    service: create_item
    related_services: [create_items]
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [tenant, location]
    writes: [source_record, item]
    effect: Creates an operational item identity with inventory and purchasing behavior.
  - name: Update item
    service: update_item
    related_services: [update_items]
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [item, location, source_record]
    writes: [source_record, item, business_event]
    effect: Updates operational item fields while preserving external evidence versions and emitting an exact before/after audit diff.
  - name: Create location
    service: create_location
    related_services: [create_locations]
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [tenant, location]
    writes: [source_record, location]
    effect: Creates a stock-capable or logical location and validates its parent.
  - name: Update location
    service: update_location
    related_services: [update_locations]
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [location, source_record]
    writes: [source_record, location, business_event]
    effect: Updates location behavior, rejects hierarchy cycles, and emits an exact before/after audit diff.
  - name: Create handling unit
    service: create_handling_unit
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [tenant, source_record, handling_unit]
    writes: [handling_unit, business_event]
    effect: Records an optional tenant-scoped pallet identity with an optional NVE/SSCC and immutable source evidence.
  - name: Create lot
    service: create_lot
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [tenant, item, source_record, lot]
    writes: [lot, business_event]
    effect: Creates a tenant-scoped batch identity for a lot- or serial-tracked item without storing a stock balance.
  - name: State lot expiry
    service: state_lot_expiry
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [lot]
    writes: [lot, business_event]
    effect: Records the best-before date somebody read off the goods; refuses a different date, because a received value is not adjusted.
  - name: Correct lot expiry
    service: correct_lot_expiry
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [lot]
    writes: [lot, business_event]
    effect: Records that a stated best-before was read wrong and what it says instead, against a confirmed current value and a stated reason.
  - name: Read expired lots
    service: expired_lots
    mode: query
    adapters: [Web, API, MCP, Chat]
    reads: [lot]
    writes: []
    effect: Lists lots whose stated best-before has passed, oldest first; a lot with no stated date is absent in both directions.
  - name: Create serial unit
    service: create_serial_unit
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [tenant, item, lot, source_record, serial_unit]
    writes: [serial_unit, business_event]
    effect: Creates the identity of one serialized unit, optionally linked to its lot, without storing its location or status.
  - name: Change master-data lifecycle
    service: set_master_data_active
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [party, item, location, payment_term]
    writes: [party, item, location, payment_term]
    effect: Activates or deactivates master data without deleting historical relationships.
  - name: Create payment term
    service: create_payment_term
    related_services: [update_payment_term]
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [tenant, payment_term]
    writes: [source_record, payment_term]
    effect: Creates a reusable payment condition identified by an opaque ID.
  - name: Create price list
    service: create_price_list
    related_services: [update_price_list]
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [tenant, price_list]
    writes: [source_record, price_list]
    effect: Creates a sales or purchase list and enforces one active default per direction and currency.
  - name: Add price tier
    service: create_price_list_entry
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [price_list, item]
    writes: [price_list_entry]
    effect: Adds an item price selected from an inclusive minimum quantity.
  - name: Assign party price list
    service: assign_party_price_list
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [party, price_list]
    writes: [party_price_list]
    effect: Gives a customer or supplier a directly prioritized price list.
  - name: Create and assign pricing group
    service: create_party_group
    related_services: [update_party_group, add_party_group_member, assign_group_price_list]
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [party, price_list, party_group]
    writes: [party_group, party_group_member, party_group_price_list]
    effect: Builds reusable customer or supplier group pricing without copying prices onto parties.
  - name: Reserve stock
    service: reserve
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    confirmation: required for Chat
    reads: [commitment, movement, reservation, item, location, handling_unit, lot, serial_unit]
    writes: [reservation]
    effect: Allocates available stock to one commitment, optionally by pallet, lot, or exact serial unit, and reports any shortage.
  - name: Release reservation
    service: release_reservation
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [reservation, commitment]
    writes: [reservation, business_event]
    effect: Gives reserved stock back to whatever needs it next, without touching the promise that held it.
  - name: Record movement
    service: record_movement
    mode: mutation
    adapters: [CLI, Web, API, scenario, MCP, Chat]
    reads: [item, location, commitment, handling_unit, lot, serial_unit]
    writes: [movement, reservation, commitment, action, business_event]
    effect: Records an immutable physical event with the same optional pallet, lot, and serial identity used by reservations.
  - name: Correct movement
    service: correct_movement
    related_services: [movement_correction_snapshot, preview_movement_correction]
    mode: mutation
    adapters: [CLI, Web, API, Chat, MCP]
    confirmation: required
    reads: [movement, movement_correction, item, location, commitment, handling_unit, lot, serial_unit, source_record]
    writes: [movement, movement_correction, commitment, business_event]
    effect: Preserves an immutable original, appends one exact correction and optional replacement, and derives the auditable net physical effect.
  - name: Reverse ledger posting group
    service: reverse_ledger_posting_group
    related_services: [ledger_reversal_snapshot, preview_ledger_reversal]
    mode: mutation
    adapters: [CLI, Web, API, Chat, MCP]
    confirmation: required
    reads: [ledger_entry, ledger_reversal, settlement_allocation, document, source_record]
    writes: [ledger_entry, ledger_reversal, business_event]
    effect: Preserves one complete immutable posting group, appends its exact inverse, and derives corrected settlement and financial views.
  - name: Revise commitment
    service: revise_commitment
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [tenant, commitment, source_record]
    writes: [commitment_revision, business_event]
    effect: Records that a counterparty now states a different date, a different quantity, or both for a promise, without erasing what it replaces.
  - name: Hold commitment
    service: hold_commitment
    related_services: [release_commitment_hold]
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [commitment, commitment_hold]
    writes: [commitment_hold]
    effect: Prevents execution without changing or deleting the underlying obligation.
  - name: Hold document commitments
    service: hold_document_commitments
    related_services: [release_document_holds]
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [document, commitment, commitment_hold]
    writes: [commitment_hold]
    effect: Places individual holds on the open commitments evidenced by a document.
  - name: Set party delivery hold
    service: hold_party_delivery
    related_services: [release_party_delivery_hold]
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    reads: [party, party_hold]
    writes: [party_hold]
    effect: Blocks customer shipment execution while orders and reservations remain possible.
  - name: Post customer payment
    service: post_customer_payment
    mode: mutation
    adapters: [CLI, Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation]
    writes: [source_record, document, ledger_entry, settlement_allocation]
    effect: Records payment evidence, posts balanced ledger entries, and allocates the payment to an invoice.
  - name: Announce customer return
    service: announce_customer_return
    related_services: [announceable_quantity, returnable_quantity]
    mode: mutation
    adapters: [Web, API, MCP, Chat]
    reads: [commitment, movement, return_announcement]
    writes: [return_announcement, business_event]
    effect: Records that a customer says goods are coming back, bounded by what the delivery can still return.
  - name: Withdraw return announcement
    service: withdraw_return_announcement
    mode: mutation
    adapters: [Web, API, MCP, Chat]
    reads: [return_announcement]
    writes: [return_announcement, business_event]
    effect: Records that the customer is not sending the goods back after all, keeping what they announced.
  - name: Read announced returns
    service: return_announcements
    related_services: [announcement_outstanding, arrived_against_announcement]
    mode: query
    adapters: [Web, API, MCP, Chat]
    reads: [commitment, movement, return_announcement]
    writes: []
    effect: Lists the returns customers have announced, in the order they said so, with what is still expected.
  - name: Preview payment run
    service: preview_payment_run
    related_services: [payable_supplier_invoices, duplicate_supplier_invoices]
    mode: query
    adapters: [Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation, party, payment_term]
    writes: []
    effect: Shows which supplier invoices are worth paying now, what each supplier is owed, and what was withheld, without paying anything.
  - name: Execute payment run
    service: execute_payment_run
    related_services: [post_supplier_payment, record_supplier_payment]
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation, party, payment_term]
    writes: [source_record, document, ledger_entry, settlement_allocation, business_event]
    effect: Pays the supplier invoices and amounts somebody confirmed, in one transaction, and records that they were one decision.
  - name: Preview stale promise closure
    service: preview_stale_promise_closure
    mode: query
    adapters: [Web, MCP, Chat]
    reads: [commitment, movement, reservation, commitment_hold, party_hold]
    writes: []
    effect: Shows how many stale promises match, what would be released, and a bounded sample, without changing anything.
  - name: Close stale promises
    service: close_stale_promises
    related_services: [cancel_commitment]
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [commitment, movement, reservation, commitment_hold, party_hold]
    writes: [commitment, reservation, business_event]
    effect: Closes the promises somebody previewed and counted, releasing their reservations and recording the reason once.
  - name: Record manual document
    service: create_manual_document_with_lines
    mode: mutation
    adapters: [Web, API, MCP, Chat]
    reads: [tenant, party, item, price_list, document_line]
    writes: [document, document_line]
    effect: Records normalized document evidence and its lines without booking anything or creating a promise.
  - name: Post sales invoice
    service: post_sales_invoice
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [document, ledger_entry]
    writes: [ledger_entry]
    effect: Books a recorded sales invoice, so what the customer owes becomes visible to settlement and the queue.
  - name: Post supplier invoice
    service: post_supplier_invoice
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [document, ledger_entry]
    writes: [ledger_entry]
    effect: Books a recorded supplier invoice, so what the company owes becomes visible to settlement and the queue.
  - name: Record return credit
    service: record_sales_credit
    mode: mutation
    adapters: [Web, API, MCP, Chat]
    reads: [document, document_line, commitment, movement, ledger_entry, ledger_reversal, settlement_allocation]
    writes: [source_record, document, document_line, ledger_entry, settlement_allocation, business_event]
    effect: Records a stated invoice-linked customer credit with explicit optional netting, or legacy return credit through an order line; no refund or stock movement.
  - name: Record supplier invoice
    service: record_supplier_invoice
    mode: mutation
    adapters: [Web, API, MCP, Chat]
    reads: [document, document_line]
    writes: [source_record, document, document_line, ledger_entry, business_event]
    effect: Records stated supplier invoice evidence linked to a purchase order line and posts its payable atomically.
  - name: Record sales invoice
    service: record_sales_invoice
    mode: mutation
    adapters: [Web, API, MCP, Chat]
    reads: [document, document_line]
    writes: [source_record, document, document_line, ledger_entry]
    effect: Records a stated invoice against one order line and posts its receivable atomically.
  - name: Post credit note
    service: post_sales_credit_note
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [document, ledger_entry]
    writes: [ledger_entry]
    effect: Posts a credit note as the exact reverse of a sales invoice, leaving the customer owed what it states.
  - name: Net credit note against invoice
    service: allocate_credit_note
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation]
    writes: [settlement_allocation]
    effect: Settles a posted credit note against an invoice the same customer still owes.
  - name: Post customer refund
    service: post_customer_refund
    related_services: [record_customer_refund]
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation]
    writes: [source_record, document, ledger_entry, settlement_allocation]
    effect: Returns money to a credited customer and settles the credit note it repays.
  - name: Post supplier credit note
    service: post_supplier_credit_note
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [document, ledger_entry]
    writes: [ledger_entry]
    effect: Books a credit a supplier sent as the exact reverse of its invoice, leaving the supplier owing what it states.
  - name: Net supplier credit against invoice
    service: allocate_supplier_credit_note
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation]
    writes: [settlement_allocation]
    effect: Settles a booked supplier credit against an invoice the company still owes that supplier.
  - name: Post supplier refund
    service: post_supplier_refund
    related_services: [record_supplier_refund]
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation]
    writes: [source_record, document, ledger_entry, settlement_allocation]
    effect: Takes money back from a supplier and settles the credit note it repays.
  - name: Post supplier payment
    service: post_supplier_payment
    mode: mutation
    adapters: [CLI, Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation]
    writes: [source_record, document, ledger_entry, settlement_allocation]
    effect: Records an outgoing payment and explicitly settles a supplier invoice entry.
  - name: Invite company member
    service: create_invitation
    mode: mutation
    adapters: [Web, API, MCP, Chat]
    confirmation: required
    reads: [tenant, tenant_membership, company_invitation]
    writes: [company_invitation, invitation_delivery, security_audit_event]
    effect: Creates an owner-authorized company invitation and atomically queues its first delivery.
  - name: Resend company invitation
    service: resend_invitation
    mode: mutation
    adapters: [Web, API, MCP, Chat]
    confirmation: required
    reads: [tenant_membership, company_invitation, invitation_delivery]
    writes: [company_invitation, invitation_delivery, security_audit_event]
    effect: Invalidates older delivery generations and queues a fresh invitation delivery after owner reauthorization.
  - name: Revoke company invitation
    service: revoke_invitation
    mode: mutation
    adapters: [Web, API, MCP, Chat]
    confirmation: required
    reads: [tenant_membership, company_invitation]
    writes: [company_invitation, security_audit_event]
    effect: Revokes a pending invitation after owner reauthorization.
  - name: Remove company member
    service: remove_member
    mode: mutation
    adapters: [Web, API, MCP, Chat]
    confirmation: required
    reads: [tenant_membership]
    writes: [tenant_membership, security_audit_event]
    effect: Archives a non-owner company membership after owner reauthorization.

  - name: Read settlement reduction context
    service: adjustment_context
    mode: read
    adapters: [CLI, Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation, subledger_account, finance_state]
    writes: []
    effect: Reads the remaining claim and permitted noncash counterpart.
  - name: Accept settlement reduction
    service: accept_adjustment
    mode: mutation
    adapters: [CLI, Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation, subledger_account, finance_state]
    writes: [source_record, document, ledger_entry, settlement_allocation, action]
    effect: Creates a separately evidenced noncash reduction only with explicit owner confirmation.

  - name: Read payment and credit context
    service: settlement_context
    mode: read
    adapters: [CLI, Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation, subledger_account, finance_state]
    writes: []
    effect: Reads the selected invoice or available credit and matching invoice choices.
  - name: Record payment or use existing credit
    service: apply_settlement
    mode: mutation
    adapters: [CLI, Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation, subledger_account, finance_state]
    writes: [source_record, document, ledger_entry, settlement_allocation, action]
    effect: Atomically records stated cash, explicit allocation and optional reduction, or consumes existing credit after owner confirmation.

  - name: Read opening position context
    service: opening_context
    mode: read
    adapters:
    - CLI
    - Web
    - MCP
    - Chat
    reads:
    - party
    - subledger_account
    - finance_state
    writes: []
    effect: Reads permitted opening counterpart, tenant parties and confirmation revision.
  - name: Import opening positions
    service: import_opening
    mode: mutation
    adapters:
    - CLI
    - Web
    - MCP
    - Chat
    reads:
    - party
    - subledger_account
    - finance_state
    - opening_scope
    - opening_item_detail
    - document
    - ledger_entry
    writes:
    - source_record
    - document
    - opening_scope
    - opening_item_detail
    - ledger_entry
    - action
    effect: Records stated residual customer/supplier positions against a neutral counterpart
      after owner confirmation, without cash or turnover.

  - name: Record shipment notice
    service: record_shipment_notice
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    confirmation: required
    reads: [party, party_role, source_record]
    writes: [shipment, shipment_package, shipment_event, business_event]
    effect: Records a stated consignment and package without moving stock.
  - name: Dispatch or receive shipment package
    service: record_packaged_execution
    related_services: [record_movement]
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    confirmation: required
    reads: [party, party_role, commitment, return_announcement, item, location, reservation, movement]
    writes: [shipment, shipment_package, shipment_event, movement, reservation, business_event]
    effect: Atomically records one physical package and its exact existing Movement effects.
  - name: Record shipment event
    service: record_shipment_event
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    confirmation: required
    reads: [shipment, shipment_package, source_record]
    writes: [shipment_event, business_event]
    effect: Appends one attributed logistics observation without changing stock.
  - name: Supersede shipment event
    service: supersede_shipment_event
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    confirmation: required
    reads: [shipment_event, source_record]
    writes: [shipment_event_supersession, business_event]
    effect: Appends a reasoned correction or retraction without deleting the original event.

capability_guidance:
  analytics_catalog:
    kind: read
    application_tool: analytics.catalog
    purpose: Discover available analytical perspectives, fields, measures and starter definitions.
    use_when:
    - Answer an explicit question about retained company records or the current user's saved analysis.
    do_not_use_when:
    - Infer complete upstream history, combine currencies, run arbitrary SQL, or impersonate a report owner.
    required_context:
    - Authorized tenant; private reports additionally require trusted authenticated user context outside
      arguments.
    data_basis:
    - document
    - document_line
    - commitment
    - movement
    - ledger_entry
    - analytics_report
    limitations:
    - Descriptive retained history only; unknown values stay unknown; no business/projection writes. Transport
      telemetry may persist outside the analytics transaction.
    freshness: Each query, contributor page and export is a fresh read-only repeatable-read observation;
      report reads return current configuration.
    empty_result: No matching retained records or private definitions, not proof of upstream absence.
    refusal_behavior: Invalid grammar, scope, unsupported combinations and resource bounds are refused without
      partial success.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - The returned observations follow the executed structured definition.
      does_not_prove:
      - Complete upstream records, future fulfilment or currency conversion.
    unknown_when:
    - Required dates, units, amounts or original source history are absent.
    next_steps:
    - Use analytics_contributors to inspect evidence or open the returned definition in Reports.
    examples:
      use:
      - scenario: Find customers ordering one resolved product in ISO week 7.
        reason: Product, customer and order date are cataloged evidence fields.
      do_not_use:
      - scenario: Calculate profit from arbitrary source JSON.
        reason: No such agreed metric or raw-expression interface is provided.
