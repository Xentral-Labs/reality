    side_effects: none
    verification: {role: independent, proves: [What was stated, when and by whom, and what Reality's movements held then.], does_not_prove: [Which side is right; a person decides.]}
    unknown_when: [The outside party reported stock that was never stated in Reality.]
    next_steps: [Take a difference over with stock_count_propose dated at the stated time, record the missing movement, or wait for the next statement.]
    examples: {use: [{scenario: Check the 3PL's Monday stock report against Reality., reason: Each line shows both quantities and the difference.}], do_not_use: [{scenario: Tell how much is in stock now., reason: Read inventory instead.}]}
  stock_counts:
    kind: read
    application_tool: stock_counts
