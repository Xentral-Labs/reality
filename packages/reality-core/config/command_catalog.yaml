    writes: [source_record, document, document_line, ledger_entry, business_event]
    effect: Records stated supplier invoice evidence without a purchase-order line and posts its payable atomically without inventing a commitment or Movement.
  - name: Read invoice credit context
    service: invoice_credit_context
    mode: query
    adapters: [Web, MCP, Chat]
    reads: [document, document_line, ledger_entry, ledger_reversal, settlement_allocation]
    writes: []
    effect: Shows exact customer-invoice positions and remaining credit capacity without recording a credit.
  - name: Read dunning context
    service: dunning_context
    related_services: [preview_notice]
    mode: query
    adapters: [Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation, party]
    writes: []
    effect: Validates one selected reminder scope and returns the finance revision without recording or sending anything.
  - name: List dunning notices
    service: notices
    mode: query
    adapters: [Web, MCP, Chat]
    reads: [source_record, document, ledger_entry, business_event]
    writes: []
    effect: Lists retained manual reminders with their invoice membership, optional fee and reversal trace.
  - name: Read dunning notice
    service: notice_detail
    mode: query
    adapters: [Web, MCP, Chat]
    reads: [source_record, document, ledger_entry, business_event]
    writes: []
    effect: Reads one retained manual reminder with its exact invoice membership, optional fee and reversal trace.
  - name: Record dunning notice
    service: record_notice
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation, party]
    writes: [source_record, document, ledger_entry, business_event]
    effect: Records one explicitly reviewed manual reminder and optional exact stated fee without sending a message.
  - name: Reverse dunning notice
    service: reverse_notice
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [source_record, document, ledger_entry, business_event]
    writes: [ledger_reversal, ledger_entry, business_event]
    effect: Retains the original reminder and explicitly reverses its fee effect and reminder state.
  - name: Record sales invoice
    service: record_sales_invoice
    mode: mutation
    adapters: [Web, API, MCP, Chat]
    reads: [document, document_line]
    writes: [source_record, document, document_line, ledger_entry]
    effect: Records a stated invoice against one order line and posts its receivable atomically.
  - name: Post credit note
    service: post_sales_credit_note
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [document, ledger_entry]
    writes: [ledger_entry]
    effect: Posts a credit note as the exact reverse of a sales invoice, leaving the customer owed what it states.
  - name: Net credit note against invoice
    service: allocate_credit_note
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation]
    writes: [settlement_allocation]
    effect: Settles a posted credit note against an invoice the same customer still owes.
  - name: Post customer refund
    service: post_customer_refund
    related_services: [record_customer_refund]
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation]
    writes: [source_record, document, ledger_entry, settlement_allocation]
    effect: Returns money to a credited customer and settles the credit note it repays.
  - name: Post supplier credit note
    service: post_supplier_credit_note
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [document, ledger_entry]
    writes: [ledger_entry]
    effect: Books a credit a supplier sent as the exact reverse of its invoice, leaving the supplier owing what it states.
  - name: Net supplier credit against invoice
    service: allocate_supplier_credit_note
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation]
    writes: [settlement_allocation]
    effect: Settles a booked supplier credit against an invoice the company still owes that supplier.
  - name: Post supplier refund
    service: post_supplier_refund
    related_services: [record_supplier_refund]
    mode: mutation
    adapters: [Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation]
    writes: [source_record, document, ledger_entry, settlement_allocation]
    effect: Takes money back from a supplier and settles the credit note it repays.
  - name: Post supplier payment
    service: post_supplier_payment
    mode: mutation
    adapters: [CLI, Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation]
    writes: [source_record, document, ledger_entry, settlement_allocation]
    effect: Records an outgoing payment and explicitly settles a supplier invoice entry.
  - name: Invite company member
    service: create_invitation
    mode: mutation
    adapters: [Web, API, MCP, Chat]
    confirmation: required
    reads: [tenant, tenant_membership, company_invitation]
    writes: [company_invitation, invitation_delivery, security_audit_event]
    effect: Creates an owner-authorized company invitation and atomically queues its first delivery.
  - name: Resend company invitation
    service: resend_invitation
    mode: mutation
    adapters: [Web, API, MCP, Chat]
    confirmation: required
    reads: [tenant_membership, company_invitation, invitation_delivery]
    writes: [company_invitation, invitation_delivery, security_audit_event]
    effect: Invalidates older delivery generations and queues a fresh invitation delivery after owner reauthorization.
  - name: Revoke company invitation
    service: revoke_invitation
    mode: mutation
    adapters: [Web, API, MCP, Chat]
    confirmation: required
    reads: [tenant_membership, company_invitation]
    writes: [company_invitation, security_audit_event]
    effect: Revokes a pending invitation after owner reauthorization.
  - name: Remove company member
    service: remove_member
    mode: mutation
    adapters: [Web, API, MCP, Chat]
    confirmation: required
    reads: [tenant_membership]
    writes: [tenant_membership, security_audit_event]
    effect: Archives a non-owner company membership after owner reauthorization.

  - name: Read settlement reduction context
    service: adjustment_context
    mode: read
    adapters: [CLI, Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation, subledger_account, finance_state]
    writes: []
    effect: Reads the remaining claim and permitted noncash counterpart.
  - name: Accept settlement reduction
    service: accept_adjustment
    mode: mutation
    adapters: [CLI, Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation, subledger_account, finance_state]
    writes: [source_record, document, ledger_entry, settlement_allocation, action]
    effect: Creates a separately evidenced noncash reduction only with explicit owner confirmation.

  - name: Read payment and credit context
    service: settlement_context
    mode: read
    adapters: [CLI, Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation, subledger_account, finance_state]
    writes: []
    effect: Reads the selected invoice or available credit and matching invoice choices.
  - name: Record payment or use existing credit
    service: apply_settlement
    mode: mutation
    adapters: [CLI, Web, MCP, Chat]
    reads: [document, ledger_entry, settlement_allocation, subledger_account, finance_state]
    writes: [source_record, document, ledger_entry, settlement_allocation, action]
    effect: Atomically records stated cash, explicit allocation and optional reduction, or consumes existing credit after owner confirmation.

  - name: Read opening position context
    service: opening_context
    mode: read
    adapters:
    - CLI
    - Web
    - MCP
    - Chat
    reads:
    - party
    - subledger_account
    - finance_state
    writes: []
    effect: Reads permitted opening counterpart, tenant parties and confirmation revision.
  - name: Import opening positions
    service: import_opening
    mode: mutation
    adapters:
    - CLI
    - Web
    - MCP
    - Chat
    reads:
    - party
    - subledger_account
    - finance_state
    - opening_scope
    - opening_item_detail
    - document
    - ledger_entry
    writes:
    - source_record
    - document
    - opening_scope
    - opening_item_detail
    - ledger_entry
    - action
    effect: Records stated residual customer/supplier positions against a neutral counterpart
      after owner confirmation, without cash or turnover.

  - name: Record shipment notice
    service: record_shipment_notice
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    confirmation: required
    reads: [party, party_role, source_record]
    writes: [shipment, shipment_package, shipment_event, business_event]
    effect: Records a stated consignment and package without moving stock.
  - name: Dispatch or receive shipment package
    service: record_packaged_execution
    related_services: [record_movement]
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    confirmation: required
    reads: [party, party_role, commitment, return_announcement, item, location, reservation, movement]
    writes: [shipment, shipment_package, shipment_event, movement, reservation, business_event]
    effect: Atomically records one physical package and its exact existing Movement effects.
  - name: Record shipment event
    service: record_shipment_event
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    confirmation: required
    reads: [shipment, shipment_package, source_record]
    writes: [shipment_event, business_event]
    effect: Appends one attributed logistics observation without changing stock.
  - name: Supersede shipment event
    service: supersede_shipment_event
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    confirmation: required
    reads: [shipment_event, source_record]
    writes: [shipment_event_supersession, business_event]
    effect: Appends a reasoned correction or retraction without deleting the original event.

  - name: Assign incoming supply to customer demand
    service: assign_supply
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    confirmation: required
    reads: [commitment, supply_assignment, source_record]
    writes: [supply_assignment, source_record]
    effect: Assigns an explicit quantity of an incoming supplier commitment to a compatible customer commitment without moving or reserving stock.

  - name: Resolve arrived customer-return goods
    service: record_return_disposition
    mode: mutation
    adapters: [CLI, Web, API, MCP, Chat]
    confirmation: required
    reads: [movement, movement_correction, source_record, location]
    writes: [movement, source_record, business_event]
    effect: Records one explicit physical outcome for part or all of an arrived customer return without implying a credit.

capability_guidance:
  price_quote_read:
    kind: read
    application_tool: price_quote
    purpose: Read the authoritative price tier for one party, item, quantity and commercial context, including why that list won.
    use_when: [A quote or order needs the currently applicable sales or purchase unit price.]
    do_not_use_when: [A price list or assignment must be changed, or an already agreed document price must be reconstructed.]
    required_context: [tenant, party ID, item ID, quantity, direction, currency, unit, and optional effective instant]
    data_basis: [party, item, party_price_list, party_group_member, party_group_price_list, price_list, price_list_entry]
    limitations: [The result answers one complete pricing context and does not infer missing currency, unit, quantity, party, or item values.]
    freshness: Reads current committed pricing records at the requested effective instant without projection or business writes; authentication telemetry may persist.
    empty_result: matched false means no eligible tier exists for the supplied context; it does not authorize an invented or copied price.
    refusal_behavior: Invalid quantities and unknown or foreign opaque IDs are refused without disclosure.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves: [The returned tier is the winner under the canonical priority, validity, quantity, direction, currency and unit rules.]
      does_not_prove: [That a price was agreed on a document or accepted by a counterparty.]
    unknown_when: [The needed party, item, unit, currency, direction or quantity is unknown.]
    next_steps: [Use the returned entry ID when recording agreed document Evidence, or prepare a governed pricing assignment change.]
    examples:
      use: [{scenario: Quote 12 pieces to a known customer in EUR., reason: The complete context can be resolved deterministically.}]
      do_not_use: [{scenario: Explain the historical price printed on an invoice., reason: Read the retained document line and historical pricing explanation.}]
  graph_format:
    kind: read
    application_tool: graph.format
    purpose: Format a checked reporting question as an editable path with separate parameters.
    use_when:
    - Show the exact technical representation of an analysis without executing it.
    do_not_use_when:
    - Read business values or execute arbitrary Cypher.
    required_context: [Authorized tenant and a declared traversal.]
    data_basis: [analytics_report]
    limitations: [Only the admitted reporting path syntax is generated.]
    freshness: Uses the currently loaded reporting declaration.
    empty_result: Formatting never supplies business results.
    refusal_behavior: Invalid model references or unrepresentable aliases are refused explicitly.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves: [The path and parameters encode the same checked question.]
      does_not_prove: [The presence of matching business records.]
    unknown_when: [The requested concept is not declared.]
    next_steps: [Execute through graph_ask.]
    examples:
      use:
      - scenario: Open an existing question in the expert editor.
        reason: Bound parameters preserve exact values separately from syntax.
      do_not_use:
      - scenario: Update a business record through the query editor.
        reason: Only read queries are admitted.
  graph_interpret:
    kind: read
    application_tool: graph.interpret
    purpose: Interpret a business question into a checked traversal using the configured AI provider.
    use_when:
    - A reader asks a business question without knowing model identifiers.
    do_not_use_when:
    - Execute writes or treat an interpretation as a calculated answer.
    required_context: [Authorized tenant and authenticated active user.]
    data_basis: [analytics_report]
    limitations: [AI provider availability and existing managed question allowance apply; one managed question is reserved before dispatch and failures still consume it.]
    freshness: Uses the current catalog and stated time zone; no business result is calculated.
    empty_result: A clarification or unsupported explanation is not a zero business result.
    refusal_behavior: Invalid output and unavailable concepts are refused before execution.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves: [The proposed traversal passes model and compilation checks.]
      does_not_prove: [Correct understanding of ambiguous intent or matching records.]
    unknown_when: [The question is ambiguous or the model lacks its required concept.]
    next_steps: [Review the interpretation and execute it through graph_ask.]
    examples:
      use:
      - scenario: Turn an order-value question into an editable analysis.
        reason: The declared measures retain their business meaning.
      do_not_use:
      - scenario: Ask for unsupported invoice aging and assume order date is equivalent.
        reason: Missing business semantics cannot be replaced by nearby fields.
  graph_templates:
    kind: read
    application_tool: graph.templates
    purpose: List the questions worth starting from, each already resolved against the declared model.
    use_when:
    - Offer somebody a starting point instead of an empty builder, or find the shape of a common report.
    do_not_use_when:
    - Treat a template as an answer; it is a question that still has to be executed.
    required_context:
    - Authorized tenant.
    data_basis:
    - analytics_report
    limitations:
    - A template carries no absolute date. Where it names a period window, whoever adopts it resolves that
      window against their own calendar, because only the caller knows what "this month" is.
    freshness: Declared beside the model and loaded with it; every template resolves or the model does not load.
    empty_result: No template is declared, not proof that no report is possible.
    refusal_behavior: A template that cannot be answered stops the model from loading, so none is ever offered.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - Which report shapes the model can express today.
      does_not_prove:
      - That a company has records for any of them.
    unknown_when:
    - A report is common in a business but has no template because the model cannot express it yet.
    next_steps:
    - Execute the question with graph_ask, or save it with graph_report_change_propose.
    examples:
      use:
      - scenario: Show somebody what Analytics can answer before they build anything.
        reason: A starting point that is known to run beats an empty form.
      do_not_use:
      - scenario: Report the open delivery backlog from a template without executing it.
        reason: A template holds the question; the numbers come from running it.

  graph_catalog:
    kind: read
    application_tool: graph.catalog
    purpose: Discover the business nodes, how they connect, which edges fan out, and what each measure means.
    use_when:
    - Decide which nodes, edges and measures a question can use before asking it.
    do_not_use_when:
    - Invent a node, edge or measure that the catalog does not list, or assume a relationship exists because
      two records look related.
    required_context:
    - Authorized tenant.
    data_basis:
    - document
    - document_line
    - party
    - item
    - commitment
    - movement
    - ledger_entry
    - settlement_allocation
    - location
    - return_announcement
    - analytics_report
    limitations:
    - Describes the declared model, not the data; a node with no rows still appears. Coverage is per node and
      as-of questions are not offered.
    freshness: The declaration is loaded at start; the catalog describes the model version it reports.
    empty_result: The named node is not declared, not proof that the business concept is absent.
    refusal_behavior: An unknown node is refused by name rather than returning an empty catalog.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - Which questions the model can express and which measure lives at which grain.
      does_not_prove:
      - That any company has records for a node, or that a measure is populated.
    unknown_when:
    - A business concept exists in the schema but has not been declared as a node.
    next_steps:
    - Use graph_ask with a path built from the nodes, edges and measures listed here.
    examples:
      use:
      - scenario: Find which measure may be summed after following order to its lines.
        reason: The catalog states each edge's multiplicity and each measure's grain.
      do_not_use:
      - scenario: Read a customer's current balance.
        reason: The catalog describes the model; graph_ask returns values.
  graph_ask:
    kind: read
    application_tool: graph.ask
    purpose: Ask a question as a path through declared edges with declared measures, grouping and filters.
    use_when:
    - Answer an explicit question about retained company records by combining declared nodes.
    do_not_use_when:
    - Sum a property directly, combine currencies or units, or attribute an order-level amount to one of its
      articles.
    required_context:
    - Authorized tenant; saved reports additionally require trusted authenticated user context outside
      arguments.
    data_basis:
    - document
    - document_line
    - party
    - item
    - commitment
    - movement
    - ledger_entry
    - settlement_allocation
    - location
    - return_announcement
    - analytics_report
    limitations:
    - Descriptive retained records only; unknown values stay unknown; no writes. Point-in-time and
      knowledge-time questions are refused rather than answered with today's rows.
    freshness: Each traversal is one fresh read-only observation in a consistent transaction snapshot.
    empty_result: No matching retained records, not proof of upstream absence.
    refusal_behavior: A refusal carries a stable code and names the edge that fanned out, the unit that cannot
      be added or the property that does not exist; it is more useful than a total that is wrong.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - The returned values follow the executed path, counted once per the measure's declared grain.
      does_not_prove:
      - Complete upstream records, future fulfilment or currency conversion.
    unknown_when:
    - Required dates, units or amounts were never received; they stay unknown rather than becoming zero.
    next_steps:
    - Save the question with graph_report_change_propose, or narrow it and ask again.
    examples:
      use:
      - scenario: Customer order value this period against last year, by month and currency.
        reason: Every node, edge and measure involved is declared, and the path does not fan out.
      do_not_use:
      - scenario: Order value per article.
        reason: An order's value cannot be attributed to one of its articles; ask for line_amount instead.
  graph_captured_reports_list:
    kind: read
    application_tool: graph.captured_reports.list
    purpose: Discover sealed captured report generations for an explicit fixed analysis selection.
    use_when: [Select one captured inventory or contribution generation by its opaque identity.]
    do_not_use_when: [Treat publication as financial approval or silently choose the latest generation.]
    required_context: [Authorized tenant, inventory or contribution family.]
    data_basis: [cost_generation, cost_captured_basis, cost_company_census, cost_publication]
    limitations: [Bounded metadata only; graph.ask rechecks sealed cache integrity and returns known subtotals only.]
    freshness: Fixed capture metadata plus ready or pending relative to the current tenant event cursor.
    empty_result: No sealed captured generation for this family in the company or page.
    refusal_behavior: Foreign and absent continuation identities are equally not found.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves: [Which sealed captured generation identities can be selected.]
      does_not_prove: [Complete company coverage, historical common knowledge or financial approval.]
    unknown_when: [No captured report has been built for the retained selection.]
    next_steps: [Ask graph_ask with the explicitly selected captured_cost_context.]
    examples:
      use:
      - scenario: Reopen a fixed captured review selection in Analysis.
        reason: The opaque generation identity remains fixed when newer reports are published.
      do_not_use:
      - scenario: Present the newest captured report as the final company valuation.
        reason: Captured reports expose known subtotals and explicit gaps only.
  graph_company_generation_current:
    kind: read
    application_tool: graph.company_generation.current
    purpose: Discover the verified currently published company cost generation for explicit fixed analysis selection.
    use_when: [Select the published financial company generation for inventory or contribution analysis.]
    do_not_use_when: [Build or publish a generation, or treat independent member reviews as one company policy.]
    required_context: [Authorized tenant, inventory or contribution family.]
    data_basis: [cost_company_publication, cost_company_generation, cost_company_manifest]
    limitations: [Metadata only; graph.ask verifies and reads the fixed generation values.]
    freshness: Ready or pending relative to the current tenant event cursor.
    empty_result: No published company cost generation.
    refusal_behavior: Foreign tenant data is never disclosed.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves: [Which verified published company generation can be selected.]
      does_not_prove: [One common company policy, complete DB2 coverage or current values after pending evidence.]
    unknown_when: [No financial company generation is published.]
    next_steps: [Ask graph_ask with the explicitly selected company_cost_context.]
    examples:
      use:
      - scenario: Analyze the published company contribution generation by customer and article.
        reason: The fixed generation keeps rows, coverage and totals on one verified basis.
      do_not_use:
      - scenario: Treat independent member reviews as one approved company accounting policy.
        reason: The generation explicitly retains independent member authority.
  graph_contribution_reviews_list:
    kind: read
    application_tool: graph.contribution_reviews.list
    purpose: Discover retained joint contribution confirmations for explicit historical report selection.
    use_when: [Select a confirmed historical contribution scope by cutoff and economic owner.]
    do_not_use_when: [Treat discovery as cache readiness or financial approval.]
    required_context: [Authorized tenant.]
    data_basis: [cost_contribution_review, cost_inventory_member, cost_inventory_review, cost_policy_revision, cost_revenue_match_basis, action, party]
    limitations: [Bounded metadata only; graph.ask rechecks integrity and complete cache availability.]
    freshness: Retained confirmations ordered by event sequence; owner names are current display labels.
    empty_result: No retained joint confirmations in this company or on the next page.
    refusal_behavior: Foreign and absent continuation identities are equally not found.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves: [Which joint contribution confirmations can be selected.]
      does_not_prove: [That a selected valuation is available or complete.]
    unknown_when: [Selected caches have not been built or are unavailable.]
    next_steps: [Ask graph_ask with the explicitly selected contribution_cost_context.]
    examples:
      use:
      - scenario: Choose a confirmed historical contribution cutoff for a saved report.
        reason: Selection preserves the actual joint confirmation identity.
      do_not_use:
      - scenario: Approve the latest valuation automatically.
        reason: Discovery neither chooses nor confirms financial decisions.
  graph_inventory_reviews_list:
    kind: read
    application_tool: graph.inventory_reviews.list
    purpose: Discover retained joint inventory confirmations for explicit historical report selection.
    use_when: [Select a confirmed historical inventory scope by cutoff and economic owner.]
    do_not_use_when: [Treat discovery as cache readiness or financial approval.]
    required_context: [Authorized tenant.]
    data_basis: [cost_inventory_review, cost_policy_revision, action, party]
    limitations: [Bounded metadata only; graph.ask rechecks integrity and complete cache availability.]
    freshness: Retained confirmations ordered by event sequence; owner names are current display labels.
    empty_result: No retained joint confirmations in this company or on the next page.
    refusal_behavior: Foreign and absent continuation identities are equally not found.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves: [Which joint inventory confirmations can be selected.]
      does_not_prove: [That a selected valuation is available or complete.]
    unknown_when: [Selected caches have not been built or are unavailable.]
    next_steps: [Ask graph_ask with the explicitly selected inventory_cost_context.]
    examples:
      use:
      - scenario: Choose a confirmed historical inventory cutoff for a saved report.
        reason: Selection preserves the actual joint confirmation identity.
      do_not_use:
      - scenario: Approve the latest valuation automatically.
        reason: Discovery neither chooses nor confirms financial decisions.
  graph_reports_list:
    kind: read
    application_tool: graph.reports.list
    purpose: List the authenticated caller's own saved graph questions.
    use_when:
    - Offer a question the caller saved earlier instead of rebuilding it.
    do_not_use_when:
    - Read another person's reports, or treat a saved report as a stored result.
    required_context:
    - Authorized tenant and trusted authenticated user context outside arguments.
    data_basis:
    - document
    - document_line
    - party
    - item
    - commitment
    - movement
    - ledger_entry
    - settlement_allocation
    - location
    - return_announcement
    - analytics_report
    limitations:
    - Owner-scoped configuration only. A report holds the question and its model version, never an answer.
    freshness: Current configuration; reopening the question re-executes it.
    empty_result: The caller has saved no graph reports, not that none exist in the company.
    refusal_behavior: Missing user context is refused rather than falling back to a tenant-wide list.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - Which questions this caller saved, and under which model version.
      does_not_prove:
      - What any of them would answer now.
    unknown_when:
    - A report was saved under a model version whose meaning has since moved.
    next_steps:
    - Open one with graph_report_get and ask it with graph_ask.
    examples:
      use:
      - scenario: Offer the caller their saved monthly revenue question.
        reason: Saved questions are owner-scoped configuration.
      do_not_use:
      - scenario: Show the numbers from last month's saved report.
        reason: No answer is stored; the question has to be asked again.
  graph_report_get:
    kind: read
    application_tool: graph.reports.get
    purpose: Open one of the authenticated caller's own saved graph questions.
    use_when:
    - Re-ask a question the caller saved, exactly as it was saved.
    do_not_use_when:
    - Open a report saved by the configured generation, or one owned by somebody else.
    required_context:
    - Authorized tenant and trusted authenticated user context outside arguments.
    data_basis:
    - document
    - document_line
    - party
    - item
    - commitment
    - movement
    - ledger_entry
    - settlement_allocation
    - location
    - return_announcement
    - analytics_report
    limitations:
    - Returns the question and its model version, never a stored answer. A report of another kind is reported
      as not found rather than read with the wrong meaning.
    freshness: Current configuration; the answer comes from asking it again.
    empty_result: No such report is owned by this caller.
    refusal_behavior: A report of another kind, or another owner's report, is not found rather than disclosed.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - The stored question and the model version that gave it meaning.
      does_not_prove:
      - That the question still returns what it returned when it was saved.
    unknown_when:
    - The stored model version differs from the one now loaded.
    next_steps:
    - Ask it with graph_ask, or propose a change with graph_report_change_propose.
    examples:
      use:
      - scenario: Reopen the saved monthly revenue question and run it.
        reason: The report holds the question; running it is a fresh observation.
      do_not_use:
      - scenario: Read a colleague's saved report.
        reason: Reports are private to their author.
  graph_requests_list:
    kind: read
    application_tool: graph.requests.list
    purpose: List the authenticated caller's own requested analyses and where each one stands.
    use_when:
    - Check whether a question asked earlier has been answered.
    do_not_use_when:
    - Look for somebody else's requests; they are private to whoever asked them.
    required_context:
    - Authorized tenant and trusted authenticated user context outside arguments.
    data_basis:
    - analysis_request
    limitations:
    - States where each request stands, never its rows. Collect one to read its answer.
    freshness: Current state of the caller's own requests.
    empty_result: This caller has asked for nothing, or their answers have expired.
    refusal_behavior: A caller who is not a member of the company is not found rather than told.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - Which questions this caller asked and which have answers.
      does_not_prove:
      - What any of those answers say.
    unknown_when:
    - An answer expired before it was collected.
    next_steps:
    - Collect a ready one with graph_request_get.
    examples:
      use:
      - scenario: See whether last night's balance question finished.
        reason: The state says so without reading the answer.
      do_not_use:
      - scenario: Read the numbers from a finished request.
        reason: That is what collecting it is for.
  graph_request_get:
    kind: read
    application_tool: graph.requests.get
    purpose: Collect a requested analysis, with the question and the moment it was answered.
    use_when:
    - Read the answer to a question this caller asked and that is ready.
    do_not_use_when:
    - Use a collected answer as a current figure; it was true of one moment and of no other.
    required_context:
    - Authorized tenant and trusted authenticated user context outside arguments.
    data_basis:
    - analysis_request
    limitations:
    - A stored answer is evidence of one answer at one moment. It is returned with its
      question and its `answered_at` so nothing downstream can mistake it for what is true
      now, and it is removed when it expires.
    freshness: As of `answered_at`, never later.
    empty_result: The question reached nothing when it ran.
    refusal_behavior: Another caller's request is not found rather than disclosed.
    confirmation: none
    side_effects: none
    verification:
      role: independent
      proves:
      - What this question answered, at the moment it was answered.
      does_not_prove:
      - That the same question would answer the same today.
    unknown_when:
    - The records changed after `answered_at`.
    next_steps:
    - Ask it again with graph_request if the moment matters.
    examples:
      use:
      - scenario: Read the customer balances requested this morning.
        reason: The answer states when it was true.
      do_not_use:
      - scenario: Quote a collected balance as today's figure.
        reason: It is an observation of one moment, not a standing number.
  finance_targets:
