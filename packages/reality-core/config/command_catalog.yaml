    limitations: [A count is what a person counted; it says nothing about locations not counted.]
    freshness: Read from the counts at request time.
    empty_result: No count has been recorded for the selection.
    refusal_behavior: Only the company's own counts are returned.
    confirmation: none
    side_effects: none
    verification: {role: independent, proves: [Which counts were recorded where and when.], does_not_prove: [That the counted quantities were right.]}
    unknown_when: [Goods were counted on paper and never recorded.]
    next_steps: [Read one count with stock_count_detail, or count again with stock_count_propose.]
    examples: {use: [{scenario: Find when the Hamburg warehouse was last counted., reason: The list shows its counts newest first.}], do_not_use: [{scenario: Tell how much is in stock now., reason: Read inventory instead.}]}
  stock_count_detail:
    kind: read
    application_tool: stock_count_detail
    purpose: Explain one count, line by line, and the adjustments that posted it.
    use_when: [Someone asks where an adjustment came from or what a count found.]
