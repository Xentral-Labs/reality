      its current validity.
    columns:
      id: {}
      tenant_id: {}
      shipment_id: {}
      shipment_package_id: {}
      event_type: {}
      reporter_type: {}
      occurred_at: {}
      recorded_at: {}
      location_text: {}
      source_record_id: {}
      external_event_id: {}
  shipment_event_supersession:
