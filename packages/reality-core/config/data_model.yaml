version: 1
title: Reality Data Model
description: Machine-readable catalog for documentation, validation, and future generators.
sections:
  - name: Financial Company Generations
    description: Retained exact company inputs and disposable complete-population observations.
    tables: [cost_company_manifest, cost_company_inventory_input, cost_company_contribution_input, cost_company_generation, cost_company_inventory_result, cost_company_contribution_result, cost_company_publication]
  - name: Captured Reports
    description: Disposable fixed captured observations; no financial company approval.
    tables: [cost_generation, cost_inventory_row, cost_contribution_row, cost_publication]
  - name: Captured Review Basis
    description: Immutable selected reviews and captured gaps, not financial approval or disposable output.
    tables: [cost_captured_basis, cost_captured_inventory_basis, cost_captured_contribution_basis]
  - name: Retained Company Discovery
    description: Immutable current input observations, not financial approvals or disposable valuation caches.
    tables: [cost_company_census, cost_company_census_movement, cost_company_census_document, cost_company_census_line, cost_company_census_source]
  - name: Commercial Contribution
    description: Retained legacy whole-line and revisioned partial commercial matching with confirmed DB1 review membership.
    tables: [cost_commercial_match_revision, cost_commercial_inventory_part, cost_commercial_direct_part, cost_revenue_match_basis, cost_contribution_review, cost_selling_attribution_part, cost_selling_review_category, cost_selling_review_member]
  - name: Inventory Costing
    description: Confirmed policy, ownership and bounded frozen movement history.
    tables: [cost_policy_revision, cost_movement_basis, cost_ownership_revision, cost_opening_basis, cost_inventory_review, cost_inventory_ownership_part, cost_inventory_member]
  - name: Receipt Costing
    description: Retained received-cost evidence, confirmed allocation decisions and exact reviewed input history.
    tables: [cost_attribution_part, cost_attribution_revision, cost_component_basis, cost_component_replacement, cost_correction_basis, cost_input_manifest, cost_manifest_attribution, cost_manifest_component, cost_manifest_correction, cost_manifest_receipt, cost_manifest_replacement, cost_receipt_basis, cost_scope_review, cost_scope_review_category]
  - name: Foundation
    description: Tenant boundary and immutable upstream evidence.
    tables: [tenant, source_system, source_capability, source_artifact, source_stream, source_record, import_job, interpretation_outcome, interpretation_record_reference]
  - name: Master Data
    description: Operational identities and settings needed for joins and decisions.
    tables: [accounting_target, accounting_target_reference, finance_target_mapping_revision, source_classification_mapping_revision, finance_reference, party, party_role, party_email_address, party_hold, payment_term, item, location, price_list, price_list_entry, party_price_list, party_group, party_group_member, party_group_price_list]
  - name: Evidence
    description: Normalized business documents that connect source evidence to reality.
    tables: [financial_component, document, document_line, opening_scope, opening_item_detail]
  - name: Reality
    description: Obligations, allocations, physical events, financial events, and observations.
    tables: [component_assignment_revision, component_assignment_part, subledger_account, finance_role_destination, finance_state, commitment, commitment_hold, reservation, handling_unit, lot, serial_unit, movement, ledger_entry, ledger_reversal, settlement_allocation, fact, business_event]
  - name: Interaction
    description: Auditable Change Proposals, approvals, executions, and chat history.
    tables: [secret, secret_audit_event, ai_settings, mcp_access_token, action, chat_session, chat_message, playground_run, playground_step, storyline_trace_entry, storyline_package, interaction]
  - name: Modeling Workflow
    description: Tenant-scoped missing-information investigation and safe declarative Fact interpretation.
    tables: [reality_gap, reality_gap_entry, interpretation_rule, rule_interpretation_outcome]
  - name: Accounts and Access
    description: Human identity, platform approval, company membership, sessions, and security audit.
    tables: [app_user, email_verification_code, user_session, access_application, access_admission_counter, tenant_membership, company_invitation, invitation_delivery, security_audit_event]
  - name: Projections
    description: Disposable tenant-scoped read models rebuilt from Business Events and authoritative Reality.
    tables: [projection_row, projection_checkpoint, cost_contribution_generation, cost_contribution_snapshot, cost_inventory_generation, cost_inventory_snapshot, cost_inventory_publication]

common_columns:
  id: Opaque technical identity. Human-readable numbers are never used as identity.
  tenant_id: Tenant boundary enforced by every repository query.
  source_record_id: Link to the immutable upstream source payload that supports this record.
  created_at: UTC timestamp when the record was created.
  updated_at: UTC timestamp when the record was last updated.
  payload: Lossless JSON payload retained for traceability and fields that are not operationally typed.

tables:
  shipment:
    description: A consignment linking physical movements through packages.
    columns:
      id: {}
      tenant_id: {}
      direction: {}
      purpose: {}
      counterparty_id: {}
      source_record_id: {}
      created_at: {}
  shipment_package:
    description: A package with stated carrier and tracking reference.
    columns:
      id: {}
      tenant_id: {}
      shipment_id: {}
      carrier: {}
      tracking_number: {}
      source_record_id: {}
      created_at: {}
  shipment_event:
