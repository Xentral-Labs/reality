    columns:
      id: {}
      tenant_id: {}
      commitment_id: {}
      quantity: {}
      reference: {}
      reason: {}
      announced_at: {}
      expected_by: {}
      status: {}
      closed_at: {}
      note: {}
      source_record_id: {}
      created_at: {}
  accounting_target:
    description: Finance-only external configuration; no financial amount authority.
    columns:
      id: {}
      tenant_id: {}
      namespace: {}
      name: {}
      state: {}
      revision: {}
      created_at: {}
      updated_at: {}
  accounting_target_reference:
    description: Finance-only external configuration; no financial amount authority.
    columns:
      id: {}
      tenant_id: {}
      target_id: {}
      kind: {}
      code: {}
      name: {}
      state: {}
      revision: {}
      created_at: {}
      updated_at: {}
  finance_target_mapping_revision:
    description: Finance-only external configuration; no financial amount authority.
    columns:
      id: {}
      tenant_id: {}
      target_id: {}
      mapping_kind: {}
      local_account_id: {}
      transaction_kind: {}
      case_reference_id: {}
      group_mode: {}
      group_reference_id: {}
      external_account_id: {}
      external_tax_code_id: {}
      case_kind: {}
      group_kind: {}
      account_kind: {}
      tax_kind: {}
      revision: {}
      replaces_id: {}
      state: {}
      is_current: {}
      configuration_snapshot: {}
      reason: {}
      actor_id: {}
      action_id: {}
      created_at: {}
  playground_run:
    description: Private learning-run orchestration metadata; never operational truth.
    columns:
      id: {}
      tenant_id: {}
      owner_user_id: {description: Account that owns this private experiment.}
      sandbox_kind: {description: Temporary experiment or persistent practice company; constrains restart lifecycle.}
      preset_key: {description: Versioned synthetic reference dataset name.}
      preset_version: {description: Positive dataset version.}
      lesson_key: {description: Guided lesson name.}
      lesson_version: {description: Positive lesson version.}
      client_request_key: {description: Owner-scoped creation retry identity.}
      status: {description: Initializing, active, initialization_failed or archived.}
      initialization_progress: {description: Bounded seed reconciliation references; not business state.}
      initialization_error_code: {description: Sanitized setup failure code, never credentials.}
      created_at: {}
      ready_at: {description: UTC time the reference dataset became ready.}
      archived_at: {description: UTC time this run became read-only.}
      storyline_key: {description: Storyline package this run plays, when it is a Storyline run.}
      storyline_version: {description: Package version the run started with; kept when the library receives a newer one.}
      storyline_state: {description: Bounded chosen branches; the current chapter is derived from the steps.}
  playground_step:
    description: Same-tenant proposal link and historical learning observations.
    columns:
      id: {}
      tenant_id: {}
      run_id: {description: Same-tenant learning run.}
      sequence: {description: Positive step position within the run.}
      request_key: {description: Run-scoped preparation retry identity.}
      proposal_id: {description: Same-tenant ChangeProposal; sole execution-state authority. Null for a Storyline read chapter.}
      lesson_step_key: {description: Optional versioned guided-step identity; the chapter key of a Storyline step.}
      before_observation: {description: Bounded historical observation captured on execution, not preview.}
      receipt_observation: {description: Bounded verified historical explanation, not current business truth.}
      created_at: {}
      observed_at: {description: UTC receipt verification time.}
      marker_sequence: {description: Storyline marker; the chapter's delta is every business event after this sequence.}
      marker_at: {description: Storyline marker; the chapter's delta is every Fact recorded after this instant.}
  storyline_trace_entry:
    description: One recorded call of a Storyline run; an explanation aid, bounded per entry and per run, never a business record.
    columns:
      id: {}
      tenant_id: {}
      run_id: {description: Same-tenant Storyline run.}
      step_id: {description: Same-tenant chapter step; null in free play.}
      ordinal: {description: Position within the run's trace.}
      kind: {description: view, read, propose, confirm, reject or error.}
      name: {description: Tool name or route template.}
      access: {description: read, propose or confirm.}
      actor: {description: person, copilot, mcp or storyline.}
      proposal_id: {description: The ChangeProposal a propose, confirm or reject entry refers to.}
      marker_sequence: {description: Marker captured before a free-play confirmation.}
      marker_at: {description: Marker instant captured before a free-play confirmation.}
      before_exceptions: {description: Bounded list of finding ids open before a free-play confirmation.}
      input: {description: Bounded call input, truncated with a flag beyond the entry bound.}
      result: {description: Bounded call result or error text.}
      duration_ms: {description: Wall-clock duration of the call.}
      recorded_at: {}
  interaction:
    description: One observed use of a company's model through one channel (spec 266, the engine room); operational telemetry kept seven days, value-free, never a business record.
    columns:
      id: {}
      tenant_id: {}
      cursor: {description: Global insertion order; the engine room polls after it.}
      started_at: {}
      recorded_at: {description: When the interaction was recorded; retention and replay windows use it.}
      duration_ms: {description: Wall-clock duration of the observed call.}
      channel: {description: web, mcp, chat, cli or worker.}
      kind: {description: read, write (committed events without a proposal), propose, decide or job.}
      operation: {description: Tool or command name, or route template; never a raw path or query.}
      outcome: {description: ok, refused, failed or awaiting_decision.}
      error_code: {description: Bounded refusal or failure code; never a message.}
      actor_user_id: {description: The signed-in person; null for token-only MCP calls and jobs.}
      mcp_token_id: {description: Same-tenant MCP access token that made the call.}
      job_id: {description: Scheduled job run the interaction was.}
      correlation_id: {description: The shared cause (one click, one chat turn, one call, one run).}
      proposal_id: {description: Same-tenant ChangeProposal the interaction requested or decided.}
      event_first_sequence: {description: First committed business event sequence it caused.}
      event_last_sequence: {description: Last committed business event sequence it caused.}
      event_ranges: {description: Exact contiguous ranges of committed event sequences it caused.}
      refresh: {description: Timer-driven background refresh; hidden by default.}
      summary: {description: Declared argument names and a result count; no values.}
  storyline_package:
    description: An imported Storyline package owned by an account; never joined by business reads.
    columns:
      id: {}
      owner_user_id: {description: Account that imported the package.}
      key: {description: Package key.}
      version: {description: Positive package version.}
      title: {description: English title for lists.}
      author: {description: Free-text author from the package.}
      checksum: {description: SHA-256 of the stored document.}
      document: {description: The package as received, bounded.}
      validation: {description: Validation result recorded at import.}
      imported_at: {}
      replaced_at: {description: Set when a same key and version import replaced this row.}
  app_user:
    description: Platform human identity, kept separate from tenant-scoped business data.
    columns:
      id: {}
      email: {description: Normalized unique sign-in address.}
      password_hash: {description: Argon2 password hash; plaintext is never retained.}
      display_name: {description: Name shown in the application.}
      status: {description: Account lifecycle such as email_unverified, pending_approval, active, or rejected.}
      language: {description: UI language preference; English is the default and translation fallback.}
      locale: {description: Locale used to format dates, quantities, and money in the UI.}
      timezone: {description: IANA display timezone; business timestamps remain UTC internally.}
      is_platform_admin: {description: Whether the user may review platform access applications.}
      email_verified_at: {description: UTC email confirmation time.}
      last_login_at: {description: UTC time of the latest successful sign-in.}
      created_at: {}
      updated_at: {}
  email_verification_code:
    description: Short-lived one-time email verification challenge.
    columns:
      id: {}
      user_id: {description: User receiving the challenge.}
      code_hash: {description: One-way digest; the clear verification code is not stored.}
      expires_at: {description: UTC expiry time.}
      attempts: {description: Failed verification attempts.}
      consumed_at: {description: UTC time of successful use.}
      created_at: {}
  user_session:
    description: Revocable HttpOnly browser session with only a token hash stored server-side.
    columns:
      id: {}
      user_id: {description: Authenticated user.}
      token_hash: {description: One-way digest of the browser cookie token.}
      expires_at: {description: UTC expiry time.}
      last_seen_at: {description: UTC time of latest authenticated use.}
      revoked_at: {description: UTC revocation time, when signed out.}
      created_at: {}
  access_application:
    description: Owner-reviewed application for access to the Reality platform.
    columns:
      id: {}
      user_id: {description: Applicant user.}
      company_name: {description: Applicant company.}
      company_website: {description: Optional company website.}
      orders_per_day: {description: Self-reported operating volume band.}
      role_title: {description: Applicant role.}
      status: {description: Pending, approved, or rejected review state.}
      review_note: {description: Internal platform-owner review note.}
      requested_at: {description: UTC application time.}
      reviewed_at: {description: UTC review time.}
      reviewed_by_user_id: {description: Platform administrator who made the decision.}
  access_admission_counter:
    description: Platform-wide serialized counter used to enforce automatic admission capacity across application instances.
    columns:
      id: {description: Stable singleton counter identity.}
      used_slots: {description: Number of automatic admission slots already consumed.}
      updated_at: {description: UTC timestamp of the latest counter update.}
  tenant_membership:
    description: Explicit user access to one tenant; the tenant boundary is checked on every request.
    columns:
      id: {}
      tenant_id: {}
      user_id: {description: Member user.}
      role: {description: Company role, initially owner.}
      status: {description: Membership lifecycle, initially active.}
      created_at: {}
  company_invitation:
    description: Tenant-scoped administrative evidence that a normalized email may explicitly accept company membership.
    columns:
      id: {}
      tenant_id: {}
      normalized_email: {description: Trimmed case-insensitive matching value; never an identity or pre-acceptance account link.}
      status: {description: Pending, accepted, revoked, or expired lifecycle.}
      token_hash: {description: Non-recoverable digest of the current invitation secret.}
      token_generation: {description: Monotone generation that invalidates older delivery links.}
      expires_at: {description: UTC deadline for the current generation.}
      invited_by_user_id: {description: Active owner who created the invitation.}
      accepted_by_user_id: {description: Matching account recorded only after explicit acceptance.}
      accepted_at: {description: UTC acceptance time.}
      revoked_at: {description: UTC revocation time.}
      terminal_at: {description: UTC retention anchor for accepted, revoked, or expired state.}
      created_at: {}
      updated_at: {}
  invitation_delivery:
    description: Tenant-scoped retryable notification intent without a clear token or rendered message body.
    columns:
      id: {}
      tenant_id: {}
      invitation_id: {description: Direct scoped link to the invitation being delivered.}
      generation: {description: Invitation generation this intent may issue.}
      template_key: {description: Stable invitation template selector.}
      locale: {description: Requested locale with an English fallback.}
      status: {description: Pending, processing, retry, delivered, or failed lifecycle.}
      attempt_count: {description: Number of delivery attempts.}
      next_attempt_at: {description: Earliest UTC time at which a worker may claim the intent.}
      claimed_at: {description: UTC start of the current worker lease.}
      attempted_at: {description: UTC time of the latest provider attempt.}
      delivered_at: {description: UTC confirmed delivery time.}
      provider_message_id: {description: Optional bounded non-secret provider result.}
      last_error_code: {description: Optional sanitized provider error category.}
      created_at: {}
  security_audit_event:
    description: Immutable account and access audit entry outside the business event journal.
    columns:
      id: {}
      user_id: {description: Subject user, when applicable.}
      actor_user_id: {description: Acting platform administrator or user.}
      tenant_id: {description: Company scope for tenant access events; null for global account events.}
      subject_type: {description: Stable type of invitation, delivery, or membership subject.}
      subject_id: {description: Opaque subject identity.}
      outcome: {description: Stable redacted transition outcome.}
      event_type: {description: Stable security event name.}
      detail: {description: JSON detail without credentials or secrets.}
      occurred_at: {description: UTC event time.}
  source_artifact:
    description: Immutable tenant-scoped original file retained for streamed source ingestion.
    columns:
      id: {type: string, description: Opaque artifact identity.}
      tenant_id: {type: string, description: Owning tenant.}
      filename: {type: string, description: Original client filename.}
      content_type: {type: string, description: Reported media type.}
      byte_size: {type: integer, description: Exact number of stored bytes.}
      sha256: {type: string, description: SHA-256 digest of the original bytes.}
      storage_key: {type: string, description: Internal content-addressed storage locator.}
      status: {type: string, description: Staged or attached lifecycle state.}
      created_at: {type: datetime, description: UTC receipt time.}
      attached_at: {type: datetime, nullable: true, description: UTC time linked to SourceRecord evidence.}
  tenant:
    description: Top-level isolation boundary for all business data.
    columns:
      id: {description: Opaque tenant identity.}
      name: {description: Human-readable tenant name.}
      purpose: {description: Immutable business or playground boundary; existing tenants default to business.}
      created_at: {}
      archived_at: {description: UTC timestamp that hides the tenant from normal workspace selection while preserving all tenant data.}
  source_system:
    description: Tenant-defined identity of an external origin; it does not imply a configured connector.
    columns:
      id: {}
      tenant_id: {}
      code: {description: Stable machine-readable origin code, unique inside the tenant.}
      name: {description: Human-readable source-system name.}
      description: {description: Optional operational explanation of this origin.}
      is_active: {description: Whether the origin remains available for new configuration and operations.}
      created_at: {}
      updated_at: {}
  source_capability:
    description: Declares an upstream object type a source system may provide and its intended operational meaning.
    columns:
      id: {}
      tenant_id: {}
      source_system_id: {description: Opaque reference to the configured source system.}
      source_type: {description: Object or event type used by the upstream system.}
      target_type: {description: Intended operational meaning, such as sales_order, item, party, or payment.}
      is_active: {description: Whether this declared source/target combination is currently enabled.}
      created_at: {}
      updated_at: {}
  source_record:
    description: Immutable version of a payload received from an external system.
    columns:
      id: {}
      tenant_id: {}
      source_system: {description: Stable identifier of the originating system, such as shopify or crm.}
      source_type: {description: Upstream object or event type.}
      external_id: {description: Identity assigned by the source system; unique only in its source context.}
      payload: {}
      payload_hash: {description: SHA-256 of canonical JSON used only for semantic duplicate detection.}
      source_artifact_id: {description: Optional opaque link to the immutable original uploaded file.}
      version: {description: Arrival sequence within one tenant-scoped source identity.}
      source_version_at: {description: Upstream version timestamp used to reject stale or conflicting deliveries when supplied.}
      supersedes_source_record_id: {description: Previous current immutable source version replaced by this version.}
      received_at: {description: UTC timestamp when this source version was received.}
  source_stream:
    description: Stable tenant-scoped external identity whose pointer selects the current immutable SourceRecord.
    columns:
      id: {}
      tenant_id: {}
      source_system: {description: Stable identifier of the originating system.}
      source_type: {description: Upstream object or event type.}
      external_id: {description: Identity assigned by the source system inside this stream.}
      current_source_record_id: {description: Current accepted SourceRecord; stale and conflicting versions never replace it.}
  import_job:
    description: Retryable interpretation request created atomically with its immutable SourceRecord.
    columns:
      id: {}
      tenant_id: {}
      source_record_id: {}
      status: {description: Processing lifecycle state such as pending, processing, completed, or failed.}
      attempts: {description: Number of interpretation attempts made for this source version.}
      input: {description: Lossless JSON application context required to interpret the source through shared services.}
      error: {description: Last business-readable interpretation error; empty after success.}
      next_attempt_at: {description: UTC timestamp after which a failed job may be retried.}
      created_at: {}
      completed_at: {description: UTC timestamp of successful or intentionally skipped completion.}
  interpretation_outcome:
    description: Immutable terminal result of one source interpretation attempt; operational audit, not business Reality.
    columns:
      id: {}
      tenant_id: {}
      source_record_id: {}
      import_job_id: {description: Opaque link to the mutable queue state whose attempt completed.}
      attempt: {description: Zero for intake-only dispositions; otherwise the executed attempt number.}
      classification: {description: Interpreted, needs_review, unsupported, stale, conflict, or failed.}
      interpreter_name: {description: Stable interpreter identity used for this attempt.}
      interpreter_version: {description: Version of the interpretation contract.}
      reason_code: {description: Controlled machine-readable reason without source payload content.}
      summary: {description: Bounded safe explanation without payloads, credentials, or stack traces.}
      completed_at: {}
  interpretation_record_reference:
    description: Controlled type and opaque identity produced or recognized by one successful interpretation.
    columns:
      id: {}
      tenant_id: {}
      outcome_id: {description: Opaque link to the owning interpreted outcome.}
      record_type: {description: Controlled produced-record family.}
      record_id: {description: Opaque target identity; never a human document number.}
  party:
    description: Operational person or organization identity used in business relationships.
    columns:
      id: {}
      tenant_id: {}
      type: {description: Legacy primary classification; detailed capabilities belong in party_role.}
      name: {description: Operational display name.}
      payload: {}
      is_active: {description: Whether the party may be used for new operations; history remains linked when inactive.}
      source_record_id: {}
      accounting_code: {description: External or internal code used to join accounting records.}
      payment_term_id: {description: Default payment term used for new transactions with this party.}
      default_currency: {description: ISO currency used by default for new party transactions.}
      credit_limit: {description: Credit threshold used for customer exposure decisions.}
      tax_identifier: {description: Tax registration identifier required for fiscal joins and output.}
  party_role:
    description: A capability a party performs, without duplicating the party identity.
    columns:
      id: {}
      tenant_id: {}
      party_id: {description: Party that performs the role.}
      role: {description: Operational role such as customer, supplier, or company.}
      default_location_id: {description: Default operational location associated with this role.}
  party_email_address:
    description: Exact tenant-scoped email address used to identify one Party from business correspondence.
    columns:
      id: {}
      tenant_id: {}
      party_id: {description: Direct owning Party; no Document or Source link is duplicated.}
      email: {description: Trimmed display value supplied by the source or operator.}
      normalized_email: {description: Case-normalized exact-match key; not a second business assertion.}
      label: {description: Optional bounded business label such as Orders or Accounts payable.}
  party_hold:
    description: Time-bounded operational restriction applying to a party, including delivery holds.
    columns:
      id: {}
      tenant_id: {}
      party_id: {description: Party whose operation is restricted.}
      hold_type: {description: Scope of the restriction, such as delivery.}
      reason_code: {description: Stable machine-readable reason for the restriction.}
      note: {description: Optional human explanation.}
      created_by: {description: Actor that placed the hold.}
      created_at: {}
      released_at: {description: UTC release timestamp; empty means the hold is active.}
  payment_term:
    description: Tenant-scoped payment condition used to calculate financial due dates.
    columns:
      id: {}
      tenant_id: {}
      code: {description: Stable human-facing lookup code such as NET_30; never used as technical identity.}
      name: {description: Human-readable payment-term name.}
      due_days: {description: Calendar days added to the relevant document date to calculate the due date.}
      requires_prepayment: {description: Explicit policy requiring qualifying allocated payment evidence before customer dispatch.}
      is_active: {description: Whether the term may be assigned to new transactions.}
      source_record_id: {}
  item:
    description: Operational product or service identity used in quantities, stock, and commitments.
    columns:
      id: {}
      tenant_id: {}
      sku: {description: Human-facing stock keeping code used for lookup, never as technical identity.}
      name: {description: Operational display name.}
      unit: {description: Base quantity unit used by inventory and commitments.}
      is_active: {description: Whether the item may be used for new operations.}
      source_record_id: {}
      item_type: {description: Operational behavior class, for example stocked or service.}
      tracking_type: {description: Traceability mode such as none, batch, or serial.}
      default_location_id: {description: Preferred location for item operations.}
