version: 1
entries:
- id: A01
  section: Order intake and order changes
  title: 'Standard order: one customer, one line, in stock'
  question: Is it committed, reserved, shipped, invoiced, paid?
  status: supported
  evidence_level: executable
  summary: Reality derives the customer invoice's open amount from its posted receivable and the payments or credits allocated to it. The invoice is fully settled when the derived open amount reaches zero; an allocation that covers only part leaves the remainder open.
  localized_summaries:
    de: Reality leitet den offenen Betrag einer Kundenrechnung aus der gebuchten Forderung und den zugeordneten Zahlungen oder Gutschriften ab. Die Rechnung ist vollständig ausgeglichen, sobald der offene Betrag null erreicht; eine Teilzahlung lässt den Rest offen.
  limitations: &id001 []
  keywords: []
  question_examples:
  - 'Standard order: one customer, one line, in stock'
  - Is it committed, reserved, shipped, invoiced, paid?
  - How does Reality know whether a customer invoice is fully paid?
  - Wie erkenne ich, dass eine Kundenrechnung vollständig bezahlt ist?
  tools: []
  demo_references: []
  product_paths: []
  related_journeys: []
  internal_evidence:
  - reference: packages/reality-core/tests/scenarios/test_order_to_cash.py::test_order_to_cash_business_story
    note: Shopify order is reserved with no shortage and shipped in two parts, then invoiced, partly paid and credited; open quantity and open amount are asserted, and the trace reaches the raw payload.
- id: A02
  section: Order intake and order changes
  title: Order with 30 lines from several warehouses
  question: What is open per line and per location?
  status: supported
  evidence_level: executable
  summary: 'Reality evaluates: What is open per line and per location? Each line reserves at the order''s warehouse, and the rest of a line at a warehouse a person names; readiness and shipping count every reservation with the stock at its own warehouse, and Stock in another warehouse names the lines whose stock is elsewhere.'
  limitations:
  - A person names the second warehouse; Reality does not spread a reservation across warehouses by itself.
  - Proven with twelve lines; the rule does not depend on the number of lines.
  keywords:
  - several warehouses
  - multi-warehouse order
  - lines from different warehouses
  - mehrere Lager
  - Auftrag aus mehreren Lagern
  - Positionen aus verschiedenen Lagern
  question_examples:
  - Order with 30 lines from several warehouses
  - What is open per line and per location?
  - Can one order be served from two warehouses, line by line?
  - Kann ein Auftrag Position für Position aus zwei Lagern beliefert werden?
  tools:
  - order_create_propose
  - reservation_propose
  - exceptions
  - shipment_dispatch_propose
  demo_references: []
  product_paths: []
  related_journeys: []
  internal_evidence:
  - reference: packages/reality-core/tests/scenarios/test_catalog_orders_and_shipments.py::test_an_order_with_many_lines_is_served_from_two_warehouses
    note: 'Twelve lines, half stocked at home and half in Munich: the home lines reserve at home, the finding names exactly the Munich lines, each is reserved in Munich, every line is ready, and each warehouse ships its own lines in one parcel.'
  - reference: packages/reality-core/tests/test_multi_warehouse_reservations.py
    note: Reserving at a named warehouse, readiness and shipping per warehouse (spec 303).
