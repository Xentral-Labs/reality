- id: A04
  section: Order intake and order changes
  title: Customer raises the quantity after a partial delivery
  question: What is still open after the revision?
  status: supported
  evidence_level: executable
  summary: After 4 of 10 units have shipped and the reviewed order quantity rises to 12, Reality derives 8 units still open. The 4 shipped units remain fulfilled, and the newly open remainder can be reserved and shipped.
  limitations: []
  keywords: []
  question_examples:
  - Customer raises the quantity after a partial delivery
  - What is still open after the revision?
  tools: []
  demo_references: []
  product_paths: []
  related_journeys: []
  internal_evidence:
  - reference: packages/reality-core/tests/scenarios/test_catalog_orders_and_shipments.py::test_raising_the_quantity_after_a_partial_delivery_opens_only_the_rest
    note: '10 ordered, 4 shipped, raised to 12 through the reviewed revision: 8 open, 4 delivered; the rest is reserved again and ships in full.'
  - reference: packages/reality-core/tests/finance/test_commercial_edges.py::test_higher_revision_allows_only_the_new_quantity; tests/test_commitment_revisions.py::test_the_quantity_in_force_is_the_latest_stated
    note: An upward revision is tested only with no delivery before it. No test raises the quantity after a partial shipment and asserts what is still open.
- id: A05
  section: Order intake and order changes
  title: Customer lowers the quantity below the delivered quantity
  question: Is the revision refused or does it demand a return?
  status: supported
  evidence_level: executable
  summary: "Reality evaluates: Is the revision refused or does it demand a return? The revision is accepted, because it is what the customer said, and Shipped beyond the order reports what left beyond the new quantity. It clears when the excess comes back as a return, or when the line is raised again to what was shipped because the customer keeps it."
  limitations:
  - No return request or credit note is created by itself.
  keywords:
  - lowered below delivered
  - over-delivery
  - Mehrlieferung
  - Menge reduziert
  question_examples:
  - Customer lowers the quantity below the delivered quantity
  - Is the revision refused or does it demand a return?
  - The customer reduced the order to 4 but we already shipped 6; what happens?
  - Der Kunde reduziert auf 4, wir haben aber schon 6 geliefert; was passiert?
  tools:
  - commitment_revise_propose
  - exceptions_list
  demo_references: []
  product_paths: []
  related_journeys: []
  internal_evidence:
  - reference: packages/reality-core/tests/scenarios/test_catalog_orders_and_shipments.py::test_a_customer_lowers_a_line_below_what_already_shipped
    note: "10 ordered, 6 shipped, lowered to 4: 2 shipped beyond the order are reported; raising the line to 6 because the customer keeps them clears it."
  - reference: packages/reality-core/tests/test_shipped_beyond_order.py
    note: The finding, its clearing by a return or a raise, a cancelled rest and isolation (spec 313).
