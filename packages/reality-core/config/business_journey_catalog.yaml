- id: A08
  section: Order intake and order changes
  title: Cancelled after picking, before shipment
  question: Does the stock go back, and is that visible?
  status: supported
  evidence_level: executable
  summary: "Reality evaluates: Does the stock go back, and is that visible? Picking moves the goods into the planned delivery's staging location; a cancellation releases the reservation, the delivery shows the goods as waiting to be put back, and the put-back moves them to their bin again."
  limitations:
  - "Picking is recorded per planned delivery; a pick list by bin path or a handheld scan is not modelled."
  keywords:
  - "cancelled after picking"
  - "picked but not shipped"
  - "put back"
  - "staging"
  - "storniert nach Kommissionierung"
  - "zurücklagern"
  - "Kommissionierung"
  question_examples:
  - "Cancelled after picking, before shipment"
  - "Does the stock go back, and is that visible?"
  - "An order was picked and then cancelled; does the stock go back to its bin?"
  - "Ein Auftrag wurde kommissioniert und dann storniert; kommt der Bestand zurück?"
  tools:
  - outbound_delivery_pick_propose
  - commitment_cancel_propose
  - outbound_delivery_put_back_propose
  - outbound_delivery_detail
  demo_references: []
  product_paths: []
  related_journeys: []
  internal_evidence:
  - reference: packages/reality-core/tests/scenarios/test_catalog_orders_and_shipments.py::test_an_order_cancelled_after_picking_goes_back_to_its_bin
    note: "4 picked into the packing zone, then cancelled: the delivery shows 4 to put back until the put-back returns them to the bin."
- id: A09
  section: Order intake and order changes
  title: '"Cancelled" after shipment'
  question: Is it treated as a return or refusal, not a cancellation?
  status: supported
  evidence_level: executable
  summary: 'Reality evaluates: Is it treated as a return or refusal, not a cancellation? A cancellation arriving after shipment cancels nothing; it waits with cancelled_after_shipment and names the return announcement a person confirms.'
  limitations:
  - The return is expected only once a person confirms the announcement; Reality does not announce it by itself.
  keywords:
  - cancelled after shipment
  - Storno nach Versand
  - storniert nach Versand
  question_examples:
  - '"Cancelled" after shipment'
  - Is it treated as a return or refusal, not a cancellation?
  - The shop cancels an order we already shipped
  - Der Shop storniert eine Bestellung, die schon versandt ist
  tools:
  - return_announce
  demo_references: []
  product_paths: []
  related_journeys: []
  internal_evidence:
  - reference: packages/reality-core/tests/scenarios/test_catalog_sources.py::test_a_cancellation_after_shipment_becomes_an_expected_return
    note: 'Both lines shipped, then the shop cancels: nothing is cancelled, the version waits with cancelled_after_shipment naming return_announce, and a confirmed announcement expects the goods back while the promise stays fulfilled.'
- id: A10
  section: Order intake and order changes
  title: Customer swaps a variant/size in an open order
  question: Old commitment closed, new one opened, history kept?
  status: missing
  evidence_level: none
  summary: 'Reality evaluates: Old commitment closed, new one opened, history kept?'
  limitations:
  - Lines cannot be added to an order once it is in operation, and a shop edit that adds a line or raises a quantity is held for review.
  - Swapping a variant on the same order while keeping its history is therefore not possible.
  keywords: []
  question_examples:
  - Customer swaps a variant/size in an open order
  - Old commitment closed, new one opened, history kept?
  tools: []
