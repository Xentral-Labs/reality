  - {code: hubspot, name: HubSpot, category: CRM, capabilities: {company: party, contact: party, deal: sales_opportunity}, deep_links: {company: 'record/0-2/{external_id}', contact: 'record/0-1/{external_id}', deal: 'record/0-3/{external_id}'}}
  - {code: dynamics365, name: Microsoft Dynamics 365, category: CRM, capabilities: {account: party, contact: party, salesorder: sales_order}}
