version: 1
title: Mock Connector Shells
description: Common source definitions without credentials, transport, mapping, or vendor API calls.
notes:
  deep_links: >-
    Optional relative address per source type, appended to the base address a tenant
    configures on its own source system. The only placeholder is {external_id}. A
    connector without a template simply offers no link; nothing is guessed. Templates
    are added per connector once their address shape is confirmed against the vendor.
connectors:
  - {code: demo_data, name: Demo Data, category: Synthetic, capabilities: {order: sales_order, invoice: sales_invoice, payment: payment}}
  - {code: shopify, name: Shopify, category: Commerce, capabilities: {order: sales_order, product: item, customer: party, fulfillment: fulfillment, refund: sales_refund}, deep_links: {order: 'orders/{external_id}', product: 'products/{external_id}', customer: 'customers/{external_id}'}}
  - {code: stripe, name: Stripe, category: Payments, capabilities: {payment_intent: payment, charge: payment, refund: payment_refund, payout: payout}, deep_links: {payment_intent: 'payments/{external_id}', charge: 'payments/{external_id}', refund: 'refunds/{external_id}', payout: 'payouts/{external_id}'}}
  - {code: shopify_payments, name: Shopify Payments, category: Payments, capabilities: {transaction: payment, payout: payout, dispute: payment_dispute}}
  - {code: odoo, name: Odoo, category: ERP, capabilities: {sale.order: sales_order, purchase.order: purchase_order, product.product: item, res.partner: party, account.move: financial_document}}
  - {code: xentral, name: Xentral, category: ERP, capabilities: {order: sales_order, purchase_order: purchase_order, article: item, contact: party, payment: payment}}
  - {code: weclapp, name: weclapp, category: ERP, capabilities: {salesOrder: sales_order, purchaseOrder: purchase_order, article: item, party: party, incomingPayment: payment}}
  - {code: billbee, name: Billbee, category: Commerce, capabilities: {order: sales_order, article: item, customer: party, shipment: fulfillment, invoice: sales_invoice}}
