  commitment:
    category_order: 40
    category: { en: "Warehouse and shipping", de: "Lager und Versand" }
    aliases: ["Lieferzusage", "Lieferverpflichtung"]
    label: { en: "Commitment", de: "Verpflichtung" }
    table: commitment
    grain: one promise to deliver or receive
    key: id
    corrections: revise           # commitment_revision holds the changes
    revision_table:
      table: commitment_revision
      of: commitment_id
      order_by: stated_at
    time: due_at
    coverage: [current, activity_period]
    properties:
      type: { column: type, label: { en: "Type", de: "Art" }, enumerated: true }
      status: { column: status, label: { en: "Status", de: "Status" }, enumerated: true }
      due_at: { column: due_at, label: { en: "Due", de: "Fällig" } }
      quantity: { column: quantity, label: { en: "Quantity", de: "Menge" } }
      currency: { column: currency, label: { en: "Currency", de: "Währung" } }
