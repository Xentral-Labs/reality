# The reporting graph: which tables are business concepts, how they connect, and
# what each number means. Loaded and validated at start by
# services/analytics/graph_model.py; an invalid declaration stops the application.
#
# Three rules make this a model rather than a list:
#   - a node declares grain, key, tenant column and correction semantics
#   - an edge declares direction, multiplicity and the column that carries it
#   - a measure declares unit and additivity
#
# Nothing here creates a database object. Every entry describes how an existing
# table is read.

version: 1
model_version: sales.1
language: business terms are English here; the web surface translates them

defaults:
  tenant_column: tenant_id
  corrections: replace          # must still be stated per node; this only catches typos


# ---------------------------------------------------------------------------
# NODES
# ---------------------------------------------------------------------------

nodes:

  party:
    label: { en: "Business partner", de: "Geschäftspartner" }
    table: party
    grain: one business partner
    key: id
    corrections: replace
    coverage: [current]         # current label only; no attribute history exists
    evidence: source_record_id
    properties:
      name: { column: name, label: { en: "Name", de: "Name" } }
      type: { column: type, label: { en: "Type", de: "Art" } }
      is_active: { column: is_active, label: { en: "Active", de: "Aktiv" } }
      default_currency: { column: default_currency, label: { en: "Currency", de: "Währung" } }
      accounting_code: { column: accounting_code, label: { en: "Account", de: "Konto" } }
      credit_limit: { column: credit_limit, label: { en: "Credit limit", de: "Kreditlimit" } }

  item:
    label: { en: "Article", de: "Artikel" }
    measures: none            # traversed and filtered, never summed
    table: item
    grain: one article
    key: id
    corrections: replace
    coverage: [current]
    evidence: source_record_id
    properties:
      sku: { column: sku, label: { en: "Article number", de: "Artikelnummer" } }
      name: { column: name, label: { en: "Name", de: "Name" } }
      unit: { column: unit, label: { en: "Unit", de: "Einheit" } }
      item_type: { column: item_type, label: { en: "Article type", de: "Artikelart" } }
      tracking_type: { column: tracking_type, label: { en: "Tracking", de: "Rückverfolgung" } }
      is_active: { column: is_active, label: { en: "Active", de: "Aktiv" } }

  order:
    label: { en: "Sales order", de: "Auftrag" }
    table: document
    where: { type: sales_order }
    grain: one retained sales order
    key: id
    corrections: replace
    time: ordered_at
    coverage: [current, activity_period]
    evidence: source_record_id
    properties:
      number: { column: number, label: { en: "Number", de: "Nummer" } }
      ordered_at: { column: ordered_at, label: { en: "Order date", de: "Bestelldatum" } }
      document_date: { column: document_date, label: { en: "Document date", de: "Belegdatum" } }
      requested_delivery_at: { column: requested_delivery_at, label: { en: "Requested delivery", de: "Wunschtermin" } }
      currency: { column: currency, label: { en: "Currency", de: "Währung" } }
      status: { column: status, label: { en: "Status", de: "Status" } }
      sales_channel: { column: sales_channel, label: { en: "Channel", de: "Kanal" } }
      customer_reference: { column: customer_reference, label: { en: "Customer reference", de: "Kundenreferenz" } }

  order_line:
    label: { en: "Order line", de: "Auftragsposition" }
    table: document_line
    of: order                   # only lines whose document is an order node
    grain: one order position
    key: id
    corrections: replace
    time: requested_at
    coverage: [current, activity_period]
    properties:
      sku: { column: sku, label: { en: "Article number", de: "Artikelnummer" } }
      description: { column: description, label: { en: "Description", de: "Bezeichnung" } }
      quantity: { column: quantity, label: { en: "Quantity", de: "Menge" } }
      unit: { column: unit, label: { en: "Unit", de: "Einheit" } }
      line_type: { column: line_type, label: { en: "Line type", de: "Positionsart" } }
      promised_at: { column: promised_at, label: { en: "Promised", de: "Zugesagt" } }
      requested_at: { column: requested_at, label: { en: "Requested", de: "Gewünscht" } }

  invoice:
    label: { en: "Invoice", de: "Rechnung" }
    table: document
    where: { type: [sales_invoice, credit_note] }
    grain: one invoice or credit note
    key: id
    corrections: replace
    time: document_date
    coverage: [current, activity_period]
    evidence: source_record_id
    properties:
      number: { column: number, label: { en: "Number", de: "Nummer" } }
      document_date: { column: document_date, label: { en: "Document date", de: "Belegdatum" } }
      currency: { column: currency, label: { en: "Currency", de: "Währung" } }
      status: { column: status, label: { en: "Status", de: "Status" } }
      type: { column: type, label: { en: "Type", de: "Art" } }

  invoice_line:
    label: { en: "Invoice line", de: "Rechnungsposition" }
    table: document_line
    of: invoice
    grain: one invoice position
    key: id
    corrections: replace
    properties:
      sku: { column: sku, label: { en: "Article number", de: "Artikelnummer" } }
      description: { column: description, label: { en: "Description", de: "Bezeichnung" } }
      quantity: { column: quantity, label: { en: "Quantity", de: "Menge" } }
      unit: { column: unit, label: { en: "Unit", de: "Einheit" } }

  commitment:
    label: { en: "Commitment", de: "Verpflichtung" }
    table: commitment
    grain: one promise to deliver or receive
    key: id
    corrections: revise           # commitment_revision holds the changes
    revision_table:
      table: commitment_revision
      of: commitment_id
      order_by: stated_at
    time: due_at
    coverage: [current, activity_period]
    properties:
      type: { column: type, label: { en: "Type", de: "Art" } }
      status: { column: status, label: { en: "Status", de: "Status" } }
      due_at: { column: due_at, label: { en: "Due", de: "Fällig" } }
      quantity: { column: quantity, label: { en: "Quantity", de: "Menge" } }
      currency: { column: currency, label: { en: "Currency", de: "Währung" } }
      priority: { column: priority, label: { en: "Priority", de: "Priorität" } }

  posting:
    label: { en: "Ledger entry", de: "Buchung" }
    table: ledger_entry
    grain: one ledger entry
    key: id
    corrections: compensate       # ledger_reversal adds a reversing group, never deletes
    correction_table:
      table: ledger_reversal
      original: original_posting_group_id
      compensating: reversing_posting_group_id
      joins_on: posting_group_id     # a reversal names a posting group, not one entry
    time: effective_at
    coverage: [current, activity_period]
    evidence: source_record_id
    properties:
      posting_group_id: { column: posting_group_id, label: { en: "Posting group", de: "Buchungsgruppe" } }
      effective_at: { column: effective_at, label: { en: "Effective", de: "Wirksam" } }
      currency: { column: currency, label: { en: "Currency", de: "Währung" } }
      debit_credit: { column: debit_credit, label: { en: "Debit/credit", de: "Soll/Haben" } }

  allocation:
    label: { en: "Settlement", de: "Zahlungszuordnung" }
    table: settlement_allocation
    grain: one settlement of a payment against an invoice
    key: id
    corrections: replace
    time: allocated_at
    coverage: [current, activity_period]
    properties:
      allocated_at: { column: allocated_at, label: { en: "Allocated", de: "Zugeordnet" } }
      currency: { column: currency, label: { en: "Currency", de: "Währung" } }

  movement:
    label: { en: "Stock movement", de: "Warenbewegung" }
    table: movement
    grain: one stock movement
    key: id
    corrections: compensate       # movement_correction adds a compensating movement
    correction_table:
      table: movement_correction
      original: original_movement_id
      compensating: compensating_movement_id
      replacement: replacement_movement_id
    time: occurred_at
    coverage: [current, activity_period]
    evidence: source_record_id
    properties:
      type: { column: type, label: { en: "Type", de: "Art" } }
      occurred_at: { column: occurred_at, label: { en: "Occurred", de: "Geschehen" } }
      quantity: { column: quantity, label: { en: "Quantity", de: "Menge" } }

  shipment:
    label: { en: "Shipment", de: "Versand" }
    measures: none            # traversed and filtered, never summed
    table: shipment
    grain: one shipment
    key: id
    corrections: replace
    time: created_at
    coverage: [current, activity_period]
    evidence: source_record_id
    properties:
      direction: { column: direction, label: { en: "Direction", de: "Richtung" } }
      purpose: { column: purpose, label: { en: "Purpose", de: "Zweck" } }
      created_at: { column: created_at, label: { en: "Created", de: "Angelegt" } }

  location:
    label: { en: "Location", de: "Lagerort" }
    measures: none            # traversed and filtered, never summed
    table: location
    grain: one storage location
    key: id
    corrections: replace
    coverage: [current]
    properties:
      name: { column: name, label: { en: "Name", de: "Name" } }
      type: { column: type, label: { en: "Type", de: "Art" } }
      is_active: { column: is_active, label: { en: "Active", de: "Aktiv" } }
      allows_stock: { column: allows_stock, label: { en: "Holds stock", de: "Bestandsführend" } }

  return_announcement:
    label: { en: "Announced return", de: "Angekündigte Retoure" }
    table: return_announcement
    grain: one announced customer return
    key: id
    corrections: replace
    time: announced_at
    coverage: [current, activity_period]
    evidence: source_record_id
    properties:
      reference: { column: reference, label: { en: "Reference", de: "Referenz" } }
      reason: { column: reason, label: { en: "Reason", de: "Grund" } }
      status: { column: status, label: { en: "Status", de: "Status" } }
      quantity: { column: quantity, label: { en: "Quantity", de: "Menge" } }
      announced_at: { column: announced_at, label: { en: "Announced", de: "Angekündigt" } }
      expected_by: { column: expected_by, label: { en: "Expected", de: "Erwartet" } }

  # --- an object type the schema does not model -----------------------------
  # Backed by fact rows, not by a table. This is how a new business concept
  # becomes queryable without a migration. It obeys exactly the same rules.
  campaign:
    label: { en: "Campaign", de: "Kampagne" }
    measures: none            # traversed and filtered, never summed
    from_facts:
      subject_type: campaign
      properties:                 # predicate -> property, with an explicit cast
        name:       { predicate: campaign_name,  cast: text }
        started_at: { predicate: campaign_start, cast: timestamp }
    grain: one campaign
    key: subject_id
    corrections: replace          # the latest fact per predicate wins
    coverage: [current]


# ---------------------------------------------------------------------------
# EDGES
#
# Two kinds, one query language:
#   via:  the link already exists in a column. Nothing is stored; it is declared.
#   fact: the link does not exist yet. Each instance is a fact row somebody creates.
# ---------------------------------------------------------------------------

edges:

  # --- sales ----------------------------------------------------------------
  ordered_by:
    label: { en: "ordered by", de: "bestellt von" }
    from: order
    to: party
    via: document.party_id
    multiplicity: n:1
    nullable: true              # an order without a resolved party stays visible

  ships_to:
    label: { en: "delivered to", de: "geliefert an" }
    from: order
    to: party
    via: document.ship_to_party_id
    multiplicity: n:1
    nullable: true

  contains:
    label: { en: "contains", de: "enthält" }
    from: order
    to: order_line
    via: document_line.document_id
    multiplicity: 1:n           # the fan-out that makes order-grain sums need folding

  of_item:
    label: { en: "for article", de: "für Artikel" }
    from: order_line
    to: item
    via: document_line.item_id
    multiplicity: n:1
    nullable: true              # a free-text line has no article

  default_location:
    label: { en: "default location", de: "Standardlagerort" }
    from: item
    to: location
    via: item.default_location_id
    multiplicity: n:1
    nullable: true              # an article without a default location is normal

  # --- billing --------------------------------------------------------------
  invoiced_to:
    label: { en: "invoiced to", de: "berechnet an" }
    from: invoice
    to: party
    via: document.party_id
    multiplicity: n:1
    nullable: true

  invoice_contains:
    label: { en: "contains", de: "enthält" }
    from: invoice
    to: invoice_line
    via: document_line.document_id
    multiplicity: 1:n

  bills:
    label: { en: "bills", de: "berechnet" }
    from: invoice_line
    to: order_line
    via: document_line.billed_document_line_id
    multiplicity: n:1           # the column sits on the invoice line and points back
    nullable: true              # partial and consolidated billing leave it unset

  # --- promises and fulfilment ---------------------------------------------
  # Corrected against data-model.md: there is no direct order_line -> movement
  # column. The path runs through commitment, which is what actually links them.
  promises:
    label: { en: "promises", de: "sagt zu" }
    from: order_line
    to: commitment
    via: commitment.document_line_id
    multiplicity: 1:n
    nullable: true

  commitment_of_item:
    label: { en: "for article", de: "für Artikel" }
    from: commitment
    to: item
    via: commitment.item_id
    multiplicity: n:1
    nullable: true

  commitment_for_document:
    label: { en: "for order", de: "zum Auftrag" }
    from: commitment
    to: order
    via: commitment.document_id
    multiplicity: n:1
    nullable: true              # document-level link beside the line-level one

  commitment_at_location:
    label: { en: "at location", de: "am Lagerort" }
    from: commitment
    to: location
    via: commitment.location_id
    multiplicity: n:1
    nullable: true

  fulfilled_by:
    label: { en: "fulfilled by", de: "erfüllt durch" }
    from: commitment
    to: movement
    via: movement.commitment_id
    multiplicity: 1:n
    nullable: true

  moved_item:
    label: { en: "article", de: "Artikel" }
    from: movement
    to: item
    via: movement.item_id
    multiplicity: n:1

  moved_from:
    label: { en: "out of", de: "aus Lagerort" }
    from: movement
    to: location
    via: movement.from_location_id
    multiplicity: n:1
    nullable: true              # a receipt has no origin inside the company

  moved_to:
    label: { en: "into", de: "in Lagerort" }
    from: movement
    to: location
    via: movement.to_location_id
    multiplicity: n:1
    nullable: true              # a shipment has no destination inside the company

  # An outbound movement that settles a customer return: the goods that came back
  # are put away, scrapped or sent on. NOT a correction — movement_correction fixes a
  # wrongly recorded movement, this records a real later physical event. The service
  # enforces: the target is type 'return', same item, and the goods leave the location
  # they came back to, capped at what came back (services/core.py, create movement).
  # It is what the return_unresolved exception class judges.
  resolves:
    label: { en: "settles return", de: "erledigt Retoure" }
    from: movement
    to: movement
    via: movement.resolves_movement_id
    multiplicity: n:1           # several partial resolutions may settle one return
    nullable: true
    target_where: { type: return }

  within:
    label: { en: "inside", de: "innerhalb von" }
    from: location
    to: location
    via: location.parent_location_id
    multiplicity: n:1
    recursive:
      max_depth: 6
      on_cycle: stop            # terminate and report, never exhaust the connection
    nullable: true

  # --- returns --------------------------------------------------------------
  returned_as:
    label: { en: "announced as", de: "angekündigt als" }
    from: movement
    to: return_announcement
    via: movement.return_announcement_id
    multiplicity: n:1
    nullable: true              # only return movements carry it

  announced_for:
    label: { en: "announced for", de: "angekündigt zu" }
    from: return_announcement
    to: commitment
    via: return_announcement.commitment_id
    multiplicity: n:1

  # commitment carries both sides explicitly; for customer_delivery the company is
  # from_party_id and the customer is to_party_id (verified in services/core.py)
  committed_to:
    label: { en: "promised to", de: "zugesagt an" }
    from: commitment
    to: party
    via: commitment.to_party_id
    multiplicity: n:1
    nullable: true

  committed_from:
    label: { en: "promised by", de: "zugesagt von" }
    from: commitment
    to: party
    via: commitment.from_party_id
    multiplicity: n:1
    nullable: true

  # --- finance --------------------------------------------------------------
  # Corrected against data-model.md: ledger_entry carries party_id and document_id
  # directly, so these are plain columns, not a posting-group construction.
  posted_for:
    label: { en: "posted for", de: "gebucht für" }
    from: posting
    to: party
    via: ledger_entry.party_id
    multiplicity: n:1
    nullable: true

  posted_from:
    label: { en: "posted from", de: "gebucht aus" }
    from: posting
    to: invoice
    via: ledger_entry.document_id
    multiplicity: n:1
    nullable: true

  settles:
    label: { en: "settles", de: "gleicht aus" }
    from: allocation
    to: posting
    via: settlement_allocation.invoice_ledger_entry_id
    multiplicity: n:1

  paid_by:
    label: { en: "paid by", de: "bezahlt durch" }
    from: allocation
    to: posting
    via: settlement_allocation.payment_ledger_entry_id
    multiplicity: n:1

  # --- shipping -------------------------------------------------------------
  shipped_to:
    label: { en: "shipped to", de: "versandt an" }
    from: shipment
    to: party
    via: shipment.counterparty_id
    multiplicity: n:1
    nullable: true

  # --- a link somebody creates ---------------------------------------------
  # No column carries this. Each instance is one fact row. Same declaration
  # rules as every other edge — direction, multiplicity, nullability — plus
  # who may create one.
  belongs_to_campaign:
    label: { en: "belongs to campaign", de: "gehört zu Kampagne" }
    from: order
    to: campaign
    fact:
      predicate: belongs_to_campaign
      subject: from             # fact.subject_id is the order, fact.value the campaign
      cast: id
    multiplicity: n:1
    writable:
      by: [member]              # VERIFY against the membership roles in use
      as: assertion             # recorded as a human statement, not as an observation


# ---------------------------------------------------------------------------
# MEASURES
#
# additive_over lists the axes a sum is meaningful across.
# never_across lists the axes where a sum is refused outright.
# ---------------------------------------------------------------------------

measures:

  stated_order_amount:
    label: { en: "Order value", de: "Auftragswert" }
    node: order
    source: gross_amount
    unit: { column: currency, kind: currency }
    additive_over: [time, party, sales_channel, item]
    never_across: [currency]
    unknown: keep               # a missing amount stays unknown, never becomes zero
    note: received order amount; never unit_price multiplied by quantity

  order_count:
    label: { en: "Orders", de: "Anzahl Aufträge" }
    node: order
    source: { distinct: id }
    unit: { kind: count }
    additive_over: [time, party, sales_channel, item]

  line_amount:
    label: { en: "Line value", de: "Positionswert" }
    node: order_line
    source: gross_amount
    unit: { from_node: order, column: currency, kind: currency }
    additive_over: [time, party, item, sales_channel]
    never_across: [currency]
    unknown: keep

  ordered_quantity:
    label: { en: "Ordered quantity", de: "Bestellte Menge" }
    node: order_line
    source: quantity
    unit: { column: unit, kind: measure }
    additive_over: [time, party]
    never_across: [item, unit]  # pieces and kilograms do not add up

  invoiced_amount:
    label: { en: "Invoiced amount", de: "Rechnungsbetrag" }
    node: invoice
    source: gross_amount
    unit: { column: currency, kind: currency }
    additive_over: [time, party]
    never_across: [currency]
    note: credit notes keep their own sign; check type before presenting a total

  posted_amount:
    label: { en: "Posted amount", de: "Buchungsbetrag" }
    node: posting
    source: amount
    unit: { column: currency, kind: currency }
    sign_from: debit_credit     # VERIFY the stored convention before first release
    additive_over: [time, party, account]
    never_across: [currency]

  allocated_amount:
    label: { en: "Allocated amount", de: "Zugeordneter Betrag" }
    node: allocation
    source: amount
    unit: { column: currency, kind: currency }
    additive_over: [time, party]
    never_across: [currency]

  moved_quantity:
    label: { en: "Moved quantity", de: "Bewegte Menge" }
    node: movement
    source: quantity
    unit: { from_node: item, column: unit, kind: measure }
    additive_over: [time, location]
    never_across: [item, unit]
    note: corrections are themselves movements, so a sum over all rows nets out;
          a plain row count over the same rows is refused as inflated

  committed_quantity:
    label: { en: "Promised quantity", de: "Zugesagte Menge" }
    node: commitment
    source: quantity
    unit: { from_node: item, column: unit, kind: measure }
    additive_over: [time, party]
    never_across: [item, unit]
    note: resolved to the latest revision before aggregation

  returned_quantity:
    label: { en: "Returned quantity", de: "Retournierte Menge" }
    node: return_announcement
    source: quantity
    unit: { from_node: item, column: unit, kind: measure }
    additive_over: [time, party]
    never_across: [item, unit]

  invoiced_quantity:
    label: { en: "Invoiced quantity", de: "Berechnete Menge" }
    node: invoice_line
    source: quantity
    unit: { column: unit, kind: measure }
    additive_over: [time, party]
    never_across: [item, unit]

  open_balance:
    label: { en: "Open balance", de: "Offener Saldo" }
    node: party
    source: { service: finance.open_items }
    unit: { kind: currency }
    additive_over: [party]
    never_across: [time]        # a state, not a flow — summing it over months is refused


# ---------------------------------------------------------------------------
# LIMITS
# ---------------------------------------------------------------------------

limits:
  max_path_length: 8
  max_recursive_depth: 6
  result_rows: 10000
  page_rows: 200
  statement_timeout_seconds: 30
  statements_per_traversal: 1   # asserted by the tests, not merely intended


# ---------------------------------------------------------------------------
# STILL OPEN — carried here so it is not lost between spec and implementation
# ---------------------------------------------------------------------------
#
# 1. purchase_order and supplier_invoice nodes: the same shapes on the purchase
#    side. Deliberately out of the first slice, not forgotten.
# 2. movement.resolves_movement_id is a second correction link beside
#    movement_correction. Its exact meaning must be confirmed before movement
#    measures are published.
# 3. posted_amount sign convention: whether debit_credit is a sign or a role.
# 4. Aging needs a derived days_overdue property on invoice from the payment term.
# 5. Writable fact edges need an authorization decision: who may assert a link,
#    whether it is revocable, and whether an assertion is visible to other users
#    of the same company before anybody confirms it.
