  # --- sales ----------------------------------------------------------------
  ordered_by:
    label: { en: "ordered by", de: "bestellt von" }
    from: order
    to: party
    via: document.party_id
    multiplicity: n:1
    nullable: true              # an order without a resolved party stays visible

  ships_to:
    label: { en: "delivered to", de: "geliefert an" }
    from: order
    to: party
    via: document.ship_to_party_id
    multiplicity: n:1
    nullable: true

  contains:
    label: { en: "contains", de: "enthält" }
    from: order
    to: order_line
    via: document_line.document_id
    multiplicity: 1:n           # the fan-out that makes order-grain sums need folding

  of_item:
    label: { en: "for article", de: "für Artikel" }
    from: order_line
    to: item
    via: document_line.item_id
    multiplicity: n:1
    nullable: true              # a free-text line has no article

  default_location:
    label: { en: "default location", de: "Standardlagerort" }
    from: item
    to: location
    via: item.default_location_id
    multiplicity: n:1
    nullable: true              # an article without a default location is normal

  # --- billing --------------------------------------------------------------
  invoiced_to:
    label: { en: "invoiced to", de: "berechnet an" }
    from: invoice
    to: party
    via: document.party_id
    multiplicity: n:1
    nullable: true

  invoice_contains:
    label: { en: "contains", de: "enthält" }
    from: invoice
    to: invoice_line
    via: document_line.document_id
    multiplicity: 1:n

  bills:
    label: { en: "bills", de: "berechnet" }
    from: invoice_line
    to: order_line
    via: document_line.billed_document_line_id
    multiplicity: n:1           # the column sits on the invoice line and points back
    nullable: true              # partial and consolidated billing leave it unset

  # --- promises and fulfilment ---------------------------------------------
  # Corrected against data-model.md: there is no direct order_line -> movement
  # column. The path runs through commitment, which is what actually links them.
  promises:
    label: { en: "promises", de: "sagt zu" }
    from: order_line
    to: commitment
    via: commitment.document_line_id
    multiplicity: 1:n
    nullable: true

  commitment_of_item:
    label: { en: "for article", de: "für Artikel" }
    from: commitment
    to: item
    via: commitment.item_id
    multiplicity: n:1
    nullable: true

  commitment_for_document:
    label: { en: "for order", de: "zum Auftrag" }
    from: commitment
    to: order
    via: commitment.document_id
    multiplicity: n:1
    nullable: true              # document-level link beside the line-level one

  commitment_at_location:
    label: { en: "at location", de: "am Lagerort" }
    from: commitment
    to: location
    via: commitment.location_id
    multiplicity: n:1
    nullable: true

  fulfilled_by:
    label: { en: "fulfilled by", de: "erfüllt durch" }
    from: commitment
    to: movement
    via: movement.commitment_id
    multiplicity: 1:n
    nullable: true

  moved_item:
    label: { en: "article", de: "Artikel" }
    from: movement
    to: item
    via: movement.item_id
    multiplicity: n:1

  moved_from:
    label: { en: "out of", de: "aus Lagerort" }
    from: movement
    to: location
    via: movement.from_location_id
    multiplicity: n:1
    nullable: true              # a receipt has no origin inside the company

  moved_to:
    label: { en: "into", de: "in Lagerort" }
    from: movement
    to: location
    via: movement.to_location_id
    multiplicity: n:1
    nullable: true              # a shipment has no destination inside the company

  # An outbound movement that settles a customer return: the goods that came back
  # are put away, scrapped or sent on. NOT a correction — movement_correction fixes a
  # wrongly recorded movement, this records a real later physical event. The service
  # enforces: the target is type 'return', same item, and the goods leave the location
  # they came back to, capped at what came back (services/core.py, create movement).
  # It is what the return_unresolved exception class judges.
  resolves:
    label: { en: "settles return", de: "erledigt Retoure" }
    from: movement
    to: movement
    via: movement.resolves_movement_id
    multiplicity: n:1           # several partial resolutions may settle one return
    nullable: true
    target_where: { type: return }

  within:
    label: { en: "inside", de: "innerhalb von" }
    from: location
    to: location
    via: location.parent_location_id
    multiplicity: n:1
    recursive:
      max_depth: 6
      on_cycle: stop            # terminate and report, never exhaust the connection
    nullable: true

  # --- returns --------------------------------------------------------------
  returned_as:
    label: { en: "announced as", de: "angekündigt als" }
    from: movement
    to: return_announcement
    via: movement.return_announcement_id
    multiplicity: n:1
    nullable: true              # only return movements carry it

  announced_for:
    label: { en: "announced for", de: "angekündigt zu" }
    from: return_announcement
    to: commitment
    via: return_announcement.commitment_id
    multiplicity: n:1

  # commitment carries both sides explicitly; for customer_delivery the company is
  # from_party_id and the customer is to_party_id (verified in services/core.py)
  committed_to:
    label: { en: "promised to", de: "zugesagt an" }
    from: commitment
    to: party
    via: commitment.to_party_id
    multiplicity: n:1
    nullable: true

  committed_from:
    label: { en: "promised by", de: "zugesagt von" }
    from: commitment
    to: party
    via: commitment.from_party_id
    multiplicity: n:1
    nullable: true

  # --- finance --------------------------------------------------------------
  # Corrected against data-model.md: ledger_entry carries party_id and document_id
  # directly, so these are plain columns, not a posting-group construction.
  posted_for:
    label: { en: "posted for", de: "gebucht für" }
    from: posting
    to: party
    via: ledger_entry.party_id
    multiplicity: n:1
    nullable: true

  posted_from:
    label: { en: "posted from", de: "gebucht aus" }
    from: posting
    to: invoice
    via: ledger_entry.document_id
    multiplicity: n:1
    nullable: true

  settles:
    label: { en: "settles", de: "gleicht aus" }
    from: allocation
    to: posting
    via: settlement_allocation.invoice_ledger_entry_id
    multiplicity: n:1

  paid_by:
    label: { en: "paid by", de: "bezahlt durch" }
    from: allocation
    to: posting
    via: settlement_allocation.payment_ledger_entry_id
    multiplicity: n:1

  # --- shipping -------------------------------------------------------------
  shipped_to:
    label: { en: "shipped to", de: "versandt an" }
    from: shipment
    to: party
    via: shipment.counterparty_id
    multiplicity: n:1
    nullable: true

  # --- a link somebody creates ---------------------------------------------
  # No column carries this. Each instance is one fact row. Same declaration
  # rules as every other edge — direction, multiplicity, nullability — plus
  # who may create one.
  belongs_to_campaign:
    label: { en: "belongs to", de: "gehört zu" }
    from: order
    to: campaign
    fact:
      predicate: belongs_to_campaign
      subject: from             # fact.subject_id is the order, fact.value the campaign
      cast: id
    multiplicity: n:1
    writable:
      by: [member]              # VERIFY against the membership roles in use
      as: assertion             # recorded as a human statement, not as an observation


