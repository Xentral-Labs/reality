      quantity: { column: quantity, label: { en: "Quantity", de: "Menge" } }
      announced_at: { column: announced_at, label: { en: "Announced", de: "Angekündigt" } }
      expected_by: { column: expected_by, label: { en: "Expected", de: "Erwartet" } }

  # --- an object type the schema does not model -----------------------------
  # Backed by fact rows, not by a table. This is how a new business concept
  # becomes queryable without a migration. It obeys exactly the same rules.
  campaign:
    category_order: 80
    category: { en: "Additional objects", de: "Weitere Objekte" }
    label: { en: "Campaign", de: "Kampagne" }
    measures: none            # traversed and filtered, never summed
    from_facts:
      subject_type: campaign
      properties:                 # predicate -> property, with an explicit cast
        name:       { predicate: campaign_name,  cast: text }
        started_at: { predicate: campaign_start, cast: timestamp }
    grain: one campaign
    key: subject_id
    corrections: replace          # the latest fact per predicate wins
    coverage: [current]

