    never_across: [item, unit]  # pieces and kilograms do not add up

  unbilled_order_quantity:
    label: { en: "Unbilled quantity", de: "Unberechnete Menge" }
    node: order_line
    source: quantity
    less:
      measure: invoiced_quantity
      over: [{ edge: bills, direction: in }]
    unit: { column: unit, kind: measure }
    additive_over: [time, party]
    never_across: [item, unit]
    note: ordered less what invoice lines bill against this line; it says nothing
          about what was shipped, which is a movement question

  invoiced_amount:
    label: { en: "Invoiced amount", de: "Rechnungsbetrag" }
    node: invoice
    source: gross_amount
    unit: { column: currency, kind: currency }
    additive_over: [time, party]
    never_across: [currency]
    note: credit notes keep their own sign; check type before presenting a total

  posted_amount:
    label: { en: "Posted amount", de: "Buchungsbetrag" }
    node: posting
    source: amount
    unit: { column: currency, kind: currency }
    sign_from: debit_credit     # Canonical convention: debit positive, credit negative.
    additive_over: [time, party, account]
    never_across: [currency]

  allocated_amount:
    label: { en: "Allocated amount", de: "Zugeordneter Betrag" }
    node: allocation
