      table: movement_correction
      original: original_movement_id
      compensating: compensating_movement_id
      replacement: replacement_movement_id
    time: occurred_at
    coverage: [current, activity_period]
    evidence: source_record_id
    properties:
      type: { column: type, label: { en: "Type", de: "Art" }, enumerated: true }
      occurred_at: { column: occurred_at, label: { en: "Occurred", de: "Geschehen" } }
      quantity: { column: quantity, label: { en: "Quantity", de: "Menge" } }

  shipment:
    category_order: 40
    category: { en: "Warehouse and shipping", de: "Lager und Versand" }
