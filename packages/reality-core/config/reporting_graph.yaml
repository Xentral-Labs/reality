# The reporting graph: which tables are business concepts, how they connect, and
# what each number means. Loaded and validated at start by
# services/analytics/graph_model.py; an invalid declaration stops the application.
#
# Three rules make this a model rather than a list:
#   - a node declares grain, key, tenant column and correction semantics
#   - an edge declares direction, multiplicity and the column that carries it
#   - a measure declares unit and additivity
#
# Nothing here creates a database object. Every entry describes how an existing
# table is read.

version: 1
model_version: sales.1
language: business terms are English here; the web surface translates them

defaults:
  tenant_column: tenant_id
  corrections: replace          # must still be stated per node; this only catches typos


# ---------------------------------------------------------------------------
# NODES
# ---------------------------------------------------------------------------

nodes:

  party:
    category_order: 50
    category: { en: "Partners and items", de: "Partner und Artikel" }
    aliases: ["Kunde", "Lieferant", "customer", "supplier"]
    label: { en: "Business partner", de: "Geschäftspartner" }
    table: party
    grain: one business partner
    key: id
    corrections: replace
    coverage: [current]         # current label only; no attribute history exists
    evidence: source_record_id
    properties:
      name: { column: name, label: { en: "Name", de: "Name" } }
      type: { column: type, label: { en: "Type", de: "Art" }, enumerated: true }
      is_active: { column: is_active, label: { en: "Active", de: "Aktiv" } }
      default_currency: { column: default_currency, label: { en: "Currency", de: "Währung" } }
      accounting_code: { column: accounting_code, label: { en: "Account", de: "Konto" } }
      credit_limit: { column: credit_limit, label: { en: "Credit limit", de: "Kreditlimit" } }

  item:
    category_order: 50
    category: { en: "Partners and items", de: "Partner und Artikel" }
    label: { en: "Article", de: "Artikel" }
    measures: none            # traversed and filtered, never summed
    table: item
    grain: one article
    key: id
    corrections: replace
    coverage: [current]
    evidence: source_record_id
    properties:
      sku: { column: sku, label: { en: "Article number", de: "Artikelnummer" } }
      name: { column: name, label: { en: "Name", de: "Name" } }
      unit: { column: unit, label: { en: "Unit", de: "Einheit" } }
      item_type: { column: item_type, label: { en: "Article type", de: "Artikelart" } }
      tracking_type: { column: tracking_type, label: { en: "Tracking", de: "Rückverfolgung" } }
      is_active: { column: is_active, label: { en: "Active", de: "Aktiv" } }

  order:
    category_order: 10
    category: { en: "Sales", de: "Verkauf" }
    label: { en: "Sales order", de: "Kundenauftrag" }
    table: document
    where: { type: sales_order }
    grain: one retained sales order
    key: id
    corrections: replace
    time: ordered_at
    coverage: [current, activity_period]
    evidence: source_record_id
    properties:
      number: { column: number, label: { en: "Number", de: "Nummer" } }
      ordered_at: { column: ordered_at, label: { en: "Order date", de: "Bestelldatum" } }
      document_date: { column: document_date, temporal: date, label: { en: "Document date", de: "Belegdatum" } }
      requested_delivery_at: { column: requested_delivery_at, label: { en: "Requested delivery", de: "Wunschtermin" } }
      currency: { column: currency, label: { en: "Currency", de: "Währung" } }
      status: { column: status, label: { en: "Status", de: "Status" }, enumerated: true }
      sales_channel: { column: sales_channel, label: { en: "Channel", de: "Kanal" }, enumerated: true }
      customer_reference: { column: customer_reference, label: { en: "Customer reference", de: "Kundenreferenz" } }

  order_line:
    category_order: 10
    category: { en: "Sales", de: "Verkauf" }
    label: { en: "Order line", de: "Auftragsposition" }
    table: document_line
    of: order                   # only lines whose document is an order node
    grain: one order position
    key: id
    corrections: replace
    time: requested_at
    coverage: [current, activity_period]
    properties:
      sku: { column: sku, label: { en: "Article number", de: "Artikelnummer" } }
      description: { column: description, label: { en: "Description", de: "Bezeichnung" } }
      quantity: { column: quantity, label: { en: "Quantity", de: "Menge" } }
      unit: { column: unit, label: { en: "Unit", de: "Einheit" } }
      line_type: { column: line_type, label: { en: "Line type", de: "Positionsart" } }
      promised_at: { column: promised_at, label: { en: "Promised", de: "Zugesagt" } }
      requested_at: { column: requested_at, label: { en: "Requested", de: "Gewünscht" } }

  invoice:
    category_order: 10
    category: { en: "Sales", de: "Verkauf" }
    label: { en: "Customer invoices and credits", de: "Kundenrechnungen und Gutschriften" }
    table: document
    where: { type: [sales_invoice, credit_note] }
    grain: one invoice or credit note
    key: id
    corrections: replace
    time: document_date
    coverage: [current, activity_period]
    evidence: source_record_id
