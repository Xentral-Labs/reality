      en: Current quantities per article across all locations. Available = physical stock minus active reservations;
        no shipment permission or historic stock.
      de: Aktuelle Mengen je Artikel über alle Lagerorte. Verfügbar = Bestand minus aktive Reservierungen;
        keine Versandfreigabe oder historische Bestandsansicht.
