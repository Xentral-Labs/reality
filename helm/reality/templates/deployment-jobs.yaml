{{/*
  Background job runners: the scheduler materialises due work, the worker
  executes it. Both ship their own image with their own entrypoint
  (reality-scheduler / reality-worker), matching compose.yml's `background`
  profile.

  Unlike the invitation worker these do NOT need the `python -c` workaround:
  their Typer apps have no root callback running `alembic upgrade head`, so
  invoking the CLI directly is safe.

  Replicas are safely scalable. Work is claimed by locking the tenant row with
  `with_for_update(skip_locked=True)` (services/projection_jobs.py), so a second
  replica skips a tenant another is already working rather than duplicating it.
  One each is plenty until there are many tenants.
*/}}
{{- range $name := list "scheduler" "worker" }}
{{- $component := index $.Values $name }}
{{- if $component.enabled }}
{{- $c := mustMergeOverwrite (dict "image" (dict "tagPrefix" (printf "%s-" $name)) "secrets" true) (deepCopy $component) }}
{{- $_ := set $c "env" (dict "REALITY_BACKGROUND_HEALTH_PORT" (printf "%v" $component.port)) }}
{{/*
  The runner only starts its health server when REALITY_BACKGROUND_HEALTH_PORT
  is set (jobs/runtime.py), and it serves exactly /healthz. Liveness only: these
  take no inbound traffic and have no Service, so readiness would gate nothing.
*/}}
{{- $_ := set $c "probes" (dict
      "startupProbe" (dict "httpGet" (dict "path" "/healthz" "port" "http") "initialDelaySeconds" 5 "periodSeconds" 5 "timeoutSeconds" 5 "failureThreshold" 30)
      "livenessProbe" (dict "httpGet" (dict "path" "/healthz" "port" "http") "periodSeconds" 30 "timeoutSeconds" 5 "failureThreshold" 5)) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reality.fullname" $ }}-{{ $name }}
  labels:
    {{- include "reality.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $component.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "reality.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "reality.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
      annotations:
        checksum/secret-keys: {{ include "reality.secretChecksum" $ }}
    spec:
      {{- include "reality.podSpec" (list $ $name $c) | nindent 6 }}
{{- end }}
{{- end }}
