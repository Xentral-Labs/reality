{{- if and .Values.externalSecret.enabled (not .Values.secrets.existingSecret) }}
{{/*
  Pulls Reality's secrets out of Vault via the External Secrets Operator and
  materialises them as one Kubernetes Secret, which every Python workload loads
  with envFrom.

  apiVersion MUST be external-secrets.io/v1. This cluster runs the
  external-secrets chart 2.10.0 / operator v2.10.0, whose CRDs serve only v1 —
  v1beta1 is still declared but `served: false` unless crds.unsafeServeV1Beta1
  is set — so a v1beta1 manifest is rejected outright.

  Rendered as a HOOK, ahead of the migration Job.
  The Job runs as a pre-install/pre-upgrade hook and mounts this Secret with
  envFrom, but Helm applies hooks BEFORE the ordinary release manifest and
  ArgoCD runs PreSync before Sync — so as a plain resource this ExternalSecret
  would not exist yet and the very first install could never succeed. Weight -10
  puts it ahead of the Job at weight 0.

  Even so, ESO needs a moment to reconcile. A pod whose envFrom Secret is not
  there yet sits in CreateContainerConfigError and the kubelet keeps retrying
  the container, so the Job recovers on its own as soon as the Secret lands —
  provided the ClusterSecretStore already exists. It is a hard prerequisite, not
  a note: see prerequisites/clustersecretstore.yaml.

  Because it is a hook it is not tracked in the release manifest, so `helm
  uninstall` leaves it behind; delete it by hand when tearing a release down.

  EVERY key listed must already exist at the Vault path. ESO's v1 schema has no
  per-key optional flag, and one missing property fails the whole sync — so all
  keys stop resolving, not just that one. Populate Vault first, then add the key.
*/}}
{{- $path := required "externalSecret.path must be set when externalSecret.enabled=true — the KV v2 path WITHOUT the `kv/` mount and `data/` segment, e.g. internal/<cluster>/templates/reality" .Values.externalSecret.path }}
{{- $keys := .Values.externalSecret.keys | default list }}
{{- if .Values.bootstrap.platformAdmin.enabled }}
{{- $keys = concat $keys (list "REALITY_PLATFORM_ADMIN_EMAIL" "REALITY_PLATFORM_ADMIN_PASSWORD") }}
{{- end }}
{{- if eq .Values.email.provider "resend" }}
{{- $keys = append $keys "RESEND_API_KEY" }}
{{- end }}
{{- if eq .Values.email.provider "smtp" }}
{{- $keys = concat $keys (list "REALITY_SMTP_USERNAME" "REALITY_SMTP_PASSWORD") }}
{{- end }}
{{- if .Values.copilot.managedKey }}
{{- $keys = append $keys "ANTHROPIC_API_KEY" }}
{{- if .Values.copilot.sendWorkspaceId }}
{{- $keys = append $keys "ANTHROPIC_WORKSPACE_ID" }}
{{- end }}
{{- end }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "reality.fullname" . }}-secrets
  labels:
    {{- include "reality.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "reality.secretName" . }}
    creationPolicy: Owner
    # Retain so the Secret outlives a hook recreation of this ExternalSecret,
    # which keeps running pods from losing their env mid-upgrade.
    deletionPolicy: Retain
  data:
    {{- range ($keys | uniq) }}
    - secretKey: {{ . }}
      remoteRef:
        key: {{ $path }}
        property: {{ . }}
    {{- end }}
{{- end }}
