{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "reality.serviceAccountName" . }}
  labels:
    {{- include "reality.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Unlike the agent-os chart this can stay false: secrets arrive through the
# External Secrets Operator, which authenticates to Vault with its OWN service
# account. Nothing in these pods calls the Kubernetes API or Vault directly.
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
