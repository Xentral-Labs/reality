# Reality Local for macOS (spec 240 FR-010, FR-012, FR-016).
#
# STATUS: scaffold. This workflow has never been executed. It reproduces the steps that
# built the mac-v0.1.0 beta by hand and adds the signing, notarization and stapling that
# release requires but did not have. Until the Apple secrets below exist, the signing
# steps are skipped and the artifact stays ad-hoc signed and clearly labelled unsigned.
#
# Required repository secrets for a signed release:
#   APPLE_CERTIFICATE_P12       Developer ID Application certificate, base64 of the .p12
#   APPLE_CERTIFICATE_PASSWORD  password of that .p12
#   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Example GmbH (ABCDE12345)"
#   APPLE_TEAM_ID               ten-character Apple developer team identifier
#   APPLE_PROVISIONING_PROFILE  base64 Developer ID profile authorizing the app identifier
#   APPLE_API_KEY_ID            App Store Connect API key id used by notarytool
#   APPLE_API_ISSUER_ID         its issuer id
#   APPLE_API_PRIVATE_KEY       base64 of the .p8 private key
#
# The release is always created as a PRE-RELEASE. installer/install.sh resolves the
# self-hosted version through the GitHub "latest release" API, and a normal release here
# would hand it a mac tag it cannot use.

name: macOS release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, without the mac-v prefix
        required: true
        default: 0.1.0
      publish:
        description: Attach the result to a pre-release
        type: boolean
        default: false
      tester_beta:
        description: Build a private unsigned artifact for named testers only
        type: boolean
        default: false
  push:
    tags:
      - "mac-v*"

permissions:
  contents: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record the resolved version
        run: |
          version="${VERSION#mac-v}"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building Reality Local $version"

      - name: Refuse public unsigned tester beta
        if: inputs.tester_beta && (startsWith(github.ref, 'refs/tags/mac-v') || inputs.publish)
        run: |
          echo "::error::Unsigned tester betas cannot be published or built from release tags."
          exit 1

      # The runtime is pinned by SHA-256 in the lock; a cache hit skips the long build.
      - name: Cache the bundled runtime base
        id: runtime-cache
        uses: actions/cache@v4
        with:
          path: apps/desktop/build/runtime-base
          key: runtime-base-${{ hashFiles('apps/desktop/scripts/runtime-dependencies.lock', 'apps/desktop/scripts/build-runtime.py') }}

      - name: Download the pinned build inputs
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p apps/desktop/build/downloads
          python3 - <<'PYTHON'
          import json, subprocess
          from pathlib import Path

          lock = json.loads(Path("apps/desktop/scripts/runtime-dependencies.lock").read_text())
          cache = Path("apps/desktop/build/downloads")
          for name, entry in lock.items():
              if not isinstance(entry, dict) or "url" not in entry:
                  continue
              target = cache / entry["archive"]
              print(f"Fetching {name} into {target}")
              subprocess.run(["curl", "-fsSL", "-o", str(target), entry["url"]], check=True)
          PYTHON

      - name: Build the bundled Python and PostgreSQL
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          python3 apps/desktop/scripts/build-runtime.py \
            --cache apps/desktop/build/downloads \
            --output apps/desktop/build/runtime-base \
            --jobs 4

      - name: Install the Python toolchain
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet hatchling
          .venv/bin/python -m pip download --only-binary=:all: --require-hashes \
            -r apps/desktop/scripts/python-requirements.lock \
            -d apps/desktop/build/wheelhouse

      - name: Build the core wheel
        run: |
          cd packages/reality-core
          ../../.venv/bin/python -m hatchling build -d ../../apps/desktop/build/wheel -t wheel

      - name: Assemble the runtime
        run: |
          .venv/bin/python apps/desktop/scripts/assemble-runtime.py \
            --runtime apps/desktop/build/runtime-base \
            --wheelhouse apps/desktop/build/wheelhouse \
            --core-wheel apps/desktop/build/wheel/business_reality-0.0.1-py3-none-any.whl \
            --output apps/desktop/build/runtime

      - name: Smoke the assembled runtime
        run: .venv/bin/python apps/desktop/scripts/runtime-smoke.py --runtime apps/desktop/build/runtime

      - name: Build the product frontend
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/web run build

      - name: Build the native shell
        run: cargo build --release --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Package the application
        run: |
          beta=()
          if [ "${{ inputs.tester_beta }}" = "true" ]; then
            beta=("--unsigned-tester-beta")
          fi
          .venv/bin/python apps/desktop/scripts/package-preview.py \
            --runtime apps/desktop/build/runtime \
            --binary apps/desktop/src-tauri/target/release/reality-local \
            --frontend apps/web/dist \
            --version "$RELEASE_VERSION" \
            "${beta[@]}" \
            --output "apps/desktop/dist/Reality Local.app"

      - name: Verify that data survives a restart
        run: |
          .venv/bin/python apps/desktop/scripts/verify-persistence.py \
            --runtime apps/desktop/build/runtime

      - name: Record the packaged application inputs
        run: |
          beta=()
          if [ "${{ inputs.tester_beta }}" = "true" ]; then
            beta=("--unsigned-tester-beta")
          fi
          python3 apps/desktop/scripts/release-manifest.py \
            --root "apps/desktop/dist/Reality Local.app" \
            --version "$RELEASE_VERSION" \
            --artifact app-inputs \
            --output apps/desktop/dist/Reality-Local-app-inputs.json
          .venv/bin/python apps/desktop/scripts/package-preview.py \
            --runtime apps/desktop/build/runtime \
            --binary apps/desktop/src-tauri/target/release/reality-local \
            --frontend apps/web/dist \
            --version "$RELEASE_VERSION" \
            "${beta[@]}" \
            --output "$RUNNER_TEMP/Reality Local reproducibility.app"
          python3 apps/desktop/scripts/release-manifest.py \
            --root "$RUNNER_TEMP/Reality Local reproducibility.app" \
            --version "$RELEASE_VERSION" \
            --artifact app-inputs \
            --compare-to apps/desktop/dist/Reality-Local-app-inputs.json \
            --output "$RUNNER_TEMP/Reality-Local-app-inputs-second.json"

      - name: Decide whether this build can be signed
        id: signing
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ "${{ inputs.tester_beta }}" = "true" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Unsigned tester beta selected; signing and notarization are intentionally disabled."
          elif [ -n "$CERTIFICATE" ] && [ -n "$CERTIFICATE_PASSWORD" ] && \
             [ -n "$SIGNING_IDENTITY" ] && [ -n "$TEAM_ID" ] && \
             [ -n "$PROFILE" ] && [ -n "$API_KEY_ID" ] && \
             [ -n "$API_ISSUER_ID" ] && [ -n "$API_PRIVATE_KEY" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Apple credentials configured. The artifact stays ad-hoc signed and is not notarized."
          fi

      - name: Refuse an unsigned publication
        if: (startsWith(github.ref, 'refs/tags/mac-v') || inputs.publish) && steps.signing.outputs.signed != 'true'
        run: |
          echo "::error::Published macOS artifacts require the complete Apple signing and notarization credential set."
          exit 1

      - name: Import the Developer ID certificate
        if: steps.signing.outputs.signed == 'true'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          trap 'rm -f "$RUNNER_TEMP/certificate.p12"' EXIT
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychain -d user -s "$keychain" login.keychain-db

      - name: Sign the application with Developer ID
        if: steps.signing.outputs.signed == 'true'
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          printf '%s' "$PROFILE" | base64 --decode > \
            "apps/desktop/dist/Reality Local.app/Contents/embedded.provisionprofile"
          python3 apps/desktop/scripts/release-signing.py prepare \
            --team-id "$TEAM_ID" \
            --bundle-id ai.runreality.local \
            --output "$RUNNER_TEMP/release.entitlements"
          python3 apps/desktop/scripts/release-signing.py sign-nested \
            --identity "${{ secrets.APPLE_SIGNING_IDENTITY }}" \
            --app "apps/desktop/dist/Reality Local.app"
          codesign --force --timestamp --options runtime \
            --entitlements "$RUNNER_TEMP/release.entitlements" \
            --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" \
            "apps/desktop/dist/Reality Local.app"
          python3 apps/desktop/scripts/release-signing.py verify \
            --team-id "$TEAM_ID" \
            --bundle-id ai.runreality.local \
            --app "apps/desktop/dist/Reality Local.app"

      - name: Build the disk image
        run: |
          staging="$RUNNER_TEMP/dmg"
          rm -rf "$staging"
          mkdir -p "$staging"
          ditto "apps/desktop/dist/Reality Local.app" "$staging/Reality Local.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Reality Local" -srcfolder "$staging" -ov -format UDZO \
            "apps/desktop/dist/Reality-Local.dmg"

      - name: Notarize and staple
        if: steps.signing.outputs.signed == 'true'
        run: |
          trap 'rm -f "$RUNNER_TEMP/api.p8"' EXIT
          printf '%s' "${{ secrets.APPLE_API_PRIVATE_KEY }}" | base64 --decode > "$RUNNER_TEMP/api.p8"
          codesign --force --timestamp --sign "${{ secrets.APPLE_SIGNING_IDENTITY }}" \
            "apps/desktop/dist/Reality-Local.dmg"
          xcrun notarytool submit "apps/desktop/dist/Reality-Local.dmg" \
            --key "$RUNNER_TEMP/api.p8" \
            --key-id "${{ secrets.APPLE_API_KEY_ID }}" \
            --issuer "${{ secrets.APPLE_API_ISSUER_ID }}" \
            --wait --timeout 45m
          xcrun stapler staple "apps/desktop/dist/Reality-Local.dmg"
          python3 apps/desktop/scripts/release-signing.py verify-dmg \
            --dmg "apps/desktop/dist/Reality-Local.dmg"

      - name: Write the checksum
        run: |
          python3 apps/desktop/scripts/release-manifest.py \
            --root apps/desktop/dist/Reality-Local.dmg \
            --version "$RELEASE_VERSION" \
            --artifact dmg \
            --output apps/desktop/dist/Reality-Local-dmg.json
          cd apps/desktop/dist
          shasum -a 256 Reality-Local.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.tester_beta && 'reality-local-unsigned-tester-beta-' || 'reality-local-' }}${{ env.RELEASE_VERSION }}
          path: |
            apps/desktop/dist/Reality-Local.dmg
            apps/desktop/dist/Reality-Local-app-inputs.json
            apps/desktop/dist/Reality-Local-dmg.json
            apps/desktop/dist/SHA256SUMS.txt

      # Always a pre-release: the self-hosted installer reads the "latest release" API.
      - name: Attach to the pre-release
        if: ${{ !inputs.tester_beta && (startsWith(github.ref, 'refs/tags/mac-v') || inputs.publish) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="mac-v${RELEASE_VERSION}"
          note="Notarized by Apple."
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease \
              --title "Reality Local for macOS ${RELEASE_VERSION} (beta)" \
              --notes "$note"
          fi
          gh release upload "$tag" \
            "apps/desktop/dist/Reality-Local.dmg" \
            "apps/desktop/dist/Reality-Local-app-inputs.json" \
            "apps/desktop/dist/Reality-Local-dmg.json" \
            "apps/desktop/dist/SHA256SUMS.txt" --clobber
