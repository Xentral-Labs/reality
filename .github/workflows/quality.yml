name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  spec-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Spec Kit policy
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python scripts/check_spec_policy.py --base-ref "origin/$BASE_REF"
          else
            python scripts/check_spec_policy.py
          fi

  backend-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect backend changes
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            set -o pipefail
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" |
              python3 scripts/ci_backend_changes.py --null >> "$GITHUB_OUTPUT"
          fi

  backend-tests:
    needs: backend-changes
    if: needs.backend-changes.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Keep two workers per runner while distributing the suite across
        # isolated PostgreSQL jobs to reduce the backend gate's critical path.
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reality
          POSTGRES_USER: reality
          POSTGRES_PASSWORD: local-only
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U reality -d reality"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/reality-core/pyproject.toml
      - name: Install shared core
        run: python -m pip install -e './packages/reality-core[dev]'
      - name: Configure disposable PostgreSQL migration lock capacity
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          # Parallel full-schema upgrade/downgrade proofs exceed the image default.
          # This container exists only for this test shard; deployment is unchanged.
          docker exec --user postgres "$POSTGRES_CONTAINER" \
            psql -v ON_ERROR_STOP=1 -U reality -d reality \
              -c "ALTER SYSTEM SET max_locks_per_transaction = 1024"
          docker restart "$POSTGRES_CONTAINER"
          for attempt in $(seq 1 30)
          do
            if docker exec "$POSTGRES_CONTAINER" pg_isready -q -U reality -d reality
            then
              break
            fi
            sleep 1
          done
          test "$(docker exec --user postgres "$POSTGRES_CONTAINER" \
            psql -At -U reality -d reality -c 'SHOW max_locks_per_transaction')" = 1024
      - name: Ruff shared core
        run: cd packages/reality-core && ruff check .
      - name: PostgreSQL test suite
        env:
          TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://reality:local-only@localhost:54329/postgres
          REALITY_AUTH_MODE: disabled
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t test_files < <(
            python3 scripts/ci_backend_test_shard.py packages/reality-core/tests \
              --shard "$SHARD" --total 4 --relative-to packages/reality-core
          )
          test "${#test_files[@]}" -gt 0
          cd packages/reality-core
          pytest -n 2 --dist worksteal --durations=20 \
            --junitxml "$RUNNER_TEMP/backend-durations-$SHARD.xml" "${test_files[@]}"
      - name: Upload test durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-durations-${{ matrix.shard }}
          path: ${{ runner.temp }}/backend-durations-${{ matrix.shard }}.xml
          if-no-files-found: warn

  backend-quality:
    needs: [backend-changes, backend-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report backend quality result
        env:
          CHANGED: ${{ needs.backend-changes.outputs.changed }}
          TEST_RESULT: ${{ needs.backend-tests.result }}
        run: |
          if [ "$CHANGED" != "true" ]; then
            echo "Backend quality skipped: no backend-affecting pull-request paths changed."
          elif [ "$TEST_RESULT" != "success" ]; then
            echo "Backend quality failed: test shards concluded with $TEST_RESULT."
            exit 1
          else
            echo "Backend quality passed in all test shards."
          fi

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise deployed web gateway routing
        run: python3 scripts/test_web_gateway.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/reality-core/pyproject.toml
      - name: Install executable catalog fixture dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install ./packages/reality-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web app
        run: cd apps/web && npm ci
      - name: Check web app formatting
        run: cd apps/web && npm run format:check
      - name: Test web app
        run: cd apps/web && npm run test:i18n
      - name: Build web app
        run: cd apps/web && npm run build
      - name: Audit translations
        run: cd apps/web && npm run i18n:audit

  browser-scripts:
    # Fixture-based Playwright scripts listed in apps/web/scripts/browser-suite.json. Runs in
    # parallel with the other jobs; skipped for pull requests that touch neither the web app
    # nor the catalogs the fixtures are derived from. Measured script durations distribute
    # the list across seven runners so the slowest shard stays below eight minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect web changes
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] ||
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" |
              grep -qE '^(apps/web/|packages/reality-core/config/|\.github/workflows/quality\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.diff.outputs.changed == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/reality-core/pyproject.toml
      - name: Install catalog fixture dependencies
        if: steps.diff.outputs.changed == 'true'
        # Several scripts derive their fixtures from the runtime catalogs through .venv.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install ./packages/reality-core
      - uses: actions/setup-node@v4
        if: steps.diff.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web app
        if: steps.diff.outputs.changed == 'true'
        run: cd apps/web && npm ci
      - name: Install Playwright
        if: steps.diff.outputs.changed == 'true'
        # Playwright is not an app dependency; the scripts import it from PLAYWRIGHT_MODULE.
        run: |
          mkdir -p "$RUNNER_TEMP/playwright"
          cd "$RUNNER_TEMP/playwright"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/playwright/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Provide the macOS screenshot directory
        if: steps.diff.outputs.changed == 'true'
        # Scripts write screenshots below /private/tmp, which exists only on macOS.
        run: sudo mkdir -p /private && sudo ln -sfn /tmp /private/tmp
      - name: Run browser scripts
        if: steps.diff.outputs.changed == 'true'
        env:
          BROWSER_SUITE_SHARD: ${{ matrix.shard }}/7
          BROWSER_SUITE_RESULTS: ${{ runner.temp }}/browser-durations-${{ matrix.shard }}.json
        run: cd apps/web && node scripts/run-browser-suite.mjs
      - name: Upload browser script durations
        if: always() && steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: browser-durations-${{ matrix.shard }}
          path: ${{ runner.temp }}/browser-durations-${{ matrix.shard }}.json
          if-no-files-found: warn

  live-browser:
    # Real-backend browser journeys (packages/reality-core/tests/browser): each harness creates
    # its own PostgreSQL database, migrates it and starts the API, Vite, worker and scheduler.
    # Runs in parallel with the other jobs when the web app or the core changes.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - journey: business-journey
            test: tests/browser/unified_business_journey.py
          - journey: payment-refresh
            test: tests/browser/unified_payment_refresh.py
          - journey: bulk-intake
            test: tests/browser/unified_bulk_intake.py
          - journey: item-csv-import
            test: tests/browser/unified_item_csv_import.py
          - journey: history-table
            test: tests/browser/unified_history_table.py
          - journey: engine-room
            test: tests/browser/unified_engine_room.py
          - journey: company-setup-live
            test: tests/browser/unified_company_setup_live.py
          - journey: finance-rollout
            test: tests/browser/unified_finance_rollout.py
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reality
          POSTGRES_USER: reality
          POSTGRES_PASSWORD: local-only
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U reality -d reality"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect web and core changes
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] ||
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" |
              grep -qE '^(apps/web/|packages/reality-core/|\.github/workflows/quality\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.diff.outputs.changed == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/reality-core/pyproject.toml
      - name: Install shared core
        if: steps.diff.outputs.changed == 'true'
        # Into .venv: the page chrome scripts derive their fixtures from the runtime catalogs
        # through .venv/bin/python, as in the browser-scripts job.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e './packages/reality-core[dev]'
      - uses: actions/setup-node@v4
        if: steps.diff.outputs.changed == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web app
        if: steps.diff.outputs.changed == 'true'
        run: cd apps/web && npm ci
      - name: Install Playwright
        if: steps.diff.outputs.changed == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/playwright"
          cd "$RUNNER_TEMP/playwright"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.62.1
          npx playwright install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$RUNNER_TEMP/playwright/node_modules/playwright/index.mjs" >> "$GITHUB_ENV"
      - name: Provide the macOS screenshot directory
        if: steps.diff.outputs.changed == 'true'
        run: sudo mkdir -p /private && sudo ln -sfn /tmp /private/tmp
      - name: Run live browser journeys
        if: steps.diff.outputs.changed == 'true'
        env:
          TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://reality:local-only@localhost:54329/postgres
          JOURNEY_ARTIFACTS: ${{ runner.temp }}/live-browser
          # Also prove page titles and introductions against the real backend.
          JOURNEY_VERIFY_PAGE_CHROME: "1"
        run: |
          cd packages/reality-core
          ../../.venv/bin/pytest -s -p no:randomly "${{ matrix.test }}"
      - name: Upload journey logs
        if: failure() && steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: live-browser-logs-${{ matrix.journey }}
          path: ${{ runner.temp }}/live-browser
          if-no-files-found: ignore

  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - name: Install product documentation
        run: cd apps/docs && npm ci
      - name: Install catalog generator dependencies
        run: python -m pip install ./packages/reality-core
      - name: Verify documentation storage metadata
        run: PYTHONPATH=packages/reality-core/src python -m unittest discover -s apps/docs/scripts -p 'test_*.py'
      - name: Verify repository scripts
        run: PYTHONPATH=packages/reality-core/src python -m unittest discover -s scripts -p 'test_*.py'
      - name: Reject stale generated catalogs
        run: |
          PYTHONPATH=packages/reality-core/src python apps/docs/scripts/generate-catalog-reference.py
          git diff --exit-code -- apps/docs/content/tool-usage apps/docs/content/de/tool-usage apps/docs/content/storylines apps/docs/content/de/storylines apps/docs/content/public/storylines apps/docs/.vitepress/data
      - name: Check product documentation formatting
        run: cd apps/docs && npm run format:check
      - name: Test product documentation contracts
        run: cd apps/docs && npm test
      - name: Build product documentation
        run: cd apps/docs && npm run build
