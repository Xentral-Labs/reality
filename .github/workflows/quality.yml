name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  spec-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Spec Kit policy
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python scripts/check_spec_policy.py --base-ref "origin/$BASE_REF"
          else
            python scripts/check_spec_policy.py
          fi

  backend-changes:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect backend changes
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            set -o pipefail
            git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" |
              python3 scripts/ci_backend_changes.py --null >> "$GITHUB_OUTPUT"
          fi

  backend-tests:
    needs: backend-changes
    if: needs.backend-changes.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: reality
          POSTGRES_USER: reality
          POSTGRES_PASSWORD: local-only
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U reality -d reality"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/reality-core/pyproject.toml
      - name: Install shared core
        run: python -m pip install -e './packages/reality-core[dev]'
      - name: Ruff shared core
        run: cd packages/reality-core && ruff check .
      - name: PostgreSQL test suite
        env:
          TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://reality:local-only@localhost:54329/postgres
          REALITY_AUTH_MODE: disabled
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t test_files < <(
            python3 scripts/ci_backend_test_shard.py packages/reality-core/tests \
              --shard "$SHARD" --total 2 --relative-to packages/reality-core
          )
          test "${#test_files[@]}" -gt 0
          cd packages/reality-core
          pytest -n 2 --dist worksteal --durations=20 \
            --junitxml "$RUNNER_TEMP/backend-durations-$SHARD.xml" "${test_files[@]}"
      - name: Upload test durations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-durations-${{ matrix.shard }}
          path: ${{ runner.temp }}/backend-durations-${{ matrix.shard }}.xml
          if-no-files-found: warn

  backend-quality:
    needs: [backend-changes, backend-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report backend quality result
        env:
          CHANGED: ${{ needs.backend-changes.outputs.changed }}
          TEST_RESULT: ${{ needs.backend-tests.result }}
        run: |
          if [ "$CHANGED" != "true" ]; then
            echo "Backend quality skipped: no backend-affecting pull-request paths changed."
          elif [ "$TEST_RESULT" != "success" ]; then
            echo "Backend quality failed: test shards concluded with $TEST_RESULT."
            exit 1
          else
            echo "Backend quality passed in all test shards."
          fi

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/reality-core/pyproject.toml
      - name: Install executable catalog fixture dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install ./packages/reality-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web app
        run: cd apps/web && npm ci
      - name: Check web app formatting
        run: cd apps/web && npm run format:check
      - name: Test web app
        run: cd apps/web && npm run test:i18n
      - name: Build web app
        run: cd apps/web && npm run build
      - name: Audit translations
        run: cd apps/web && npm run i18n:audit

  docs-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json
      - name: Install product documentation
        run: cd apps/docs && npm ci
      - name: Install catalog generator dependencies
        run: python -m pip install ./packages/reality-core
      - name: Verify documentation storage metadata
        run: PYTHONPATH=packages/reality-core/src python -m unittest discover -s apps/docs/scripts -p 'test_*.py'
      - name: Reject stale generated catalogs
        run: |
          PYTHONPATH=packages/reality-core/src python apps/docs/scripts/generate-catalog-reference.py
          git diff --exit-code -- apps/docs/content/tool-usage apps/docs/content/de/tool-usage apps/docs/content/storylines apps/docs/content/de/storylines apps/docs/content/public/storylines apps/docs/.vitepress/data
      - name: Check product documentation formatting
        run: cd apps/docs && npm run format:check
      - name: Test product documentation contracts
        run: cd apps/docs && npm test
      - name: Build product documentation
        run: cd apps/docs && npm run build
